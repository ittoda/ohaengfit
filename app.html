ses se raffermir", "발을 휙 차듯 올리지 말고 천천히 올려요. 허리를 뒤로 젖히지 않아요": "Ne balancez pas le pied vers le haut comme un coup de pied ; levez-le lentement. Ne vous penchez pas en arrière", "펼 때 내쉬고 내릴 때 들이쉬어요": "Expirez en tendant, inspirez en baissant", "아래팔 신전근(손등 쪽)": "Extenseurs de l'avant-bras (côté dos de la main)", "아래팔 굴곡근(손바닥 쪽)": "Fléchisseurs de l'avant-bras (côté paume)", "아래팔 안쪽과 바깥쪽이 번갈아 늘어나는 느낌이에요": "Vous sentez l'intérieur puis l'extérieur de l'avant-bras s'étirer à tour de rôle", "세게 꺾으면 안 돼요. 살짝 당기는 정도에서 멈춰요": "Ne forcez pas la flexion. Arrêtez à une traction douce", "숨을 편하게 쉬어요": "Respirez tranquillement", "아래팔 신전근": "Extenseurs de l'avant-bras", "아래팔 굴곡근": "Fléchisseurs de l'avant-bras", "아래팔이 번갈아 가볍게 쓰이는 느낌이에요": "Vous sentez vos avant-bras travailler légèrement à tour de rôle", "팔꿈치가 흔들리지 않게 고정해요": "Gardez le coude immobile", "일정한 리듬으로 편하게 쉬어요": "Respirez tranquillement à un rythme régulier", "대둔근·척추기립근": "Grand fessier · érecteurs du rachis", "허벅지 뒤가 당기고 엉덩이가 힘으로 밀어 올려지는 느낌이에요": "Vous sentez l'arrière des cuisses tirer et les hanches vous propulser vers le haut", "허리를 둥글게 말면 안 돼요. 엉덩이를 뒤로 빼는 동작이에요": "N'arrondissez pas le bas du dos. C'est un mouvement qui consiste à pousser les hanches en arrière", "숙일 때 들이쉬고 일어날 때 내쉬어요": "Inspirez en vous penchant, expirez en vous relevant", "장요근·대퇴직근(허벅지 앞)": "Psoas-iliaque · droit fémoral (face avant de la cuisse)", "지지다리 대둔근": "Grand fessier de la jambe d'appui", "당기는 쪽 엉덩이가 늘어나고 지지하는 다리는 균형을 잡아요": "La hanche du côté tiré s'étire pendant que la jambe d'appui garde l'équilibre", "상체를 뒤로 젖히지 않고 곧게 서요": "Tenez-vous droit sans pencher le buste en arrière", "당길 때 내쉬어요": "Expirez en ramenant", "강하게": "Fort", "보통": "Moyen", "약하게": "Léger", " 운동": " exercice", "근육 해부도 보기 (이는곳·닿는곳)": "Voir l'anatomie musculaire (origine · insertion)", "운동을 누르면 근육이 쓰이는 부위를 크게 확대해서 보여줘요": "Touchez un exercice pour voir une vue agrandie des muscles utilisés", "크게 보기 ›": "Agrandir ›", " · 늘어남": " · s'étire", "진한 빨강 = 가장 세게 쓰는 근육 · 중간 빨강 = 보통 · 연한 빨강 = 약하게 쓰거나 늘어나는 근육": "Rouge foncé = muscles les plus sollicités · rouge moyen = modérément · rouge clair = muscles peu sollicités ou étirés", "← 목록": "← Liste", "전체 몸 보기": "Corps entier", "확대해서 보기": "Zoomer", "어떤 근육이 움직이나요": "Quels muscles bougent ?", "근육이 빨갛게 표시돼요. 진할수록 더 세게 쓰는 근육이에요. 확대하면 근육 이름이 보여요.": "Le rouge indique les muscles utilisés ; plus il est foncé, plus le muscle travaille. Zoomez pour voir les noms des muscles.", "따라하는 방법": "Comment faire", "핵심 포인트": "Points clés", "이렇게 느껌져야 해요": "Ce que vous devez ressentir", "흔한 실수": "Erreurs courantes", "호흡": "Respiration", "통증이 생기면 바로 멈추고, 계속되면 의료진과 상담하세요.": "Arrêtez immédiatement en cas de douleur et consultez un professionnel de santé si elle persiste.", "큰가슴근": "Grand pectoral", "가슴 부위를 대부분 감싸고 있는 부채꼴 근육이에요. 빗장뼈 부분, 복장갈비 부분, 배 부분 세 부분으로 나눌 수 있어요.": "Muscle en éventail qui recouvre presque toute la région de la poitrine. On peut le diviser en trois parties : claviculaire, sterno-costale et abdominale.", "빗장뼈 안쪽, 복장뼈, 위쪽 갈비연골": "Face interne de la clavicule, sternum, cartilages costaux supérieurs", "위팔뼈 위쪽 앞면(큰결절능)": "Face antérieure supérieure de l'humérus (crête du tubercule majeur)", "팔을 앞으로 모으기, 안쪽으로 돌리기, 올린 팔 내리기": "Ramener les bras vers l'avant, rotation interne, abaisser un bras levé", "벽에 팔을 대고 몸을 돌리는 가슴 스트레칭이 좋아요. 컴퓨터 작업이 길면 앞으로 말린 어깨의 원인이 돼요.": "Les étirements de la poitrine, bras contre le mur en tournant le corps, sont recommandés. Un long travail sur ordinateur est une cause des épaules enroulées vers l'avant.", "어깨세모근": "Deltoïde", "어깨를 둥글게 덮는 근육이에요. 앞·가운데·뒤 세 부분이 팔을 올리는 방향마다 나눠서 일해요.": "Muscle qui recouvre l'épaule en arrondi. Les trois parties, antérieure, moyenne et postérieure, se partagent le travail selon la direction de levée du bras.", "빗장뼈 바깥쪽, 어깨뼈 봉우리, 어깨뼈 가시": "Face externe de la clavicule, acromion, épine de la scapula", "위팔뼈 가운데 바깥면(세모근 거친면)": "Face externe médiane de l'humérus (tubérosité deltoïdienne)", "팔을 옆·앞·뒤로 들어 올리기": "Lever le bras sur le côté, devant, derrière", "가벼운 덤벨로 옆으로 들어 올리는 운동이 대표적이에요. 어깨를 으쓱하며 올리지 않게 주의하세요.": "L'exercice typique est l'élévation latérale avec un haltère léger. Attention à ne pas hausser les épaules en levant.", "등세모근": "Trapèze", "뒤통수부터 등 가운데까지 이어지는 마름모꼴 근육이에요. 위·가운데·아래 세 부분으로 나뉘며 어깨뼈를 올리고 모으고 내려요.": "Muscle en losange allant de l'occiput au milieu du dos. Divisé en trois parties (supérieure, moyenne, inférieure), il élève, rapproche et abaisse l'omoplate.", "뒤통수뼈, 목덜미 인대, 목뼈 7번~가슴뼈 12번 가시돌기": "Os occipital, ligament nuchal, apophyses épineuses de C7 à T12", "빗장뼈 바깥쪽, 어깨뼈 봉우리와 어깨뼈 가시": "Face externe de la clavicule, acromion et épine de la scapula", "어깨 으쓱하기, 어깨뼈 모으기, 고개 젖히기": "Hausser les épaules, rapprocher les omoplates, renverser la tête", "턱을 당기고 어깨뼈를 모으는 운동, 목·어깨 스트레칭이 도움이 돼요. 화면을 오래 보면 위쪽이 쉽게 뭉쳐요.": "Les exercices de menton rentré et de rapprochement des omoplates, ainsi que les étirements du cou et des épaules, aident. Regarder un écran longtemps crispe facilement la partie supérieure.", "넓은등근": "Grand dorsal", "등 아래쪽을 넓게 덮는 큰 삼각형 근육이에요. 몸통에서 시작해 겨드랑이 쪽 위팔뼈로 모여요.": "Grand muscle triangulaire qui recouvre largement le bas du dos. Il part du tronc et se rassemble vers l'humérus, du côté de l'aisselle.", "가슴뼈 7번~허리뼈 가시돌기, 엉덩뼈능선, 아래 갈비뼈": "Apophyses épineuses de T7 aux lombaires, crête iliaque, côtes inférieures", "위팔뼈 앞쪽 고랑(결절간구)": "Sillon antérieur de l'humérus (gouttière bicipitale)", "올린 팔 끌어내리기, 팔 뒤로 젖히기, 안쪽으로 돌리기": "Abaisser un bras levé, tirer le bras en arrière, rotation interne", "턱걸이, 랫풀다운이 대표 운동이고, 한 팔을 올려 옆구리를 늘리는 스트레칭이 좋아요.": "Les tractions et le tirage vertical sont les exercices typiques ; lever un bras pour étirer le flanc est aussi bénéfique.", "목빗근": "Sterno-cléido-mastoïdien", "목 옆을 비스듬히 가로지르는 근육이에요. 머리를 돌리고 숙이는 데 쓰여요.": "Muscle qui traverse le côté du cou en diagonale. Il sert à tourner et à pencher la tête.", "복장뼈 윗부분, 빗장뼈 안쪽": "Partie supérieure du sternum, face interne de la clavicule", "귀 뒤 꼭지돌기(유양돌기)": "Processus mastoïde derrière l'oreille", "고개 돌리기, 옆으로 기울이기, 앞으로 숙이기": "Tourner la tête, l'incliner sur le côté, la pencher en avant", "고개를 숙이고 폰을 오래 보면 짧아지고 뻣뻣해져요. 턱 당기기와 목 옆 스트레칭이 도움이 돼요.": "Regarder longtemps son téléphone la tête baissée le raccourcit et le raidit. Le menton rentré et les étirements latéraux du cou aident.", "배곧은근": "Droit de l'abdomen", "배 앞쪽을 세로로 지나는 근육이에요. 힘줄 마디가 있어서 복근이 나뉘어 보여요.": "Muscle qui parcourt l'avant de l'abdomen à la verticale. Ses intersections tendineuses donnent aux abdominaux un aspect segmenté.", "두덩뼈(치골)": "Pubis", "칼돌기, 5~7번 갈비연골": "Processus xiphoïde, cartilages costaux 5 à 7", "상체 굽히기, 골반 말아 올리기, 허리 안정": "Fléchir le tronc, enrouler le bassin vers le haut, stabiliser les lombaires", "플랭크처럼 허리를 버티는 운동이 허리 건강에 도움이 돼요. 윗몸을 과하게 말면 목에 부담이 가요.": "Les exercices qui soutiennent les lombaires, comme la planche, sont bons pour le dos. Enrouler trop le buste sollicite le cou.", "큰볼기근": "Grand fessier", "엉덩이를 이루는 가장 큰 근육이에요. 일어서고 계단을 오를 때 허벅지를 뒤로 보내는 힘을 내요.": "Le plus grand muscle des fesses. Il donne la force qui envoie la cuisse vers l'arrière quand on se lève ou monte des escaliers.", "엉치뼈, 엉덩뼈 뒤쪽": "Sacrum, face postérieure de l'ilium", "넙다리뼈 뒤 거친면, 엉덩정강근막띠": "Ligne âpre de la face postérieure du fémur, bandelette ilio-tibiale", "고관절 펴기, 다리 바깥으로 돌리기": "Extension de la hanche, rotation externe de la jambe", "브릿지, 힙 힌지가 대표 운동이에요. 오래 앉으면 쓰임이 줄어 허리 부담이 커져요.": "Le pont et la charnière de hanche sont les exercices typiques. Rester longtemps assis réduit son usage et augmente la charge sur les lombaires.", "넙다리네갈래근": "Quadriceps", "허벅지 앞쪽의 큰 근육이에요. 네 갈래가 한 힘줄로 모여 무릎뼈를 지나 정강이에 붙어요.": "Gros muscle de la face antérieure de la cuisse. Ses quatre chefs se rejoignent en un tendon qui passe par la rotule et s'attache au tibia.", "엉덩뼈 앞쪽, 넙다리뼈 몸통": "Face antérieure de l'ilium, corps du fémur", "무릎뼈를 지나 정강뼈 거친면": "Passe par la rotule jusqu'à la tubérosité tibiale", "무릎 펴기, 계단 오르기, 일어서기": "Tendre le genou, monter les escaliers, se lever", "의자 스쿼트, 앉아서 무릎 펴기가 좋아요. 무릎이 발끝보다 안쪽으로 모이지 않게 하세요.": "Le squat sur chaise et l'extension du genou assis sont bénéfiques. Ne laissez pas les genoux rentrer vers l'intérieur par rapport aux orteils.", "뒤넙다리근": "Ischio-jambiers", "허벅지 뒤쪽 근육 무리예요. 엉덩이에서 시작해 무릎 뒤 양쪽으로 갈라져 붙어요.": "Groupe musculaire de l'arrière de la cuisse. Il part de la fesse et se divise en deux, de chaque côté derrière le genou.", "궁둥뼈 결절(앉았을 때 닿는 뼈)": "Tubérosité ischiatique (l'os en contact quand on est assis)", "정강뼈와 종아리뼈 위쪽": "Partie supérieure du tibia et du péroné", "무릎 굽히기, 엉덩관절 펴기": "Fléchir le genou, étendre la hanche", "앉아 있는 시간이 길면 짧아져 허리와 골반이 당겨요. 누워서 다리 들어 올리는 스트레칭이 좋아요.": "Rester longtemps assis les raccourcit et tire sur les lombaires et le bassin. Les étirements en levant la jambe allongé sont bénéfiques.", "장딴지근": "Gastrocnémien", "종아리 위쪽의 볼록한 근육이에요. 아킬레스힘줄로 모여 발뒤꿈치에 붙어요.": "Muscle bombé de la partie haute du mollet. Il se rassemble dans le tendon d'Achille et s'attache au talon.", "넙다리뼈 아래쪽 안·바깥 융기": "Condyles interne et externe du bas du fémur", "아킬레스힘줄을 지나 발뒤꿈치뼈": "Passe par le tendon d'Achille jusqu'au calcanéum", "발끝 세우기, 무릎 굽히기 보조": "Se dresser sur la pointe des pieds, aider à fléchir le genou", "벽 종아리 스트레칭, 발뒤꿈치 올리기가 대표 운동이에요. 오래 서 있으면 쉽게 뭉쳐요.": "L'étirement du mollet au mur et les montées sur la pointe des pieds sont les exercices typiques. Rester longtemps debout le crispe facilement.", "손목 굽힘근": "Fléchisseurs du poignet", "아래팔 안쪽(손바닥 쪽)의 근육 무리예요. 손목과 손가락을 굽혀요.": "Groupe musculaire de la face interne (côté paume) de l'avant-bras. Il fléchit le poignet et les doigts.", "위팔뼈 안쪽 위관절융기(팔꿈치 안쪽)": "Épicondyle médial de l'humérus (intérieur du coude)", "손목뼈, 손가락뼈": "Os du carpe, phalanges", "손목 굽히기, 손가락 쥐기": "Fléchir le poignet, serrer la main", "타이핑이나 마우스를 오래 쓰면 쌓여요. 팔을 펴고 손끝을 아래로 당기는 스트레칭을 해보세요.": "S'accumule en tapant au clavier ou en utilisant longtemps la souris. Essayez l'étirement bras tendu en tirant les doigts vers le bas.", "손목 폄근": "Extenseurs du poignet", "아래팔 바깥쪽(손등 쪽)의 근육 무리예요. 손목과 손가락을 펴고 손목을 안정시켜요.": "Groupe musculaire de la face externe (côté dos de la main) de l'avant-bras. Il étend le poignet et les doigts et stabilise le poignet.", "위팔뼈 바깥 위관절융기(팔꿈치 바깥)": "Épicondyle latéral de l'humérus (extérieur du coude)", "손등 쪽 손목뼈, 손가락뼈": "Os du carpe côté dos de la main, phalanges", "손목 젖히기, 손가락 펴기": "Relever le poignet, étendre les doigts", "손목을 꺾은 채 타이핑하면 부담이 커요. 손등을 아래로 돌려 당기는 스트레칭을 해보세요.": "Taper avec les poignets cassés augmente la charge. Essayez l'étirement en tournant le dos de la main vers le bas et en tirant.", "← 운동 목록": "← Liste des exercices", "근육 ON": "Muscles ON", "근육 OFF": "Muscles OFF", "이는곳": "Origine", "닿는곳": "Insertion", "하는 일": "Action", "파란 점은 근육이 시작하는 곳, 초록 점은 닿는 곳이에요. 단순화한 도식이라 실제 해부도와 다를 수 있어요.": "Le point bleu est l'origine du muscle, le point vert son insertion. C'est un schéma simplifié qui peut différer de l'anatomie réelle.", "▶ 움직임 보기": "▶ Voir le mouvement", "염소자리": "Capricorne", "물병자리": "Verseau", "물고기자리": "Poissons", "양자리": "Bélier", "황소자리": "Taureau", "쌍둥이자리": "Gémeaux", "게자리": "Cancer", "사자자리": "Lion", "처녀자리": "Vierge", "천칭자리": "Balance", "전갈자리": "Scorpion", "사수자리": "Sagittaire", "불": "Feu", "흙": "Terre", "바람": "Air", "물": "Eau", "열정적이고 에너지가 넘치는": "passionné et plein d'énergie", "차분하고 현실적인": "calme et réaliste", "자유롭고 호기심 많은": "libre et très curieux", "감성이 깊고 섬세한": "d'une sensibilité profonde et délicate", "A형": "A", "섬세하고 차분한 감성 → 서정적이고 잔잔한 곡": "Sensibilité délicate et calme → chansons lyriques et paisibles", "B형": "B", "자유롭고 호기심 많은 감성 → 리듬감 있고 개성 있는 곡": "Sensibilité libre et curieuse → chansons rythmées et originales", "O형": "O", "에너지 넘치고 긍정적인 감성 → 힘 있고 따라 부르기 좋은 곡": "Sensibilité pleine d'énergie et positive → chansons puissantes, faciles à chanter", "AB형": "AB", "독특하고 다채로운 감성 → 장르를 넘나드는 곡": "Sensibilité singulière et colorée → chansons qui traversent les genres", "혈액형 모름": "Groupe sanguin inconnu", "혈액형 없이 오행·별자리·오늘의 기분으로 골랐어요": "Choisi selon vos Cinq Éléments, votre signe et l'humeur du jour, sans groupe sanguin", "기분이 올라가는 곡": "Une chanson qui remonte le moral", "차분하게 마음을 가라앉히는 곡": "U opfwender (M. sternocleidomastoideus)", "목 옆을 비스듬히 가로지르는 근육이에요. 머리를 돌리고 숙이는 데 쓰여요.": "Muskel, der schräg über die Halsseite verläuft. Er dient zum Drehen und Beugen des Kopfes.", "복장뼈 윗부분, 빗장뼈 안쪽": "Oberer Teil des Brustbeins, Innenseite des Schlüsselbeins", "귀 뒤 꼭지돌기(유양돌기)": "Warzenfortsatz hinter dem Ohr", "고개 돌리기, 옆으로 기울이기, 앞으로 숙이기": "Kopf drehen, zur Seite neigen, nach vorn beugen", "고개를 숙이고 폰을 오래 보면 짧아지고 뻣뻣해져요. 턱 당기기와 목 옆 스트레칭이 도움이 돼요.": "Langes Handyschauen mit gesenktem Kopf verkürzt und versteift ihn. Kinn einziehen und seitliche Nackendehnungen helfen.", "배곧은근": "Gerader Bauchmuskel", "배 앞쪽을 세로로 지나는 근육이에요. 힘줄 마디가 있어서 복근이 나뉘어 보여요.": "Muskel, der senkrecht über die Bauchvorderseite verläuft. Durch Sehnenzwischenstreifen sieht der Bauch in Blöcke geteilt aus.", "두덩뼈(치골)": "Schambein", "칼돌기, 5~7번 갈비연골": "Schwertfortsatz, Rippenknorpel 5–7", "상체 굽히기, 골반 말아 올리기, 허리 안정": "Oberkörper beugen, Becken aufrollen, unteren Rücken stabilisieren", "플랭크처럼 허리를 버티는 운동이 허리 건강에 도움이 돼요. 윗몸을 과하게 말면 목에 부담이 가요.": "Übungen, die den unteren Rücken halten, wie die Planke, tun dem Rücken gut. Den Oberkörper zu stark einzurollen belastet den Nacken.", "큰볼기근": "Großer Gesäßmuskel", "엉덩이를 이루는 가장 큰 근육이에요. 일어서고 계단을 오를 때 허벅지를 뒤로 보내는 힘을 내요.": "Der größte Muskel des Gesäßes. Er liefert beim Aufstehen und Treppensteigen die Kraft, den Oberschenkel nach hinten zu führen.", "엉치뼈, 엉덩뼈 뒤쪽": "Kreuzbein, Rückseite des Darmbeins", "넙다리뼈 뒤 거친면, 엉덩정강근막띠": "Raue Linie an der Rückseite des Oberschenkelknochens, Tractus iliotibialis", "고관절 펴기, 다리 바깥으로 돌리기": "Hüfte strecken, Bein nach außen drehen", "브릿지, 힙 힌지가 대표 운동이에요. 오래 앉으면 쓰임이 줄어 허리 부담이 커져요.": "Brücke und Hüftbeuge sind typische Übungen. Langes Sitzen verringert seinen Einsatz und erhöht die Belastung des unteren Rückens.", "넙다리네갈래근": "Vorderer Oberschenkelmuskel (Quadrizeps)", "허벅지 앞쪽의 큰 근육이에요. 네 갈래가 한 힘줄로 모여 무릎뼈를 지나 정강이에 붙어요.": "Großer Muskel an der Oberschenkelvorderseite. Seine vier Köpfe laufen in einer Sehne zusammen, die über die Kniescheibe zum
