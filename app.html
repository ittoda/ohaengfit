<style>
:root{--bg:#f4f0fb;--card:#fff;--tx:#2a2238;--sub:#6f6485;--ln:#e2d9f3;--ac:#6d4bb8;--ok:#4f9a6b;--wa:#d9a23a;--dg:#d9703a;--vd:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16121f;--card:#211b30;--tx:#efe9fb;--sub:#a89cc4;--ln:#3a2f55;--ac:#b79cf0}}
:root[data-theme="dark"]{--bg:#16121f;--card:#211b30;--tx:#efe9fb;--sub:#a89cc4;--ln:#3a2f55;--ac:#b79cf0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
.w{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:0 0 10px}
.p{color:var(--sub);font-size:14px;margin:0 0 16px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px}
.r{display:flex;gap:8px}.r>div{flex:1}
input[type=range]{padding:0}
.v{float:right;color:var(--ac);font-weight:600}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
.pil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pil div{border:1px solid var(--ln);border-radius:10px;padding:8px 2px}
.pil b{font-size:20px;display:block}.pil small{color:var(--sub);font-size:11px}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}.row span:first-child{width:92px;flex:none}.row span:last-child{width:34px;text-align:right}.row .bar{flex:1}
.big{text-align:center}.big .n{font-size:56px;font-weight:700;line-height:1}.big .l{font-weight:600;margin-top:4px}
.t{font-size:14px;margin:6px 0}.t b{color:var(--ac)}
.q{text-align:center;font-size:16px;padding:18px 8px;line-height:1.8}
.d{font-size:12px;color:var(--sub);text-align:center}
#out{display:none}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.pills button{width:auto;margin:0;padding:8px 12px;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--ln)}.pills button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}#lg{width:auto;flex:none;margin:4px 0 0;padding:6px 8px;font-size:13px}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{line-height:1.25;word-break:keep-all;flex:1;width:auto;margin:0;padding:10px 4px;font-size:14px;background:var(--card);color:var(--tx);border:1px solid var(--ln)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>

<body>
<div class="w">
<div class="hd"><h1 style="display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;flex:none;display:block"><svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a98bf0"/><stop offset="1" stop-color="#5a3aa8"/></linearGradient></defs><rect width="240" height="240" rx="54" fill="url(#lg2)"/><g fill="#fff"><circle cx="120" cy="78" r="13"/><path d="M120 94C108 94 104 104 104 116L104 142 110 142 112 182 121 182 120 152 121 182 130 182 130 142 136 142 136 116C136 104 132 94 120 94Z"/></g><circle cx="120" cy="38" r="10" fill="#6fcf97"/><circle cx="190" cy="90" r="10" fill="#ff7a59"/><circle cx="164" cy="176" r="10" fill="#ffd25a"/><circle cx="76" cy="176" r="10" fill="#d7dde5"/><circle cx="50" cy="90" r="10" fill="#5aa7ff"/></svg></span><span>오행핏<small style="display:block;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--sub);margin-top:1px">Wellbeing Life</small></span></h1><select id="lg" data-nt onchange="setLang(this.value)"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option><option value="vi">Tiếng Việt</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
<p class="p">생년월일시와 생활패턴으로 오행 체질과 자세 위험도(100점 기준)를 확인해요.</p>

<div class="tabs"><button id="tb1" class="on" onclick="tab(1)">나의 몸 분석하기</button><button id="tb2" onclick="tab(2)">나에게 맞는 음식</button><button id="tb3" onclick="tab(3)">오늘의 운세와 글귀</button><button id="tb4" onclick="tab(4)">나에게 맞는 노래</button></div>
<div class="c" id="form">
<div id="st1"><h2>1단계 · 나의 정보 입력</h2>
<label>생년월일</label><input type="date" id="bd" value="1990-01-01">
<div class="r"><div><label>태어난 시각</label><input type="time" id="bt" value="12:00"></div>
<div><label>성별</label><select id="sx"><option>여성</option><option>남성</option></select></div></div>
<div class="r"><div><label>혈액형</label><select id="bl"><option value="">모름</option><option>A</option><option>B</option><option>O</option><option>AB</option></select></div>
<div><label>별자리</label><select id="zd"><option value="">생년월일로 자동</option><option value="3">♈ 양자리</option><option value="4">♉ 황소자리</option><option value="5">♊ 쌍둥이자리</option><option value="6">♋ 게자리</option><option value="7">♌ 사자자리</option><option value="8">♍ 처녀자리</option><option value="9">♎ 천칭자리</option><option value="10">♏ 전갈자리</option><option value="11">♐ 사수자리</option><option value="0">♑ 염소자리</option><option value="1">♒ 물병자리</option><option value="2">♓ 물고기자리</option></select></div></div>
<label><input type="checkbox" id="nt" style="width:auto"> 태어난 시를 몰라요</label>

<label>직종</label><select id="jb" data-nt onchange="applyJob()"></select>
<label>근무 형태</label><select id="jw" onchange="applyJob()"><option value="0">선택 안 함</option><option value="1">주로 앉아서</option><option value="2">주로 서서</option><option value="3">이동·운전이 많음</option><option value="4">몸을 쓰는 일</option><option value="5">집·재택</option></select>
<p class="d" style="text-align:left;margin-top:8px">직종을 고르면 다음 단계의 생활패턴이 자동으로 채워지고, 직접 바꿀 수도 있어요.</p>
<button onclick="step(2)">다음: 생활패턴 →</button></div>
<div id="st2" style="display:none"><h2>2단계 · 하루 생활패턴</h2>
<label>앉아 있는 시간 <span class="v" id="v1">8시간</span></label><input type="range" id="sit" min="0" max="14" value="8">
<label>스마트폰 보는 시간 <span class="v" id="v2">4시간</span></label><input type="range" id="ph" min="0" max="12" value="4">
<label>서서 일하는 시간 <span class="v" id="v3">2시간</span></label><input type="range" id="st" min="0" max="12" value="2">
<label>운동 횟수(주) <span class="v" id="v4">1회</span></label><input type="range" id="ex" min="0" max="7" value="1">
<div class="r"><div><label>무거운 것 드는 빈도</label><select id="lf"><option value="0">거의 없음</option><option value="1">가끔</option><option value="2">자주</option></select></div>
<div><label>주된 수면 자세</label><select id="sl"><option value="s">옆으로</option><option value="u">바로 누워</option><option value="p">엎드려</option></select></div></div>
<div class="r"><div><label>운전 빈도</label><select id="dv"><option value="0">운전 안 함</option><option value="1">가끔(주 1~2일)</option><option value="2">자주(주 3~5일)</option><option value="3">거의 매일</option></select></div><div><label>하루 운전 시간 <span class="v" id="v5">1시간</span></label><input type="range" id="dh" min="0" max="8" step="0.5" value="1"></div></div>
<label>내 생활습관을 직접 적어주세요 (선택)</label><textarea id="ft" rows="4" placeholder="예) 하루 종일 서서 요리해요. 퇴근 후 누워서 폰을 봐요. 한쪽 어깨로 가방을 메요." style="width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit"></textarea>
<button onclick="go()">내 몸 분석하기</button><button onclick="step(1)" style="background:var(--card);color:var(--tx);border:1px solid var(--ln)">← 이전</button></div>
</div>

<div id="out"></div><div id="pan2" style="display:none"></div><div id="pan3" style="display:none"></div><div id="pan4" style="display:none"></div>
</div>

, talk to a pharmacist or doctor first. Check that ingredients don't overlap, and see a doctor if pain or numbness lasts more than 2 weeks.", "나무는 하루아침에 자라지 않아도 매일 해를 향해 갑니다. 오늘도 그 방향이면 충분해요.": "A tree doesn't grow overnight, yet it turns toward the sun every day. Facing that way again today is enough.", "오늘 내디딘 한 걸음이 내일의 새싹이 돼요. 서두르지 않아도 괜찮아요.": "The step you took today becomes tomorrow's sprout. There's no need to rush.", "굽은 가지도 결국 빛을 찾아 자랍니다. 지금 모습 그대로 괜찮아요.": "Even a crooked branch ends up growing toward the light. You're fine just as you are.", "숲은 서로의 그늘을 나눠 크는 법이에요. 오늘 누군가에게 그늘이 되어주세요.": "A forest grows by sharing its shade. Be someone's shade today.", "작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.": "One small spark warms a whole room. Your smile today is that spark.", "타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.": "Not only what blazes is light. Softly lighting up those beside you is strength too.", "마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.": "If your heart has cooled, take one deep breath. The spark is still there.", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "One big laugh today changes the temperature of your whole day.", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "The earth quietly holds everything up. Just getting through today is already a big deal.", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "A path packed down slowly goes the farthest. One step today is all it takes.", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "A hearty meal anchors your day. Feed yourself well today.", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "A deeply rooted person smiles even when the wind blows. Trust your roots.", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "Metal becomes strong only after passing through fire. Your current hardship is refining you.", "맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.": "A clear bell's sound travels far. A word you offer today will reach people the same way.", "깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.": "Breathe deeply and open your shoulders. When your chest opens, your heart follows.", "정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.": "A tidy desk and a tidy mind are alike. Clear just one thing today and you'll feel lighter.", "물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.": "Water goes around when blocked and rests when it pools. Rest is part of the flow too.", "깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.": "Deep water flows without a sound. A day of quietly getting things done is wonderful too.", "오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.": "Don't rush today—just flow. In the end, the sea takes in all water.", "따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.": "A warm cup of water loosens the heart. Pause for a moment and look after yourself.", "오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.": "Your emotional rhythm is low today. Be a little kinder to yourself.", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠보세요.": "Your mood is clear today. Share that energy with the people around you.", "오늘은 차분하게 균형을 지키기 좋은 날이에요.": "A good day to stay calm and keep your balance.", "오늘 나에게 맞는 글귀": "A quote for you today", "목형 (성장·추진형)": "Wood type (growth · drive)", "새로운 계획과 배움 이야기를 즐기고 시원시원하게 말하는 사람": "Someone who enjoys talking about new plans and learning, and speaks openly", "“요즘 새로 시작한 게 있어요?”처럼 근황과 계획을 물어보세요": "Ask about their recent news and plans, like “Have you started anything new lately?”", "초록": "Green", "화형 (열정·밝은 에너지형)": "Fire type (passion · bright energy)", "표정이 밝고 말이 빠르며 웃음이 많은 사람": "Someone with a bright face, quick speech and lots of laughter", "“오늘 기분 좋아 보여요!”처럼 먼저 웃으며 인사해 보세요": "Greet them with a smile first, like “You look happy today!”", "빨강": "Red", "토형 (믿음직·안정형)": "Earth type (reliable · steady)", "차분하고 말수는 적지만 약속을 잘 지키는 사람": "Calm and quiet, but someone who keeps their promises", "고민을 솔직하게 털어놓고 조언을 구해 보세요": "Share your worries honestly and ask for their advice", "노랑·베이지": "Yellow · beige", "금형 (원칙·정리형)": "Metal type (principled · organized)", "말이 간결하고 단정하며 시간 약속에 철저한 사람": "Concise and neat in speech, strict about time", "핵심부터 짧게 말하고 일정과 결정을 함께 정리해 보세요": "Start with the key point, keep it short, and se osen your wrists every 20 minutes and stand up every hour.", "마우스·태블릿 작업이 길면 손목과 어깨를 자주 풀어주세요.": "Long mouse or tablet work means you should loosen your wrists and shoulders often.", "장시간 문서·화면 작업은 목·눈 부담이 커요. 시선을 멀리 두는 휴식을 자주 가지세요.": "Long document or screen work strains the neck and eyes. Take frequent breaks looking into the distance.", "재택은 자세가 흐트러지기 쉬워요. 책상·의자를 갖추고 일하는 시간과 쉬는 시간을 구분하세요.": "At home your posture slips easily. Set up a proper desk and chair and separate work time from rest.", "책상 공부가 길면 목·허리가 굳어요. 의자 높이를 맞추고 45분마다 스트레칭하세요.": "Long desk study stiffens the neck and lower back. Adjust your chair height and stretch every 45 minutes.", "오래 서서 말하는 일은 무릎·허리에 부담이 돼요. 발을 번갈아 쉬어주고 수분을 챙기세요.": "Talking while standing for long hours strains the knees and lower back. Rest your feet in turns and drink water.", "서서 일하고 환자를 옮기는 일은 허리·무릎에 부담이 커요. 코어 운동과 종아리 스트레칭을 권해요.": "Standing work and moving patients strain the lower back and knees. Core exercises and calf stretches are recommended.", "오래 서 있는 일은 무릎·발에 부담이 커요. 쿠션 좋은 신발과 종아리 스트레칭이 도움이 돼요.": "Standing for long hours strains the knees and feet. Cushioned shoes and calf stretches help.", "주방 일은 허리·손목 부담이 커요. 작업대 높이를 맞추고 발밑에 매트를 두세요.": "Kitchen work strains the lower back and wrists. Set the counter to a good height and put a mat under your feet.", "장시간 운전과 짐 나르기는 허리·목에 부담이 커요. 1~2시간마다 쉬고 짐은 몸 가까이 들어요.": "Long driving and carrying loads strain the lower back and neck. Rest every 1–2 hours and carry loads close to your body.", "반복 동작과 무거운 작업은 허리·어깨에 부담이 커요. 작업 전 준비운동과 보호 장비를 챙기세요.": "Repetitive motions and heavy work strain the lower back and shoulders. Warm up before work and use protective gear.", "굽힌 자세 작업이 많아 허리·무릎이 힘들어요. 작업 사이 허리를 펴는 습관을 들이세요.": "Lots of bent-over work is hard on the lower back and knees. Get in the habit of straightening up between tasks.", "안기·들기·서서 하는 집안일이 잦아 허리·손목이 힘들어요. 안는 위치를 자주 바꾸세요.": "Frequent holding, lifting and standing chores strain the lower back and wrists. Change how you hold often.", "근무 시간이 길어지기 쉬워요. 틈틈이 앉았다 서기를 번갈아 하고 식사 시간을 지키세요.": "Working hours tend to run long. Alternate sitting and standing and keep your mealtimes.", "활동량이 줄기 쉬워요. 하루 30분 걷기와 가벼운 근력 운동을 꾸준히 이어가세요.": "Activity tends to drop. Keep up a 30-minute daily walk and light strength exercise.", "내 일에서 가장 오래 하는 동작을 찾아 그 자세를 자주 바꿔주세요.": "Find the motion you repeat most in your work and change that posture often.", "시간": " hours", "생년월일을 입력해 주세요": "Please enter your date of birth", "턱 당기기": "Chin Tuck", "목 깊은 굴곡근, 후두하근, 흉쇄유돌근": "Deep neck flexors, suboccipitals, sternocleidomastoid", "5초 유지 × 10회 × 3세트": "Hold 5 s × 10 reps × 3 sets", "등과 엉덩이를 벽에 붙이고 시선은 정면에 둬요": "Press your back and hips against the wall and look straight ahead", "고개를 숙이지 말고 턱을 뒤로 살짝 당겨 이중턱을 만들어요": "Don't lower your head; gently draw your chin straight back to make a double chin", "5초 버틴 뒤 천천히 풀어요": "Hold for 5 seconds, then release slowly", "날개뼈 모으기": "Scapular Squeeze", "능형근, 중·하부 승모근, 후면 삼각근": "Rhomboids, mid & lower trapezius, rear deltoid", "5초 유지 × 12회 × 3세트": "Hold 5 s × 12 reps × 3 sets", "팔꿈치를 90도로 굽혀 앞으로 나란히 해요": "Bend your elbows to 90° and hold them out in front", "팔꿈치를 뒤로 보내며 양쪽 날개뼈를 가운데로 조여요": "Move your elbows back and squeeze both shoulder blades toward the middle", "어깨가 올라가지 않게 5초 버티고 돌아와요": "Hold 5 seconds without lifting your shoulders, then return", "벽 천사 (팔 올리기)": "Wall Angel (arm raise)", "전거근, 하부 승모근, 삼각근 (가슴 앞쪽은 늘어나요)": "Serratus anterior, lower trapezius, deltoid (the front of the chest stretches)", "10회 × 3세트": "10 reps × 3 sets", "등을 벽에 대고 서서 팔꿈치를 굽혀 어깨 높이에 둬요": "Stand with your back on the wall, elbows bent at shoulder height", "팔을 벽을 타고 천천히 머리 위로 쭉 올려요": "Slowly slide your arms up the wall and overhead", "허리가 벽에서 뜨지 않게 하며 천천히 내려요": "Lower slowly without letting your lower back lift off the wall", "고양이-소 자세": "Cat-Cow", "척추기립근, 다열근, 복직근 (허리뼈 주변)": "Erector spinae, multifidus, rectus abdominis (around the lumbar spine)", "10회 × 3세트 (천천히)": "10 reps × 3 sets (slowly)", "네발기기 자세로 손은 어깨 nd", "장요근·대퇴직근(허벅지 앞)": "Iliopsoas · rectus femoris (front of thigh)", "지지다리 대둔근": "Gluteus maximus of the supporting leg", "당기는 쪽 엉덩이가 늘어나고 지지하는 다리는 균형을 잡아요": "The hip on the pulling side stretches while the supporting leg keeps your balance", "상체를 뒤로 젖히지 않고 곧게 서요": "Stand straight without leaning your upper body back", "당길 때 내쉬어요": "Exhale as you pull", "강하게": "Strong", "보통": "Medium", "약하게": "Light", " 운동": " exercise", "근육 해부도 보기 (이는곳·닿는곳)": "View muscle anatomy (origin · insertion)", "운동을 누르면 근육이 쓰이는 부위를 크게 확대해서 보여줘요": "Tap an exercise to see an enlarged view of the muscles being used", "크게 보기 ›": "Enlarge ›", " · 늘어남": " · stretches", "진한 빨강 = 가장 세게 쓰는 근육 · 중간 빨강 = 보통 · 연한 빨강 = 약하게 쓰거나 늘어나는 근육": "Dark red = hardest-working muscles · medium red = moderate · light red = lightly worked or stretched muscles", "← 목록": "← List", "전체 몸 보기": "Full body", "확대해서 보기": "Zoom in", "어떤 근육이 움직이나요": "Which muscles move?", "근육이 빨갛게 표시돼요. 진할수록 더 세게 쓰는 근육이에요. 확대하면 근육 이름이 보여요.": "Red shows the muscles being used, and the darker the red, the harder it works. Zoom in to see the muscle names.", "따라하는 방법": "How to do it", "핵심 포인트": "Key points", "이렇게 느껌져야 해요": "What you should feel", "흔한 실수": "Common mistakes", "호흡": "Breathing", "통증이 생기면 바로 멈추고, 계속되면 의료진과 상담하세요.": "Stop immediately if you feel pain, and consult a medical professional if it continues.", "큰가슴근": "Pectoralis major", "가슴 부위를 대부분 감싸고 있는 부채꼴 근육이에요. 빗장뼈 부분, 복장갈비 부분, 배 부분 세 부분으로 나눌 수 있어요.": "A fan-shaped muscle that covers most of the chest. It has three parts: clavicular, sternocostal and abdominal.", "빗장뼈 안쪽, 복장뼈, 위쪽 갈비연골": "Inner clavicle, sternum, upper rib cartilages", "위팔뼈 위쪽 앞면(큰결절능)": "Upper front of the humerus (crest of the greater tubercle)", "팔을 앞으로 모으기, 안쪽으로 돌리기, 올린 팔 내리기": "Brings the arm forward, rotates it inward, lowers a raised arm", "벽에 팔을 대고 몸을 돌리는 가슴 스트레칭이 좋아요. 컴퓨터 작업이 길면 앞으로 말린 어깨의 원인이 돼요.": "A chest stretch with your arm on the wall while turning your body works well. Long computer work can cause rounded shoulders.", "어깨세모근": "Deltoid", "어깨를 둥글게 덮는 근육이에요. 앞·가운데·뒤 세 부분이 팔을 올리는 방향마다 나눠서 일해요.": "A muscle that covers the shoulder in a rounded shape. The front, middle and rear parts work depending on which way you raise your arm.", "빗장뼈 바깥쪽, 어깨뼈 봉우리, 어깨뼈 가시": "Outer clavicle, acromion, spine of the scapula", "위팔뼈 가운데 바깥면(세모근 거친면)": "Middle outer humerus (deltoid tuberosity)", "팔을 옆·앞·뒤로 들어 올리기": "Raises the arm to the side, front and back", "가벼운 덤벨로 옆으로 들어 올리는 운동이 대표적이에요. 어깨를 으쓱하며 올리지 않게 주의하세요.": "Lateral raises with light dumbbells are the classic exercise. Be careful not to shrug as you lift.", "등세모근": "Trapezius", "뒤통수부터 등 가운데까지 이어지는 마름모꼴 근육이에요. 위·가운데·아래 세 부분으로 나뉘며 어깨뼈를 올리고 모으고 내려요.": "A diamond-shaped muscle running from the back of the head to the middle of the back. It has upper, middle and lower parts that raise, squeeze and lower the shoulder blades.", "뒤통수뼈, 목덜미 인대, 목뼈 7번~가슴뼈 12번 가시돌기": "Occipital bone, nuchal ligament, spinous processes of C7–T12", "빗장뼈 바깥쪽, 어깨뼈 봉우리와 어깨뼈 가시": "Outer clavicle, acromion and spine of the scapula", "어깨 으쓱하기, 어깨뼈 모으기, 고개 젖히기": "Shrugs the shoulders, squeezes the shoulder blades, tilts the head back", "턱을 당기고 어깨뼈를 모으는 운동, 목·어깨 스트레칭이 도움이 돼요. 화면을 오래 보면 위쪽이 쉽게 뭉쳐요.": "Chin tucks, scapular squeezes and neck-shoulder stretches help. Long screen time tightens the upper part easily.", "넓은등근": "Latissimus dorsi", "등 아래쪽을 넓게 덮는 큰 삼각형 근육이에요. 몸통에서 시작해 겨드랑이 쪽 위팔뼈로 모여요.": "A large triangular muscle covering the lower back. It starts at the trunk and converges on the humerus near the armpit.", "가슴뼈 7번~허리뼈 가시돌기, 엉덩뼈능선, 아래 갈비뼈": "Spinous processes from T7 down the lumbar spine, iliac crest, lower ribs", "위팔뼈 앞쪽 고랑(결절간구)": "Front groove of the humerus (intertubercular groove)", "올린 팔 끌어내리기, 팔 뒤로 젖히기, 안쪽으로 돌리기": "Pulls a raised arm down, extends the arm back, rotates it inward", "턱걸이, 랫풀다운이 대표 운동이고, 한 팔을 올려 옆구리를 늘리는 스트레칭이 좋아요.": "Pull-ups and lat pulldowns are the classic exercises; a stretch with one arm raised to lengthen the side works well.", "목빗근": "Sternocleidomastoid", "목 옆을 비스듬히 가로지르는 근육이에요. 머리를 돌리고 숙이는 데 쓰여요.": "A muscle crossing diagonally along the side of the neck. It turns and bends the head.", "복장뼈 윗부분, 빗장뼈 안쪽": "Top of the sternum, inner clavicle", "귀 뒤 꼭지돌기(유양돌기)": "Mastoid process behind the ear", "고개 돌리기, 옆으로 기울이기, 앞으로 숙이기": "Turns the head, tilts it sideways, bends it forward", "고개를 숙이고 폰을 오래 보면 짧아지고 뻣뻣해져요. 턱 당기기와 목 옆 스트레칭이 도움이 돼요.": "Looking down at your phone for long periods shortens and stiffens it. Chin tucks and side-neck stretches help.", "배곧은근": "Rectus abdominis", "배 앞쪽을 세로로 지나는 근육이에요. 힘줄 마디가 있어서 복근이 나뉘어 보여요.": "A muscle running vertically down the front of the abdomen. Tendon bands make the abs look divided.", "두덩뼈(치골)": "Pubic bone", "칼돌기, 5~7번 갈비연골": "Xiphoid process, 5th–7th rib cartilages", "상체 굽히기, 골반 말아 올리기, 허리 안정": "Bends the trunk, curls the pelvis up, stabilizes the lower back", "플랭크처럼 허리를 버티는 운동이 허리 건강에 도움이 돼요. 윗몸을 과하게 말면 목에 부담이 가요.": "Exercises that hold the lower back, like planks, help back health. Curling the upper body too much strains the neck.", "큰볼기근": "Gluteus maximus", "엉덩이를 이루는 가장 큰 근육이에요. 일어서고 계단을 오를 때 허벅지를 뒤로 보내는 힘을 내요.": "The largest muscle of the buttocks. It drives the thigh backward when you stand and climb stairs.", "엉치뼈, 엉덩뼈 뒤쪽": "Sacrum, back of the ilium", "넙다리뼈 뒤 거친면, 엉덩정강근막띠": "Gluteal tuberosity of the femur, iliotibial band", "고관절 펴기, 다리 바깥으로 돌리기": "Extends the hip, rotates the leg outward", "브릿지, 힙 힌지가 대표 운동이에요. 오래 앉으면 쓰임이 줄어 허리 부담이 커져요.": "Bridges and hip hinges are the classic exercises. Sitting long lowers its use and increases lower back strain.", "넙다리네갈래근": "Quadriceps", "허벅지 앞쪽의 큰 근육이에요. 네 갈래가 한 힘줄로 모여 무릎뼈를 지나 정강이에 붙어요.": "The large muscle at the front of the thigh. Its four heads join into one tendon that passes the kneecap and attaches to the shin.", "엉덩뼈 앞쪽, 넙다리뼈 몸통": "Front of the ilium, shaft of the femur", "무릎뼈를 지나 정강뼈 거친면": "Past the kneecap to the tibial tuberosity", "무릎 펴기, 계단 오르기, 일어서기": "Straightens the knee, climbs stairs, stands up", "의자 스쿼트, 앉아서 무릎 펴기가 좋아요. 무릎이 발끝보다 안쪽으로 모이지 않게 하세요.": "Chair squats and seated knee extensions are good. Don't let your knees cave inward past your toes.", "뒤넙다리근": "Hamstrings", "허벅지 뒤쪽 근육 무리예요. 엉덩이에서 시작해 무릎 뒤 양쪽으로 갈라져 붙어요.": "A group of muscles at the back of the thigh. They start at the hip and split to attach on both sides behind the knee.", "궁둥뼈 결절(앉았을 때 닿는 뼈)": "Ischial tuberosity (the bone you sit on)", "정강뼈와 종아리뼈 위쪽": "Upper tibia and fibula", "무릎 굽히기, 엉덩관절 펴기": "Bends the knee, extends the hip", "앉아 있는 시간이 길면 짧아져 허리와 골반이 당겨요. 누워서 다리 들어 올리는 스트레칭이 좋아요.": "Long sitting shortens them and pulls on the lower back and pelvis. A lying leg-raise stretch works well.", "장딴지근": "Gastrocnemius", "종아리 위쪽의 볼록한 근육이에요. 아킬레스힘줄로 모여 발뒤꿈치에 붙어요.": "The bulging muscle at the top of the calf. It converges into the Achilles tendon and attaches to the heel.", "넙다리뼈 아래쪽 안·바깥 융기": "Inner and outer condyles at the lower femur", "아킬레스힘줄을 지나 발뒤꿈치뼈": "Past the Achilles tendon to the heel bone", "발끝 세우기, 무릎 굽히기 보조": "Rises onto the toes, assists knee bending", "벽 종아리 스트레칭, 발뒤꿈치 올리기가 대표 운동이에요. 오래 서 있으면 쉽게 뭉쳐요.": "Wall calf stretches and heel raises are the classic exercises. It knots easily from long standing.", "손목 굽힘근": "Wrist flexors", "아래팔 안쪽(손바닥 쪽)의 근육 무리예요. 손목과 손가락을 굽혀요.": "A group of muscles on the inner forearm (palm side). They bend the wrist and fingers.", "위팔뼈 안쪽 위관절융기(팔꿈치 안쪽)": "Medial epicondyle of the humerus (inner elbow)", "손목뼈, 손가락뼈": "Wrist bones, finger bones", "손목 굽히기, 손가락 쥐기": "Bends the wrist, grips the fingers", "타이핑이나 마우스를 오래 쓰면 쌓여요. 팔을 펴고 손끝을 아래로 당기는 스트레칭을 해보세요.": "It builds up from long typing or mouse use. Try stretching with your arm straight and fingertips pulled down.", "손목 폄근": "Wrist extensors", "아래팔 바깥쪽(손등 쪽)의 근육 무리예요. 손목과 손가락을 펴고 손목을 안정시켜요.": "A group of muscles on the outer forearm (back of hand side). They extend the wrist and fingers and stabilize the wrist.", "위팔뼈 바깥 위관절융기(팔꿈치 바깥)": "Lateral epicondyle of the humerus (outer elbow)", "손등 쪽 손목뼈, 손가락뼈": "Wrist bones and finger bones on the back of the hand", "손목 젖히기, 손가락 펴기": "Bends the wrist back, extends the fingers", "손목을 꺾은 채 타이핑하면 부담이 커요. 손등을 아래로 돌려 당기는 스트레칭을 해보세요.": "Typing with bent wrists adds strain. Try stretching by turning the back of your hand down and pulling.", "← 운동 목록": "← Exercise list", "근육 ON": "Muscles ON", "근육 OFF": "Muscles OFF", "이는곳": "Origin", "닿는곳": "Insertion", "하는 일": "Action", "파란 점은 근육이 시작하는 곳, 초록 점은 닿는 곳이에요. 단순화한 도식이라 실제 해부도와 다를 수 있어요.": "Blue dots mark where a muscle starts and green dots where it attaches. This is a simplified diagram and may differ from real anatomy.", "▶ 움직임 보기": "▶ See movement", "염소자리": "Capricorn", "물병자리": "Aquarius", "물고기자리": "Pisces", "양자리": "Aries", "황소자리": "Taurus", "쌍둥이자리": "Gemini", "게자리": "Cancer", "사자자리": "Leo", "처녀자리": "Virgo", "천칭자리": "Libra", "전갈자리": "Scorpio", "사수자리": "Sagittarius", "불": "Fire", "흙": "Earth", "바람": "Air", "물": "Water", "열정적이고 에너지가 넘치는": "passionate and energetic", "차분하고 현실적인": "calm and practical", "자유롭고 호기심 많은": "free-spirited and curious", "감성이 깊고 섬세한": "deeply emotional and sensitive", "A형": "Type A", "섬세하고 차분한 감성 → 서정적이고 잔잔한 곡": "Delicate, calm sensibility → lyrical, gentle songs", "B형": "Type B", "자유롭고 호기심 많은 감성 → 리듬감 있고 개성 있는 곡": "Free-spirited, curious sensibility → rhythmic, distinctive songs", "O형": "Type O", "에너지 넘치고 긍정적인 감성 → 힘 있고 따라 부르기 좋은 곡": "Energetic, positive sensibility → powerful songs that are easy to sing along to", "AB형": "Type AB", "독특하고 다채로운 감성 → 장르를 넘나드는 곡": "Unique, many-sided sensibility → songs that cross genres", "혈액형 모름": "Blood type unknown", "혈액형 없이 오행·별자리·오늘의 기분으로 골랐어요": "Chosen using your Five Elements, zodiac and today's mood, without a blood type", "밤편지": "Through the Night", "아이유": "IU", "좋은 날": "Good Day", "봄날": "Spring Day", "야생화": "Wild Flower", "박효신": "Park Hyo-shin", "서른 즈음에": "Around Thirty", "김광석": "Kim Kwang-seok", "킬리만자로의 표범": "The Leopard of Kilimanjaro", "조용필": "Cho Yong-pil", "벚꽃 엔딩": "Cherry Blossom Ending", "버스커 버스커": "Busker の木陰になってあげてください。", "작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.": "小さな火種ひとつが部屋全体を温めます。今日のあなたの笑顔がその火種です。", "타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.": "燃え盛るものだけが光ではありません。ほのかに隣を照らすのも力です。", "마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.": "心が冷めたなら、深く息を一つ吸いましょう。火種はまだそこにあります。", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "今日一度大きく笑えば、一日の温度が変わります。", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "大地は黙ってすべてを支えてくれます。今日を耐えただけでも十分大きなことです。", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "ゆっくり踏み固めた道がいちばん遠くまで行けます。今日も一歩で十分です。", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "しっかりした一食が一日の軸になります。今日は自分をよく食べさせてあげましょう。", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "根の深い人は風が吹いても笑っています。自分の根を信じましょう。", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "鉄は火をくぐってこそ強くなります。今の困難があなたを磨いています。", "맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.": "澄んだ鐘の音は遠くまで響きます。今日かける一言も、そのように届くでしょう。", "깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.": "深く息を吸って肩を開きましょう。胸が開けば心もついて開きます。", "정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.": "整った机と心は似ています。今日ひとつだけ手放せば軽くなります。", "물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.": "水はふさがれれば回り道をし、たまれば休みます。休むことも流れの一部です。", "깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.": "深い水は音もなく流れます。静かにやり遂げる一日も素敵です。", "오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.": "今日は急がず流れましょう。海は結局すべての水を受け止めてくれます。", "따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.": "温かい水一杯が心をほぐします。ちょっと立ち止まって自分をいたわりましょう。", "오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.": "今日は感情のリズムが低い日です。自分に少しだけ優しくしてあげましょう。", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠보세요.": "今日は気持ちが澄んでいる日です。そのエネルギーを周りに分けてあげましょう。", "오늘은 차분하게 균형을 지키기 좋은 날이에요.": "今日は落ち着いてバランスを保つのによい日です。", "오늘 나에게 맞는 글귀": "今日のあなたへの言葉", "목형 (성장·추진형)": "木タイプ(成長・推進型)", "새로운 계획과 배움 이야기를 즐기고 시원시원하게 말하는 사람": "新しい計画や学びの話が好きで、さっぱり話す人", "“요즘 새로 시작한 게 있어요?”처럼 근황과 계획을 물어보세요": "「最近、新しく始めたことはありますか?」のように近況や計画を聞いてみましょう", "초록": "グリーン", "화형 (열정·밝은 에너지형)": "火タイプ(情熱・明るいエネルギー型)", "표정이 밝고 말이 빠르며 웃음이 많은 사람": "表情が明るく、話が早く、よく笑う人", "“오늘 기분 좋아 보여요!”처럼 먼저 웃으며 인사해 보세요": "「今日は機嫌がよさそうですね!」のように、先に笑顔で挨拶してみましょう", "빨강": "レッド", "토형 (믿음직·안정형)": "土タイプ(頼もしい・安定型)", "차분하고 말수는 적지만 약속을 잘 지키는 사람": "落ち着いていて口数は少ないけれど、約束をきちんと守る人", "고민을 솔직하게 털어놓고 조언을 구해 보세요": "悩みを正 쪽으로 올라가거나 허리가 꺾이면 안 돼요. 어깨는 아래로 내려요": "肩が耳のほうへ上がったり、腰が反ったりしてはいけません。肩は下げます", "뒤로 모을 때 내쉬고 돌아올 때 들이쉬요": "後ろに寄せるときに吐き、戻るときに吸います", "삼각근(어깨)": "三角筋(肩)", "하부 승모근·전거근": "僧帽筋下部・前鋸筋", "대흉근(가슴 앞)": "大胸筋(胸の前)", "어깨와 날개뼈 아래가 쓰이고 가슴 앞이 시원하게 늘어나요": "肩と肩甲骨の下が使われ、胸の前が気持ちよく伸びます", "팔을 올릴 때 허리가 벽에서 뜨거나 어깨가 올라가면 안 돼요": "腕を上げるとき、腰が壁から浮いたり肩が上がったりしてはいけません", "올릴 때 내쉬고 내릴 때 들이쉬어요": "上げるときに吐き、下ろすときに吸います", "척추기립근(등)": "脊柱起立筋(背中)", "복직근(배)": "腹直筋(お腹)", "등을 말 때 배가 조여지고, 등을 내릴 때 허리 근육이 쓰여요": "背中を丸めるときにお腹が締まり、背中を下げるときに腰の筋肉が使われます", "팔꿈치를 굽히거나 엉덩이를 뒤로 빼면 척추가 덜 움직여요": "肘を曲げたりお尻を後ろに引いたりすると、背骨があまり動きません", "말 때 내쉬고 펼 때 들이쉬어요": "丸めるときに吐き、伸ばすときに吸います", "척추기립근·다열근": "脊柱起立筋・多裂筋", "대둔근·햄스트링": "大殿筋・ハムストリングス", "허리와 엉덩이, 반대쪽 어깨가 함께 단단해지는 느낌이에요": "腰とお尻、反対側の肩がいっしょに引き締まる感じです", "다리를 너무 높이 올려 허리가 꺾이거나 골반이 돌아가면 안 돼요": "脚を高く上げすぎて腰が反ったり、骨盤が回ったりしてはいけません", "뻗으며 내쉬고 돌아오며 들이쉬어요": "伸ばすときに吐き、戻るときに吸います", "대둔근·햄스트링(엉덩이·허벅지 뒤)": "大殿筋・ハムストリングス(お尻・太ももの裏)", "척추기립근": "脊柱起立筋", "복횡근(배 깊은 근육)": "腹横筋(お腹の深い筋肉)", "엉덩이와 허벅지 뒤가 힘을 쓰고 허리는 편안해야 해요": "お尻と太ももの裏が力を使い、腰は楽でなければなりません", "허리를 과하게 꺾거나 무릎이 벌어지면 안 돼요. 발뒤꿈치로 바닥을 밀어요": "腰を反らしすぎたり、膝が開いたりしてはいけません。かかとで床を押します", "대퇴사두근(허벅지 앞)": "大腿四頭筋(太ももの前)", "대둔근(엉덩이)": "大殿筋(お尻)", "비복근(종아리)": "腓腹筋(ふくらはぎ)", "허벅지 앞과 엉덩이에 힘이 들어가고 무릎은 편안해야 해요": "太ももの前とお尻に力が入り、膝は楽でなければなりません", "무릎이 안으로 모이거나 발끝보다 많이 앞으로 나가면 안 돼요": "膝が内側に寄ったり、つま先よりかなり前に出たりしてはいけません", "내려갈 때 들이쉬고 일어나며 내쉬어요": "下りるときに吸い、立ち上がるときに吐きます", "비복근·가자미근(종아리)": "腓腹筋・ヒラメ筋(ふくらはぎ)", "햄스트링(허벅지 뒤)": "ハムストリングス(太ももの裏)", "뒤쪽 다리 종아리가 당기며 늘어나는 느낌이에요": "後ろ脚のふくらはぎが引かれて伸びる感じです", "뒤꿈치가 들리거나 무릎이 굽으면 늘어나지 않아요": "かかとが浮いたり膝が曲がったりすると伸びません", "숨을 참지 말고 천천히 쉬어요": "息を止めず、ゆっくり吐きます", "허벅지 앞이 단단하게 조여지는 느낌이에요": "太ももの前がぎゅっと締まる感じです", "발을 휙 차듯 올리지 말고 천천히 올려요. 허리를 뒤로 젖히지 않아요": "足を蹴り上げるように上げず、ゆっくり上げます。腰を後ろに反らしません", "펼 때 내쉬고 내릴 때 들이쉬어요": "伸ばすときに吐き、下ろすときに吸います", "아래팔 신전근(손등 쪽)": "前腕伸筋(手の甲側)", "아래팔 굴곡근(손바닥 쪽)": "前腕屈筋(手のひら側)", "아래팔 안쪽과 바깥쪽이 번갈아 늘어나는 느낌이에요": "前腕の内側と外側が交互に伸びる感じです", "세게 꺾으면 안 돼요. 살짝 당기는 정도에서 멈춰요": "強く曲げてはいけません。軽く引かれるところで止めます", "숨을 편하게 쉬어요": "楽に呼吸します", "아래팔 신전근": "前腕伸筋", "아래팔 굴곡근": "前腕屈筋", "아래팔이 번갈아 가볍게 쓰이는 느낌이에요": "前腕が交互に軽く使われる感じです", "팔꿈치가 흔들리지 않게 고정해요": "肘が揺れないように固定します", "일정한 리듬으로 편하게 쉬어요": "一定のリズムで楽に呼吸します", "대둔근·척추기립근": "大殿筋・脊柱起立筋", "허벅지 뒤가 당기고 엉덩이가 힘으로 밀어 올려지는 느낌이에요": "太ももの裏が引かれ、お尻の力で押し上げられる感じです", "허리를 둥글게 말면 안 돼요. 엉덩이를 뒤로 빼는 동작이에요": "腰を丸めてはいけません。お尻を後ろに引く動作です", "숙일 때 들이쉬고 일어날 때 내쉬어요": "倒すときに吸い、立つときに吐きます", "장요근·대퇴직근(허벅지 앞)": "腸腰筋・大腿直筋(太ももの前)", "지지다리 대둔근": "支える脚の大殿筋", "당기는 쪽 엉덩이가 늘어나고 지지하는 다리는 균형을 잡아요": "引く側のお尻が伸び、支える脚はバランスをとります", "상체를 뒤로 젖히지 않고 곧게 서요": "上体を後ろに反らさず、まっすぐ立ちます", "당길 때 내쉬어요": "引くときに吐きます", "강하게": "強", "보통": "中", "약하게": "弱", " 운동": " 運動", "근육 해부도 보기 (이는곳·닿는곳)": "筋肉の解剖図を見る(起始・停止)", "운동을 누르면 근육이 쓰이는 부위를 크게 확대해서 보여줘요": "運動を押すと、筋肉が使われる部位を大きく拡大して見せます", "크게 보기 ›": "拡大して見る ›", " · 늘어남": " · 伸ばされる", "진한 빨강 = 가장 세게 쓰는 근육 · 중간 빨강 = 보통 · 연한 빨강 = 약하게 쓰거나 늘어나는 근육": "濃い赤 = いちばん強く使う筋肉 · 中くらいの赤 = 普通 · 薄い赤 = 弱く使う、または伸びる筋肉", "← 목록": "← 一覧", "전체 몸 보기": "全身を見る", "확대해서 보기": "拡大して見る", "어떤 근육이 움직이나요": "どの筋肉が動く?", "근육이 빨갛게 표시돼요. 진할수록 더 세게 쓰는 근육이에요. 확대하면 근육 이름이 보여요.": "筋肉が赤く表示されます。濃いほど強く使う筋肉です。拡大すると筋肉の名前が見えます。", "따라하는 방법": "やり方", "핵심 포인트": "ポイント", "이렇게 느껌져야 해요": "感じるはずのこと", "흔한 실수": "よくある間違い", "호흡": "呼吸", "통증이 생기면 바로 멈추고, 계속되면 의료진과 상담하세요.": "痛みが出たらすぐ止めて、続く場合は医療機関に相談してください。", "큰가슴근": "大胸筋", "가슴 부위를 대부분 감싸고 있는 부채꼴 근육이에요. 빗장뼈 부분, 복장갈비 부분, 배 부분 세 부분으로 나눌 수 있어요.": "胸の大部分を覆う扇形の筋肉です。鎖骨部・胸肋部・腹部の3つに分けられます。", "빗장뼈 안쪽, 복장뼈, 위쪽 갈비연골": "鎖骨の内側、胸骨、上部の肋軟骨", "위팔뼈 위쪽 앞면(큰결절능)": "上腕骨の上部前面(大結節稜)", "팔을 앞으로 모으기, 안쪽으로 돌리기, 올린 팔 내리기": "腕を前に寄せる、内側に回す、上げた腕を下ろす", "벽에 팔을 대고 몸을 돌리는 가슴 스트레칭이 좋아요. 컴퓨터 작업이 길면 앞으로 말린 어깨의 원인이 돼요.": "壁に腕をつけて体をひねる胸のストレッチがよいです。パソコン作業が長いと、巻き肩の原因になります。", "어깨세모근": "三角筋", "어깨를 둥글게 덮는 근육이에요. 앞·가운데·뒤 세 부분이 팔을 올리는 방향마다 나눠서 일해요.": "肩を丸く覆う筋肉です。前・中・後ろの3つの部分が、腕を上げる方向ごとに分担して働きます。", "빗장뼈 바깥쪽, 어깨뼈 봉우리, 어깨뼈 가시": "鎖骨の外側、肩峰、肩甲棘", "위팔뼈 가운데 바깥면(세모근 거친면)": "上腕骨の中央外側面(三角筋粗面)", "팔을 옆·앞·뒤로 들어 올리기": "腕を横・前・後ろに上げる", "가벼운 덤벨로 옆으로 들어 올리는 운동이 대표적이에요. 어깨를 으쓱하며 올리지 않게 주의하세요.": "軽いダンベルでのサイドレイズが代表的です。肩をすくめて上げないように注意しましょう。", "등세모근": "僧帽筋", "뒤통수부터 등 가운데까지 이어지는 마름모꼴 근육이에요. 위·가운데·아래 세 부분으로 나뉘며 어깨뼈를 올리고 모으고 내려요.": "後頭部から背中の中央まで続くひし形の筋肉です。上・中・下の3つに分かれ、肩甲骨を上げる・寄せる・下げる働きをします。", "뒤통수뼈, 목덜미 인대, 목뼈 7번~가슴뼈 12번 가시돌기": "後頭骨、項靭帯、第7頸椎〜第12胸椎の棘突起", "빗장뼈 바깥쪽, 어깨뼈 봉우리와 어깨뼈 가시": "鎖骨の外側、肩峰と肩甲棘", "어깨 으쓱하기, 어깨뼈 모으기, 고개 젖히기": "肩をすくめる、肩甲骨を寄せる、頭をそらす", "턱을 당기고 어깨뼈를 모으는 운동, 목·어깨 스트레칭이 도움이 돼요. 화면을 오래 보면 위쪽이 쉽게 뭉쳐요.": "あごを引いて肩甲骨を寄せる運動、首・肩のストレッチが役立ちます。画面を長く見ると上部がこりやすいです。", "넓은등근": "広背筋", "등 아래쪽을 넓게 덮는 큰 삼각형 근육이에요. 몸통에서 시작해 겨드랑이 쪽 위팔뼈로 모여요.": "背中の下側を広く覆う大きな三角形の筋肉です。体幹から始まり、脇の下の上腕骨に集まります。", "가슴뼈 7번~허리뼈 가시돌기, 엉덩뼈능선, 아래 갈비뼈": "第7胸椎〜腰椎の棘突起、腸骨稜、下部の肋骨", "위팔뼈 앞쪽 고랑(결절간구)": "上腕骨の前面の溝(結節間溝)", "올린 팔 끌어내리기, 팔 뒤로 젖히기, 안쪽으로 돌리기": "上げた腕を引き下ろす、腕を後ろに引く、内側に回す", "턱걸이, 랫풀다운이 대표 운동이고, 한 팔을 올려 옆구리를 늘리는 스트레칭이 좋아요.": "懸垂とラットプルダウンが代表的で、片腕を上げて脇腹を伸ばすストレッチがよいです。", "목빗근": "胸鎖乳突筋", "목 옆을 비스듬히 가로지르는 근육이에요. 머리를 돌리고 숙이는 데 쓰여요.": "首の横を斜めに横切る筋肉です。頭を回したり下げたりするのに使われます。", "복장뼈 윗부분, 빗장뼈 안쪽": "胸骨の上部、鎖骨の内側", "귀 뒤 꼭지돌기(유양돌기)": "耳の後ろの乳様突起", "고개 돌리기, 옆으로 기울이기, 앞으로 숙이기": "頭を回す、横に傾ける、前に下げる", "고개를 숙이고 폰을 오래 보면 짧아지고 뻣뻣해져요. 턱 당기기와 목 옆 스트레칭이 도움이 돼요.": "うつむいてスマホを長く見ると、短く固くなります。チンタックと首の横のストレッチが役立ちます。", "배곧은근": "腹直筋", "배 앞쪽을 세로로 지나는 근육이에요. 힘줄 마디가 있어서 복근이 나뉘어 보여요.": "お腹の前を縦に通る筋肉です。腱の節があるため、腹筋が分かれて見えます。", "두덩뼈(치골)": "恥骨", "칼돌기, 5~7번 갈비연골": "剣状突起、第5〜7肋軟骨", "상체 굽히기, 골반 말아 올리기, 허리 안정": "上体を曲げる、骨盤を巻き上げる、腰を安定させる", "플랭크처럼 허리를 버티는 운동이 허리 건강에 도움이 돼요. 윗몸을 과하게 말면 목에 부담이 가요.": "プランクのように腰を支える運動が腰の健康に役立ちます。上体を過度に丸めると首に負担がかかります。", "큰볼기근": "大殿筋", "엉덩이를 이루는 가장 큰 근육이에요. 일어서고 계단을 오를 때 허벅지를 뒤로 보내는 힘을 내요.": "お尻をつくる最も大きな筋肉です。立ち上がるときや階段を上るとき、太ももを後ろへ送る力を出します。", "엉치뼈, 엉덩뼈 뒤쪽": "仙骨、腸骨の後ろ側", "넙다리뼈 뒤 거친면, 엉덩정강근막띠": "大腿骨の後ろの粗面、腸脛靭帯", "고관절 펴기, 다리 바깥으로 돌리기": "股関節を伸ばす、脚を外側に回す", "브릿지, 힙 힌지가 대표 운동이에요. 오래 앉으면 쓰임이 줄어 허리 부담이 커져요.": "ブリッジとヒップヒンジが代表的な運動です。長く座ると使われる量が減り、腰の負担が大きくなります。", "넙다리네갈래근": "大腿四頭筋", "허벅지 앞쪽의 큰 근육이에요. 네 갈래가 한 힘줄로 모여 무릎뼈를 지나 정강이에 붙어요.": "太ももの前側の大きな筋肉です。4つの頭がひとつの腱に集まり、膝のお皿を通ってすねにつきます。", "엉덩뼈 앞쪽, 넙다리뼈 몸통": "腸骨の前側、大腿骨の体部", "무릎뼈를 지나 정강뼈 거친면": "膝のお皿を通って脛骨粗面へ", "무릎 펴기, 계단 오르기, 일어서기": "膝を伸ばす、階段を上る、立ち上がる", "의자 스쿼트, 앉아서 무릎 펴기가 좋아요. 무릎이 발끝보다 안쪽으로 모이지 않게 하세요.": "チェアスクワットや座って膝を伸ばす運動がよいです。膝がつま先より内側に寄らないようにしましょう。", "뒤넙다리근": "ハムストリングス", "허벅지 뒤쪽 근육 무리예요. 엉덩이에서 시작해 무릎 뒤 양쪽으로 갈라져 붙어요.": "太ももの後ろ側の筋肉群です。お尻から始まり、膝の裏の両側に分かれてつきます。", "궁둥뼈 결절(앉았을 때 닿는 뼈)": "坐骨結節(座ったときに当たる骨)", "정강뼈와 종아리뼈 위쪽": "脛骨と腓骨の上部", "무릎 굽히기, 엉덩관절 펴기": "膝を曲げる、股関節を伸ばす", "앉아 있는 시간이 길면 짧아져 허리와 골반이 당겨요. 누워서 다리 들어 올리는 스트레칭이 좋아요.": "座っている時間が長いと短くなり、腰と骨盤が引っ張られます。仰向けで脚を上げるストレッチがよいです。", "장딴지근": "腓腹筋", "종아리 위쪽의 볼록한 근육이에요. 아킬레스힘줄로 모여 발뒤꿈치에 붙어요.": "ふくらはぎの上側のふくらんだ筋肉です。アキレス腱に集まり、かかとにつきます。", "넙다리뼈 아래쪽 안·바깥 융기": "大腿骨下部の内側・外側の隆起", "아킬레스힘줄을 지나 발뒤꿈치뼈": "アキレス腱を通って踵骨", "발끝 세우기, 무릎 굽히기 보조": "つま先立ち、膝を曲げる補助", "벽 종아리 스트레칭, 발뒤꿈치 올리기가 대표 운동이에요. 오래 서 있으면 쉽게 뭉쳐요.": "壁ふくらはぎストレッチとかかと上げが代表的な運動です。長く立っているとこりやすいです。", "손목 굽힘근": "手首の屈筋", "아래팔 안쪽(손바닥 쪽)의 근육 무리예요. 손목과 손가락을 굽혀요.": "前腕の内側(手のひら側)の筋肉群です。手首と指を曲げます。", "위팔뼈 안쪽 위관절융기(팔꿈치 안쪽)": "上腕骨内側上顆(肘の内側)", "손목뼈, 손가락뼈": "手根骨、指の骨", "손목 굽히기, 손가락 쥐기": "手首を曲げる、指を握る", "타이핑이나 마우스를 오래 쓰면 쌓여요. 팔을 펴고 손끝을 아래로 당기는 스트레칭을 해보세요.": "タイピングやマウスを長く使うと溜まります。腕を伸ばして指先を下に引くストレッチをしてみましょう。", "손목 폄근": "手首の伸筋", "아래팔 바깥쪽(손등 쪽)의 근육 무리예요. 손목과 손가락을 펴고 손목을 안정시켜요.": "前腕の外側(手の甲側)の筋肉群です。手首と指を伸ばし、手首を安定させます。", "위팔뼈 바깥 위관절융기(팔꿈치 바깥)": "上腕骨外側上顆(肘の外側)", "손등 쪽 손목뼈, 손가락뼈": "手の甲側の手根骨、指の骨", "손목 젖히기, 손가락 펴기": "手首をそらす、指を伸ばす", "손목을 꺾은 채 타이핑하면 부담이 커요. 손등을 아래로 돌려 당기는 스트레칭을 해보세요.": "手首を曲げたままタイピングすると負担が大きくなります。手の甲を下に向けて引くストレッチをしてみましょう。", "← 운동 목록": "← 運動一覧", "근육 ON": "筋肉 ON", "근육 OFF": "筋肉 OFF", "이는곳": "起始", "닿는곳": "停止", "하는 일": "働き", "파란 점은 근육이 시작하는 곳, 초록 점은 닿는 곳이에요. 단순화한 도식이라 실제 해부도와 다를 수 있어요.": "青い点は筋肉の始まる場所、緑の点は付着する場所です。単純化した図なので、実際の解剖図と異なることがあります。", "▶ 움직임 보기": "▶ 動きを見る", "염소자리": "やぎ座", "물병자리": "みずがめ座", "물고기자리": "うお座", "양자리": "おひつじ座", "황소자리": "おうし座", "쌍둥이자리": "ふたご座", "게자리": "かに座", "사자자리": "しし座", "처녀자리": "おとめ座", "천칭자리": "てんびん座", "전갈자리": "さそり座", "사수자리": "いて座", "불": "火", "흙": "土", "바람": "風", "물": "水", "열정적이고 에너지가 넘치는": "情熱的でエネルギーにあふれた", "차분하고 현실적인": "落ち着いていて現実的な", "자유롭고 호기심 많은": "自由で好奇心旺盛な", "감성이 깊고 섬세한": "感受性が豊かで繊細な", "A형": "A型", "섬세하고 차분한 감성 → 서정적이고 잔잔한 곡": "繊細で落ち着いた感性 → 叙情的で穏やかな曲", "B형": "B型", "자유롭고 호기심 많은 감성  종아리 스트레칭이 도움이 돼요.": "长时间站立对膝盖和脚负担大。缓冲好的鞋和小腿拉伸会有帮助。", "주방 일은 허리·손목 부담이 커요. 작업대 높이를 맞추고 발밑에 매트를 두세요.": "厨房工作对腰部和手腕负担大。请调整操作台高度，并在脚下放一块垫子。", "장시간 운전과 짐 나르기는 허리·목에 부담이 커요. 1~2시간마다 쉬고 짐은 몸 가까이 들어요.": "长时间驾驶和搬运货物对腰部和颈部负担大。每1～2小时休息一次，货物贴近身体搬运。", "반복 동작과 무거운 작업은 허리·어깨에 부담이 커요. 작업 전 준비운동과 보호 장비를 챙기세요.": "重复性动作和重体力工作对腰部和肩膀负担大。工作前请热身，并使用防护装备。", "굽힌 자세 작업이 많아 허리·무릎이 힘들어요. 작업 사이 허리를 펴는 습관을 들이세요.": "弯腰作业多，腰部和膝盖会吃力。请养成在工作间隙伸直腰的习惯。", "안기·들기·서서 하는 집안일이 잦아 허리·손목이 힘들어요. 안는 위치를 자주 바꾸세요.": "抱孩子、提重物、站着做家务较多，腰部和手腕会吃力。请经常更换抱的位置。", "근무 시간이 길어지기 쉬워요. 틈틈이 앉았다 서기를 번갈아 하고 식사 시간을 지키세요.": "工作时间容易拖长。请交替坐着和站着，并按时吃饭。", "활동량이 줄기 쉬워요. 하루 30분 걷기와 가벼운 근력 운동을 꾸준히 이어가세요.": "活动量容易减少。请坚持每天散步30分钟和轻度力量训练。", "내 일에서 가장 오래 하는 동작을 찾아 그 자세를 자주 바꿔주세요.": "找出你工作中做得最久的动作，并经常改变那个姿势。", "시간": "小时", "생년월일을 입력해 주세요": "请输入出生日期", "턱 당기기": "收下巴", "목 깊은 굴곡근, 후두하근, 흉쇄유돌근": "颈深屈肌、枕下肌、胸锁乳突肌", "5초 유지 × 10회 × 3세트": "保持5秒 × 10次 × 3组", "등과 엉덩이를 벽에 붙이고 시선은 정면에 둬요": "背部和臀部贴墙，视线看向正前方", "고개를 숙이지 말고 턱을 뒤로 살짝 당겨 이중턱을 만들어요": "不要低头，把下巴轻轻向后收，做出双下巴", "5초 버틴 뒤 천천히 풀어요": "坚持5秒后，慢慢放松", "날개뼈 모으기": "肩胛骨内收", "능형근, 중·하부 승모근, 후면 삼각근": "菱形肌、斜方肌中下部、三角肌后束", "5초 유지 × 12회 × 3세트": "保持5秒 × 12次 × 3组", "팔꿈치를 90도로 굽혀 앞으로 나란히 해요": "手肘弯成90度，向前平举", "팔꿈치를 뒤로 보내며 양쪽 날개뼈를 가운데로 조여요": "手肘向后，同时把两侧肩胛骨向中间夹紧", "어깨가 올라가지 않게 5초 버티고 돌아와요": "保持5秒，不要耸肩，然后回到起始位置", "벽 천사 (팔 올리기)": "靠墙天使(举臂)", "전거근, 하부 승모근, 삼각근 (가슴 앞쪽은 늘어나요)": "前锯肌、斜方肌下部、三角肌(胸前侧会被拉伸)", "10회 × 3세트": "10次 × 3组", "등을 벽에 대고 서서 팔꿈치를 굽혀 어깨 높이에 둬요": "背靠墙站立，手肘弯曲放在肩膀高度", "팔을 벽을 타고 천천히 머리 위로 쭉 올려요": "手臂贴着墙慢慢向头顶上方伸直", "허리가 벽에서 뜨지 않게 하며 천천히 내려요": "慢慢放下，腰部不要离开墙面", "고양이-소 자세": "猫牛式", "척추기립근, 다열근, 복직근 (허리뼈 주변)": "竖脊肌、多裂肌、腹直肌(腰椎周围)", "10회 × 3세트 (천천히)": "10次 × 3组(慢慢做)", "네발기기 자세로 손은 어깨 아래, 무릎은 엉덩이 아래에 둬요": "四足跪姿，手在肩膀正下方，膝盖在髋部正下方", "숨을 내쉬며 등을 둥글게 말고 시선은 배꼽으로 보내요": "呼气，把背部拱圆，视线看向肚脐", "숨을 들이쉬며 배를 내리고 가슴과 시선을 천천히 들어요": "吸气，让肚子下沉，慢慢抬起胸口和视线", "버드독": "鸟狗式", "다열근, 척추기립근, 복횡근, 대둔근": "多裂肌、竖脊肌、腹横肌、臀大肌", "좌우 번갈아 8회 × 3세트": "左右交替8次 × 3组", "네발기기 자세에서 배에 힘을 줘 허리를 평평하게 해요": "四足跪姿，收紧腹部，让腰部保持平直", "한쪽 팔과 반대쪽 다리를 동시에 천천히 길게 뻗어요": "同时慢慢向远处伸出一只手臂和对侧的腿", "골반이 기울지 않게 3초 버티고 돌아와요": "骨盆不要倾斜，坚持3秒后回到起始位置", "브릿지 (엉덩이 들기)": "臀桥(抬臀)", "대둔근, 햄스트링, 척추기립근, 복횡근": "臀大肌、腘绳肌、竖脊肌、腹横肌", "3초 유지 × 12회 × 3세트": "保持3秒 × 12次 × 3组", "누워서 무릎을 세우고 발은 엉덩이 너비로 벌려요": "躺下，屈膝，双脚与髋同宽", "엉덩이를 천천히 들어 어깨-엉덩이-무릎이 일직선이 되게 해요": "慢慢抬起臀部，使肩-臀-膝成一条直线", "허리를 꺾지 말고 3초 버틴 뒤 천천히 내려와요": "不要过度塌腰，坚持3秒后慢慢放下", "의자 스쿼트": "椅子深蹲", "대퇴사두근, 대둔근, 햄스트링": "股四头肌、臀大肌、腘绳肌", "의자 앞에 발을 어깨너비로 벌리고 서요": "站在椅子前，双脚与肩同宽", "엉덩이를 뒤로 빼며 앉듯이 내려가요 (무릎이 발끝을 넘지 않게)": "臀部向后坐，像要坐下一样往下蹲(膝盖不要超过脚尖)", "발바닥으로 바닥을 밀며 천천히 일어나요": "用脚掌蹬地，慢慢站起来", "벽 종아리 스트레칭": "靠墙小腿拉伸", "비복근, 가자미근, 아킬레스건": "腓肠肌、比目鱼肌、跟腱", "각 다리 30초 × 3세트": "每条腿30秒 × 3组", "벽을 짚고 한 다리는 앞, 한 다리는 뒤로 둬요": "手扶墙，一条腿在前，一条腿在后", "뒤쪽 무릎을 펴고 발뒤꿈치를 바닥에 붙인 채 몸을 벽 쪽으로 기울여요": "后侧膝盖伸直，脚后跟贴地，身体向墙的方向倾斜", "종아리가 당기는 느낌에서 30초 유지해요": "在小腿有拉伸感的位置保持30秒", "앉아서 무릎 펴기": "坐姿伸膝", "대퇴사두근 (허벅지 앞쪽)": "股四头肌(大腿前侧)", "좌우 12회 × 3세트": "左右各12次 × 3组", "의자에 허리를 펴고 앉아 발은 바닥에 둬요": "在椅子上挺直腰坐好，双脚放在地面", "한쪽 무릎을 천천히 쭉 펴서 다리를 수평으로 들어요": "慢慢伸直一侧膝盖，把腿抬到水平", "2초 버틴 뒤 천천히 내려요": "坚持2秒后，慢慢放下", "손목 굽힘·폄 스트레칭": "手腕屈伸拉伸", "아래팔 굴곡근·신전근": "前臂屈肌·伸肌", "각 15초 × 3세트": "每侧15秒 × 3组", "팔을 앞으로 곧게 뻗어요": "手臂向前伸直", "반대 손으로 손등을 잡고 손끝이 아래로 향하게 당겨 15초 유지해요": "用另一只手抓住手背，让指尖朝下拉伸，保持15秒", "손바닥 쪽으로 바꿔 손끝이 위로 향하게 당겨 15초 유지해요": "换到手心一侧，让指尖朝上拉伸，保持15秒", "손목 위아래 흔들기": "手腕上下摆动", "아래팔 근육, 손목 인대 주변": "前臂肌肉、手腕韧带周围", "20회 × 2세트": "20次 × 2组", "팔꿈치를 90도로 굽혀 팔뚝을 수평으로 둬요": "手肘弯成90度，让前臂保持水平", "손목을 위로 젖혔다가 아래로 숙이는 동작을 천천히 반복해요": "手腕向上翘起再向下弯，慢慢重复这个动作", "아프지 않은 범위에서만 움직여요": "只在不痛的范围内活动", "힙 힌지": "髋关节铰链", "대둔근, 햄스트링, 척추기립근": "臀大肌、腘绳肌、竖脊肌", "발을 어깨너비로 벌리고 무릎을 살짝 굽혀요": "双脚与肩同宽，膝盖微屈", "허리를 곧게 편 채 엉덩이를 뒤로 보내며 상체를 숙여요": "保持背部挺直，臀部向后送，上身前倾", "엉덩이 힘으로 밀어내며 천천히 일어나요": "用臀部的力量推起，慢慢站直", "서서 무릎 당기기": "站姿提膝", "대둔근, 고관절 주변 근육 (지지하는 다리는 장요근)": "臀大肌、髋关节周围肌肉(支撑腿是髂腰肌)", "좌우 각 10회 × 2세트": "左右各10次 × 2组", "곧게 서서 한쪽 다리로 균형을 잡아요": "站直，用一条腿保持平衡", "다른 쪽 무릎을 가슴 쪽으로 천천히 끌어올려 두 손으로 감싸요": "慢慢把另一侧膝盖向胸口拉起，用双手抱住", "2~3초 버틴 뒤 내리고 반대쪽도 해요": "坚持2～3秒后放下，再做另一侧", " 운동 따라하기": " 跟练运动", "닫기": "关闭", "빨갛게 표시되는 부위": "红色标示的部位", "처방": "方案", "▶ 따라하기 시작": "▶ 开始跟练", "옆모습 기준의 움직이는 그림이에요. 통증이 생기면 바로 멈추고, 계속되면 의료진과 상담하세요.": "这是侧面视角的动态图。如果出现疼痛请立即停止，持续疼痛请咨询医疗人员。", "세트 완료! 20~30초 쉬고 다시 시작하세요": "一组完成！休息20～30秒再重新开始", "3세트 완료! 수고하셨어요": "3组全部完成！辛苦了", "내쉬면서 천천히 동작": "呼气，慢慢做动作", "자세 유지 · 호흡은 편하게": "保持姿势 · 呼吸放松", "들이쉬면서 천천히 돌아오기": "吸气，慢慢回到起始位置", "회 · ": "次 · ", "/3세트": "/3组", " · 미리보기": " · 预览", "■ 멈추기": "■ 停止", "부족한 기운이 채워지는 날이에요. 중요한 일을 시작하기 좋아요.": "欠缺的能量得到补充的日子。适合开始重要的事。", "귀인의 도움을 받기 쉬운 날이에요. 먼저 손을 내밀어 보세요.": "容易得到贵人帮助的日子。请主动伸出手。", "마음이 예민해지기 쉬운 날이에요. 결정은 서두르지 말고 한 박자 쉬세요.": "心情容易敏感的日子。不要急着做决定，停一拍。", "기운이 넘치는 날이에요. 과하지 않게 속도를 조절하세요.": "能量充沛的日子。请控制好节奏，不要过度。", "평온하게 흘러가는 날이에요. 꾸준히 할 일을 해나가세요.": "平稳流动的日子。请继续稳步做该做的事。", "재물": "财运", "일·직업": "工作·事业", "관계": "人际关系", "건강": "健康", "행운의 숫자": "幸运数字", "심부경추굴곡근(목 앞 깊은 근육)": "颈深屈肌(颈前深层肌肉)", "후두하근·목 뒤 근육": "枕下肌·颈后肌肉", "상부 승모근": "斜方肌上部", "목 앞쪽 깊은 곳과 턱 아래가 살짝 당겨지고, 목 뒤가 길게 늘어나는 느낌이에요": "颈前深处和下巴下方有轻微牵拉，颈后被拉长的感觉", "고개를 숙이거나 턱을 들어 올리면 효과가 없어요. 시선은 정면, 턱만 수평으로 뒤로 보내요": "低头或抬下巴都没有效果。视线看向正前方，只让下巴水平向后", "내쉬며 턱을 당기고, 유지하는 동안 숨을 참지 말고 편하게 쉬어요": "呼气时收下巴，保持期间不要憋气，放松呼吸", "능형근·중부 승모근(날개뼈 사이)": "菱形肌·斜方肌中部(肩胛骨之间)", "후면 삼각근": "三角肌后束", "대흉근(가슴)": "胸大肌(胸部)", "날개뼈 사이가 조여지고 가슴 앞이 열리는 느낌이에요": "肩胛骨之间被夹紧，胸前打开的感觉", "어깨가 귀 쪽으로 올라가거나 허리가 꺾이면 안 돼요. 어깨는 아래로 내려요": "肩膀不要耸向耳朵，腰也不要塌。肩膀向下沉", "뒤로 모을 때 내쉬고 돌아올 때 들이쉬요": "向后收时呼气，回来时吸气", "삼각근(어깨)": "三角肌(肩)", "하부 승모근·전거근": "斜方肌下部·前锯肌", "대흉근(가슴 앞)": "胸大肌(胸前)", "어깨와 날개뼈 아래가 쓰이고 가슴 앞이 시원하게 늘어나요": "肩膀和肩胛骨下方在发力，胸前舒服地被拉伸", "팔을 올릴 때 허리가 벽에서 뜨거나 어깨가 올라가면 안 돼요": "举臂时腰不能离开墙，肩膀也不能耸起", "올릴 때 내쉬고 내릴 때 들이쉬어요": "抬起时呼气，放下时吸气", "척추기립근(등)": "竖脊肌(背)", "복직근(배)": "腹直肌(腹部)", "등을 말 때 배가 조여지고, 등을 내릴 때 허리 근육이 쓰여요": "拱背时腹部收紧，放下背部时腰部肌肉发力", "팔꿈치를 굽히거나 엉덩이를 뒤로 빼면 척추가 덜 움직여요": "弯曲手肘或把臀部向后撅，脊柱的活动会变少", "말 때 내쉬고 펼 때 들이쉬어요": "拱背时呼气，伸展时吸气", "척추기립근·다열근": "竖脊肌·多裂肌", "대둔근·햄스트링": "臀大肌·腘绳肌", "허리와 엉덩이, 반대쪽 어깨가 함께 단단해지는 느낌이에요": "腰、臀和对侧肩膀一起绷紧的感觉", "다리를 너무 높이 올려 허리가 꺾이거나 골반이 돌아가면 안 돼요": "腿不要抬得太高，导致腰塌或骨盆转动", "뻗으며 내쉬고 돌아오며 들이쉬어요": "伸展时呼气，回来时吸气", "대둔근·햄스트링(엉덩이·허벅지 뒤)": "臀大肌·腘绳肌(臀部·大腿后侧)", "척추기립근": "竖脊肌", "복횡근(배 깊은 근육)": "腹横肌(腹部深层肌肉)", "엉덩이와 허벅지 뒤가 힘을 쓰고 허리는 편안해야 해요": "臀部和大腿后侧发力，腰部要放松", "허리를 과하게 꺾거나 무릎이 벌어지면 안 돼요. 발뒤꿈치로 바닥을 밀어요": "不要过度塌腰，膝盖也不要向外分开。用脚后跟蹬地", "대퇴사두근(허벅지 앞)": "股四头肌(大腿前侧)", "대둔근(엉덩이)": "臀大肌(臀部)", "비복근(종아리)": "腓肠肌(小腿)", "허벅지 앞과 엉덩이에 힘이 들어가고 무릎은 편안해야 해요": "大腿前侧和臀部发力，膝盖要保持舒适", "무릎이 안으로 모이거나 발끝보다 많이 앞으로 나가면 안 돼요": "膝盖不要内扣，也不要明显超过脚尖", "내려갈 때 들이쉬고 일어나며 내쉬어요": "下蹲时吸气，站起时呼气", "비복근·가자미근(종아리)": "腓肠肌·比目鱼肌(小腿)", "햄스트링(허벅지 뒤)": "腘绳肌(大腿后侧)", "뒤쪽 다리 종아리가 당기며 늘어나는 느낌이에요": "后侧腿的小腿被拉伸的感觉", "뒤꿈치가 들리거나 무릎이 굽으면 늘어나지 않아요": "如果脚后跟抬起或膝盖弯曲，就拉不到", "숨을 참지 말고 천천히 쉬어요": "不要憋气，慢慢呼气", "허벅지 앞이 단단하게 조여지는 느낌이에요": "大腿前侧紧绷的感觉", "발을 휙 차듯 올리지 말고 천천히 올려요. 허리를 뒤로 젖히지 않아요": "不要像踢腿一样甩起脚，要慢慢抬。腰不要向后仰", "펼 때 내쉬고 내릴 때 들이쉬어요": "伸直时呼气，放下时吸气", "아래팔 신전근(손등 쪽)": "前臂伸肌(手背侧)", "아래팔 굴곡근(손바닥 쪽)": "前臂屈肌(手心侧)", "아래팔 안쪽과 바깥쪽이 번갈아 늘어나는 느낌이에요": "前臂内侧和外侧轮流被拉伸的感觉", "세게 꺾으면 안 돼요. 살짝 당기는 정도에서 멈춰요": "不要用力硬掰。拉到有轻微牵拉感就停", "숨을 편하게 쉬어요": "放松呼吸", "아래팔 신전근": "前臂伸肌", "아래팔 굴곡근": "前臂屈肌", "아래팔이 번갈아 가볍게 쓰이는 느낌이에요": "前臂轮流轻轻发力的感觉", "팔꿈치가 흔들리지 않게 고정해요": "固定好手肘，不要晃动", "일정한 리듬으로 편하게 쉬어요": "以稳定的节奏放松呼吸", "대둔근·척추기립근": "臀大肌·竖脊肌", "허벅지 뒤가 당기고 엉덩이가 힘으로 밀어 올려지는 느낌이에요": "大腿后侧被拉紧，臀部发力向上推起的感觉", "허리를 둥글게 말면 안 돼요. 엉덩이를 뒤로 빼는 동작이에요": "不要圆腰。这是把臀部向后送的动作", "숙일 때 들이쉬고 일어날 때 내쉬어요": "俯身时吸气，站起时呼气", "장요근·대퇴직근(허벅지 앞)": "髂腰肌·股直肌(大腿前侧)", "지지다리 대둔근": "支撑腿的臀大肌", "당기는 쪽 엉덩이가 늘어나고 지지하는 다리는 균형을 잡아요": "被拉的一侧髋部被拉伸，支撑腿负责保持平衡", "상체를 뒤로 젖히지 않고 곧게 서요": "站直，上身不要向后仰", "당길 때 내쉬어요": "拉起时呼气", "강하게": "强", "보통": "中", "약하게": "弱", " 운동": " 运动", "근육 해부도 보기 (이는곳·닿는곳)": "查看肌肉解剖图(起点·止点)", "운동을 누르면 근육이 쓰이는 부위를 크게 확대해서 보여줘요": "点击运动，会放大显示肌肉发力的部位", "크게 보기 ›": "放大查看 ›", " · 늘어남": " · 被拉伸", "진한 빨강 = 가장 세게 쓰는 근육 · 중간 빨강 = 보통 · 연한 빨강 = 약하게 쓰거나 늘어나는 근육": "深红 = 用力最大的肌肉 · 中红 = 一般 · 浅红 = 轻度发力或被拉伸的肌肉", "← 목록": "← 列表", "전체 몸 보기": "查看全身", "확대해서 보기": "放大查看", "어떤 근육이 움직이나요": "哪些肌肉在动？", "근육이 빨갛게 표시돼요. 진할수록 더 세게 쓰는 근육이에요. 확대하면 근육 이름이 보여요.": "肌肉会以红色显示，颜色越深表示用力越大。放大后可以看到肌肉名称。", "따라하는 방법": "做法", "핵심 포인트": "关键要点", "이렇게 느껌져야 해요": "你应该有的感觉", "흔한 실수": "常见错误", "호흡": "呼吸", "통증이 생기면 바로 멈추고, 계속되면 의료진과 상담하세요.": "如果出现疼痛请立即停止，持续疼痛请咨询医疗人员。", "큰가슴근": "胸大肌", "가슴 부위를 대부분 감싸고 있는 부채꼴 근육이에요. 빗장뼈 부분, 복장갈비 부분, 배 부분 세 부분으로 나눌 수 있어요.": "覆盖大部分胸部的扇形肌肉。可分为锁骨部、胸肋部、腹部三个部分。", "빗장뼈 안쪽, 복장뼈, 위쪽 갈비연골": "锁骨内侧、胸骨、上部肋软骨", "위팔뼈 위쪽 앞면(큰결절능)": "肱骨上部前面(大结节嵴)", "팔을 앞으로 모으기, 안쪽으로 돌리기, 올린 팔 내리기": "将手臂向前合拢、向内旋转、放下举起的手臂", "벽에 팔을 대고 몸을 돌리는 가슴 스트레칭이 좋아요. 컴퓨터 작업이 길면 앞으로 말린 어깨의 원인이 돼요.": "手臂贴墙转动身体的胸部拉伸效果好。长时间用电脑会导致圆肩。", "어깨세모근": "三角肌", "어깨를 둥글게 덮는 근육이에요. 앞·가운데·뒤 세 부분이 팔을 올리는 방향마다 나눠서 일해요.": "圆润包裹肩部的肌肉。前、中、后三个部分按举臂的方向分工发力。", "빗장뼈 바깥쪽, 어깨뼈 봉우리, 어깨뼈 가시": "锁骨外侧、肩峰、肩胛冈", "위팔뼈 가운데 바깥면(세모근 거친면)": "肱骨中部外侧面(三角肌粗隆)", "팔을 옆·앞·뒤로 들어 올리기": "向侧面、前面、后面举起手臂", "가벼운 덤벨로 옆으로 들어 올리는 운동이 대표적이에요. 어깨를 으쓱하며 올리지 않게 주의하세요.": "用轻哑铃做侧平举是代表性的训练。注意不要耸肩发力。", "등세모근": "斜方肌", "뒤통수부터 등 가운데까지 이어지는 마름모꼴 근육이에요. 위·가운데·아래 세 부분으로 나뉘며 어깨뼈를 올리고 모으고 내려요.": "从后脑勺延伸到背部中央的菱形肌肉。分为上、中、下三部分，负责抬起、内收、下沉肩胛骨。", "뒤통수뼈, 목덜미 인대, 목뼈 7번~가슴뼈 12번 가시돌기": "枕骨、项韧带、第7颈椎～第12胸椎棘突", "빗장뼈 바깥쪽, 어깨뼈 봉우리와 어깨뼈 가시": "锁骨外侧、肩峰和肩胛冈", "어깨 으쓱하기, 어깨뼈 모으기, 고개 젖히기": "耸肩、肩胛骨内收、头后仰", "턱을 당기고 어깨뼈를 모으는 운동, 목·어깨 스트레칭이 도움이 돼요. 화면을 오래 보면 위쪽이 쉽게 뭉쳐요.": "收下巴、肩胛骨内收训练，以及颈肩拉伸都有帮助。长时间看屏幕，上部很容易紧绷。", "넓은등근": "背阔肌", "등 아래쪽을 넓게 덮는 큰 삼각형 근육이에요. 몸통에서 시작해 겨드랑이 쪽 위팔뼈로 모여요.": "覆盖背部下方的大三角形肌肉。从躯干出发，汇聚到腋下的肱骨。", "가슴뼈 7번~허리뼈 가시돌기, 엉덩뼈능선, 아래 갈비뼈": "第7胸椎～腰椎棘突、髂嵴、下部肋骨", "위팔뼈 앞쪽 고랑(결절간구)": "肱骨前面的沟(结节间沟)", "올린 팔 끌어내리기, 팔 뒤로 젖히기, 안쪽으로 돌리기": "把举起的手臂向下拉、手臂向后伸、向内旋转", "턱걸이, 랫풀다운이 대표 운동이고, 한 팔을 올려 옆구리를 늘리는 스트레칭이 좋아요.": "引体向上、高位下拉是代表性训练，举起一只手臂拉伸侧腰的拉伸也很好。", "목빗근": "胸锁乳突肌", "목 옆을 비스듬히 가로지르는 근육이에요. 머리를 돌리고 숙이는 데 쓰여요.": "斜着穿过颈部侧面的肌肉。用于转头和低头。", "복장뼈 윗부분, 빗장뼈 안쪽": "胸骨上部、锁骨内侧", "귀 뒤 꼭지돌기(유양돌기)": "耳后乳突", "고개 돌리기, 옆으로 기울이기, 앞으로 숙이기": "转头、向侧面倾斜、向前低头", "고개를 숙이고 폰을 오래 보면 짧아지고 뻣뻣해져요. 턱 당기기와 목 옆 스트레칭이 도움이 돼요.": "长时间低头看手机会使它变短变僵硬。收下巴和颈侧拉伸会有帮助。", "배곧은근": "腹直肌", "배 앞쪽을 세로로 지나는 근육이에요. 힘줄 마디가 있어서 복근이 나뉘어 보여요.": "纵向穿过腹部前方的肌肉。因为有腱划，腹肌看起来是分开的。", "두덩뼈(치골)": "耻骨", "칼돌기, 5~7번 갈비연골": "剑突、第5～7肋软骨", "상체 굽히기, 골반 말아 올리기, 허리 안정": "屈身、卷起骨盆、稳定腰部", "플랭크처럼 허리를 버티는 운동이 허리 건강에 도움이 돼요. 윗몸을 과하게 말면 목에 부담이 가요.": "像平板支撑这样支撑腰部的训练对腰部健康有帮助。上身卷得过度会增加颈部负担。", "큰볼기근": "臀大肌", "엉덩이를 이루는 가장 큰 근육이에요. 일어서고 계단을 오를 때 허벅지를 뒤로 보내는 힘을 내요.": "构成臀部的最大肌肉。站起和上楼梯时，提供把大腿向后送的力量。", "엉치뼈, 엉덩뼈 뒤쪽": "骶骨、髂骨后侧", "넙다리뼈 뒤 거친면, 엉덩정강근막띠": "股骨后侧粗线、髂胫束", "고관절 펴기, 다리 바깥으로 돌리기": "伸髋、把腿向外旋转", "브릿지, 힙 힌지가 대표 운동이에요. 오래 앉으면 쓰임이 줄어 허리 부담이 커져요.": "臀桥、髋关节铰链是代表性训练。久坐会减少它的使用，增加腰部负担。", "넙다리네갈래근": "股四头肌", "허벅지 앞쪽의 큰 근육이에요. 네 갈래가 한 힘줄로 모여 무릎뼈를 지나 정강이에 붙어요.": "大腿前侧的大肌肉。四个头汇聚成一条肌腱，经过髌骨附着在小腿胫骨上。", "엉덩뼈 앞쪽, 넙다리뼈 몸통": "髂骨前侧、股骨体", "무릎뼈를 지나 정강뼈 거친면": "经过髌骨到胫骨粗隆", "무릎 펴기, 계단 오르기, 일어서기": "伸膝、上楼梯、站起", "의자 스쿼트, 앉아서 무릎 펴기가 좋아요. 무릎이 발끝보다 안쪽으로 모이지 않게 하세요.": "椅子深蹲、坐姿伸膝都不错。注意膝盖不要向内扣到脚尖内侧。", "뒤넙다리근": "腘绳肌", "허벅지 뒤쪽 근육 무리예요. 엉덩이에서 시작해 무릎 뒤 양쪽으로 갈라져 붙어요.": "大腿后侧的肌肉群。从臀部出发，分成两侧附着在膝盖后方。", "궁둥뼈 결절(앉았을 때 닿는 뼈)": "坐骨结节(坐着时接触的骨头)", "정강뼈와 종아리뼈 위쪽": "胫骨和腓骨上部", "무릎 굽히기, 엉덩관절 펴기": "屈膝、伸髋", "앉아 있는 시간이 길면 짧아져 허리와 골반이 당겨요. 누워서 다리 들어 올리는 스트레칭이 좋아요.": "久坐会使它变短，牵拉腰部和骨盆。躺着抬腿的拉伸很好。", "장딴지근": "腓肠肌", "종아리 위쪽의 볼록한 근육이에요. 아킬레스힘줄로 모여 발뒤꿈치에 붙어요.": "小腿上部隆起的肌肉。汇聚成跟腱，附着在脚后跟。", "넙다리뼈 아래쪽 안·바깥 융기": "股骨下部内外侧髁", "아킬레스힘줄을 지나 발뒤꿈치뼈": "经过跟腱到跟骨", "발끝 세우기, 무릎 굽히기 보조": "踮脚尖、辅助屈膝", "벽 종아리 스트레칭, 발뒤꿈치 올리기가 대표 운동이에요. 오래 서 있으면 쉽게 뭉쳐요.": "靠墙小腿拉伸和提踵是代表性训练。久站容易紧绷。", "손목 굽힘근": "腕屈肌", "아래팔 안쪽(손바닥 쪽)의 근육 무리예요. 손목과 손가락을 굽혀요.": "前臂内侧(手心侧)的肌肉群。负责弯曲手腕和手指。", "위팔뼈 안쪽 위관절융기(팔꿈치 안쪽)": "肱骨内上髁(肘内侧)", "손목뼈, 손가락뼈": "腕骨、指骨", "손목 굽히기, 손가락 쥐기": "屈腕、握拳", "타이핑이나 마우스를 오래 쓰면 쌓여요. 팔을 펴고 손끝을 아래로 당기는 스트레칭을 해보세요.": "长时间打字或用鼠标会累积疲劳。试试把手臂伸直、指尖向下拉的拉伸。", "손목 폄근": "腕伸肌", "아래팔 바깥쪽(손등 쪽)의 근육 무리예요. 손목과 손가락을 펴고 손목을 안정시켜요.": "前臂外侧(手背侧)的肌肉群。负责伸直手腕和手指，并稳定手腕。", "위팔뼈 바깥 위관절융기(팔꿈치 바깥)": "肱骨外上髁(肘外侧)", "손등 쪽 손목뼈, 손가락뼈": "手背侧的腕骨、指骨", "손목 젖히기, 손가락 펴기": "伸腕(手腕后翘)、伸直手指", "손목을 꺾은 채 타이핑하면 부담이 커요. 손등을 아래로 돌려 당기는 스트레칭을 해보세요.": "弯着手腕打字会增加负担。试试把手背朝下拉伸。", "← 운동 목록": "← 运动列表", "근육 ON": "肌肉 开", "근육 OFF": "肌肉 关", "이는곳": "起点", "닿는곳": "止点", "하는 일": "作用", "파란 점은 근육이 시작하는 곳, 초록 점은 닿는 곳이에요. 단순화한 도식이라 실제 해부도와 다를 수 있어요.": "蓝点表示肌肉的起点，绿点表示止点。这是简化示意图，可能与真实解剖图不同。", "▶ 움직임 보기": "▶ 查看动作", "염소자리": "摩羯座", "물병자리": "水瓶座", "물고기자리": "双鱼座", "양자리": "白羊座", "황소자리": "金牛座", "쌍둥이자리": "双子座", "게자리": "巨蟹座", "사자자리": "狮子座", "처녀자리": "处女座", "천칭자리": "天秤座", "전갈자리": "天蝎座", "사수자리 크는 법이에요. 오늘 누군가에게 그늘이 되어주세요.": "Khu rừng lớn lên nhờ chia sẻ bóng mát cho nhau. Hôm nay hãy làm bóng mát cho ai đó.", "작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.": "Một đốm lửa nhỏ làm ấm cả căn phòng. Nụ cười hôm nay của bạn chính là đốm lửa ấy.", "타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.": "Không chỉ thứ bùng cháy mới là ánh sáng. Lặng lẽ soi sáng bên cạnh người khác cũng là sức mạnh.", "마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.": "Nếu lòng đã nguội, hãy hít một hơi thật sâu. Đốm lửa vẫn còn ở đó.", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "Hôm nay cười thật to một lần, nhiệt độ cả ngày sẽ khác đi.", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "Đất lặng lẽ nâng đỡ mọi thứ. Chỉ cần chịu đựng qua hôm nay cũng đã là việc đủ lớn.", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "Con đường được nén chặt từ từ sẽ đi xa nhất. Hôm nay cũng chỉ cần một bước.", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "Một bữa ăn đầy đặn giữ vững trọng tâm của cả ngày. Hôm nay hãy cho mình ăn thật ngon.", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "Người gốc rễ sâu thì gió thổi vẫn mỉm cười. Hãy tin vào gốc rễ của bạn.", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "Kim loại phải qua lửa mới cứng cáp. Khó khăn hiện tại đang mài giũa bạn.", "맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.": "Tiếng chuông trong trẻo vang đi rất xa. Một lời bạn nói hôm nay cũng sẽ chạm đến người khác như thế.", "깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.": "Hãy hít thở sâu và mở rộng đôi vai. Khi lồng ngực mở ra, lòng cũng mở ra theo.", "정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.": "Chiếc bàn gọn gàng và tâm trí gọn gàng giống nhau. Hôm nay chỉ cần dọn đi một thứ là nhẹ nhõm hơn.", "물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.": "Nước bị chặn thì đi đường vòng, đọng lại thì nghỉ ngơi. Nghỉ ngơi cũng là một phần của dòng chảy.", "깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.": "Nước sâu chảy không một tiếng động. Một ngày lặng lẽ hoàn thành công việc cũng thật tuyệt.", "오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.": "Hôm nay đừng vội, hãy cứ trôi theo dòng. Biển cuối cùng sẽ đón nhận mọi dòng nước.", "따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.": "Một cốc nước ấm làm lòng dịu lại. Hãy dừng một chút và chăm sóc bản thân.", "오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.": "Hôm nay nhịp cảm xúc của bạn đang thấp. Hãy dịu dàng với bản thân thêm một chút.", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠보세요.": "Hôm nay tâm trạng của bạn trong trẻo. Hãy chia sẻ năng lượng đó cho những người xung quanh.", "오늘은 차분하게 균형을 지키기 좋은 날이에요.": "Một ngày thích hợp để giữ bình tĩnh và cân bằng.", "오늘 나에게 맞는 글귀": "Lời nhắn dành cho bạn hôm nay", "목형 (성장·추진형)": "Kiểu Mộc (phát triển · chủ động)", "새로운 계획과 배움 이야기를 즐기고 시원시원하게 말하는 사람": "Người thích nói chuyện về kế hoạch mới và việc học, nói chuyện thẳng thắn", "“요즘 새로 시작한 게 있어요?”처럼 근황과 계획을 물어보세요": "Hãy hỏi thăm tình hình và kế hoạch, như “Dạo này bạn có bắt đầu điều gì mới không?”", "초록": "Xanh lá", "화형 (열정·밝은 에너지형)": "Kiểu Hỏa (nhiệt huyết · năng lượng tươi sáng)", "표정이 밝고 말이 빠르며 웃음이 많은 사람": "Người có gương mặt tươi tắn, nói nhanh và hay cười", "“오늘 기분 좋아 보여요!”처럼 먼저 웃으며 인사해 보세요": "Hãy mỉm cười chào trước, như “Hôm nay trông bạn vui quá!”", "빨강": "Đỏ", "토형 (믿음직·안정형)": "Kiểu Thổ (đáng tin · ổn định)", "차분하고 말수는 적지만 약속을 잘 지키는 사람": "Điềm đạm, ít nói nhưng giữ lời hứa", "고민을 솔직하게 털어놓고 조언을 구해 보세요": "Hãy thẳng thắn chia sẻ nỗi lo và xin lời khuyên", "노랑·베이지": "Vàng · be", "금형 (원칙·정리형)": "Kiểu Kim (nguyên tắc · ngăn nắp)", "말이 간결하고 단정하며 시간 약속에 철저한 사람": "Nói ngắn gọn, chỉn chu, rất nghiêm túc về giờ giấc", "핵심부터 짧게 말하고 일정과 결정을 함께 정리해 보세요": "Hãy nói ý chính trước, ngắn gọn, và cùng chốt lịch trình lẫn quyết định", "흰색·은색": "Trắng · bạc", "수형 (지혜·유연형)": "Kiểu Thủy (thông tuệ · linh hoạt)", "경청을 잘하고 생각이 깊으며 분위기를 부드럽게 만드는 사람": "Người biết lắng nghe, suy nghĩ sâu sắc và làm không khí dịu lại", "따뜻한 차 한 잔 하며 천천히 이야기를 나눠 보세요": "Hãy vừa uống trà ấm vừa trò chuyện thong thả", "검정·남색": "Đen · xanh navy", "오늘 만나면 좋은 사람": "Người nên gặp hôm nay", "누굴 만날지 몰라도, 이런 분을 만나면 하루가 편해져요.": "Dù không biết sẽ gặp ai, gặp người như thế này thì cả ngày sẽ nhẹ nhàng hơn.", "오늘의 귀인": "Quý nhân hôm nay", "이런 사람이에요": "Họ là người như thế nào", "이렇게 다가가 보세요": "Hãy tiếp cận như thế này", "행운의 색": "Màu may mắn", " 계열 소품이나 옷을 하나 걸쳐 보세요": " – hãy thử diện một món đồ hoặc phụ kiện cùng tông màu này", "조금 조심할 유형": "Kiểu người nên hơi cẩn trọng", "과는 의견이 부딪히기 쉬워요. 결론을 서두르지 말고 한 박자 쉬고 답해 보세요.": " dễ bất đồng ý kiến với bạn. Đừng vội kết luận, hãy ngừng một nhịp rồi hãy trả lời.", "재미로 보는 오행 해석이에요. 실제 사람을 평가하는 기준이 아니니 가볍게 참고하세요.": "Đây là cách giải Ngũ hành mang tính giải trí. Nó không phải tiêu chuẩn để đánh giá người thật, hãy tham khảo nhẹ nhàng.", "먼저 “나의 몸 분석하기”에서 생년월일시를 입력하고 분석해 주세요.": "Trước tiên hãy nhập ngày giờ sinh ở “Phân tích cơ thể” rồi phân tích.", "입력하러 가기": "Đi nhập thông tin", "사무·행정": "Văn phòng · hành chính", "IT·개발": "IT · lập trình", "디자인·크리에이티브": "Thiết kế · sáng tạo", "전문직(법률·금융 등)": "Chuyên gia (luật, tài chính...)", "프리랜서·재택": "Freelancer · làm việc tại nhà", "학생": "Học sinh · sinh viên", "교육·교사": "Giáo dục · giáo viên", "의료·간호": "Y tế · điều dưỡng", "서비스·판매": "Dịch vụ · bán hàng", "요식업·조리": "Ẩm thực · nấu ăn", "운전·배송": "Lái xe · giao hàng", "현장·제조·건설": "Công trường · sản xuất · xây dựng", "농업·어업": "Nông · ngư nghiệp", "주부·육아": "Nội trợ · chăm con", "자영업": "Tự kinh doanh", "은퇴·무직": "Nghỉ hưu · chưa có việc", "기타": "Khác", "사무직은 목·허리 부담이 커요. 50분마다 일어나 걷고 모니터를 눈높이에 맞추세요.": "Công việc văn phòng gây áp lực lên cổ và thắt lưng. Cứ 50 phút hãy đứng dậy đi lại và chỉnh màn hình ngang tầm mắt.", "장시간 코딩은 목·손목에 부담이 커요. 20분마다 손목을 풀고 1시간마다 자리에서 일어나세요.": "Lập trình lâu gây áp lực lên cổ và cổ tay. Cứ 20 phút hãy thả lỏng cổ tay, mỗi giờ đứng dậy một lần.", "마우스·태블릿 작업이 길면 손목과 어깨를 자주 풀어주세요.": "Làm việc với chuột hoặc máy tính bảng lâu thì hãy thường xuyên thả lỏng cổ tay và vai.", "장시간 문서·화면 작업은 목·눈 부담이 커요. 시선을 멀리 두는 휴식을 자주 가지세요.": "Làm việc với tài liệu hoặc màn hình lâu gây áp lực lên cổ và mắt. Hãy thường xuyên nghỉ để nhìn xa.", "재택은 자세가 흐트러지기 쉬워요. 책상·의자를 갖추고 일하는 시간과 쉬는 시간을 구분하세요.": "Ở nhà tư thế rất dễ bị xô lệch. Hãy chuẩn bị bàn ghế phù hợp và phân biệt giờ làm việc với giờ nghỉ.", "책상 공부가 길면 목·허리가 굳어요. 의자 높이를 맞추고 45분마다 스트레칭하세요.": "Học bàn lâu khiến cổ và thắt lưng cứng lại. Hãy chỉnh độ cao ghế và giãn cơ mỗi 45 phút.", "오래 서서 말하는 일은 무릎·허리에 부담이 돼요. 발을 번갈아 쉬어주고 수분을 챙기세요.": "Đứng nói chuyện lâu gây áp lực lên đầu gối và thắt lưng. Hãy thay phiên cho hai chân nghỉ và nhớ uống nước.", "서서 일하고 환자를 옮기는 일은 허리·무릎에 부담이 커요. 코어 운동과 종아리 스트레칭을 권해요.": "Đứng làm việc và di chuyển bệnh nhân gây áp lực lên thắt lưng và đầu gối. Nên tập cơ lõi và giãn bắp chân.", "오래 서 있는 일은 무릎·발에 부담이 커요. 쿠션 좋은 신발과 종아리 스트레칭이 도움이 돼요.": "Đứng lâu gây áp lực lên đầu gối và bàn chân. Giày có đệm tốt và giãn bắp chân sẽ giúp ích.", "주방 일은 허리·손목 부담이 커요. 작업대 높이를 맞추고 발밑에 매트를 두세요.": "Làm bếp gây áp lực lên thắt lưng và cổ tay. Hãy chỉnh độ cao mặt bếp và đặt tấm lót dưới chân.", "장시간 운전과 짐 나르기는 허리·목에 부담이 커요. 1~2시간마다 쉬고 짐은 몸 가까이 들어요.": "Lái xe lâu và khiêng vác gây áp lực lên thắt lưng và cổ. Cứ 1–2 giờ hãy nghỉ, và ôm đồ sát vào người khi nhấc.", "반복 동작과 무거운 작업은 허리·어깨에 부담이 커요. 작업 전 준비운동과 보호 장비를 챙기세요.": "Động tác lặp lại và công việc nặng gây áp lực lên thắt lưng và vai. Hãy khởi động trước khi làm và dùng đồ bảo hộ.", "굽힌 자세 작업이 많아 허리·무릎이 힘들어요. 작업 사이 허리를 펴는 습관을 들이세요.": "Làm việc cúi người nhiều khiến thắt lưng và đầu gối mệt. Hãy tập thói quen duỗi thẳng lưng giữa các công việc.", "안기·들기·서서 하는 집안일이 잦아 허리·손목이 힘들어요. 안는 위치를 자주 바꾸세요.": "Bế, nhấc và làm việc nhà khi đứng nhiều khiến thắt lưng và cổ tay mệt. Hãy thường xuyên đổi vị trí bế.", "근무 시간이 길어지기 쉬워요. 틈틈이 앉았다 서기를 번갈아 하고 식사 시간을 지키세요.": "Giờ làm việc dễ kéo dài. Hãy xen kẽ ngồi và đứng, và giữ giờ ăn đúng giờ.", "활동량이 줄기 쉬워요. 하루 30분 걷기와 가벼운 근력 운동을 꾸준히 이어가세요.": "Lượng vận động dễ giảm. Hãy duy trì đi bộ 30 phút mỗi ngày và tập sức mạnh nhẹ.", "내 일에서 가장 오래 하는 동작을 찾아 그 자세를 자주 바꿔주세요.": "Hãy tìm động tác bạn làm lâu nhất trong công việc và thường xuyên thay đổi tư thế đó.", "시간": " giờ", "생년월일을 입력해 주세요": "Vui lòng nhập ngày sinh", "턱 당기기": "Thu cằm", "목 깊은 굴곡근, 후두하근, 흉쇄유돌근": "Cơ gập sâu cổ, cơ dướ uộn tròn, hít vào khi duỗi ra", "척추기립근·다열근": "Cơ dựng sống · cơ đa phân", "대둔근·햄스트링": "Cơ mông lớn · cơ đùi sau", "허리와 엉덩이, 반대쪽 어깨가 함께 단단해지는 느낌이에요": "Cảm giác thắt lưng, hông và vai đối diện cùng săn chắc lại", "다리를 너무 높이 올려 허리가 꺾이거나 골반이 돌아가면 안 돼요": "Đừng nâng chân quá cao khiến thắt lưng ưỡn hoặc xương chậu xoay", "뻗으며 내쉬고 돌아오며 들이쉬어요": "Thở ra khi duỗi ra, hít vào khi trở về", "대둔근·햄스트링(엉덩이·허벅지 뒤)": "Cơ mông lớn · cơ đùi sau (mông · mặt sau đùi)", "척추기립근": "Cơ dựng sống", "복횡근(배 깊은 근육)": "Cơ ngang bụng (cơ sâu vùng bụng)", "엉덩이와 허벅지 뒤가 힘을 쓰고 허리는 편안해야 해요": "Mông và mặt sau đùi làm việc, còn thắt lưng phải thoải mái", "허리를 과하게 꺾거나 무릎이 벌어지면 안 돼요. 발뒤꿈치로 바닥을 밀어요": "Đừng ưỡn thắt lưng quá mức hoặc để hai gối tách ra. Hãy đạp sàn bằng gót chân", "대퇴사두근(허벅지 앞)": "Cơ tứ đầu đùi (mặt trước đùi)", "대둔근(엉덩이)": "Cơ mông lớn (mông)", "비복근(종아리)": "Cơ bụng chân (bắp chân)", "허벅지 앞과 엉덩이에 힘이 들어가고 무릎은 편안해야 해요": "Cảm giác mặt trước đùi và mông dùng sức, còn đầu gối vẫn thoải mái", "무릎이 안으로 모이거나 발끝보다 많이 앞으로 나가면 안 돼요": "Đừng để gối chụm vào trong hoặc vượt quá nhiều so với mũi chân", "내려갈 때 들이쉬고 일어나며 내쉬어요": "Hít vào khi xuống, thở ra khi đứng lên", "비복근·가자미근(종아리)": "Cơ bụng chân · cơ dép (bắp chân)", "햄스트링(허벅지 뒤)": "Cơ đùi sau (mặt sau đùi)", "뒤쪽 다리 종아리가 당기며 늘어나는 느낌이에요": "Cảm giác bắp chân của chân sau bị kéo giãn", "뒤꿈치가 들리거나 무릎이 굽으면 늘어나지 않아요": "Nếu gót chân nhấc lên hoặc gối gập thì sẽ không giãn được", "숨을 참지 말고 천천히 쉬어요": "Đừng nín thở, hãy thở ra từ từ", "허벅지 앞이 단단하게 조여지는 느낌이에요": "Cảm giác mặt trước đùi săn chắc lại", "발을 휙 차듯 올리지 말고 천천히 올려요. 허리를 뒤로 젖히지 않아요": "Đừng vung chân lên như đá; hãy nâng từ từ. Không ngả lưng ra sau", "펼 때 내쉬고 내릴 때 들이쉬어요": "Thở ra khi duỗi, hít vào khi hạ xuống", "아래팔 신전근(손등 쪽)": "Cơ duỗi cẳng tay (phía mu bàn tay)", "아래팔 굴곡근(손바닥 쪽)": "Cơ gập cẳng tay (phía lòng bàn tay)", "아래팔 안쪽과 바깥쪽이 번갈아 늘어나는 느낌이에요": "Cảm giác phía trong và phía ngoài cẳng tay lần lượt được kéo giãn", "세게 꺾으면 안 돼요. 살짝 당기는 정도에서 멈춰요": "Đừng gập mạnh. Dừng ở mức hơi căng", "숨을 편하게 쉬어요": "Thở thoải mái", "아래팔 신전근": "Cơ duỗi cẳng tay", "아래팔 굴곡근": "Cơ gập cẳng tay", "아래팔이 번갈아 가볍게 쓰이는 느낌이에요": "Cảm giác cẳng tay lần lượt làm việc nhẹ nhàng", "팔꿈치가 흔들리지 않게 고정해요": "Giữ cố định khuỷu tay, đừng để lung lay", "일정한 리듬으로 편하게 쉬어요": "Thở thoải mái theo nhịp đều đặn", "대둔근·척추기립근": "Cơ mông lớn · cơ dựng sống", "허벅지 뒤가 당기고 엉덩이가 힘으로 밀어 올려지는 느낌이에요": "Cảm giác mặt sau đùi căng ra và hông đẩy người lên", "허리를 둥글게 말면 안 돼요. 엉덩이를 뒤로 빼는 동작이에요": "Đừng cuộn tròn thắt lưng. Đây là động tác đẩy hông ra sau", "숙일 때 들이쉬고 일어날 때 내쉬어요": "Hít vào khi cúi, thở ra khi đứng lên", "장요근·대퇴직근(허벅지 앞)": "Cơ thắt lưng chậu · cơ thẳng đùi (mặt trước đùi)", "지지다리 대둔근": "Cơ mông lớn của chân trụ", "당기는 쪽 엉덩이가 늘어나고 지지하는 다리는 균형을 잡아요": "Hông bên được kéo giãn còn chân trụ giữ thăng bằng", "상체를 뒤로 젖히지 않고 곧게 서요": "Đứng thẳng, không ngả thân trên ra sau", "당길 때 내쉬어요": "Thở ra khi kéo", "강하게": "Mạnh", "보통": "Vừa", "약하게": "Nhẹ", " 운동": " bài tập", "근육 해부도 보기 (이는곳·닿는곳)": "Xem giải phẫu cơ (điểm bám đầu · điểm bám cuối)", "운동을 누르면 근육이 쓰이는 부위를 크게 확대해서 보여줘요": "Nhấn vào bài tập để xem phóng to vùng cơ đang hoạt động", "크게 보기 ›": "Phóng to ›", " · 늘어남": " · được kéo giãn", "진한 빨강 = 가장 세게 쓰는 근육 · 중간 빨강 = 보통 · 연한 빨강 = 약하게 쓰거나 늘어나는 근육": "Đỏ đậm = cơ dùng sức nhiều nhất · đỏ vừa = trung bình · đỏ nhạt = cơ dùng sức nhẹ hoặc được kéo giãn", "← 목록": "← Danh sách", "전체 몸 보기": "Xem toàn thân", "확대해서 보기": "Phóng to", "어떤 근육이 움직이나요": "Cơ nào đang cử động?", "근육이 빨갛게 표시돼요. 진할수록 더 세게 쓰는 근육이에요. 확대하면 근육 이름이 보여요.": "Cơ được tô màu đỏ, càng đậm thì cơ càng dùng nhiều sức. Phóng to để xem tên cơ.", "따라하는 방법": "Cách thực hiện", "핵심 포인트": "Điểm chính", "이렇게 느껌져야 해요": "Cảm giác bạn nên có", "흔한 실수": "Lỗi thường gặp", "호흡": "Hơi thở", "통증이 생기면 바로 멈추고, 계속되면 의료진과 상담하세요.": "Nếu bị đau hãy dừng ngay, và nếu đau kéo dài hãy hỏi ý kiến nhân viên y tế.", "큰가슴근": "Cơ ngực lớn", "가슴 부위를 대부분 감싸고 있는 부채꼴 근육이에요. 빗장뼈 부분, 복장갈비 부분, 배 부분 세 부분으로 나눌 수 있어요.": "Cơ hình quạt phủ gần hết vùng ngực. Có thể chia thành ba phần: phần xương đòn, phần xương ức và phần bụng.", "빗장뼈 안쪽, 복장뼈, 위쪽 갈비연골": "Phía trong xương đòn, xương ức, sụn sườn phía trên", "위팔뼈 위쪽 앞면(큰결절능)": "Mặt trước phía trên xương cánh tay (mào củ lớn)", "팔을 앞으로 모으기, 안쪽으로 돌리기, 올린 팔 내리기": "Khép tay ra trước, xoay vào trong, hạ cánh tay đã nâng xuống", "벽에 팔을 대고 몸을 돌리는 가슴 스트레칭이 좋아요. 컴퓨터 작업이 길면 앞으로 말린 어깨의 원인이 돼요.": "Nên giãn ngực bằng cách tựa tay vào tường rồi xoay người. Làm việc máy tính lâu là nguyên nhân khiến vai bị cuộn về phía trước.", "어깨세모근": "Cơ delta", "어깨를 둥글게 덮는 근육이에요. 앞·가운데·뒤 세 부분이 팔을 올리는 방향마다 나눠서 일해요.": "Cơ phủ tròn vai. Ba phần trước, giữa, sau lần lượt làm việc theo hướng nâng tay.", "빗장뼈 바깥쪽, 어깨뼈 봉우리, 어깨뼈 가시": "Phía ngoài xương đòn, mỏm cùng vai, gai xương bả vai", "위팔뼈 가운데 바깥면(세모근 거친면)": "Mặt ngoài giữa xương cánh tay (lồi củ delta)", "팔을 옆·앞·뒤로 들어 올리기": "Nâng tay sang bên, ra trước, ra sau", "가벼운 덤벨로 옆으로 들어 올리는 운동이 대표적이에요. 어깨를 으쓱하며 올리지 않게 주의하세요.": "Bài tiêu biểu là nâng tạ nhẹ sang hai bên. Chú ý đừng nhún vai khi nâng.", "등세모근": "Cơ thang", "뒤통수부터 등 가운데까지 이어지는 마름모꼴 근육이에요. 위·가운데·아래 세 부분으로 나뉘며 어깨뼈를 올리고 모으고 내려요.": "Cơ hình thoi kéo dài từ chẩm đến giữa lưng. Chia làm ba phần trên, giữa, dưới, giúp nâng, khép và hạ xương bả vai.", "뒤통수뼈, 목덜미 인대, 목뼈 7번~가슴뼈 12번 가시돌기": "Xương chẩm, dây chằng gáy, mỏm gai từ đốt sống cổ 7 đến đốt sống ngực 12", "빗장뼈 바깥쪽, 어깨뼈 봉우리와 어깨뼈 가시": "Phía ngoài xương đòn, mỏm cùng vai và gai xương bả vai", "어깨 으쓱하기, 어깨뼈 모으기, 고개 젖히기": "Nhún vai, khép bả vai, ngửa đầu", "턱을 당기고 어깨뼈를 모으는 운동, 목·어깨 스트레칭이 도움이 돼요. 화면을 오래 보면 위쪽이 쉽게 뭉쳐요.": "Bài tập thu cằm và khép bả vai cùng giãn cổ-vai sẽ giúp ích. Nhìn màn hình lâu khiến phần trên dễ bị căng cứng.", "넓은등근": "Cơ lưng rộng", "등 아래쪽을 넓게 덮는 큰 삼각형 근육이에요. 몸통에서 시작해 겨드랑이 쪽 위팔뼈로 모여요.": "Cơ hình tam giác lớn phủ rộng phần dưới lưng. Bắt đầu từ thân mình và tụ về xương cánh tay phía nách.", "가슴뼈 7번~허리뼈 가시돌기, 엉덩뼈능선, 아래 갈비뼈": "Mỏm gai từ đốt sống ngực 7 đến thắt lưng, mào chậu, xương sườn dưới", "위팔뼈 앞쪽 고랑(결절간구)": "Rãnh phía trước xương cánh tay (rãnh gian củ)", "올린 팔 끌어내리기, 팔 뒤로 젖히기, 안쪽으로 돌리기": "Kéo cánh tay đã nâng xuống, đưa tay ra sau, xoay vào trong", "턱걸이, 랫풀다운이 대표 운동이고, 한 팔을 올려 옆구리를 늘리는 스트레칭이 좋아요.": "Hít xà và lat pulldown là bài tiêu biểu; giãn sườn bằng cách giơ một tay lên cũng tốt.", "목빗근": "Cơ ức đòn chũm", "목 옆을 비스듬히 가로지르는 근육이에요. 머리를 돌리고 숙이는 데 쓰여요.": "Cơ chạy chéo qua bên cổ. Dùng để quay và cúi đầu.", "복장뼈 윗부분, 빗장뼈 안쪽": "Phần trên xương ức, phía trong xương đòn", "귀 뒤 꼭지돌기(유양돌기)": "Mỏm chũm sau tai", "고개 돌리기, 옆으로 기울이기, 앞으로 숙이기": "Quay đầu, nghiêng sang bên, cúi về trước", "고개를 숙이고 폰을 오래 보면 짧아지고 뻣뻣해져요. 턱 당기기와 목 옆 스트레칭이 도움이 돼요.": "Cúi đầu xem điện thoại lâu sẽ khiến cơ ngắn lại và cứng. Thu cằm và giãn bên cổ sẽ giúp ích.", "배곧은근": "Cơ thẳng bụng", "배 앞쪽을 세로로 지나는 근육이에요. 힘줄 마디가 있어서 복근이 나뉘어 보여요.": "Cơ chạy dọc phía trước bụng. Có các gân ngang nên cơ bụng trông như chia thành các khối.", "두덩뼈(치골)": "Xương mu", "칼돌기, 5~7번 갈비연골": "Mỏm mũi kiếm, sụn sườn 5–7", "상체 굽히기, 골반 말아 올리기, 허리 안정": "Gập thân trên, cuộn xương chậu lên, ổn định thắt lưng", "플랭크처럼 허리를 버티는 운동이 허리 건강에 도움이 돼요. 윗몸을 과하게 말면 목에 부담이 가요.": "Các bài giữ thắt lưng như plank tốt cho sức khỏe lưng. Cuộn thân trên quá mức sẽ gây áp lực lên cổ.", "큰볼기근": "Cơ mông lớn", "엉덩이를 이루는 가장 큰 근육이에요. 일어서고 계단을 오를 때 허벅지를 뒤로 보내는 힘을 내요.": "Cơ lớn nhất tạo nên mông. Tạo lực đưa đùi ra sau khi đứng lên và leo cầu thang.", "엉치뼈, 엉덩뼈 뒤쪽": "Xương cùng, phía sau xương chậu", "넙다리뼈 뒤 거친면, 엉덩정강근막띠": "Mặt nhám sau xương đùi, dải chậu chày", "고관절 펴기, 다리 바깥으로 돌리기": "Duỗi hông, xoay chân ra ngoài", "브릿지, 힙 힌지가 대표 운동이에요. 오래 앉으면 쓰임이 줄어 허리 부담이 커져요.": "Cầu mông và hip hinge là bài tiêu biểu. Ngồi lâu làm cơ ít được dùng, khiến thắt lưng chịu thêm áp lực.", "넙다리네갈래근": "Cơ tứ đầu đùi", "허벅지 앞쪽의 큰 근육이에요. 네 갈래가 한 힘줄로 모여 무릎뼈를 지나 정강이에 붙어요.": "Cơ lớn ở mặt trước đùi. Bốn đầu hợp lại thành một gân đi qua xương bánh chè và bám vào xương chày.", "엉덩뼈 앞쪽, 넙다리뼈 몸통": "Phía trước xương chậu, thân xương đùi", "무릎뼈를 지나 정강뼈 거친면": "Qua xương bánh chè đến lồi củ xương chày", "무릎 펴기, 계단 오르기, 일어서기": "Duỗi gối, leo cầu thang, đứng lên", "의자 스쿼트, 앉아서 무릎 펴기가 좋아요. 무릎이 발끝보다 안쪽으로 모이지 않게 하세요.": "Squat với ghế và duỗi gối khi ngồi rất tốt. Đừng để gối chụm vào trong so với mũi chân.", "뒤넙다리근": "Nhóm cơ đùi sau", "허벅지 뒤쪽 근육 무리예요. 엉덩이에서 시작해 무릎 뒤 양쪽으로 갈라져 붙어요.": "Nhóm cơ ở mặt sau đùi. Bắt đầu từ mông và tách thành hai bên phía sau gối để bám vào.", "궁둥뼈 결절(앉았을 때 닿는 뼈)": "Ụ ngồi (xương chạm xuống khi ngồi)", "정강뼈와 종아리뼈 위쪽": "Phía trên xương chày và xương mác", "무릎 굽히기, 엉덩관절 펴기": "Gập gối, duỗi hông", "앉아 있는 시간이 길면 짧아져 허리와 골반이 당겨요. 누워서 다리 들어 올리는 스트레칭이 좋아요.": "Ngồi lâu khiến cơ ngắn lại, kéo căng thắt lưng và xương chậu. Nên giãn bằng cách nằm và nâng chân.", "장딴지근": "Cơ bụng chân", "종아리 위쪽의 볼록한 근육이에요. 아킬레스힘줄로 모여 발뒤꿈치에 붙어요.": "Cơ phồng ở phần trên bắp chân. Hợp lại thành gân Achilles và bám vào gót chân.", "넙다리뼈 아래쪽 안·바깥 융기": "Lồi cầu trong và ngoài phía dưới xương đùi", "아킬레스힘줄을 지나 발뒤꿈치뼈": "Qua gân Achilles đến xương gót", "발끝 세우기, 무릎 굽히기 보조": "Kiễng gót, hỗ trợ gập gối", "벽 종아리 스트레칭, 발뒤꿈치 올리기가 대표 운동이에요. 오래 서 있으면 쉽게 뭉쳐요.": "Giãn bắp chân tựa tường và nhón gót là bài tiêu biểu. Đứng lâu khiến cơ dễ bị căng cứng.", "손목 굽힘근": "Cơ gập cổ tay", "아래팔 안쪽(손바닥 쪽)의 근육 무리예요. 손목과 손가락을 굽혀요.": "Nhóm cơ ở mặt trong (phía lòng bàn tay) của cẳng tay. Gập cổ tay và ngón tay.", "위팔뼈 안쪽 위관절융기(팔꿈치 안쪽)": "Lồi cầu trong xương cánh tay (phía trong khuỷu tay)", "손목뼈, 손가락뼈": "Xương cổ tay, xương ngón tay", "손목 굽히기, 손가락 쥐기": "Gập cổ tay, nắm tay", "타이핑이나 마우스를 오래 쓰면 쌓여요. 팔을 펴고 손끝을 아래로 당기는 스트레칭을 해보세요.": "Tích tụ khi gõ phím hoặc dùng chuột lâu. Hãy thử giãn bằng cách duỗi tay và kéo đầu ngón tay xuống.", "손목 폄근": "Cơ duỗi cổ tay", "아래팔 바깥쪽(손등 쪽)의 근육 무리예요. 손목과 손가락을 펴고 손목을 안정시켜요.": "Nhóm cơ ở mặt ngoài (phía mu bàn tay) của cẳng tay. Duỗi cổ tay và ngón tay, giữ cổ tay ổn định.", "위팔뼈 바깥 위관절융기(팔꿈치 바깥)": "Lồi cầu ngoài xương cánh tay (phía ngoài khuỷu tay)", "손등 쪽 손목뼈, 손가락뼈": "Xương cổ tay phía mu bàn tay, xương ngón tay", "손목 젖히기, 손가락 펴기": "Ngửa cổ tay, duỗi ngón tay", "손목을 꺾은 채 타이핑하면 부담이 커요. 손등을 아래로 돌려 당기는 스트레칭을 해보세요.": "Gõ phím trong khi bẻ cổ tay sẽ tăng áp lực. Hãy thử giãn bằng cách xoay mu bàn tay xuống và kéo.", "← 운동 목록": "← Danh sách bài tập", "근육 ON": "Cơ BẬT", "근육 OFF": "Cơ TẮT", "이는곳": "Điểm bám đầu", "닿는곳": "Điểm bám cuối", "하는 일": "Chức năng", "파란 점은 근육이 시작하는 곳, 초록 점은 닿는 곳이에요. 단순화한 도식이라 실제 해부도와 다를 수 있어요.": "Chấm xanh dương là nơi cơ bắt đầu, chấm xanh lá là nơi cơ bám vào. Đây là sơ đồ đơn giản hóa nên có thể khác với giải phẫu thực tế.", "▶ 움직임 보기": "▶ Xem chuyển động", "염소자리": "Ma Kết", "물병자리": "Bảo Bình", "물고기자리": "Song Ngư", "양자리": "Bạch Dương", "황소자리": "Kim Ngưu", "쌍둥이자리": "Song Tử", "게자리": "Cự Giải", "사자자리": "Sư Tử", "처녀자리": "Xử Nữ", "천칭자리": "Thiên Bình", "전갈자리": "Bò Cạp", "사수자리": "Nhân Mã", "불": "Lửa", "흙": "Đất", "바람": "Gió", "물": "Nước", "열정적이고 에너지가 넘치는": "nhiệt huyết và tràn đầy năng lượng", "차분하고 현실적인": "điềm tĩnh và thực tế", "자유롭고 호기심 많은": "tự do và nhiều tò mò", "감성이 깊고 섬세한": "nhạy cảm sâu sắc và tinh tế", "A형": "A", "섬세하고 차분한 감성 → 서정적이고 잔잔한 곡": "Cảm xúc tinh tế, điềm tĩnh → bài hát trữ tình, nhẹ nhàng", "B형": "B", "자유롭고 호기심 많은 감성 → 리듬감 있고 개성 있는 곡": "Cảm xúc tự do, nhiều tò mò → bài hát có nhịp điệu và cá tính", "O형": "O", "에너지 넘치고 긍정적인 감성 → 힘 있고 따라 부르기 좋은 곡": "Cảm xúc tràn năng lượng, tích cực → bài hát mạnh mẽ, dễ hát theo", "AB형": "AB", "독특하고 다채로운 감성 → 장르를 넘나드는 곡": "Cảm xúc độc đáo, đa sắc màu → bài hát vượt qua ranh giới thể loại", "혈액형 모름": "Không biết nhóm máu", "혈액형 없이 오행·별자리·오늘의 기분으로 골랐어요": "Đã chọn dựa trên Ngũ hành, cung hoàng đạo và tâm trạng hôm nay, không dùng nhóm máu", "기분이 올라가는 곡": "Bài hát làm tâm trạng phấn chấn", "차분하게 마음을 가라앉히는 곡": "Bài hát giúp lắng dịu tâm trí", "위로와 힘이 되는 곡": "Bài hát an ủi và tiếp thêm sức mạnh", "오늘 기분에 어울려요": "Hợp với tâm trạng hôm nay", "부족한 ": "Bổ sung khí ", " 기운을 채워줘요": " còn thiếu", "의 ": " · hệ ", " 감성": " cảm xúc", "A형의 섬세한 감성": "Cảm xúc tinh tế của nhóm máu A", "B형의 자유로운 리듬감": "Nhịp điệu tự do của nhóm máu B", "O형의 힘 있는 에너지": "Năng lượng mạnh mẽ của nhóm máu O", "AB형의 독특한 취향": "Gu độc đáo của nhóm máu AB", "나만의 노래 성향": "Xu h t une fois. L'étincelle est toujours là.", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "Un grand éclat de rire aujourd'hui change la température de toute votre journée.", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "La terre soutient tout en silence. Avoir tenu bon aujourd'hui est déjà beaucoup.", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "Un chemin tassé lentement va le plus loin. Un pas aujourd'hui suffit.", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "Un bon repas ancre votre journée. Nourrissez-vous bien aujourd'hui.", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "Quelqu'un de profondément enraciné sourit même quand le vent souffle. Faites confiance à vos racines.", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "Le métal ne devient fort qu'en passant par le feu. Votre épreuve actuelle vous affine.", "맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.": "Le son d'une cloche claire porte loin. Un mot offert aujourd'hui atteindra les gens de la même façon.", "깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.": "Respirez profondément et ouvrez les épaules. Quand la poitrine s'ouvre, le cœur suit.", "정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.": "Un bureau rangé et un esprit rangé se ressemblent. Rangez une seule chose aujourd'hui et vous vous sentirez plus léger.", "물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.": "L'eau contourne l'obstacle et se repose quand elle s'accumule. Le repos fait aussi partie du courant.", "깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.": "L'eau profonde coule sans bruit. Une journée à avancer tranquillement est belle aussi.", "오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.": "Ne vous pressez pas aujourd'hui, laissez-vous couler. Au bout du compte, la mer accueille toutes les eaux.", "따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.": "Une tasse d'eau chaude détend le cœur. Faites une pause et prenez soin de vous.", "오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.": "Votre rythme émotionnel est bas aujourd'hui. Soyez un peu plus doux avec vous-même.", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠보세요.": "Votre humeur est claire aujourd'hui. Partagez cette énergie 는 시간을 구분하세요.": "À la maison, la posture se relâche facilement. Installez un bureau et une chaise adaptés et séparez le temps de travail du repos.", "책상 공부가 길면 목·허리가 굳어요. 의자 높이를 맞추고 45분마다 스트레칭하세요.": "Étudier longtemps au bureau raidit le cou et le bas du dos. Réglez la hauteur de la chaise et étirez-vous toutes les 45 minutes.", "오래 서서 말하는 일은 무릎·허리에 부담이 돼요. 발을 번갈아 쉬어주고 수분을 챙기세요.": "Parler debout pendant de longues heures sollicite les genoux et le bas du dos. Reposez vos pieds à tour de rôle et buvez de l'eau.", "서서 일하고 환자를 옮기는 일은 허리·무릎에 부담이 커요. 코어 운동과 종아리 스트레칭을 권해요.": "Le travail debout et le déplacement de patients sollicitent le bas du dos et les genoux. Le renforcement du tronc et l'étirement des mollets sont recommandés.", "오래 서 있는 일은 무릎·발에 부담이 커요. 쿠션 좋은 신발과 종아리 스트레칭이 도움이 돼요.": "Rester debout de longues heures sollicite les genoux et les pieds. Des chaussures amorties et des étirements des mollets aident.", "주방 일은 허리·손목 부담이 커요. 작업대 높이를 맞추고 발밑에 매트를 두세요.": "Le travail en cuisine sollicite le bas du dos et les poignets. Réglez le plan de travail à bonne hauteur et mettez un tapis sous vos pieds.", "장시간 운전과 짐 나르기는 허리·목에 부담이 커요. 1~2시간마다 쉬고 짐은 몸 가까이 들어요.": "Conduire longtemps et porter des charges sollicitent le bas du dos et le cou. Faites une pause toutes les 1–2 heures et portez les charges près du corps.", "반복 동작과 무거운 작업은 허리·어깨에 부담이 커요. 작업 전 준비운동과 보호 장비를 챙기세요.": "Les gestes répétitifs et le travail lourd sollicitent le bas du dos et les épaules. Échauffez-vous avant le travail et utilisez des protections.", "굽힌 자세 작업이 많아 허리·무릎이 힘들어요. 작업 사이 허리를 펴는 습관을 들이세요.": "Beaucoup de travail penché est dur pour le bas du dos et les genoux. Prenez l'habitude de vous redresser entre les tâches.", "안기·들기·서서 하는 집안일이 잦아 허리·손목이 힘들어요. 안는 위치를 자주 바꾸세요.": "Porter, soulever et faire les tâches debout sollicite souvent le bas du dos et les poignets. Changez souvent votre façon de porter.", "근무 시간이 길어지기 쉬워요. 틈틈이 앉았다 서기를 번갈아 하고 식사 시간을 지키세요.": "Les horaires de travail ont tendance à s'allong
