var TR={"en": {"생년월일": "Date of birth", "성별": "Gender", "여성": "Female", "남성": "Male", "모름": "Unknown", "목": "Wood", "화": "Fire", "토": "Earth", "금": "Metal", "수": "Water", "목(木)": "Wood(木)", "화(火)": "Fire(火)", "토(土)": "Earth(土)", "금(金)": "Metal(金)", "수(水)": "Water(水)", "나무는 하루아침에 자라지 않아도 매일 해를 향해 갑니다. 오늘도 그 방향이면 충분해요.": "A tree doesn't grow overnight, yet it turns toward the sun every day. Facing that way again today is enough.", "오늘 내디딘 한 걸음이 내일의 새싹이 돼요. 서두르지 않아도 괜찮아요.": "The step you took today becomes tomorrow's sprout. There's no need to rush.", "굽은 가지도 결국 빛을 찾아 자랍니다. 지금 모습 그대로 괜찮아요.": "Even a crooked branch ends up growing toward the light. You're fine just as you are.", "숲은 서로의 그늘을 나눠 크는 법이에요. 오늘 누군가에게 그늘이 되어주세요.": "A forest grows by sharing its shade. Be someone's shade today.", "작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.": "One small spark warms a whole room. Your smile today is that spark.", "타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.": "Not only what blazes is light. Softly lighting up those beside you is strength too.", "마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.": "If your heart has cooled, take one deep breath. The spark is still there.", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "One big laugh today changes the temperature of your whole day.", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "The earth quietly holds everything up. Just getting through today is already a big deal.", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "A path packed down slowly goes the farthest. One step today is all it takes.", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "A hearty meal anchors your day. Feed yourself well today.", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "A deeply rooted person smiles even when the wind blows. Trust your roots.", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "Metal becomes strong only after passing through fire. Your current hardship is refining you.", "맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.": "A clear bell's sound travels far. A word you offer today will reach people the same way.", "깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.": "Breathe deeply and open your shoulders. When your chest opens, your heart follows.", "정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.": "A tidy desk and a tidy mind are alike. Clear just one thing today and you'll feel lighter.", "물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.": "Water goes around when blocked and rests when it pools. Rest is part of the flow too.", "깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.": "Deep water flows without a sound. A day of quietly getting things done is wonderful too.", "오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.": "Don't rush today—just flow. In the end, the sea takes in all water.", "따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.": "A warm cup of water loosens the heart. Pause for a moment and look after yourself.", "오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.": "Your emotional rhythm is low today. Be a little kinder to yourself.", "오늘은 차분하게 균형을 지키기 좋은 날이에요.": "A good day to stay calm and keep your balance.", "목형 (성장·추진형)": "Wood type (growth · drive)", "새로운 계획과 배움 이야기를 즐기고 시원시원하게 말하는 사람": "Someone who enjoys talking about new plans and learning, and speaks openly", "“요즘 새로 시작한 게 있어요?”처럼 근황과 계획을 물어보세요": "Ask about their recent news and plans, like “Have you started anything new lately?”", "초록": "Green", "화형 (열정·밝은 에너지형)": "Fire type (passion · bright energy)", "표정이 밝고 말이 빠르며 웃음이 많은 사람": "Someone with a bright face, quick speech and lots of laughter", "“오늘 기분 좋아 보여요!”처럼 먼저 웃으며 인사해 보세요": "Greet them with a smile first, like “You look happy today!”", "빨강": "Red", "토형 (믿음직·안정형)": "Earth type (reliable · steady)", "차분하고 말수는 적지만 약속을 잘 지키는 사람": "Calm and quiet, but someone who keeps their promises", "고민을 솔직하게 털어놓고 조언을 구해 보세요": "Share your worries honestly and ask for their advice", "노랑·베이지": "Yellow · beige", "금형 (원칙·정리형)": "Metal type (principled · organized)", "말이 간결하고 단정하며 시간 약속에 철저한 사람": "Concise and neat in speech, strict about time", "핵심부터 짧게 말하고 일정과 결정을 함께 정리해 보세요": "Start with the key point, keep it short, and settle schedules and decision fore answering. Spend only where it truly matters.", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "Small mistakes happen easily this month, so be thorough. Double-check documents and appointments, and put safety first when on the move. The more careful you are, the lighter next month feels.", "이달의 운세": "This month", "분야별 흐름": "By area", "이달의 한마디": "Words for the month", "이달의 행운": "Lucky things this month", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "Your birth date and photo are saved to your Pi account, so they stay even after you close the app.", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "Your birth date is saved only to your Pi account. Fortunes are for fun and reference; health content doesn't replace medical advice.", "궁합": "Compatibility", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "See how well two people's energies match", "상대방 정보": "Their info", "상대 이름 (선택)": "Their name (optional)", "궁합 보기": "Check compatibility", "다른 사람과 보기": "Try someone else", "띠 궁합": "Zodiac match", "성향 궁합": "Personality match", "오행 궁합": "Five Elements match", "두 사람에게 주는 조언": "Advice for you two", "두 띠는 서로 힘을 북돋아 주는 삼합 관계예요. 함께 있으면 일이 술술 풀리고 마음이 잘 통해요.": "Your signs form a 'triple harmony' that lifts each other up. Together, things go smoothly and you understand each other well.", "두 띠는 서로 끌어당기는 육합 관계예요. 처음 만나도 편안하고, 오래 함께할수록 정이 깊어져요.": "Your signs form a 'six harmony' that draws you together. You feel at ease from the start, and the bond deepens over time.", "두 띠는 서로 마주 보는 충 관계예요. 성향이 달라 부딪힐 때도 있지만, 서로를 인정하면 오히려 좋은 자극이 돼요.": "Your signs sit opposite each other. Different styles may clash at times, but accepting each other turns it into good motivation.", "같은 띠라 생각과 리듬이 비슷해요. 말하지 않아도 통하는 부분이 많아 편안한 사이예요.": "Same sign, so your thinking and rhythm are alike. Much is understood without words—an easy, comfortable pair.", "두 띠는 크게 부딪히지도 끌리지도 않는 무난한 관계예요. 함께 보내는 시간만큼 신뢰가 쌓여요.": "Your signs neither clash nor pull strongly—a steady match. T ", "흐리거나 잘 안 보여요": "Faint or hard to see", "몸의 바탕 힘이 단단하고 회복력이 좋은 편이에요. 꾸준히 몸을 쓰면 나이가 들수록 더 든든해지는 손금이에요.": "Your core vitality is solid and you recover well. Keep moving regularly and you'll grow even sturdier with age.", "짧은 생명선은 수명이 아니라 생활 리듬을 뜻해요. 무리하기보다 잠과 식사를 일정하게 지킬 때 힘이 오래가는 타입이에요.": "A short life line is about rhythm, not lifespan. Your energy lasts longest when you keep regular sleep and meals rather than overdoing it.", "삶의 큰 전환점을 지나며 새 방향을 찾는 흐름이에요. 이사·이직 같은 변화가 오히려 기운을 새로 채워 주는 손금이에요.": "You're passing a big turning point and finding a new direction. Changes like moving or a new job actually recharge your energy.", "현실 감각이 좋고 계획을 세워 차근차근 해내는 타입이에요. 숫자·정리·판단이 필요한 일에서 실력이 빛나요.": "You're practical and get things done step by step with a plan. You shine at work that needs numbers, organizing and judgment.", "상상력과 감수성이 풍부한 타입이에요. 글·그림·기획처럼 아이디어를 쓰는 일에서 남다른 결과를 만들어요.": "You're imaginative and sensitive. You create standout results in idea work like writing, art or planning.", "생각보다 행동이 빠른 타입이에요. 오래 고민하기보다 일단 해 보면서 길을 찾는 쪽이 잘 맞아요.": "You act faster than you think. Trying things out suits you better than long deliberation.", "정이 깊고 표현이 따뜻한 사람이에요. 한번 마음을 주면 오래 가고, 주변 사람을 잘 챙겨 사랑받는 손금이에요.": "You're warm-hearted and expressive. Once you give your heart it lasts, and your care for others makes you loved.", "감정을 차분하게 다스리는 사람이에요. 겉으로는 담담해 보여도 믿을 수 있는 사람에게는 깊은 마음을 보여 줘요.": "You handle emotions calmly. You may look composed, but you show deep feelings to people you trust.", "마음이 넓고 여러 사람과 잘 어울려요. 다양한 인연 속에서 좋은 기회를 만나는 손금이에요.": "You're open-hearted and get along with many people. Your many connections bring good opportunities.", "일찍부터 자기 길이 분명한 편이에요. 한 분야를 꾸준히 밀고 나가면 인정받고 자리를 잡는 손금이에요.": "You've known your path from early on. Stick with one field and you'll earn recognition and a solid place.", "늦게 피는 꽃처럼 중년 이후에 운이 크게 열리는 흐름이에요. 지금 쌓는 경험이 나중에 큰 힘이 돼요.": "Like a late-blooming flower, your luck opens wide from midlife on. The experience you build now becomes great strength later.", "정해진 틀보다 스스로 길을 만드는 자유로운 타입이에요. 여러 경험을 해 볼수록 나에게 맞는 일을 찾게 돼요.": "You're a free spirit who makes your own path rather than following set molds. The more you try, the sooner you find what fits.", "손금 전체에 힘이 고르게 실려 있어요. 지금 하는 일을 꾸준히 밀고 나가면 좋은 결과가 따라와요.": "Strength runs evenly through your palm. Keep pushing on with what you're doing and good results will follow.", "강한 선과 부드러운 선이 섞여 균형이 좋은 손이에요. 장점은 살리고 약한 부분은 생활 습관으로 채워 보세요.": "Strong and gentle lines mix into a well-balanced hand. Build on your strengths and support the weaker parts with daily habits.", "손금은 살면서 조금씩 바뀌어요. 지금의 흐름은 변화와 가능성이 크다는 뜻이니, 새로운 도전을 두려워하지 마세요.": "Palm lines change little by little over life. Right now they point to big change and potential, so don't fear new challenges.", "왼손": "left", "오른손": "right", "{0} 손바닥을 손 모양 안에 맞춰 주세요": "Fit your {0} palm inside the hand outline", "전통적으로 남자는 왼손, 여자는 오른손을 봐요": "Traditionally, men read the left hand and women the right", "카메라를 켤 수 없어요. 아래 버튼으로 사진을 찍어 주세요.": "Can't open the camera. Use the button below to take a photo.", "찍기": "Capture", "{0}으로 보기": "Use {0} hand", "손바닥 윤곽을 맞추는 중…": "Aligning palm outline…", "생명선 찾는 중…": "Finding life line…", "두뇌선 찾는 중…": "Finding head line…", "감정선 찾는 중…": "Finding heart line…", "운명선 찾는 중…": "Finding fate line…", "스캔 완료!": "Scan complete!", "사진 속 점선 위치의 내 손금과 가장 비슷한 모양을 골라 주세요": "Compare each dotted line with your palm and pick the closest shape", "손금 풀이 보기": "See my reading", "나의 손금 풀이": "My palm reading", "한마디": "In a word", "손금 풀이는 전통 해석을 바탕으로 한 재미와 참고용이에요. 사진은 휴대폰 안에서만 쓰이고 서버에 저장되지 않아요.": "Palm readings are based on traditional interpretation, for fun and reference. Your photo stays on your phone and is never saved to our server.", "다시 찍기": "Retake", "아직 고르지 않은 손금이 있어요: {0}": "Some lines aren't chosen yet: {0}", "스캔 결과로 손금 모양을 자동으로 골랐어요. 내 손과 다르면 아래에서 바꿀 수 있어요": "We picked your line shapes from the scan. If something looks different from your hand, change it below.", "보고 싶은 손금을 눌러 보세요": "Tap a line to see its reading", "총평": "Overall reading", "닮은 손금 유형": "Your palm type", "한눈에 보기": "At a glance", "건강·체력운: 타고난 체력이 좋아 바쁜 시기에도 쉽게 지치지 않아요. 다만 몸을 믿고 무리하는 습관이 생기기 쉬우니, 한 달에 한 번은 푹 쉬는 날을 정해 두세요. 걷기나 등산처럼 오래 꾸준히 하는 운동이 이 손금과 가장 잘 맞아요.": "Health & vitality: You have natural stamina and don't tire easily even in busy times. But trusting your body can lead to overdoing it, so set one full rest day a month. Long, steady exercise like walking or hiking suits this palm best.", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Health & vitality: You run out of energy fast if you spend it all at once, so a rhythm of short, frequent breaks matters. Warm food and regular sleep are your best medicine. Track your good and bad days and your own care routine will soon become clear.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Health & vitality: When your surroundings change, your body goes through an adjustment period too. During big changes like moving or a new job, take special care of sleep and meals for the first few weeks. Once you get through it, healthier habits than before take root.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Work & study: Breaking goals into small pieces and ticking them off suits you. You earn trust in precise fields like planning, management, accounting or IT, and your responsibilities grow over time. Don't wait for perfect readiness and miss chances — start when you're 70% ready.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Work & study: Your real talent shows in creating new things rather than tasks with fixed answers. Jotting ideas down the moment they come becomes a great asset. Scheduling may be a weak spot, so pairing with a detail-minded partner makes results far better.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Work & study: You decide fast and execute well, so you shine where speed matters — field work, sales, start-ups. Short bursts of focus with quick results suit you better than holding onto one thing for long. Before big decisions, sleep on it once and your mistakes will drop sharply.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Love & relationships: You give generously in love, so your partner feels deeply secure. Longtime friends and family become a great pillar in your life. You may feel hurt when you don't get back as much as you give, so practice putting your wishes into words.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Love & relationships: You don't open up easily, but once you trust someone you stay loyal to the end. You show love through steady, sincere attention rather than flashy gestures. Expressing yourself just a little more makes your partner feel your love far more strongly.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Love & relationships: Your charm draws people in, bringing many connections, and you naturally become the center of a gathering. Learning to recognize who is truly on your side makes your relationships much stronger. Good chances come through new encounters, so keep an open heart.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Wealth & career: You dig deep in one field, so your income grows steadily as your career builds. Methods where time is on your side, like steady saving or long-term investing, suit you well. Keep certificates or records that prove your expertise and chances will come sooner.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Wealth & career: Your wealth luck grows later in life, so not rushing is the key. The experience and network you've built return as big rewards, and you may even succeed greatly in something you started late. For now, focus on stopping money leaks rather than earning big.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Wealth & career: Your wealth luck comes alive when you earn according to your ability rather than a fixed salary. Building several income streams — side jobs, freelancing, a small business — suits you. Income may fluctuate, so be sure to set aside a few months of living costs as an emergency fund.", "👑 리더형 손금": "👑 Leader-type palm", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Since old times, a hand with both a clear life line and fate line has been said to belong to business founders and leaders who run large organizations. With stamina and drive behind you, you have the power to push a goal through to the end. People naturally trust and follow your judgment, so don't shy away from positions of responsibility. Rather than carrying everything alone, share work with people you trust and your luck will grow even bigger.", "🎨 예술가형 손금": "🎨 Artist-type palm", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Traditionally, a hand whose head line curves gently downward is said to be common among artists, writers and designers. You have a strong sense for feeling and expressing what others miss. When you dive into something you love, you lose track of time — and that immersion is your treasure. When waves of emotion come, pour them into writing or drawing and something good may come of it.", "🌳 대기만성형 손금": "🌳 Late-bloomer palm", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "A hand whose fate line starts in the middle of the palm is called the late-bloomer type that blossoms late but succeeds greatly. All the trial and error of your youth becomes the soil for later success. Keeping your own pace matters more than comparing speed with others. From midlife on, a flow of stable wealth and respect appears.", "🧭 개척자형 손금": "🧭 Pioneer-type palm", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "A hand with branching or freely spreading lines belongs to the pioneer type who opens new paths rather than following set ones. You're the kind who seizes chances amid change — new jobs, moves, challenges. Chasing only stability can make you feel stifled, so keep trying new things, even small ones. The moment your many experiences come together, you'll achieve something remarkable.", "♟️ 전략가형 손금": "♟️ Strategist-type palm", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "A hand with a straight head line belongs to the strategist or advisor type, precise in calculation and judgment. You can see the big picture and read risks in advance, making you indispensable in any organization. You show your true worth shaping the game from behind rather than standing in front. Now and then, set the calculations aside and trust your gut — unexpected luck may come.", "⚖️ 균형형 손금": "⚖️ Balanced-ty .": "森はお互いの木陰を分け合って育ちます。今日は誰かの木陰になってあげてください。", "작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.": "小さな火種ひとつが部屋全体を温めます。今日のあなたの笑顔がその火種です。", "타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.": "燃え盛るものだけが光ではありません。ほのかに隣を照らすのも力です。", "마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.": "心が冷めたなら、深く息を一つ吸いましょう。火種はまだそこにあります。", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "今日一度大きく笑えば、一日の温度が変わります。", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "大地は黙ってすべてを支えてくれます。今日を耐えただけでも十分大きなことです。", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "ゆっくり踏み固めた道がいちばん遠くまで行けます。今日も一歩で十分です。", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "しっかりした一食が一日の軸になります。今日は自分をよく食べさせてあげましょう。", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "根の深い人は風が吹いても笑っています。自分の根を信じましょう。", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "鉄は火をくぐってこそ強くなります。今の困難があなたを磨いています。", "맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.": "澄んだ鐘の音は遠くまで響きます。今日かける一言も、そのように届くでしょう。", "깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.": "深く息を吸って肩を開きましょう。胸が開けば心もついて開きます。", "정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.": "整った机と心は似ています。今日ひとつだけ手放せば軽くなります。", "물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.": "水はふさがれれば回り道をし、たまれば休みます。休むことも流れの一部です。", "깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.": "深い水は音もなく流れます。静かにやり遂げる一日も素敵です。", "오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.": "今日は急がず流れましょう。海は結局すべての水を受け止めてくれます。", "따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.": "温かい水一杯が心をほぐします。ちょっと立ち止まって自分をいたわりましょう。", "오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.": "今日は感情のリズムが低い日です。自分に少しだけ優しくしてあげましょう。", "오늘은 차분하게 균형을 지키기 좋은 날이에요.": "今日は落ち着いてバランスを保つのによい日です。", "목형 (성장·추진형)": "木タイプ(成長・推進型)", "새로운 계획과 배움 이야기를 즐기고 시원시원하게 말하는 사람": "新しい計画や学びの話が好きで、さっぱり話す人", "“요즘 새로 시작한 게 있어요?”처럼 근황과 계획을 물어보세요": "「最近、新しく始めたことはありますか?」のように近況や計画を聞いてみましょう", "초록": "グリーン", "화형 (열정·밝은 에너지형)": "火タイプ(情熱・明るいエネルギー型)", "표정이 밝고 말이 빠르며 웃음이 많은 사람": "表情が明るく、話が早く、よく笑う人", "“오늘 기분 좋아 보여요!”처럼 먼저 웃으며 인사해 보세요": "「今日は機嫌がよさそうですね!」のように、先に笑顔で挨拶してみましょう", "빨강": "レッド", "토형 (믿음직·안정형)": "土タイプ(頼もしい・安定型)", "차분하고 말수는 적지만 약속을 잘 지키는 사람": "落ち着いていて口数は少ないけれど、約束をきちんと守る人", "고민을 솔직하게 털어놓고 조언을 구해 보세요": "悩みを正直に打ち明けて、アドバイスをもらってみましょう", "노랑·베이지": "イエロー・ベージュ", "금형 (원칙·정리형)": "金タイプ(原則・整理型)",  "四柱八字", "산처럼 든든히 쌓는 해": "山のようにしっかり積み上げる年", "상반기엔 가까운 사람의 도움이 크게 작용해요. 가족과 오랜 친구를 먼저 챙기세요.": "上半期は身近な人の助けが大きく働きます。家族と古い友人を大切に。", "상반기엔 돈이 들어오고 나가는 일이 잦아요. 계획 없는 지출만 줄이면 남는 게 있어요.": "上半期はお金の出入りが多い。無計画な出費を減らせば残ります。", "상반기엔 말 한마디가 운을 바꿔요. 부드럽게 말할수록 일이 술술 풀려요.": "上半期はひと言が運を変えます。やわらかく話すほど物事がうまく進みます。", "상반기엔 바쁘게 움직일수록 기회가 와요. 집에만 있기보다 밖으로 나가 보세요.": "上半期は動くほどチャンスが来ます。家にいるより外に出て。", "상반기엔 새 사람을 만나는 일이 많아요. 첫인상보다 시간을 두고 지켜보세요.": "上半期は新しい出会いが多い。第一印象より時間をかけて見て。", "상반기엔 속도를 늦추고 몸과 마음을 돌볼 때예요. 쉼이 곧 준비예요.": "上半期はペースを落として心身をいたわる時。休むことが準備です。", "새로운 시작에 힘이 실리는 달이에요. 배움을 시작해도 좋아요.": "新しい始まりに力が宿る月。学び始めるのも良いでしょう。", "새싹이 땅을 뚫는 해": "新芽が土を破る年", "생각이 많아지는 달이에요. 메모를 하면 머리가 맑아져요.": "考えごとが増える月。メモすると頭がすっきり。", "생년월일시로 나의 오행(목·화·토·금·수) 기운을 읽고, 한 해와 오늘의 흐름을 알려 주는 앱이에요.": "生年月日時からあなたの五行（木・火・土・金・水）を読み、一年と今日の流れを教えてくれるアプリです。", "생년월일은 내 폰에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "生年月日はスマホにだけ保存されます。運勢は楽しみと参考用で、健康情報は医療相談の代わりにはなりません。", "생년월일은 이 폰에만 저장되고 서버로 보내지 않아요.": "生年月日はこのスマホにだけ保存され、サーバーには送りません。", "생년월일을 한 번만 넣으면 모든 운세에 쓰여요.": "生年月日を一度入れるだけで、すべての運勢に使われます。", "생활패턴으로 보는 부위별 관리 포인트": "生活パターンから見る部位別ケアのポイント", "서두르면 일이 꼬이는 달이에요. 한 박자 쉬고 움직이세요.": "急ぐと物事がこじれる月。一呼吸おいて動いて。", "서쪽": "西", "성실하고 참을성이 강해 한번 맡은 일은 끝까지 해내요. 느려 보여도 가장 멀리 가요.": "誠実で忍耐強く、引き受けたことは最後までやり遂げます。遅く見えても一番遠くまで行きます。", "세는나이 {0}세": "数え年 {0}歳", "소": "丑（牛）", "순하고 예술적인 감각이 있어요. 남을 잘 배려하고 평화로운 관계를 만들어요.": "穏やかで芸術的なセンスがあります。人を思いやり、平和な関係を築きます。", "숲길 걷기, 식물 키우기": "森の散歩、植物を育てること", "씀씀이를 조금만 줄이면 연말에 넉넉해요.": "出費を少し抑えれば年末にゆとりが。", "아침 해가 떠오르는 해": "朝日が昇る年", "앱 소개": "アプリ紹介", "양력": "新暦", "억지로 밀어붙이기보다 흐름에 몸을 맡길 때 더 멀리 가는 해예요. 막히는 곳이 있으면 돌아가면 되고, 기다리면 길이 열려요. 조급함만 내려놓으면 무난하게 흘러가요.": "無理に押し通すより流れに身を任せる方が遠くへ行ける年。行き止まりなら回り道を、待てば道は開けます。焦りさえ手放せば順調に流れます。", "없는 날짜예요. 다시 확인해 주세요.": "存在しない日付です。もう一度確認してください。", "여덟 글자로 보는 나의 타고난 기운": "八文字で見る生まれ持った気", "여름": "夏", "영리하고 재주가 많아 무엇이든 빨리 배워요. 유머 감각으로 분위기를 띄워요.": "賢く多才で何でも早く覚えます。ユーモアで場を盛り上げます。", "영양 가이드": "栄養ガイド", "오늘 기분과 오행에 맞는 노래 5곡": "今日の気分と五行に合う5曲", "오늘의 글귀": "今日の言葉", "오늘의 노래와 글귀": "今日の歌と言葉", "오늘의 노래와 글귀 · 나의 몸 분석": "今日の歌と言葉・からだチェック", "오늘의 운세": "今日の運勢", "오늘의 일진과 내 사주의 오행을 견주어 본 재미·참고용 운세예요.": "今日の日辰とあなたの五行を照らし合わせた、楽しみと参考の運勢です。", "오래된 인연이 다시 이어져요.": "古い縁が再びつながります。", "오해가 생기기 쉬운 달이에요. 중요한 말은 글로 남기세요.": "誤解が生じやすい月。大事なことは文字で残して。", "오행 분포": "五行の分布", "오행과 계절에 맞춘 오늘의 식사·음료": "五行と季節に合わせた今日の食事・飲み物", "오행핏": "五行フィット", "오행핏에 오신 걸 환영해요!": "五行フィットへようこそ！", "온화하고 다정해 사람들이 편안해해요. 감각이 섬세하고 평화를 사랑해요.": "穏やかで優しく、人を安心させます。繊細で平和を愛します。", "용": "辰（龍）", "용감하고 당당해 앞장서는 걸 좋아해요. 정의감이 강하고 마음이 따뜻해요.": "勇敢で堂々と先頭に立つのが好き。正義感が強く心が温かい。", "운동 따라하기": "運動をまねしよう", "원숭이": "申（猿）", "월주": "月柱", "위는 천간, 아래는 지지예요. 일주의 천간 <b>{0}</b>이 바로 \"나\"를 뜻해요.": "上が天干、下が地支です。日柱の天干<b>{0}</b>が「自分」を表します。", "윗사람의 눈에 띄는 기회가 있어요.": "目上の人の目に留まるチャンスがあります。", "윤{0}월 {1}일": "閏{0}月{1}日", "윤달이에요": "閏月です", "음력": "旧暦", "음력 날짜를 확인해 주세요.": "旧暦の日付を確認してください。", "의리 있고 정직해요. 한번 맺은 인연을 소중히 지켜요.": "義理堅く正直。結んだ縁を大切に守ります。", "이사·이직·새로운 만남처럼 자리가 바뀌는 기운이 강한 해예요. 변화가 두렵게 느껴져도 대부분 좋은 쪽으로 이어져요. 다만 한꺼번에 여러 가지를 바꾸지는 마세요.": "引っ越し・転職・新しい出会いなど、居場所が変わる気が強い年。変化が怖くても多くは良い方向へ。ただ一度に多くを変えないで。", "이슬과 시냇물처럼 맑고 섬세해요. 직감이 좋고 공감 능력이 뛰어나요. 마음이 쉽게 흔들릴 땐 믿을 만한 사람과 이야기를 나눠 보세요.": "露や小川のように澄んで繊細。直感が鋭く共感力に優れます。心が揺れたら信頼できる人と話して。", "이용약관": "利用規約", "일·학업": "仕事・学業", "일간": "日干", "일주": "日柱", "작은 서운함은 그때그때 풀어 두세요.": "小さなわだかまりはその都度解消して。", "작은 약속을 잘 지키면 다음 달에 복으로 돌아와요.": "小さな約束を守れば翌月に福として返ってきます。", "작은 재물이 들어오는 달이에요. 들어온 만큼 조금은 모아 두세요.": "小さな財が入る月。入った分の一部は貯めて。", "잘 다듬어진 보석처럼 깔끔하고 감각이 뛰어나요. 완성도를 중요하게 여기고 아름다운 것을 알아봐요. 완벽하지 않아도 괜찮다고 스스로에게 말해 주세요.": "磨かれた宝石のように洗練され、センス抜群。完成度を重んじ、美しいものを見抜きます。完璧でなくていいと自分に言ってあげて。", "잘 맞는 사람": "相性の良い人", "잠을 잘 자는 것이 올해 최고의 관리예요.": "よく眠ることが今年最高のケア。", "재치 있고 눈치가 빨라 어디서든 살아남는 힘이 있어요. 알뜰하고 기회를 잘 잡아요.": "機転が利き勘が鋭く、どこでも生き抜く力があります。倹約家でチャンスをつかむのが上手。", "저장하고 시작하기": "保存して始める", "정리 정돈, 깊은 호흡": "整理整頓、深呼吸", "정리 정돈을 하면 운이 트이는 달이에요.": "整理整頓すると運が開ける月。", "조용히 실력을 다지기 좋은 달이에요. 서두를 필요 없어요.": "静かに実力を磨くのに良い月。急ぐ必要はありません。", "좋은 방향": "良い方角", "좋은 소개가 들어오는 해예요.": "良い紹介が舞い込む年。", "쥐": "子（鼠）", "지난해의 고민과 얽힌 일이 하나씩 풀려 가는 해예요. 상반기에 정리를 잘 해 두면 하반기엔 마음이 한결 가벼워져요. 미뤄 둔 연락이나 정리를 먼저 해 보세요.": "昨年の悩みやもつれが一つずつほどける年。上半期に整理しておけば下半期は心が軽く。後回しにした連絡や整理から。", "지혜롭고 차분하며 직감이 뛰어나요. 깊이 생각한 뒤 움직여 실수가 적어요.": "賢く落ち着いていて直感に優れます。深く考えてから動くので失敗が少ない。", "처음": "ホーム", "촛불처럼 은은하게 곁을 밝히는 사람이에요. 세심하고 배려가 깊어 마음을 잘 읽어요. 속으로 삭이기보다 마음을 표현할수록 빛이 커져요.": "ろうそくのようにそっと周りを照らす人。細やかで思いやり深く、心を読むのが上手。胸にしまうより表現するほど光が増します。", "충동구매와 보증은 피하세요. 지키는 게 버는 거예요.": "衝動買いと保証人は避けて。守ることが稼ぐこと。", "충분한 잠, 물 자주 마시기": "十分な睡眠、こまめな水分補給", "크게 요란하진 않아도 차곡차곡 쌓이는 해예요. 저축, 공부, 건강 관리처럼 꾸준히 하는 일이 연말에 든든한 결과로 돌아와요. 욕심내지 않는 것이 가장 큰 복이에요.": "派手ではなくても着実に積み上がる年。貯蓄・勉強・健康管理など続けることが年末に実ります。欲張らないことが一番の福。", "큰 강을 건너는 해": "大河を渡る年", "큰 나무처럼 곧고 반듯한 성품이에요. 한번 정한 목표는 끝까지 밀고 나가고, 남을 이끄는 힘이 있어요. 가끔은 굽힐 줄 아는 유연함이 더해지면 더 크게 자라요.": "大木のようにまっすぐな性格。決めた目標はやり抜き、人を導く力があります。時にしなやかさを加えればもっと大きく育ちます。", "큰 바다처럼 생각이 깊고 포용력이 커요. 지혜롭고 상황을 넓게 봐요. 생각이 너무 많아질 땐 몸을 움직여 머리를 비워 보세요.": "大海のように思慮深く包容力があります。賢く物事を広く見ます。考えすぎたら体を動かして頭を空に。", "큰 변화 없이 평온한 달이에요. 하던 일을 꾸준히 이어 가세요.": "大きな変化のない穏やかな月。続けていることを着実に。", "큰 산처럼 듬직하고 믿음직해요. 쉽게 흔들리지 않아 사람들이 기대요. 변화 앞에서 너무 오래 머뭇거리지만 않으면 돼요.": "大きな山のように頼もしく信頼できます。揺るがないので人に頼られます。変化の前で迷いすぎなければ大丈夫。", "큰돈보다 작은 돈이 꾸준히 들어와요.": "大金より小さなお金が着実に入ります。", "타고난 성품": "生まれ持った性格", "태양처럼 밝고 따뜻해요. 솔직하고 열정이 넘쳐 주변을 환하게 만들어요. 감정이 금세 타오르니 결정을 내리기 전 한 번 식혀 보세요.": "太陽のように明るく温かい人。率直で情熱的、周りを明るくします。感情が燃えやすいので、決める前に一度冷まして。", "태어난 시": "生まれた時刻", "태어난 시 모름": "時刻不明", "토끼": "卯（兎）", "토정비결": "土亭秘訣", "토정비결 · 사주팔자 · 오늘의 운세": "土亭秘訣・四柱八字・今日の運勢", "토정비결·사주·운세는 전통 계산법을 바탕으로 한 재미와 참고용이에요.": "土亭秘訣・四柱・運勢は伝統的な計算法に基づく楽しみと参考用です。", "투자보다 저축이 이로운 해예요.": "投資より貯蓄が有利な年。", "파이오니어": "パイオニア", "평온하게 흘러가는 날이에요. 꾸준히 할 일을 해 나가세요.": "穏やかに流れる日。やるべきことを着実に。", "프리미엄": "プレミアム", "프리미엄에서 몸 분석, 맞춤 음식, 운동 따라하기, 영양 가이드를 모두 쓸 수 있어요. 한 번 열면 계속 쓸 수 있어요.": "プレミアムではからだチェック、食べもの、運動、栄養ガイドをすべて使えます。一度開けばずっと使えます。", "하는 일마다 손발이 맞는 달이에요. 미뤄 둔 일을 처리하기 좋아요.": "何をしても息が合う月。後回しのことを片付けるのに好機。", "하던 일을 깊게 파고들면 길이 보여요.": "今していることを深く掘り下げれば道が見えます。", "하반기로 갈수록 운이 올라가요. 늦게 피는 꽃이 더 오래 가듯, 연말에 웃게 돼요.": "下半期になるほど運が上がります。遅咲きの花が長持ちするように、年末に笑えます。", "하반기엔 정리와 마무리에 힘쓰면 좋아요. 새 일보다 하던 일을 끝내는 게 이득이에요.": "下半期は整理と仕上げに力を。新しいことより続けていることを終える方が得。", "한 단계 올라서는 도약의 해예요. 중요한 결정을 내려야 할 순간이 오는데, 충분히 준비했다면 과감하게 건너도 좋아요. 건넌 뒤엔 넓은 들판이 기다려요.": "一段上がる飛躍の年。大事な決断の時が来ますが、十分に準備したなら思い切って渡って。渡った先には広い野が待っています。", "한 해 내내 고르게 흘러가요. 큰 굴곡 없이 꾸준함이 결실을 맺어요.": "一年を通して平らに流れます。大きな起伏なく、継続が実を結びます。", "한 해 총운": "一年の総運", "햇볕 쬐기, 즐거운 모임": "日光浴、楽しい集まり", "호랑이": "寅（虎）", "혼자보다 함께할 때 성과가 커요.": "一人より一緒の方が成果が大きい。", "환절기": "季節の変わり目", "활발하고 자유로워 어디로든 달려가요. 솔직하고 사람을 좋아해요.": "活発で自由、どこへでも駆けていきます。率直で人が好き。", "흰색": "白", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠 보세요.": "今日は感情が澄んだ日。そのエネルギーを周りに分けてみて。", "좋은 달": "良い月", "조심할 달": "注意する月", "올해의 행운": "今年の幸運", "달을 누르면 그 달의 운세를 볼 수 있어요.": "月をタップするとその月の運勢が見られます。", "← 올해 운세": "← 今年の運勢", "{0}월 운세": "{0}月の運勢", "좋은 흐름": "良い流れ", "무난한 흐름": "穏やかな流れ", "조심할 흐름": "注意の流れ", "이달에 눈여겨볼 분야": "今月注目の分野", "이달의 행운의 날: 음력 {0}일": "今月の幸運の日：旧暦{0}日", "이전 달": "前の月", "다음 달": "次の月", "좋음": "良い", "보통": "普通", "조심": "注意", "음악 켬": "音楽 ON", "음악 끔": "音楽 OFF", "올해는 '시작'이 열쇠예요. 완벽하게 준비될 때를 기다리기보다 작게 시작해서 고쳐 나가는 쪽이 운을 부르는 해예요. 새로 배우는 것과 새로 만나는 사람에게 마음을 열어 두세요.": "今年は「始めること」が鍵。完璧に準備が整うのを待つより、小さく始めて直していく方が運を呼ぶ年です。新しい学びと新しい出会いに心を開いて。", "올해는 '유연함'이 열쇠예요. 계획대로 되지 않는 일이 생겨도 다른 길을 찾으면 오히려 더 좋은 결과로 이어져요. 서두르고 싶은 마음이 들 때마다 한 번 쉬어 가는 여유를 가지세요.": "今年は「しなやかさ」が鍵。計画通りにいかなくても別の道を探せば、かえって良い結果につながります。焦りを感じたら、一息つく余裕を。", "올해는 '드러냄'이 열쇠예요. 그동안 쌓아 둔 실력과 생각을 보여 줄 기회가 찾아와요. 주목받는 만큼 겸손함을 잃지 않으면 좋은 평판이 오래 가요.": "今年は「表に出すこと」が鍵。積み重ねた実力や考えを見せる機会が訪れます。注目されるほど謙虚さを忘れなければ、良い評判が長く続きます。", "올해는 '변화'가 열쇠예요. 익숙한 자리를 떠나는 일이 생겨도 두려워하지 마세요. 바뀐 환경에서 새로운 인연과 기회가 기다리고 있어요. 큰 결정은 하나씩 차례대로 하세요.": "今年は「変化」が鍵。慣れた場所を離れることがあっても怖がらないで。新しい環境で新しい縁とチャンスが待っています。大きな決断は一つずつ。", "올해는 '꾸준함'이 열쇠예요. 눈에 띄는 변화보다 매일 반복하는 작은 습관이 큰 차이를 만들어요. 돈도 건강도 차곡차곡 모으는 만큼 연말에 든든해져요.": "今年は「継続」が鍵。目立つ変化より毎日の小さな習慣が大きな差を生みます。お金も健康もこつこつ貯めるほど、年末に心強くなります。", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "今年は「整理」が鍵。古い荷物や心のわだかまりを一つずつ下ろすほど、心身が軽くなります。空いた場所に良いことが入ってきます。", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "今年は「人」が鍵。一人で頑張るより周りと一緒の方がうまくいきます。感謝している人に先に気持ちを伝えれば、その縁が大きな福になって返ってきます。", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "今年は「勇気」が鍵。長く迷っていた挑戦に一歩踏み出す時。十分に準備したなら結果を信じて進んで。越えた先で一段成長した自分に出会えます。", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "{0}は良い気が続きます。後回しにした計画を実行するのに良い時期です。", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "{0}は大きな起伏なく穏やかに流れます。今していることを続けて。", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "{0}は少し注意が必要です。急がず、健康と出費に気を配って。", "올해의 큰 흐름": "今年の大きな流れ", "올해의 조언": "今年のアドバイス", "상반기": "上半期", "하반기": "下半期", "계절별 흐름": "季節ごとの流れ", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "今月は全体的に気が上向く時期。準備してきたことがあれば今月出してみて。小さな決断が思った以上の結果につながります。", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "周りの助けと応援が自然と集まる月。一人で抱えずに分かち合えば喜びは倍に。感謝を伝えるほど運が固まります。", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "決めたことに勢いがつく月。ただ順調な時ほど基本を守ることが大切。約束と締め切りを守れば良い流れが来月まで続きます。", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "新しいチャンスの扉が開く月。普段なら見過ごす誘いや出会いにも耳を傾けて。迷いより好奇心が今月の幸運を呼びます。", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "大きな出来事なく穏やかに流れる月。こんな時こそ日々のリズムを守るのが一番のケア。よく食べよく眠るだけで来月の力が蓄えられます。", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "良いことと残念なことが半々に混ざる月。どちらかに気を取られすぎずバランスを取れば無難に過ぎます。小さな達成を自分で褒めてあげて。", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "静かに足場を固めるのに良い月。目立つ変化より後回しにした整理や勉強に向いています。今まいた種が次の季節に芽を出します。", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "流れが平らな分、心にゆとりを持てる月。大切な人と過ごしたり軽い散歩で体をほぐして。穏やかな心が次のチャンスに気づかせてくれます。", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "少し急ぐと物事がすれ違いやすい月。大事な決断は一日二日置いて考えを整理してから。ゆっくり進むことが実は一番の近道です。", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "心身が疲れやすい月。無理な予定を減らし、しっかり休む時間を必ず取って。自分が穏やかなら周りも穏やかになります。", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "ひと言、一円に気をつければ無難に過ごせる月。感情が高ぶったらすぐ答えずひと呼吸。出費は本当に必要なところだけに。", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "小さなミスが起きやすい月なので丁寧さが必要。書類や約束はもう一度確認し、移動は安全第一で。気をつけた分だけ来月が軽くなります。", "이달의 운세": "今月の運勢", "분야별 흐름": "分野別の流れ", "이달의 한마디": "今月のひと言", "이달의 행운": "今月のラッキー", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "生年月日と写真はPiアカウントに保存されるので、アプリを閉じてもそのまま残ります。", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "生年月日はPiアカウントにだけ保存されます。運勢は楽しみと参考用で、健康情報は医療相談の代わりにはなりません。", "궁합": "相性", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "二人の気がどれだけ合うかを見ます", "상대방 정보": "相手の情報", "상대 이름 (선택)": "相手の名前（任意）", "궁합 보기": "相性を見る", "다른 사람과 보기": "別の人と見る", "띠 궁합": "干支の相性", "성향 궁합": "性格の相性", "오행 궁합": "五行の相性", "두 사람에게 주는 조언": "二人へのアドバイス", "두 띠는 서로 힘을 북돋아 주는 삼합 관계예요. 함께 있으면 일이 술술 풀리고 마음이 잘 통해요.": "二人の干支は互いを高め合う三合の関係。一緒にいると物事がスムーズに進み、心がよく通じます。", "두 띠는 서로 끌어당기는 육합 관계예요. 처음 만나도 편안하고, 오래 함께할수록 정이 깊어져요.": "二人の干支は引き合う六合の関係。初対面から居心地がよく、長く一緒にいるほど情が深まります。", "두 띠는 서로 마주 보는 충 관계예요. 성향이 달라 부딪힐 때도 있지만, 서로를 인정하면 오히려 좋은 자극이 돼요.": "二人の干支は向かい合う冲の関係。性格の違いでぶつかることもありますが、認め合えば良い刺激になります。", "같은 띠라 생각과 리듬이 비슷해요. 말하지 않아도 통하는 부분이 많아 편안한 사이예요.": "同じ干支なので考え方やリズムが似ています。言わなくても通じることが多い、楽な間柄です。", "두 띠는 크게 부딪히지도 끌리지도 않는 무난한 관계예요. 함께 보내는 시간만큼 신뢰가 쌓여요.": "大きくぶつかりも引かれもしない無難な関係。一緒に過ごす時間だけ信頼が積み重なります。", "두 사람 모두 같은 {0} 기운을 타고났어요. 친구처럼 편하게 통하지만, 둘 다 고집을 부릴 땐 한 발씩 양보하세요.": "二人とも同じ{0}の気を持って生まれました。友達のように通じ合えますが、二人とも意地を張る時は一歩ずつ譲って。", "나의 {0} 기운이 상대의 {1} 기운을 키워 주는 관계예요. 내가 아낌없이 챙겨 주고 상대는 그 덕에 빛나요. 가끔은 나도 돌봄을 받으세요.": "あなたの{0}の気が相手の{1}の気を育てる関係。あなたが惜しみなく尽くし、相手はそのおかげで輝きます。時には自分も甘えて。", "상대의 {0} 기운이 나의 {1} 기운을 키워 주는 관계예요. 상대가 든든한 버팀목이 되어 주니 고마움을 자주 표현하세요.": "相手の{0}の気があなたの{1}の気を育てる関係。相手が頼もしい支えになってくれるので、感謝をよく伝えて。", "나의 {0} 기운이 상대의 {1} 기운을 다스리는 관계예요. 내가 이끄는 쪽이 되기 쉬우니 상대의 뜻을 먼저 물어보세요.": "あなたの{0}の気が相手の{1}の気を導く関係。あなたが引っ張る側になりやすいので、相手の気持ちを先に聞いて。", "상대의 {0} 기운이 나의 {1} 기운을 다스리는 관계예요. 상대가 방향을 잡아 주는 편이에요. 서운할 땐 마음을 솔직하게 말하세요.": "相手の{0}の気があ 管理は弱いかもしれないので、几帳面な仲間と組むと成果がぐっと良くなります。", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "仕事・学業運：決断が早く実行力があるので、現場・営業・起業などスピードが大事な仕事で輝きます。一つを長く抱えるより、短く集中して結果を見るやり方が合っています。大事な決断の前は一晩寝かせる習慣で失敗がぐっと減ります。", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "恋愛・人間関係運：愛するときは惜しみなく与えるタイプなので、相手は深い安心感を覚えます。長年の友人や家族が人生の大きな支えになる手相です。思いほど返ってこないと寂しさが大きくなるので、望みを言葉にする練習を。", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "恋愛・人間関係運：簡単には心を開かないけれど、一度信じたら最後まで守る義理堅いタイプです。派手なイベントより、変わらぬ真心のこもった気遣いで愛を表します。時々もう少し表現すると、相手はあなたの気持ちをずっと大きく感じます。", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "恋愛・人間関係運：人を惹きつける魅力があり縁が多く、集まりでは自然と中心になります。多くの縁の中から本当の味方を見極める目を育てると、関係がずっと強くなります。新しい出会いから良い機会が来るので、心を開いておきましょう。", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "財運・仕事運：一つのことを深く掘って成果を出すタイプなので、経歴を積むほど収入も安定して増えます。こつこつ貯金や長期投資のように、時間が味方になる方法が合います。専門性を示す資格や実績を残しておくと、チャンスが早く来ます。", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "財運・仕事運：財運が後になるほど大きくなる流れなので、焦らないことが鍵です。これまで積んだ経験と人脈が大きな実りとなって返ってきて、遅く始めたことで大成功することも。今は大きく稼ぐより、無駄な出費を防ぐことに集中しましょう。", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "財運・仕事運：決まった月給より、実力に応じて稼ぐ仕組みで財運が活きます。副業・フリーランス・小さな起業など、複数の収入源を作る方法が合います。収入が不安定になりやすいので、生活費数か月分は必ず緊急資金として貯めておきましょう。", "👑 리더형 손금": "👑 リーダー型の手相", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "生命線と運命線がどちらもはっきりした手は、昔から大きな組織を率いる経営者や指導者に多いと伝えられています。体力と推進力に支えられ、一度決めた目標を最後までやり抜く力があります。人々は自然とあなたの判断を信じてついてくるので、責任ある立場を避けないで。一人で全部背負わず、信頼できる人に任せると運がさらに大きくなります。", "🎨 예술가형 손금": "🎨 芸術家型の手相", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "頭脳線が下へやわらかく曲がる手は、伝統的に芸術家・作家・デザイナーに多いと言われます。人が気づかないものを感じ取り表現する感覚に優れています。好きなことに没頭すると時間を忘れますが、その没頭こそがあなたの財産です。感情の波が来たら文章や絵にすると、かえって良い作品が生まれます。", "🌳 대기만성형 손금": "🌳 大器晩成型の手相", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "運命線が手のひらの中ほどから始まる手は、遅く咲いて大きく成功する大器晩成型と呼ばれます。若い頃の試行錯誤がすべて後のための肥やしになる手相です。人と速さを比べるより、自分のペースを守ることが最も大切です。中年以降は安定した財と尊敬を共に得る流れが見えます。", "🧭 개척자형 손금": "🧭 開拓者型の手相", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "線が分かれたり自由に伸びたりする手は、決まった道より新しい道を切り開く開拓者型です。転職・引っ越し・挑戦のような変化の中で、むしろチャンスをつかむタイプです。安定ばかり追うと息苦しくなりやすいので、小さくても新しい試みを続けて。いろいろな経験が一つにまとまった瞬間、人並み外れた成果が生まれます。", "♟️ 전략가형 손금": "♟️ 戦略家型の手相", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "頭脳線がまっすぐ伸びる手は、計算と判断が正確な戦略家・参謀型です。大きな絵を描き、リスクを先読みする力があるので、どんな組織でも欠かせない人になります。前に出るより、後ろで戦略を練る役割で真価を発揮します。時には計算を手放して直感を信じると、思わぬ幸運が訪れます。", "⚖️ 균형형 손금": "⚖️ バランス型の手相", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "どの線にも偏らない手は、いろいろな分野を満遍なくこなすバランス型です。人・仕事・健康をまんべんなく気にかける感覚があり、どんな環境にもよく適応します。一つに集中する時期を決めて力を集めると、隠れた才能が大きく表れます。こつこつ積み重ねるほど、周りの信頼と運が一緒に大きくなる手相です。", "생활패턴 수정": "生活パターン修正", "생활패턴을 저장했어요": "生活パターンを保存しました", "나의 하루 생활패턴": "私の一日の生活パターン", "나의 손금": "私の手相", "{0} 손바닥을 화면 가득 쫙 펴서 찍어 주세요": "{0}の手のひらを画面いっぱいに広げて撮ってください", "광고 보고 +{0} 토큰": " 己开路。经历越多，越能找到适合自己的事。", "손금 전체에 힘이 고르게 실려 있어요. 지금 하는 일을 꾸준히 밀고 나가면 좋은 결과가 따라와요.": "整体手相力量均衡。坚持正在做的事，好结果自然会来。", "강한 선과 부드러운 선이 섞여 균형이 좋은 손이에요. 장점은 살리고 약한 부분은 생활 습관으로 채워 보세요.": "强线与柔线交织，是平衡的手。发挥长处，用生活习惯补足短处。", "손금은 살면서 조금씩 바뀌어요. 지금의 흐름은 변화와 가능성이 크다는 뜻이니, 새로운 도전을 두려워하지 마세요.": "手相会随人生慢慢变化。现在的走势意味着变化与可能性很大，别害怕新挑战。", "왼손": "左手", "오른손": "右手", "{0} 손바닥을 손 모양 안에 맞춰 주세요": "请把{0}掌心对准手形框", "전통적으로 남자는 왼손, 여자는 오른손을 봐요": "传统上男看左手，女看右手", "카메라를 켤 수 없어요. 아래 버튼으로 사진을 찍어 주세요.": "无法打开相机，请用下方按钮拍照。", "찍기": "拍照", "{0}으로 보기": "改看{0}", "손바닥 윤곽을 맞추는 중…": "正在对齐手掌轮廓…", "생명선 찾는 중…": "正在寻找生命线…", "두뇌선 찾는 중…": "正在寻找智慧线…", "감정선 찾는 중…": "正在寻找感情线…", "운명선 찾는 중…": "正在寻找事业线…", "스캔 완료!": "扫描完成！", "사진 속 점선 위치의 내 손금과 가장 비슷한 모양을 골라 주세요": "请对照照片中虚线位置，选出与你手相最接近的形状", "손금 풀이 보기": "查看手相解读", "나의 손금 풀이": "我的手相解读", "한마디": "一句话", "손금 풀이는 전통 해석을 바탕으로 한 재미와 참고용이에요. 사진은 휴대폰 안에서만 쓰이고 서버에 저장되지 않아요.": "手相解读基于传统说法，仅供娱乐参考。照片只在手机内使用，不会保存到服务器。", "다시 찍기": "重新拍", "아직 고르지 않은 손금이 있어요: {0}": "还有未选择的掌纹：{0}", "스캔 결과로 손금 모양을 자동으로 골랐어요. 내 손과 다르면 아래에서 바꿀 수 있어요": "已根据扫描结果自动选择掌纹形状。如与你的手不同，可在下方修改。", "보고 싶은 손금을 눌러 보세요": "点击想看的掌纹", "총평": "总评", "닮은 손금 유형": "相似的手相类型", "한눈에 보기": "一览", "건강·체력운: 타고난 체력이 좋아 바쁜 시기에도 쉽게 지치지 않아요. 다만 몸을 믿고 무리하는 습관이 생기기 쉬우니, 한 달에 한 번은 푹 쉬는 날을 정해 두세요. 걷기나 등산처럼 오래 꾸준히 하는 운동이 이 손금과 가장 잘 맞아요.": "健康·体力运：天生体力好，忙碌时也不易疲惫。但容易仗着身体好而勉强自己，每月请安排一天彻底休息。散步、登山这类长期坚持的运动最适合这种手相。", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "健康·体力运：一次性用光精力就容易透支，因此短而频繁的休息节奏很重要。温热的饮食和规律的睡眠是最好的补药。记录状态好坏的日子，很快就能找到适合自己的调理方法。", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "健康·体力运：环境变化时，身体也会经历适应期。搬家、新工作等重大变化时，头几周要特别注意睡眠和饮食。顺利度过后，反而会养成比以前更健康的生活习惯。", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "事业·学业运：把目标拆细、逐一完成的方式很适合你。在策划、管理、会计、IT等需要精确的领域赢得信任，负责的事情会越来越大。别等万事俱备而错过机会，准备到七成就开始吧。", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "事业·学业运：比起有标准答案的工作，你的真本事体现在创造新事物上。灵感一来就记下的习惯会成为巨大财富。日程管理可能较弱，与细心的伙伴搭档，成果会好得多。", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "事业·学业运：决断快、执行力强，在现场、销售、创业等讲究速度的工作中大放异彩。与其长时间钻研一件事，不如短时间集中、快速看到结果。重大决定前先睡一晚再看，失误会大大减少。", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "爱情·人际运：爱一个人时毫无保留，对方会感到深深的安心。多年的老友和家人是你人生的重要支柱。付出得不到同等回报时容易失落，试着把期望说出口吧。", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "爱情·人际运：不轻易敞开心扉，但一旦信任便守护到底，很讲义气。比起华丽的惊喜，更习惯用持久真诚的关心表达爱。偶尔多表达一点，对方会更强烈地感受到你的心意。", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "爱情·人际运：有吸引人的魅力，人缘广，在聚会中自然成为焦点。在众多缘分中练就识别真心朋友的眼光，关系会更加稳固。新的相遇会带来好机会，请保持开放的心。", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "财运·事业运：你擅长深耕一个领域取得成果，资历越深收入越稳定增长。定期储蓄、长期投资等让时间站在你这边的方式最合适。留下能证明专业能力的证书或记录，机会会来得更快。", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "财运·事业运：财运越往后越旺，不急躁是关键。一路积累的经验与人脉会结出丰硕成果，甚至在晚开始的事上大获成功。现在与其想着大赚，不如专注堵住漏财的口子。", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "财运·事业运：比起固定薪水，按能力赚钱的方式更能激活你的财运。副业、自由职业、小型创业等多渠道收入方式很适合你。收入可能起伏不定，务必存下几个月的生活费作为应急金。", "👑 리더형 손금": "👑 领袖型手相", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "生命线和事业线都清晰的手，自古相传多见于带领大型组织的企业家和领导者。有体力和魄力支撑，一旦定下目标就能坚持到底。人们自然会信任并追随你的判断，不要回避承担责任的位置。别一个人扛下一切，把事情分给信得过的人，运势会更旺。", "🎨 예술가형 손금": "🎨 艺术家型手相", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "智慧线向下柔和弯曲的手，传统上被认为多见于艺术家、作家和设计师。你善于感受并表达别人看不到的东西。一旦沉浸在喜欢的事里就忘了时间，而这份专注正是你的财富。情绪起伏时，把它写下来或画出来，反而能成就好作品。", "🌳 대기만성형 손금": "🌳 大器晚成型手相", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "事业线从掌心中部开始的手被称为大器晚成型，晚开却成大器。年轻时的试错都会成为日后的养分。与其和别人比速度，坚持自己的节奏最重要。中年以后可见财富稳定、受人尊敬的运势。", "🧭 개척자형 손금": "🧭 开拓者型手相", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "掌纹分叉或自由延伸的手，属于不走老路、开辟新路的开拓者型。你往往能在跳槽、搬家、挑战等变化中抓住机会。一味追求安稳容易感到憋闷，哪怕很小也请持续尝试新事物。当各种经历汇聚成一的那一刻，就会迎来非凡的成就。", "♟️ 전략가형 손금": "♟️ 战略家型手相", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "智慧线笔直延伸的手，属于计算和判断精准的战略家、参谋型。你能把握全局、预判风险，在任何组织里都是不可或缺的人。比起站在台前，在幕后运筹帷幄更能展现真本领。偶尔放下算计、相信直觉，会有意外的好运降临。", "⚖️ 균형형 손금": "⚖️ 均衡型手相", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "不偏向任何一条线的手，是能均衡兼顾多个领域的均衡型。你懂得同时照顾人际、工作和健康，在任何环境都能很好地适应。确定一个专注的时期集中力量，隐藏的才能就会大放光彩。坚持越久，周围的信任和运势就一起越旺。", "생활패턴 수정": "修改生活习惯", "생활패턴을 저장했어요": "已保存生活习惯", "나의 하루 생활패턴": "我的日常生活习惯", "나의 손금": "我的手相", "{0} 손바닥을 화면 가득 쫙 펴서 찍어 주세요": "请把{0}手掌张开铺满画面后拍照", "광고 보고 +{0} 토큰": "看广告 +{0} 代币", "오늘 {0}/{1}회": "今天 {0}/{1}次", "광고 준비 중이에요": "广告准备中", "오늘 광고 보상을 다 받았어요": "今天的广告奖励已领完", "광고를 불러오지 못했어요. 잠시 후 다시 해 주세요.": "广告加载失败，请稍后再试。", "광고 시청 확인이 안 됐어요": "无法确认广告观看", "토큰 순위": "代币排行", "나의 순위": "我的排名", "{0}위": "第{0}名", "아직 순위가 없어요": "暂无排名", "매달 토큰을 많이 모은 분께 건강용품을 드릴 예정이에요. Pi 정책에 따라 바뀌거나 빠질 수 있어요.": "我们计划每月向代币最多的用户赠送健康用品。可能根据Pi政策调整或取消  해": "Năm trời quang sau mưa", "사람 복이 많은 해예요. 귀한 인연을 만나거나 오래된 관계가 더 깊어져요. 혼자 끙끙 앓기보다 도움을 청하면 생각보다 쉽게 풀려요.": "Năm có phúc về con người. Gặp mối duyên quý hoặc quan hệ cũ thêm gắn bó. Đừng ôm một mình, nhờ giúp đỡ sẽ dễ hơn bạn nghĩ.", "사람·애정": "Người & tình cảm", "사주는 절기를 날짜로 단순화해 계산한 참고용 결과예요. 절기 경계일에 태어났다면 실제와 한 글자 다를 수 있어요.": "Tứ trụ được tính đơn giản theo ngày tiết khí, chỉ để tham khảo. Nếu sinh đúng ngày giao tiết, có thể lệch một chữ.", "사주팔자": "Tứ trụ", "산처럼 든든히 쌓는 해": "Năm tích lũy vững như núi", "상반기엔 가까운 사람의 도움이 크게 작용해요. 가족과 오랜 친구를 먼저 챙기세요.": "Nửa đầu năm, người thân giúp đỡ nhiều. Hãy quan tâm gia đình và bạn cũ trước.", "상반기엔 돈이 들어오고 나가는 일이 잦아요. 계획 없는 지출만 줄이면 남는 게 있어요.": "Nửa đầu năm tiền ra vào nhiều. Bớt chi tiêu không kế hoạch sẽ còn dư.", "상반기엔 말 한마디가 운을 바꿔요. 부드럽게 말할수록 일이 술술 풀려요.": "Nửa đầu năm, một lời nói có thể đổi vận. Nói càng nhẹ nhàng, việc càng suôn.", "상반기엔 바쁘게 움직일수록 기회가 와요. 집에만 있기보다 밖으로 나가 보세요.": "Nửa đầu năm càng năng động càng nhiều cơ hội. Hãy ra ngoài thay vì ở nhà.", "상반기엔 새 사람을 만나는 일이 많아요. 첫인상보다 시간을 두고 지켜보세요.": "Nửa đầu năm gặp nhiều người mới. Đừng vội đánh giá qua ấn tượng đầu.", "상반기엔 속도를 늦추고 몸과 마음을 돌볼 때예요. 쉼이 곧 준비예요.": "Nửa đầu năm hãy chậm lại, chăm sóc thân tâm. Nghỉ ngơi cũng là chuẩn bị.", "새로운 시작에 힘이 실리는 달이에요. 배움을 시작해도 좋아요.": "Khởi đầu mới có đà. Bắt đầu học điều mới cũng tốt.", "새싹이 땅을 뚫는 해": "Năm mầm non nhú khỏi đất", "생각이 많아지는 달이에요. 메모를 하면 머리가 맑아져요.": "Nhiều suy nghĩ. Ghi chép giúp đầu óc minh mẫn.", "생년월일시로 나의 오행(목·화·토·금·수) 기운을 읽고, 한 해와 오늘의 흐름을 알려 주는 앱이에요.": "Đọc ngũ hành (Mộc, Hỏa, Thổ, Kim, Thủy) từ ngày giờ sinh, cho biết dòng chảy của năm và của hôm nay.", "생년월일은 내 폰에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "Ngày sinh chỉ lưu trên điện thoại. Vận mệnh để giải trí, tham khảo; thông tin sức khỏe không thay thế tư vấn y tế.", "생년월일은 이 폰에만 저장되고 서버로 보내지 않아요.": "Ngày sinh chỉ lưu trên điện thoại này, không gửi lên máy chủ.", "생년월일을 한 번만 넣으면 모든 운세에 쓰여요.": "Nhập ngày sinh một lần, dùng cho mọi quẻ.", "생활패턴으로 보는 부위별  đầu. Chính nghĩa và ấm áp.", "운동 따라하기": "Tập theo", "원숭이": "Thân (Khỉ)", "월주": "Tháng", "위는 천간, 아래는 지지예요. 일주의 천간 <b>{0}</b>이 바로 \"나\"를 뜻해요.": "Hàng trên là thiên can, dưới là địa chi. Can ngày <b>{0}</b> chính là \"bạn\".", "윗사람의 눈에 띄는 기회가 있어요.": "Có cơ hội được cấp trên chú ý.", "윤{0}월 {1}일": "{1}/{0} nhuận", "윤달이에요": "Là tháng nhuận", "음력": "Âm lịch", "음력 날짜를 확인해 주세요.": "Vui lòng kiểm tra ngày âm lịch.", "의리 있고 정직해요. 한번 맺은 인연을 소중히 지켜요.": "Trọng nghĩa, thật thà. Trân trọng mối quan hệ đã có.", "이사·이직·새로운 만남처럼 자리가 바뀌는 기운이 강한 해예요. 변화가 두렵게 느껴져도 대부분 좋은 쪽으로 이어져요. 다만 한꺼번에 여러 가지를 바꾸지는 마세요.": "Năm nhiều đổi thay—chuyển nhà, đổi việc, gặp người mới. Thay đổi đáng sợ nhưng phần lớn dẫn đến điều tốt. Chỉ đừng đổi quá nhiều cùng lúc.", "이슬과 시냇물처럼 맑고 섬세해요. 직감이 좋고 공감 능력이 뛰어나요. 마음이 쉽게 흔들릴 땐 믿을 만한 사람과 이야기를 나눠 보세요.": "Trong trẻo, tinh tế như sương và suối. Trực giác tốt, giàu đồng cảm. Khi dao động, hãy tâm sự với người tin cậy.", "이용약관": "Điều khoản", "일·학업": "Công việc & học tập", "일간": "Can ngày", "일주": "Ngày", "작은 서운함은 그때그때 풀어 두세요.": "Chuyện buồn nhỏ nên giải tỏa ngay.", "작은 약속을 잘 지키면 다음 달에 복으로 돌아와요.": "Giữ lời hứa nhỏ, tháng sau sẽ thành phúc.", "작은 재물이 들어오는 달이에요. 들어온 만큼 조금은 모아 두세요.": "Có chút tiền vào. Hãy để dành một ít.", "잘 다듬어진 보석처럼 깔끔하고 감각이 뛰어나요. 완성도를 중요하게 여기고 아름다운 것을 알아봐요. 완벽하지 않아도 괜찮다고 스스로에게 말해 주세요.": "Gọn gàng như viên ngọc đã mài, rất có gu. Coi trọng sự hoàn thiện. Hãy tự nhủ không hoàn hảo cũng được.", "잘 맞는 사람": "Người hợp với bạn", "잠을 잘 자는 것이 올해 최고의 관리예요.": "Ngủ ngon là cách chăm sóc tốt nhất năm nay.", "재치 있고 눈치가 빨라 어디서든 살아남는 힘이 있어요. 알뜰하고 기회를 잘 잡아요.": "Lanh trí, nhạy bén, sống tốt ở mọi nơi. Tiết kiệm, giỏi nắm cơ hội.", "저장하고 시작하기": "Lưu và bắt đầu", "정리 정돈, 깊은 호흡": "dọn dẹp, hít thở sâu", "정리 정돈을 하면 운이 트이는 달이에요.": "Dọn dẹp sẽ mở vận.", "조용히 실력을 다지기 좋은 달이에요. 서두를 필요 없어요.": "Tháng tốt để lặng lẽ trau dồi. Không cần vội.", "좋은 방향": "Hướng tốt", "좋은 소개가 들어오는 해예요.": "Sẽ có người giới thiệu tốt.", "쥐": "Tý (Chuột)", "지난해의 고민과 얽힌 일이 하나씩 풀려 가는 해예요. 상반기에 정리를 잘 해 두면 하반기엔 마음이 한결 가벼워져요. 미뤄 둔 연락이나 정리를 먼저 해 보세요.": "Lo âu, vướng mắc năm ngoái lần lượt được gỡ. Nửa đầu dọn dẹp tốt thì nửa sau nhẹ lòng. Bắt đầu từ việc liên lạc, dọn dẹp còn dang dở.", "지혜롭고 차분하며 직감이 뛰어나요. 깊이 생각한 뒤 움직여 실수가 적어요.": "Thông minh, điềm tĩnh, trực giác tốt. Nghĩ kỹ rồi làm nên ít sai.", "처음": "Trang đầu", "촛불처럼 은은하게 곁을 밝히는 사람이에요. 세심하고 배려가 깊어 마음을 잘 읽어요. 속으로 삭이기보다 마음을 표현할수록 빛이 커져요.": "Như ngọn nến lặng lẽ soi sáng xung quanh. Tinh tế, chu đáo, hiểu lòng người. Bày tỏ cảm xúc sẽ khiến bạn tỏa sáng hơn.", "충동구매와 보증은 피하세요. 지키는 게 버는 거예요.": "Tránh mua sắm bốc đồng và bảo lãnh. Giữ được là kiếm được.", "충분한 잠, 물 자주 마시기": "ngủ đủ, uống nhiều nước", "크게 요란하진 않아도 차곡차곡 쌓이는 해예요. 저축, 공부, 건강 관리처럼 꾸준히 하는 일이 연말에 든든한 결과로 돌아와요. 욕심내지 않는 것이 가장 큰 복이에요.": "Không ồn ào nhưng tích lũy từng chút. Tiết kiệm, học tập, giữ sức khỏe sẽ cho kết quả vững vào cuối năm. Không tham là phúc lớn nhất.", "큰 강을 건너는 해": "Năm vượt sông lớn", "큰 나무처럼 곧고 반듯한 성품이에요. 한번 정한 목표는 끝까지 밀고 나가고, 남을 이끄는 힘이 있어요. 가끔은 굽힐 줄 아는 유연함이 더해지면 더 크게 자라요.": "Ngay thẳng như cây lớn. Đã đặt mục tiêu là theo đến cùng, có khả năng dẫn dắt. Thêm chút mềm dẻo sẽ lớn mạnh hơn.", "큰 바다처럼 생각이 깊고 포용력이 커요. 지혜롭고 상황을 넓게 봐요. 생각이 너무 많아질 땐 몸을 움직여 머리를 비워 보세요.": "Sâu sắc, bao dung như biển cả. Khôn ngoan, nhìn xa. Khi nghĩ quá nhiều, hãy vận động cho đầu óc thông thoáng.", "큰 변화 없이 평온한 달이에요. 하던 일을 꾸준히 이어 가세요.": "Tháng bình yên, không biến động lớn. Cứ đều đặn việc đang làm.", "큰 산처럼 듬직하고 믿음직해요. 쉽게 흔들리지 않아 사람들이 기대요. 변화 앞에서 너무 오래 머뭇거리지만 않으면 돼요.": "Vững chãi, đáng tin như núi lớn. Không dễ lung lay nên mọi người dựa vào. Chỉ đừng chần chừ quá lâu trước thay đổi.", "큰돈보다 작은 돈이 꾸준히 들어와요.": "Tiền nhỏ vào đều hơn tiền lớn.", "타고난 성품": "Tính cách bẩm sinh", "태양처럼 밝고 따뜻해요. 솔직하고 열정이 넘쳐 주변을 환하게 만들어요. 감정이 금세 타오르니 결정을 내리기 전 한 번 식혀 보세요.": "Rực rỡ, ấm áp như mặt trời. Thẳng thắn, nhiệt huyết, làm sáng xung quanh. Cảm xúc dễ bùng, hãy bình tĩnh trước khi quyết.", "태어난 시": "Giờ sinh", "태어난 시 모름": "Không rõ giờ sinh", "토끼": "Mão (Mèo)", "토정비결": "Thổ Đình Bí Quyết", "토정비결 · 사주팔자 · 오늘의 운세": "Thổ Đình · Tứ trụ · Vận hôm nay", "토정비결·사주·운세는 전통 계산법을 바탕으로 한 재미와 참고용이에요.": "Thổ Đình, Tứ trụ và vận hạn dựa trên cách tính truyền thống, chỉ để giải trí, tham khảo.", "투자보다 저축이 이로운 해예요.": "Năm này tiết kiệm có lợi hơn đầu tư.", "파이오니어": "Pioneer", "평온하게 흘러가는 날이에요. 꾸준히 할 일을 해 나가세요.": "Một ngày bình yên. Cứ đều đặn làm việc của mình.", "프리미엄": "Cao cấp", "프리미엄에서 몸 분석, 맞춤 음식, 운동 따라하기, 영양 가이드를 모두 쓸 수 있어요. 한 번 열면 계속 쓸 수 있어요.": "Gói cao cấp mở Phân tích cơ thể, Món ăn, Bài tập và Dinh dưỡng. Mở một lần, dùng mãi.", "하는 일마다 손발이 맞는 달이에요. 미뤄 둔 일을 처리하기 좋아요.": "Việc gì cũng ăn ý. Tốt để giải quyết việc tồn đọng.", "하던 일을 깊게 파고들면 길이 보여요.": "Đào sâu việc đang làm, con đường sẽ hiện ra.", "하반기로 갈수록 운이 올라가요. 늦게 피는 꽃이 더 오래 가듯, 연말에 웃게 돼요.": "Vận lên dần về nửa cuối năm. Hoa nở muộn bền lâu, cuối năm bạn sẽ cười.", "하반기엔 정리와 마무리에 힘쓰면 좋아요. 새 일보다 하던 일을 끝내는 게 이득이에요.": "Nửa cuối năm hãy tập trung hoàn tất. Làm xong việc cũ lợi hơn bắt đầu việc mới.", "한 단계 올라서는 도약의 해예요. 중요한 결정을 내려야 할 순간이 오는데, 충분히 준비했다면 과감하게 건너도 좋아요. 건넌 뒤엔 넓은 들판이 기다려요.": "Năm bứt phá lên một bậc. Sẽ có quyết định quan trọng—đã chuẩn bị kỹ thì cứ mạnh dạn vượt qua. Bên kia là cánh đồng rộng.", "한 해 내내 고르게 흘러가요. 큰 굴곡 없이 꾸준함이 결실을 맺어요.": "Cả năm đều đặn, không thăng trầm lớn, sự bền bỉ sẽ đơm hoa.", "한 해 총운": "Tổng vận cả năm", "햇볕 쬐기, 즐거운 모임": "tắm nắng, gặp gỡ vui vẻ", "호랑이": "Dần (Hổ)", "혼자보다 함께할 때 성과가 커요.": "Cùng nhau sẽ đạt nhiều hơn một mình.", "환절기": "giao mùa", "활발하고 자유로워 어디로든 달려가요. 솔직하고 사람을 좋아해요.": "Năng động, tự do, đi khắp nơi. Thẳng thắn, quý người.", "흰색": "Trắng", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠 보세요.": "Hôm nay cảm xúc trong trẻo. Hãy lan tỏa năng lượng ấy.", "좋은 달": "Tháng tốt", "조심할 달": "Tháng cần cẩn thận", "올해의 행운": "May mắn năm nay", "달을 누르면 그 달의 운세를 볼 수 있어요.": "Chạm vào tháng để xem vận tháng đó.", "← 올해 운세": "← Cả năm", "{0}월 운세": "Vận tháng {0}", "좋은 흐름": "Thuận lợi", "무난한 흐름": "Bình ổn", "조심할 흐름": "Cẩn thận", "이달에 눈여겨볼 분야": "Lĩnh vực cần để ý", "이달의 행운의 날: 음력 {0}일": "Ngày may mắn: mùng {0} âm lịch", "이전 달": "Tháng trước", "다음 달": "Tháng sau", "좋음": "Tốt", "보통": "Bình thường", "조심": "Cẩn thận", "음악 켬": "Nhạc bật", "음악 끔": "Nhạc tắt", "올해는 '시작'이 열쇠예요. 완벽하게 준비될 때를 기다리기보다 작게 시작해서 고쳐 나가는 쪽이 운을 부르는 해예요. 새로 배우는 것과 새로 만나는 사람에게 마음을 열어 두세요.": "Năm nay, chìa khóa là 'bắt đầu'. Thay vì chờ chuẩn bị hoàn hảo, hãy bắt đầu từ nhỏ và điều chỉnh dần—đó là cách gọi may mắn. Hãy mở lòng với điều mới và người mới.", "올해는 '유연함'이 열쇠예요. 계획대로 되지 않는 일이 생겨도 다른 길을 찾으면 오히려 더 좋은 결과로 이어져요. 서두르고 싶은 마음이 들 때마다 한 번 쉬어 가는 여유를 가지세요.": "Năm nay, chìa khóa là 'linh hoạt'. Dù mọi việc không theo kế hoạch, tìm lối khác lại đem kết quả tốt hơn. Mỗi khi thấy vội, hãy cho mình khoảng nghỉ.", "올해는 '드러냄'이 열쇠예요. 그동안 쌓아 둔 실력과 생각을 보여 줄 기회가 찾아와요. 주목받는 만큼 겸손함을 잃지 않으면 좋은 평판이 오래 가요.": "Năm nay, chìa khóa là 'thể hiện'. Cơ hội đến để bạn cho thấy năng lực và ý tưởng tích lũy. Càng được chú ý càng khiêm tốn, danh tiếng tốt sẽ bền lâu.", "올해는 '변화'가 열쇠예요. 익숙한 자리를 떠나는 일이 생겨도 두려워하지 마세요. 바뀐 환경에서 새로운 인연과 기회가 기다리고 있어요. 큰 결정은 하나씩 차례대로 하세요.": "Năm nay, chìa khóa là 'thay đổi'. Đừng sợ rời chỗ quen thuộc. Môi trường mới có duyên mới và cơ hội mới. Quyết định lớn hãy làm từng cái một.", "올해는 '꾸준함'이 열쇠예요. 눈에 띄는 변화보다 매일 반복하는 작은 습관이 큰 차이를 만들어요. 돈도 건강도 차곡차곡 모으는 만큼 연말에 든든해져요.": "Năm nay, chìa khóa là 'bền bỉ'. Thói quen nhỏ mỗi ngày tạo khác biệt lớn hơn thay đổi rầm rộ. Tiền bạc và sức khỏe tích từng chút, cuối năm sẽ vững vàng.", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "Năm nay, chìa khóa là 'buông bỏ'. Càng đặt xuống gánh cũ và khúc mắc trong lòng, thân tâm càng nhẹ. Chỗ trống sẽ đón điều tốt đến.", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "Năm nay, chìa khóa là 'con người'. Cùng người xung quanh sẽ suôn sẻ hơn tự mình gắng sức. Bày tỏ lòng biết ơn trước, mối duyên ấy sẽ thành phúc lớn.", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "Năm nay, chìa khóa là 'can đảm'. Đã đến lúc bước tới thử thách bạn lưỡng lự bấy lâu. Đã chuẩn bị kỹ thì tin vào kết quả mà đi. Vượt qua rồi, bạn sẽ gặp một phiên bản trưởng thành hơn.", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "Vào {0}, khí tốt kéo dài. Thời điểm tốt để thực hiện kế hoạch còn dang dở.", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "Vào {0}, mọi việc trôi êm không biến động lớn. Cứ đều đặn việc đang làm.", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "Vào {0}, có chút điều cần cẩn thận. Đừng vội, hãy giữ sức khỏe và chi tiêu.", "올해의 큰 흐름": "Dòng chảy lớn của năm", "올해의 조언": "Lời khuyên cho năm nay", "상반기": "Nửa đầu năm", "하반기": "Nửa cuối năm", "계절별 흐름": "Theo từng mùa", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "Tháng này nhìn chung năng lượng đi lên. Nếu bạn đang chuẩn bị điều gì, hãy đưa ra trong tháng này. Một quyết định nhỏ có thể dẫn tới kết quả lớn hơn bạn nghĩ.", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "Sự giúp đỡ và cổ vũ tự nhiên tụ lại. Chia sẻ thay vì ôm một mình, niềm vui sẽ nhân đôi. Càng bày tỏ lòng biết ơn, vận càng vững.", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "Việc đã quyết sẽ tăng tốc. Nhưng càng suôn sẻ càng phải giữ điều cơ bản. Giữ lời hứa và hạn chót thì dòng chảy tốt sẽ kéo sang tháng sau.", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "Cánh cửa cơ hội mới mở ra. Hãy lắng nghe cả lời mời hay cuộc gặp mà bình thường bạn bỏ qua. Sự tò mò chứ không phải do dự sẽ mang may mắn.", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "Tháng trôi êm không có biến cố lớn. Những lúc thế này, giữ nhịp sinh hoạt là cách chăm sóc tốt nhất. Ăn ngon ngủ đủ đã là tích sức cho tháng sau.", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "Điều vui và điều tiếc đan xen đều nhau. Đừng quá nghiêng về bên nào, giữ cân bằng sẽ qua êm. Hãy tự khen những thành tựu nhỏ.", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "Tháng tốt để lặng lẽ củng cố nền móng. Hợp với việc dọn dẹp, học hành còn dang dở hơn là thay đổi lớn. Hạt giống gieo bây giờ sẽ nảy mầm mùa sau.", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "Dòng chảy bằng phẳng nên hãy cho lòng chút thong thả. Dành thời gian cho người thân hoặc đi dạo nhẹ. Tâm trạng thư thái giúp bạn nhận ra cơ hội tiếp theo.", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "Hơi vội là việc dễ lệch nhau. Quyết định quan trọng hãy hoãn một hai ngày để sắp xếp suy nghĩ. Đi chậm lại hóa ra là đường nhanh nhất.", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "Thân tâm dễ mệt. Giảm hẹn hò quá sức và nhớ nghỉ ngơi đủ. Mình thoải mái thì người xung quanh cũng thoải mái.", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "Cẩn thận từng lời, từng đồng thì tháng sẽ qua êm. Khi cảm xúc dâng lên, hít thở trước khi đáp. Chỉ chi vào chỗ thật cần.", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "Dễ có sai sót nhỏ nên cần tỉ mỉ. Kiểm tra lại giấy tờ, hẹn hò và ưu tiên an toàn khi di chuyển. Càng cẩn thận, tháng sau càng nhẹ.", "이달의 운세": "Vận tháng này", "분야별 흐름": "Theo lĩnh vực", "이달의 한마디": "Lời nhắn tháng này", "이달의 행운": "May mắn tháng này", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "Ngày sinh và ảnh được lưu vào tài khoản Pi, đóng ứng dụng vẫn còn nguyên.", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "Ngày sinh chỉ lưu trong tài khoản Pi của bạn. Vận mệnh để giải trí, tham khảo; thông tin sức khỏe không thay thế tư vấn y tế.", "궁합": "Hợp nhau", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "Xem năng lượng hai người hợp nhau đến đâu", "상대방 정보": "Thông tin người ấy", "상대 이름 (선택)": "Tên người ấy (tùy chọn)", "궁합 người tin tưởng thì rất sâu sắc.", "마음이 넓고 여러 사람과 잘 어울려요. 다양한 인연 속에서 좋은 기회를 만나는 손금이에요.": "Bạn rộng lượng, hòa hợp với nhiều người. Nhiều mối duyên mang đến cơ hội tốt.", "일찍부터 자기 길이 분명한 편이에요. 한 분야를 꾸준히 밀고 나가면 인정받고 자리를 잡는 손금이에요.": "Bạn sớm rõ con đường của mình. Kiên trì một lĩnh vực sẽ được công nhận và có chỗ đứng.", "늦게 피는 꽃처럼 중년 이후에 운이 크게 열리는 흐름이에요. 지금 쌓는 경험이 나중에 큰 힘이 돼요.": "Như hoa nở muộn, vận may mở rộng từ trung niên. Kinh nghiệm tích lũy bây giờ sẽ thành sức mạnh lớn.", "정해진 틀보다 스스로 길을 만드는 자유로운 타입이에요. 여러 경험을 해 볼수록 나에게 맞는 일을 찾게 돼요.": "Bạn tự do, tự mở đường thay vì theo khuôn mẫu. Càng trải nghiệm càng tìm ra việc hợp mình.", "손금 전체에 힘이 고르게 실려 있어요. 지금 하는 일을 꾸준히 밀고 나가면 좋은 결과가 따라와요.": "Sức mạnh trải đều trên bàn tay. Kiên trì việc đang làm thì kết quả tốt sẽ đến.", "강한 선과 부드러운 선이 섞여 균형이 좋은 손이에요. 장점은 살리고 약한 부분은 생활 습관으로 채워 보세요.": "Đường mạnh và mềm đan xen, bàn tay cân bằng. Phát huy điểm mạnh, bù điểm yếu bằng thói quen.", "손금은 살면서 조금씩 바뀌어요. 지금의 흐름은 변화와 가능성이 크다는 뜻이니, 새로운 도전을 두려워하지 마세요.": "Chỉ tay thay đổi dần theo cuộc sống. Hiện tại báo hiệu nhiều thay đổi và tiềm năng, đừng ngại thử thách mới.", "왼손": "trái", "오른손": "phải", "{0} 손바닥을 손 모양 안에 맞춰 주세요": "Đặt lòng bàn tay {0} vào trong khung bàn tay", "전통적으로 남자는 왼손, 여자는 오른손을 봐요": "Theo truyền thống, nam xem tay trái, nữ xem tay phải", "카메라를 켤 수 없어요. 아래 버튼으로 사진을 찍어 주세요.": "Không mở được camera. Hãy dùng nút bên dưới để chụp.", "찍기": "Chụp", "{0}으로 보기": "Xem tay {0}", "손바닥 윤곽을 맞추는 중…": "Đang căn viền lòng bàn tay…", "생명선 찾는 중…": "Đang tìm đường đời…", "두뇌선 찾는 중…": "Đang tìm đường trí đạo…", "감정선 찾는 중…": "Đang tìm đường tình cảm…", "운명선 찾는 중…": "Đang tìm đường vận mệnh…", "스캔 완료!": "Quét xong!", "사진 속 점선 위치의 내 손금과 가장 비슷한 모양을 골라 주세요": "So với vị trí đường chấm trên ảnh, chọn hình gần nhất với chỉ tay của bạn", "손금 풀이 보기": "Xem lời giải", "나의 손금 풀이": "Lời giải chỉ tay của tôi", "한마디": "Lời nhắn", "손금 풀이는 전통 해석을 바탕으로 한 재미와 참고용이에요. 사진은 휴대폰 안에서만 쓰이고 서버에 저장되지 않아요.": "Lời giải dựa trên cách hiểu truyền thống, mang tính giải trí và tham khảo. Ảnh chỉ dùng trong điện thoại, không lưu lên máy chủ.", "다시 찍기": "Chụp lại", "아직 고르지 않은 손금이 있어요: {0}": "Còn đường chưa chọn: {0}", "스캔 결과로 손금 모양을 자동으로 골랐어요. 내 손과 다르면 아래에서 바꿀 수 있어요": "Đã tự chọn hình chỉ tay theo kết quả quét. Nếu khác tay bạn, hãy đổi bên dưới.", "보고 싶은 손금을 눌러 보세요": "Chạm vào đường muốn xem", "총평": "Tổng quan", "닮은 손금 유형": "Kiểu chỉ tay của bạn", "한눈에 보기": "Tóm tắt", "건강·체력운: 타고난 체력이 좋아 바쁜 시기에도 쉽게 지치지 않아요. 다만 몸을 믿고 무리하는 습관이 생기기 쉬우니, 한 달에 한 번은 푹 쉬는 날을 정해 두세요. 걷기나 등산처럼 오래 꾸준히 하는 운동이 이 손금과 가장 잘 맞아요.": "Sức khỏe & thể lực: Thể lực bẩm sinh tốt, lúc bận cũng ít mệt. Nhưng dễ ỷ vào sức mà quá sức, hãy dành một ngày nghỉ trọn vẹn mỗi tháng. Đi bộ hay leo núi đều đặn hợp nhất với chỉ tay này.", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Sức khỏe & thể lực: Dồn sức một lúc là nhanh cạn, nên nhịp nghỉ ngắn mà thường xuyên rất quan trọng. Đồ ăn ấm và giấc ngủ đều đặn là liều thuốc tốt nhất. Ghi lại ngày khỏe và ngày mệt, bạn sẽ sớm thấy cách chăm sóc riêng.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Sức khỏe & thể lực: Khi môi trường thay đổi, cơ thể cũng cần thời gian thích nghi. Lúc chuyển nhà hay đổi việc, mấy tuần đầu hãy đặc biệt chú ý giấc ngủ và bữa ăn. Vượt qua rồi, thói quen lành mạnh hơn sẽ hình thành.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Công việc & học tập: Chia nhỏ mục tiêu rồi hoàn thành từng phần rất hợp với bạn. Bạn được tin tưởng ở lĩnh vực cần chính xác như kế hoạch, quản lý, kế toán, IT, và trách nhiệm ngày càng lớn. Đừng chờ hoàn hảo mà lỡ cơ hội, chuẩn bị 70% là bắt đầu.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Công việc & học tập: Tài năng thật của bạn lộ ra khi tạo cái mới hơn là việc có sẵn đáp án. Thói quen ghi ngay ý tưởng sẽ thành tài sản lớn. Quản lý lịch có thể là điểm yếu, nên bắt cặp với người tỉ mỉ sẽ cho kết quả tốt hơn nhiều.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Công việc & học tập: Quyết nhanh, làm giỏi nên bạn tỏa sáng ở việc cần tốc độ như hiện trường, kinh doanh, khởi nghiệp. Tập trung ngắn rồi xem kết quả hợp hơn ôm một việc lâu. Trước quyết định lớn, hãy ngủ một đêm rồi xem lại, sai sót sẽ giảm hẳn.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Tình yêu & quan hệ: Khi yêu bạn cho đi hết lòng nên người ấy rất yên tâm. Bạn bè lâu năm và gia đình là chỗ dựa lớn trong đời. Khi không được đáp lại tương xứng bạn dễ tủi thân, hãy tập nói ra mong muốn của mình.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Tình yêu & quan hệ: Bạn không dễ mở lòng, nhưng đã tin thì giữ trọn nghĩa đến cùng. Bạn thể hiện tình yêu bằng sự quan tâm đều đặn, chân thành hơn là màn hào nhoáng. Thỉnh thoảng thể hiện thêm chút nữa, người ấy sẽ cảm nhận rõ hơn nhiều.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Tình yêu & quan hệ: Bạn có sức hút nên nhiều mối duyên, tự nhiên thành trung tâm buổi gặp. Rèn con mắt nhận ra ai thật lòng sẽ giúp quan hệ bền chặt hơn. Cơ hội tốt đến từ những cuộc gặp mới, hãy giữ lòng rộng mở.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Tài lộc & sự nghiệp: Bạn đào sâu một lĩnh vực để thành công, nên kinh nghiệm càng dày thu nhập càng tăng ổn định. Tiết kiệm đều hay đầu tư dài hạn, nơi thời gian đứng về phía bạn, rất hợp. Lưu giữ chứng chỉ hay thành tích chứng minh chuyên môn, cơ hội sẽ đến sớm hơn.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Tài lộc & sự nghiệp: Tài lộc càng về sau càng lớn, nên điều quan trọng là đừng vội. Kinh nghiệm và quan hệ tích lũy sẽ thành quả ngọt, thậm chí thành công lớn với việc bắt đầu muộn. Bây giờ hãy tập trung chặn chi tiêu rò rỉ hơn là kiếm thật nhiều.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Tài lộc & sự nghiệp: Tài lộc khởi sắc khi bạn kiếm theo năng lực thay vì lương cố định. Tạo nhiều nguồn thu như làm thêm, tự do, kinh doanh nhỏ rất hợp với bạn. Thu nhập có thể thất thường, hãy để dành vài tháng sinh hoạt phí làm quỹ khẩn cấp.", "👑 리더형 손금": "👑 Chỉ tay kiểu lãnh đạo", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Bàn tay có cả đường đời và đường vận mệnh rõ ràng, từ xưa được cho là thường thấy ở doanh nhân, người lãnh đạo tổ chức lớn. Có thể lực và động lực, bạn đủ sức theo đuổi mục tiêu đến cùng. Mọi người tự nhiên tin và theo phán đoán của bạn, đừng né vị trí trách nhiệm. Thay vì gánh hết một mình, hãy giao việc cho người tin cậy, vận may sẽ càng lớn.", "🎨 예술가형 손금": "🎨 Chỉ tay kiểu nghệ sĩ", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Bàn tay có đường trí đạo cong mềm xuống dưới theo truyền thống thường thấy ở nghệ sĩ, nhà văn, nhà thiết kế. Bạn có giác quan nhạy bén để cảm nhận và thể hiện điều người khác không thấy. Đắm mình vào việc yêu thích thì quên cả thời gian, và chính sự say mê ấy là tài sản. Khi cảm xúc dâng trào, hãy viết hay vẽ ra, có khi thành tác phẩm hay.", "🌳 대기만성형 손금": "🌳 Chỉ tay kiểu thành công muộn", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "Bàn tay có đường vận mệnh bắt đầu từ giữa lòng bàn tay gọi là kiểu thành công muộn nhưng lớn. Mọi thử thách thời trẻ đều thành nền móng cho sau này. Giữ nhịp riêng quan trọng hơn so tốc độ với người khác. Từ trung niên trở đi, tài lộc ổn định và sự kính trọng cùng đến.", "🧭 개척자형 손금": "🧭 Chỉ tay kiểu tiên phong", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Bàn tay có các đường chẻ nhánh hay trải tự do là kiểu tiên phong, mở đường mới thay vì đi lối cũ. Bạn thường nắm cơ hội ngay trong thay đổi như đổi việc, chuyển nhà, thử thách. Chỉ chạy theo ổn định dễ khiến bạn ngột ngạt, hãy đều đặn thử điều mới dù nhỏ. Khoảnh khắc mọi trải nghiệm hội tụ, thành quả khác biệt sẽ đến.", "♟️ 전략가형 손금": "♟️ Chỉ tay kiểu chiến lược gia", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Bàn tay có đường trí đạo thẳng là kiểu chiến lược gia, quân sư, tính toán và phán đoán chính xác. Bạn nhìn được bức tranh lớn và đọc trước rủi ro, nên tổ chức nào cũng cần bạn. Bạn phát huy giá trị thật khi bày binh bố trận phía sau hơn là đứng trước. Thỉnh thoảng gác tính toán lại và tin trực giác, may mắn bất ngờ sẽ đến.", "⚖️ 균형형 손금": "⚖️ Chỉ tay kiểu cân bằng", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Bàn tay không nghiêng về đường nào là kiểu cân bằng, làm tốt nhiều lĩnh vực. Bạn biết chăm lo đều cả con người, công việc và sức khỏe, nên thích nghi tốt mọi môi trường. Chọn một giai đoạn để dồn sức cho một việc, tài năng ẩn sẽ bộc lộ rõ. Càng bền bỉ, niềm tin của mọi người và vận may càng lớn cùng nhau.", "생활패턴 수정": "Sửa thói quen", "생활패턴을 저장했어요": "Đã lưu thói quen sinh hoạt", "나의 하루 생활패턴": "Nếp sinh hoạt hằng ngày của tôi", "나의 손금": "Chỉ tay của tôi", "{0} 손바닥을 화면 가득 쫙 펴서 찍어 주세요": "Xòe rộng lòng bàn tay {0} cho đầy màn hình rồi chụp", "광고 보고 +{0} 토큰": "Xem quảng cáo +{0} token", "오늘 {0}/{1}회": "hôm nay {0}/{1}", "광고 준비 중이에요": "Quảng cáo sắp có", "오늘 광고 보상을 다 받았어요": "Hôm nay đã nhận hết thưởng quảng cáo", "광고를 불러오지 못했어요. 잠시 후 다시 해 주세요.": "Không tải được quảng cáo. Vui lòng thử lại sau.", "광고 시청 확인이 안 됐어요": "Không xác nhận được lượt xem", "토큰 순위": "Bảng xếp hạng token", "나의 순위": "Hạng của tôi", "{0}위": "#{0}", "아직 순위가 없어요": "Chưa có xếp hạng", "매달 토큰을 많이 모은 분께 건강용품을 드릴 예정이에요. Pi 정책에 따라 바뀌거나 빠질 수 있어요.": "Mỗi tháng sẽ tặng đồ dùng sức khỏe cho người có nhiều token nhất. Có thể thay đổi hoặc hủy theo chính sách của Pi.", "항목당 0.1π 또는 100토큰": "Mỗi mục 0.1π hoặc 100 token", "100 토큰으로 열기": "Mở bằng 100 token", "토큰 순위 보기": "Xem xếp hạng token", "광고를 끝까지 봐야 토큰을 받아요": "Xem hết quảng cáo để nhận token"}, "fr": {"생년월일": "Date de naissance", "성별": "Sexe", "여성": "Femme", "남성": "Homme", "모름": "Inconnu", "목": "Bois", "화": "Feu", "토": "Terre", "금": "Métal", "수": "Eau", "목(木)": "Bois(木)", "화(火)": "Feu(火)", "토(土)": "Terre(土)", "금(金)": "Métal(金)", "수(水)": "Eau(水)", "나무는 하루아침에 자라지 않아도 매일 해를 향해 갑니다. 오늘도 그 방향이면 충분해요.": "Un arbre ne pousse pas en une nuit, pourtant il se tourne chaque jour vers le soleil. Vous tourner de ce côté aujourd'hui suffit.", "오늘 내디딘 한 걸음이 내일의 새싹이 돼요. 서두르지 않아도 괜찮아요.": "Le pas fait aujourd'hui devient la pousse de demain. Inutile de vous presser.", "굽은 가지도 결국 빛을 찾아 자랍니다. 지금 모습 그대로 괜찮아요.": "Même une branche tordue finit par pousser vers la lumière. Vous êtes bien tel que vous êtes.", "숲은 서로의 그늘을 나눠 크는 법이에요. 오늘 누군가에게 그늘이 되어주세요.": "Une forêt grandit en partageant son ombre. Soyez l'ombre de quelqu'un aujourd'hui.", "작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.": "Une petite étincelle réchauffe toute une pièce. Votre sourire d'aujourd'hui est cette étincelle.", "타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.": "Ce n'est pas seulement ce qui flambe qui éclaire. Éclairer doucement ceux qui vous entourent est aussi une force.", "마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.": "Si votre cœur s'est refroidi, respirez profondément une fois. L'étincelle est toujours là.", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "Un grand éclat de rire aujourd'hui change la température de toute votre journée.", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "La terre soutient tout en silence. Avoir tenu bon aujourd'hui est déjà beaucoup.", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "Un chemin tassé lentement va le plus loin. Un pas aujourd'hui suffit.", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "Un bon repas ancre votre journée. Nourrissez-vous bien aujourd'hui.", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "Quelqu'un de profondément enraciné sourit même quand le vent souffle. Faites confiance à vos racines.", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "Le métal ne devient fort qu'en passant par le feu. Votre épreuve actuelle vous affine.", "맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.": "Le son d'une cloche claire porte loin. Un mot offert aujourd'hui atteindra les gens de la même façon.", "깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.": "Respirez profondément et ouvrez les épaules. Quand la poitrine s'ouvre, le cœur suit.", "정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.": "Un bureau rangé et un esprit rangé se ressemblent. Rangez une seule chose aujourd'hui et vous vous sentirez plus léger.", "물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.": "L'eau contourne l'obstacle et se repose quand elle s'accumule. Le repos fait aussi partie du courant.", "깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.": "L'eau profonde coule sans bruit. Une journée à avancer tranquillement est belle aussi.", "오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.": "Ne vous pressez pas aujourd'hui, laissez-vous couler. Au bout du compte, la mer accueille toutes les eaux.", "따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.": "Une tasse d'eau chaude détend le cœur. Fai 대로 하세요.": "Cette année, la clé est le « changement ». N'ayez pas peur de quitter vos repères. De nouvelles rencontres et opportunités vous attendent. Prenez les grandes décisions une à une.", "올해는 '꾸준함'이 열쇠예요. 눈에 띄는 변화보다 매일 반복하는 작은 습관이 큰 차이를 만들어요. 돈도 건강도 차곡차곡 모으는 만큼 연말에 든든해져요.": "Cette année, la clé est la « constance ». Les petites habitudes quotidiennes comptent plus que les grands changements. Plus vous économisez, argent comme santé, plus vous serez serein en fin d'année.", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "Cette année, la clé est de « faire le tri ». Plus vous déposez vieux fardeaux et rancœurs, plus corps et esprit s'allègent. De bonnes choses viendront remplir l'espace libéré.", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "Cette année, la clé, ce sont les « gens ». Tout s'arrange mieux ensemble que seul. Exprimez d'abord votre gratitude, et ces liens reviendront en grandes bénédictions.", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "Cette année, la clé est le « courage ». Il est temps d'avancer vers le défi longtemps remis. Si vous êtes prêt, faites confiance et allez-y. De l'autre côté, vous découvrirez un vous qui a grandi.", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "En {0}, la bonne énergie se prolonge. Idéal pour réaliser les projets remis.", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "En {0}, tout s'écoule calmement, sans grands remous. Continuez sur votre lancée.", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "En {0}, un peu de prudence s'impose. Ne vous pressez pas, soignez santé et dépenses.", "올해의 큰 흐름": "Le grand courant de l'année", "올해의 조언": "Conseil de l'année", "상반기": "Premier semestre", "하반기": "Second semestre", "계절별 흐름": "Saison par saison", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "Ce mois-ci, l'énergie monte dans l'ensemble. Si vous préparez quelque chose, sortez-le maintenant. Une petite décision peut mener plus loin que prévu.", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "Aide et soutien affluent naturellement. Partagez plutôt que tout porter seul et la joie double. Plus vous exprimez votre gratitude, plus votre chance se renforce.", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "Vos projets prennent de la vitesse. Mais plus tout va bien, plus les bases comptent. Tenez promesses et échéances et le bon courant se prolongera.", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "Une porte vers de nouvelles occasions s'ouvre. Écoutez même les propositions que vous ignoreriez d'habitude. La curiosité, pas l'hésitation, attire la chance.", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "Un mois tranquille sans grands événements. C'est le moment de garder votre rythme quotidien. Bien manger et bien dormir suffit à préparer le mois suivant.", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "Bons et moins bons moments se mêlent à parts égales. Ne penchez pas trop d'un côté ; l'équilibre vous fera passer sans encombre. Félicitez-vous pour les petites réussites.", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "Un bon mois pour consolider en silence. Plutôt que de grands changements, rangez et étudiez ce que vous aviez remis. Les graines semées germeront à la saison suivante.", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "Le courant est calme : laissez de l'espace à votre cœur. Passez du temps avec vos proches ou faites une petite promenade. Un esprit détendu repère la prochaine chance.", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "Un peu de précipitation et tout s'emmêle. Reportez les grandes décisions d'un jour ou deux pour y voir clair. Aller lentement est en fait le plus rapide.", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "Corps et esprit se fatiguent vite. Réduisez les engagements lourds et prenez vraiment le temps de vous reposer. Quand vous allez bien, votre entourage aussi.", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "Attention à chaque mot et à chaque euro et le mois passera en douceur. Quand l'émotion monte, respirez avant de répondre. Ne dépensez que pour l'essentiel.", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "Les petites erreurs arrivent vite : soyez minutieux. Revérifiez documents et rendez-vous, et pensez sécurité en déplacement. Plus de prudence, un mois prochain plus léger.", "이달의 운세": "Ce mois-ci", "분야별 흐름": "Par domaine", "이달의 한마디": "Le mot du mois", "이달의 행운": "Porte-bonheur du mois", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "Votre date de naissance et votre photo sont enregistrées sur votre compte Pi et restent même après fermeture.", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "Votre date de naissance n'est enregistrée que sur votre compte Pi. Les prédictions sont ludiques ; la santé ne remplace pas un médecin.", "궁합": "Compatibilité", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "Voyez si vos énergies s'accordent", "상대방 정보": "Ses infos", "상대 이름 (선택)": "Son prénom (facultatif)", "궁합 보기": "Voir la compatibilité", "다른 사람과 보기": "Essayer quelqu'un d'autre", "띠 궁합": "Signes", "성향 궁합": "Caractères", "오행 궁합": "Cinq Éléments", "두 사람에게 주는 조언": "Conseil pour vous deux", "두 띠는 서로 힘을 북돋아 주는 삼합 관계예요. 함께 있으면 일이 술술 풀리고 마음이 잘 통해요.": "Vos signes forment une « triple harmonie » qui vous élève. Ensemble, tout roule et vous vous comprenez bien.", "두 띠는 서로 끌어당기는 육합 관계예요. 처음 만나도 편안하고, 오래 함께할수록 정이 깊어져요.": "Vos signes forment une « harmonie à six » qui vous attire. À l'aise dès le début, le lien s'approfondit avec le temps.", "두 띠는 서로 마주 보는 충 관계예요. 성향이 달라 부딪힐 때도 있지만, 서로를 인정하면 오히려 좋은 자극이 돼요.": "Vos signes sont opposés. Vos différences peuvent s'entrechoquer, mais s'accepter devient une belle stimulation.", "같은 띠라 생각과 리듬이 비슷해요. 말하지 않아도 통하는 부분이 많아 편안한 사이예요.": "Même signe : pensée et rythme semblables. Beaucoup se comprend sans mots, une relation confortable.", "두 띠는 크게 부딪히지도 끌리지도 않는 무난한 관계예요. 함께 보내는 시간만큼 신뢰가 쌓여요.": "Vos signes ne s'opposent ni ne s'attirent fortement : un lien stable. La confiance grandit avec le temps partagé.", "두 사람 모두 같은 {0} 기운을 타고났어요. 친구처럼 편하게 통하지만, 둘 다 고집을 부릴 땐 한 발씩 양보하세요.": "Vous êtes tous deux nés avec la même énergie {0}. Vous vous entendez comme des amis, mais quand vous vous entêtez, cédez chacun un pas.", "나의 {0} 기운이 상대의 {1} 기운을 키워 주는 관계예요. 내가 아낌없이 챙겨 주고 상대는 그 덕에 빛나요. 가끔은 나도 돌봄을 받으세요.": "Votre énergie {0} nourrit son énergie {1}. Vous donnez sans compter et l'autre brille grâce à vous. Laissez-vous aussi chouchouter.", "상대의 {0} 기운이 나의 {1} 기운을 키워 주는 관계예요. 상대가 든든한 버팀목이 되어 주니 고마움을 자주 표현하세요.": "Son énergie {0} nourrit votre énergie {1}. C'est un soutien solide : exprimez souvent votre gratitude.", "나의 {0} 기운이 상대의 {1} 기운을 다스리는 관계예요. 내가 이끄는 쪽이 되기 쉬우니 상대의 뜻을 먼저 물어보세요.": "Votre énergie {0} guide son énergie {1}. Vous menez souvent : demandez d'abord son avis.", "상대의 {0} 기운이 나의 {1} 기운을 다스리는 관계예요. 상대가 방향을 잡아 주는 편이에요. 서운할 땐 마음을 솔직하게 말하세요.": "Son énergie {0} guide votre énergie {1}. L'autre fixe souvent le cap. Si vous êtes blessé, dites-le franchement.", "상대에게 많은 {0} 기운이 나에게는 부족한 기운이라, 함께 있으면 상대가 나를 채워 줘요.": "L'énergie {0} qu'il ou elle a en abondance vous manque : ensemble, l'autre vous complète.", "나에게 많은 {0} 기운이 상대에게는 부족한 기운이라, 함께 있으면 내가 상대를 채워 줘요.": "L'énergie {0} que vous avez en abondance lui manque : ensemble, vous le ou la complétez.", "두 사람의 오행 분포가 비슷해서 같은 것을 좋아하고 같은 것에 지치기 쉬워요. 함께 새로운 경험을 해 보세요.": "Vos Cinq Éléments se ressemblent : vous aimez et vous lassez des mêmes choses. Vivez ensemble des expériences nouvelles.", "전체적으로 잘 어울리는 두 사람이에요. 지
