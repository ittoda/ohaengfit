 !", "사진 속 점선 위치의 내 손금과 가장 비슷한 모양을 골라 주세요": "Comparez chaque pointillé à votre paume et choisissez la forme la plus proche", "손금 풀이 보기": "Voir mon interprétation", "나의 손금 풀이": "Ma lecture de la main", "한마디": "En un mot", "손금 풀이는 전통 해석을 바탕으로 한 재미와 참고용이에요. 사진은 휴대폰 안에서만 쓰이고 서버에 저장되지 않아요.": "L'interprétation repose sur la tradition, à titre ludique. Votre photo reste sur votre téléphone et n'est jamais enregistrée sur notre serveur.", "다시 찍기": "Reprendre", "아직 고르지 않은 손금이 있어요: {0}": "Une ligne n'est pas encore choisie : {0}", "스캔 결과로 손금 모양을 자동으로 골랐어요. 내 손과 다르면 아래에서 바꿀 수 있어요": "Nous avons choisi vos lignes d'après l'analyse. Si quelque chose diffère, modifiez-le ci-dessous.", "보고 싶은 손금을 눌러 보세요": "Touchez une ligne pour la lire", "총평": "Bilan", "닮은 손금 유형": "Votre type de main", "한눈에 보기": "En un coup d'œil", "건강·체력운: 타고난 체력이 좋아 바쁜 시기에도 쉽게 지치지 않아요. 다만 몸을 믿고 무리하는 습관이 생기기 쉬우니, 한 달에 한 번은 푹 쉬는 날을 정해 두세요. 걷기나 등산처럼 오래 꾸준히 하는 운동이 이 손금과 가장 잘 맞아요.": "Santé et vitalité : vous avez une endurance naturelle et vous fatiguez peu, même en période chargée. Mais à trop compter sur votre corps, vous risquez d'en faire trop : prévoyez un vrai jour de repos par mois. Les efforts longs et réguliers, comme la marche ou la randonnée, vous conviennent le mieux.", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Santé et vitalité : vous vous épuisez vite si vous dépensez tout d'un coup ; un rythme de pauses courtes et fréquentes est essentiel. Repas chauds et sommeil régulier sont vos meilleurs remèdes. Notez vos bons et mauvais jours : votre méthode personnelle apparaîtra vite.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Santé et vitalité : quand votre environnement change, votre corps traverse lui aussi une période d'adaptation. Lors d'un déménagement ou d'un nouveau travail, soignez particulièrement sommeil et repas les premières semaines. Une fois le cap passé, de meilleures habitudes s'installent.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Travail et études : découper vos objectifs et les cocher un à un vous réussit. Vous inspirez confiance dans les domaines exigeants comme la planification, la gestion, la comptabilité ou l'informatique, et vos responsabilités grandissent. N'attendez pas d'être parfaitement prêt : lancez-vous à 70 %.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Travail et études : votre vrai talent s'exprime en créant du neuf plutôt qu'en suivant des réponses toutes faites. Noter vos idées sur-le-champ deviendra un précieux atout. La gestion du planning peut être un point faible : faites équipe avec quelqu'un de méticuleux.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Travail et études : rapide à décider et efficace, vous brillez là où la vitesse compte : terrain, vente, création d'entreprise. Des sprints de concentration avec résultats rapides vous conviennent mieux que de longs efforts. Avant une grande décision, dormez dessus : vos erreurs diminueront nettement.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Amour et relations : vous donnez sans compter, si bien que l'autre se sent en profonde sécurité. Vos amis de longue date et votre famille sont de solides piliers. Vous pouvez être blessé quand on ne vous rend pas autant : exercez-vous à exprimer vos attentes.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Amour et relations : vous ne vous ouvrez pas facilement, mais une fois en confiance vous êtes fidèle jusqu'au bout. Vous montrez votre amour par une attention constante et sincère plutôt que par des gestes spectaculaires. Exprimez-vous un peu plus et l'autre le ressentira bien davantage.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Amour et relations : votre charme attire, vous avez beaucoup de liens et devenez naturellement le centre des réunions. Apprendre à reconnaître vos vrais alliés rendra vos relations bien plus solides. De belles occasions naissent des nouvelles rencontres : gardez le cœur ouvert.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Argent et carrière : vous creusez un domaine en profondeur, si bien que vos revenus progressent régulièrement avec l'expérience. Les approches où le temps joue pour vous, comme l'épargne régulière ou l'investissement à long terme, vous conviennent. Gardez certificats et réalisations qui prouvent votre expertise : les occasions viendront plus vite.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Argent et carrière : votre chance financière grandit avec le temps, la clé est de ne pas vous presser. Votre expérience et votre réseau reviendront en belles récompenses, et vous pourriez réussir dans un projet commencé tard. Pour l'instant, concentrez-vous sur les fuites d'argent plutôt que sur les gros gains.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Argent et carrière : votre chance financière s'éveille quand vous gagnez selon vos capacités plutôt qu'avec un salaire fixe. Multiplier les sources de revenus — activité secondaire, freelance, petite entreprise — vous convient. Les revenus peuvent fluctuer : mettez absolument de côté quelques mois de dépenses en réserve.", "👑 리더형 손금": "👑 Main de leader", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Depuis toujours, on dit qu'une main aux lignes de vie et de destin bien nettes appartient aux fondateurs et dirigeants de grandes organisations. Porté par votre endurance et votre élan, vous menez vos objectifs jusqu'au bout. Les gens font naturellement confiance à votre jugement : n'évitez pas les postes à responsabilité. Plutôt que de tout porter seul, déléguez à des personnes de confiance et votre chance grandira encore.", "🎨 예술가형 손금": "🎨 Main d'artiste", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Traditionnellement, une main dont la ligne de tête s'incurve doucement vers le bas est fréquente chez les artistes, écrivains et designers. Vous savez ressentir et exprimer ce que d'autres ne voient pas. Plongé dans ce que vous aimez, vous oubliez le temps — et cette immersion est votre trésor. Quand les émotions déferlent, couchez-les sur papier ou en dessin : de belles œuvres peuvent naître.", "🌳 대기만성형 손금": "🌳 Main d'éclosion tardive", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "Une main dont la ligne de destin naît au milieu de la paume est dite « à éclosion tardive » : elle fleurit tard mais réussit grandement. Tous les tâtonnements de la jeunesse deviennent le terreau de la suite. Garder votre propre rythme compte plus que vous comparer aux autres. Après la quarantaine se dessine un flux de richesse stable et de respect.", "🧭 개척자형 손금": "🧭 Main de pionnier", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Une main aux lignes fourchues ou libres appartient au pionnier, qui ouvre de nouvelles voies plutôt que de suivre les tracés établis. Vous saisissez les occasions au cœur du changement : nouveau travail, déménagement, défi. Ne viser que la stabilité risque de vous étouffer : continuez à tenter des choses nouvelles, même petites. Le jour où vos expériences convergeront, vous accomplirez quelque chose de remarquable.", "♟️ 전략가형 손금": "♟️ Main de stratège", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Une main à la ligne de tête droite appartient au stratège ou conseiller, précis dans ses calculs et jugements. Vous voyez la vue d'ensemble et anticipez les risques, ce qui vous rend indispensable partout. Vous révélez votre vraie valeur en orchestrant en coulisses plutôt qu'en première ligne. De temps en temps, laissez les calculs et fiez-vous à votre intuition : une chance inattendue peut surgir.", "⚖️ 균형형 손금": "⚖️ Main équilibrée", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Une main qui ne penche vers aucune ligne en particulier appartient au type équilibré, à l'aise dans de nombreux domaines. Vous savez prendre soin à la fois des gens, du travail et de la santé, et vous vous adaptez partout. Choisissez une période pour vous concentrer sur une seule chose : vos talents cachés éclateront. Plus votre constance grandit, plus la confiance des autres et votre chance augmentent ensemble.", "생활패턴 수정": "Modifier mes habitudes", "생활패턴을 저장했어요": "Vos habitudes sont enregistrées", "나의 하루 생활패턴": "Mon quotidien", "나의 손금": "Ma main", "{0} 손바닥을 화면 가득 쫙 펴서 찍어 주세요": "Écartez bien votre paume {0} pour remplir l'écran, puis prenez la photo", "광고 보고 +{0} 토큰": "Regarder une pub +{0} jetons", "오늘 {0}/{1}회": "aujourd'hui {0}/{1}", "광고 준비 중이 es", "달을 누르면 그 달의 운세를 볼 수 있어요.": "Tippe auf einen Monat für seine Deutung.", "← 올해 운세": "← Jahr", "{0}월 운세": "Monat {0}", "좋은 흐름": "Guter Fluss", "무난한 흐름": "Ruhig", "조심할 흐름": "Vorsicht", "이달에 눈여겨볼 분야": "Fokus des Monats", "이달의 행운의 날: 음력 {0}일": "Glückstag: Mondtag {0}", "이전 달": "Vorheriger", "다음 달": "Nächster", "좋음": "Gut", "보통": "Mittel", "조심": "Vorsicht", "음악 켬": "Musik an", "음악 끔": "Musik aus", "올해는 '시작'이 열쇠예요. 완벽하게 준비될 때를 기다리기보다 작게 시작해서 고쳐 나가는 쪽이 운을 부르는 해예요. 새로 배우는 것과 새로 만나는 사람에게 마음을 열어 두세요.": "Dieses Jahr ist 'Anfangen' der Schlüssel. Statt auf perfekte Vorbereitung zu warten, bringt kleines Anfangen und Nachbessern Glück. Öffne dich für Neues und neue Menschen.", "올해는 '유연함'이 열쇠예요. 계획대로 되지 않는 일이 생겨도 다른 길을 찾으면 오히려 더 좋은 결과로 이어져요. 서두르고 싶은 마음이 들 때마다 한 번 쉬어 가는 여유를 가지세요.": "Dieses Jahr ist 'Flexibilität' der Schlüssel. Auch wenn etwas nicht nach Plan läuft, führt ein anderer Weg zu besseren Ergebnissen. Wenn du dich gehetzt fühlst, gönn dir eine Pause.", "올해는 '드러냄'이 열쇠예요. 그동안 쌓아 둔 실력과 생각을 보여 줄 기회가 찾아와요. 주목받는 만큼 겸손함을 잃지 않으면 좋은 평판이 오래 가요.": "Dieses Jahr ist 'Sich zeigen' der Schlüssel. Du bekommst die Chance, dein Können und deine Ideen zu zeigen. Bleib bescheiden, wenn die Aufmerksamkeit wächst, dann hält dein guter Ruf.", "올해는 '변화'가 열쇠예요. 익숙한 자리를 떠나는 일이 생겨도 두려워하지 마세요. 바뀐 환경에서 새로운 인연과 기회가 기다리고 있어요. 큰 결정은 하나씩 차례대로 하세요.": "Dieses Jahr ist 'Veränderung' der Schlüssel. Hab keine Angst, Vertrautes zu verlassen. In neuer Umgebung warten neue Kontakte und Chancen. Triff große Entscheidungen nacheinander.", "올해는 '꾸준함'이 열쇠예요. 눈에 띄는 변화보다 매일 반복하는 작은 습관이 큰 차이를 만들어요. 돈도 건강도 차곡차곡 모으는 만큼 연말에 든든해져요.": "Dieses Jahr ist 'Beständigkeit' der Schlüssel. Kleine tägliche Gewohnheiten bewirken mehr als große Umbrüche. Je mehr du ansparst, Geld wie Gesundheit, desto sicherer bist du zum Jahresende.", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "Dieses Jahr ist 'Loslassen' der Schlüssel. Je mehr alte Lasten und Groll du ablegst, desto leichter werden Körper und Geist. In den freien Raum zieht Gutes ein.", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "Dieses Jahr sind 'Menschen' der Schlüssel. Gemeinsam läuft es besser als allein. Zeig zuerst deine Dankbarkeit, dann kehren diese Bindungen als großer Segen zurück.", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "Dieses Jahr ist 'Mut' der Schlüssel. Zeit für den Schritt zur lange aufgeschobenen Herausforderung. Bist du vorbereitet, vertrau darauf und geh voran. Danach triffst du ein gewachsenes Ich.", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "Im {0} hält die gute Energie an. Gute Zeit, Aufgeschobenes umzusetzen.", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "Im {0} fließt alles ruhig ohne große Schwankungen. Mach einfach weiter.", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "Im {0} ist etwas Vorsicht geboten. Nichts überstürzen, achte auf Gesundheit und Ausgaben.", "올해의 큰 흐름": "Der große Fluss des Jahres", "올해의 조언": "Rat für das Jahr", "상반기": "Erste Jahreshälfte", "하반기": "Zweite Jahreshälfte", "계절별 흐름": "Jahreszeit für Jahreszeit", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "Diesen Monat steigt die Energie insgesamt. Hast du etwas vorbereitet, hol es jetzt hervor. Eine kleine Entscheidung kann mehr bewirken als gedacht.", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "Hilfe und Zuspruch sammeln sich wie von selbst. Teile statt alles allein zu tragen, dann verdoppelt sich die Freude. Je mehr Dank du zeigst, desto fester wird dein Glück.", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "Deine Pläne nehmen Fahrt auf. Doch je besser es läuft, desto wichtiger sind die Grundlagen. Halte Zusagen und Fristen ein, dann trägt der Schwung in den nächsten Monat.", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "Eine Tür zu neuen Chancen geht auf. Hör auch bei Angeboten hin, die du sonst übergehen würdest. Neugier statt Zögern bringt das Glück des Monats.", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "Ein ruhiger Monat ohne große Ereignisse. Gerade jetzt ist dein Alltagsrhythmus die beste Pflege. Gut essen und schlafen sammelt Kraft für den nächsten Monat.", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "Schönes und Enttäuschendes halten sich die Waage. Häng dich nicht zu sehr an eine Seite, dann geht es glatt vorbei. Lob dich für kleine Erfolge.", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "Ein guter Monat, um still Fundamente zu legen. Statt großer Veränderung passt Aufräumen und Lernen von Aufgeschobenem. Was du jetzt säst, keimt in der nächsten Jahreszeit.", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "Der Fluss ist ruhig – gönn deinem Herzen Raum. Verbring Zeit mit Lieben oder lockere dich bei einem Spaziergang. Ein entspannter Geist erkennt die nächste Chance.", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "Ein wenig Eile verwirrt leicht die Dinge. Verschieb große Entscheidungen um ein, zwei Tage. Langsam ist eigentlich der schnellste Weg.", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "Körper und Geist ermüden leicht. Reduziere anstrengende Termine und gönn dir genug Ruhe. Geht es dir gut, geht es auch deinem Umfeld gut.", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "Achte auf jedes Wort und jeden Euro, dann läuft der Monat glatt. Wenn Gefühle hochkochen, atme erst durch. Gib nur aus, wo es wirklich nötig ist.", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "Kleine Fehler passieren leicht, also sei gründlich. Prüfe Unterlagen und Termine doppelt und achte unterwegs auf Sicherheit. Je vorsichtiger, desto leichter der nächste Monat.", "이달의 운세": "Dieser Monat", "분야별 흐름": "Nach Bereich", "이달의 한마디": "Worte für den Monat", "이달의 행운": "Glücksbringer des Monats", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "Geburtsdatum und Foto werden in deinem Pi-Konto gespeichert und bleiben auch nach dem Schließen.", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "Dein Geburtsdatum wird nur in deinem Pi-Konto gespeichert. Horoskope sind zur Unterhaltung; Gesundheitsinfos ersetzen keinen Arzt.", "궁합": "Partnerschaft", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "Sieh, wie gut eure Energien zusammenpassen", "상대방 정보": "Daten des Partners", "상대 이름 (선택)": "Name (optional)", "궁합 보기": "Passung ansehen", "다른 사람과 보기": "Mit jemand anderem", "띠 궁합": "Tierzeichen", "성향 궁합": "Wesen", "오행 궁합": "Fünf Elemente", "두 사람에게 주는 조언": "Rat für euch zwei", "두 띠는 서로 힘을 북돋아 주는 삼합 관계예요. 함께 있으면 일이 술술 풀리고 마음이 잘 통해요.": "Eure Zeichen bilden eine 'Dreier-Harmonie', die euch stärkt. Zusammen läuft es glatt und ihr versteht euch gut.", "두 띠는 서로 끌어당기는 육합 관계예요. 처음 만나도 편안하고, 오래 함께할수록 정이 깊어져요.": "Eure Zeichen bilden eine 'Sechser-Harmonie', die euch anzieht. Von Anfang an vertraut, mit der Zeit immer tiefer.", "두 띠는 서로 마주 보는 충 관계예요. 성향이 달라 부딪힐 때도 있지만, 서로를 인정하면 오히려 좋은 자극이 돼요.": "Eure Zeichen stehen sich gegenüber. Unterschiede können reiben, doch wer sich annimmt, gewinnt gute Impulse.", "같은 띠라 생각과 리듬이 비슷해요. 말하지 않아도 통하는 부분이 많아 편안한 사이예요.": "Gleiches Zeichen: ähnliches Denken und ähnlicher Rhythmus. Vieles versteht ihr ohne Worte.", "두 띠는 크게 부딪히지도 끌리지도 않는 무난한 관계예요. 함께 보내는 시간만큼 신뢰가 쌓여요.": "Eure Zeichen reiben sich nicht und ziehen sich nicht stark an – eine ruhige Verbindung. Vertrauen wächst mit gemeinsamer Zeit.", "두 사람 모두 같은 {0} 기운을 타고났어요. 친구처럼 편하게 통하지만, 둘 다 고집을 부릴 땐 한 발씩 양보하세요.": "Ihr beide habt dieselbe {0}-Energie. Ihr versteht euch wie Freunde, doch wenn beide stur sind, gebt je einen Schritt nach.", "나의 {0} 기운이 상대의 {1} 기운을 키워 주는 관계예요. 내가 아낌없이 챙겨 주 undheit & Vitalität: Du hast natürliche Ausdauer und ermüdest selbst in stressigen Zeiten kaum. Wer seinem Körper zu sehr vertraut, übernimmt sich aber leicht – plane einen echten Ruhetag pro Monat. Lange, gleichmäßige Bewegung wie Gehen oder Wandern passt am besten.", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Gesundheit & Vitalität: Gibst du alles auf einmal, ist deine Energie schnell weg – ein Rhythmus mit kurzen, häufigen Pausen ist wichtig. Warmes Essen und regelmäßiger Schlaf sind deine beste Medizin. Notiere gute und schlechte Tage, dann erkennst du bald deine eigene Routine.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Gesundheit & Vitalität: Ändert sich dein Umfeld, braucht auch dein Körper eine Eingewöhnung. Achte bei Umzug oder neuem Job in den ersten Wochen besonders auf Schlaf und Essen. Danach setzen sich gesündere Gewohnheiten als zuvor durch.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Arbeit & Lernen: Ziele in kleine Schritte zu zerlegen und abzuhaken, liegt dir. In präzisen Feldern wie Planung, Management, Buchhaltung oder IT gewinnst du Vertrauen, und deine Aufgaben wachsen. Warte nicht auf Perfektion – fang an, wenn du zu 70 % bereit bist.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Arbeit & Lernen: Dein wahres Talent zeigt sich beim Erschaffen von Neuem statt bei Aufgaben mit fester Lösung. Ideen sofort zu notieren, wird zu einem großen Schatz. Terminplanung ist evtl. eine Schwäche – mit einem gewissenhaften Partner werden die Ergebnisse viel besser.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Arbeit & Lernen: Du entscheidest schnell und setzt gut um – ideal, wo Tempo zählt: Außendienst, Vertrieb, Gründung. Kurze Fokusphasen mit schnellen Ergebnissen passen besser als langes Festhalten. Schlaf vor großen Entscheidungen eine Nacht darüber, dann sinken Fehler deutlich.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Liebe & Beziehungen: Du gibst in der Liebe großzügig, dein Gegenüber fühlt sich tief geborgen. Langjährige Freunde und Familie sind starke Stützen deines Lebens. Bekommst du weniger zurück, kann das kränken – übe, deine Wünsche auszusprechen.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Liebe & Beziehungen: Du öffnest dich nicht leicht, bist aber, wenn du vertraust, treu bis zum Schluss. Du zeigst Liebe durch beständige, aufrichtige Aufmerksamkeit statt großer Gesten. Zeig etwas mehr – dein Gegenüber spürt deine Liebe dann viel stärker.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Liebe & Beziehungen: Dein Charme zieht Menschen an, du hast viele Kontakte und stehst oft im Mittelpunkt. Lernst du zu erkennen, wer wirklich zu dir hält, werden deine Beziehungen viel stabiler. Gute Chancen kommen durch neue Begegnungen – bleib offen.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Geld & Karriere: Du gräbst tief in einem Feld, daher wächst dein Einkommen mit der Erfahrung stetig. Methoden, bei denen die Zeit für dich arbeitet – regelmäßiges Sparen, Langfristanlagen –, passen gut. Halte Zertifikate und Nachweise deiner Expertise fest, dann kommen Chancen schneller.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Geld & Karriere: Dein Geldglück wächst später im Leben – nicht zu hetzen ist der Schlüssel. Erfahrung und Netzwerk kehren als große Ernte zurück, und selbst Spätstarts können sehr erfolgreich werden. Konzentriere dich jetzt eher darauf, Geldlecks zu stopfen, als groß zu verdienen.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Geld & Karriere: Dein Geldglück blüht auf, wenn du nach Leistung statt mit festem Gehalt verdienst. Mehrere Einkommensquellen – Nebenjob, Freelance, kleines Business – passen zu dir. Da das Einkommen schwanken kann, leg unbedingt einige Monatskosten als Notgroschen zurück.", "👑 리더형 손금": "👑 Anführer-Hand", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Seit jeher heißt es, eine Hand mit klarer Lebens- und Schicksalslinie gehöre Gründern und Führungspersonen großer Organisationen. Ausdauer und Tatkraft geben dir die Kraft, Ziele bis zum Ende durchzuziehen. Menschen vertrauen deinem Urteil ganz natürlich – scheue keine verantwortungsvollen Posten. Statt alles allein zu tragen, verteile Aufgaben an Vertraute – dann wächst dein Glück noch mehr.", "🎨 예술가형 손금": "🎨 Künstler-Hand", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Traditionell heißt es, eine sanft nach unten gebogene Kopflinie finde sich oft bei Künstlern, Autoren und Designern. Du spürst und drückst aus, was anderen entgeht. Versinkst du in etwas, das du liebst, vergisst du die Zeit – genau diese Hingabe ist dein Schatz. Kommen Gefühlswellen, bring sie in Text oder Bild – oft entsteht daraus etwas Gutes.", "🌳 대기만성형 손금": "🌳 Spätzünder-Hand", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "Beginnt die Schicksalslinie mitten in der Handfläche, spricht man vom Spätzünder, der spät aufblüht und groß Erfolg hat. Alles Ausprobieren der Jugend wird zum Nährboden für später. Dein eigenes Tempo zu halten ist wichtiger, als dich mit anderen zu vergleichen. Ab der Lebensmitte zeigen sich stabiler Wohlstand und Anerkennung.", "🧭 개척자형 손금": "🧭 Pionier-Hand", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Eine Hand mit verzweigten oder frei verlaufenden Linien gehört zum Pionier, der lieber neue Wege bahnt als alte geht. Du ergreifst gerade im Wandel Chancen – Jobwechsel, Umzug, Herausforderung. Nur Sicherheit zu suchen, engt dich ein – probier immer wieder Neues, auch im Kleinen. Sobald sich deine vielen Erfahrungen bündeln, gelingt dir Außergewöhnliches.", "♟️ 전략가형 손금": "♟️ Strategen-Hand", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Eine Hand mit gerader Kopflinie gehört zum Strategen oder Berater, präzise in Kalkül und Urteil. Du siehst das große Ganze und erkennst Risiken früh – in jeder Organisation unverzichtbar. Deinen wahren Wert zeigst du, wenn du im Hintergrund die Fäden ziehst. Leg ab und zu das Kalkül beiseite und vertrau deinem Bauch – unerwartetes Glück kann folgen.", "⚖️ 균형형 손금": "⚖️ Ausgewogene Hand", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Eine Hand, die zu keiner Linie neigt, gehört zum ausgewogenen Typ, der in vielen Bereichen gut ist. Du kümmerst dich gleichermaßen um Menschen, Arbeit und Gesundheit und passt dich überall gut an. Wähle eine Phase, in der du dich auf eines konzentrierst – dann zeigen sich verborgene T ": "Entra algo de dinero. Ahorra una parte.", "잘 다듬어진 보석처럼 깔끔하고 감각이 뛰어나요. 완성도를 중요하게 여기고 아름다운 것을 알아봐요. 완벽하지 않아도 괜찮다고 스스로에게 말해 주세요.": "Refinado como una joya pulida, con gran ojo para la belleza. Valoras la calidad. Dite que no pasa nada por no ser perfecto.", "잘 맞는 사람": "Personas afines", "잠을 잘 자는 것이 올해 최고의 관리예요.": "Dormir bien es tu mejor cuidado este año.", "재치 있고 눈치가 빨라 어디서든 살아남는 힘이 있어요. 알뜰하고 기회를 잘 잡아요.": "Ingenioso y perspicaz, te desenvuelves en cualquier sitio. Ahorrador y hábil para aprovechar oportunidades.", "저장하고 시작하기": "Guardar y empezar", "정리 정돈, 깊은 호흡": "ordenar y respirar hondo", "정리 정돈을 하면 운이 트이는 달이에요.": "Ordenar te abre la suerte este mes.", "조용히 실력을 다지기 좋은 달이에요. 서두를 필요 없어요.": "Buen mes para mejorar en silencio. Sin prisa.", "좋은 방향": "Dirección favorable", "좋은 소개가 들어오는 해예요.": "Te llegan buenas presentaciones.", "쥐": "Rata", "지난해의 고민과 얽힌 일이 하나씩 풀려 가는 해예요. 상반기에 정리를 잘 해 두면 하반기엔 마음이 한결 가벼워져요. 미뤄 둔 연락이나 정리를 먼저 해 보세요.": "Las preocupaciones del año pasado se deshacen una a una. Ordena en la primera mitad y la segunda será más ligera. Empieza por las llamadas y tareas pendientes.", "지혜롭고 차분하며 직감이 뛰어나요. 깊이 생각한 뒤 움직여 실수가 적어요.": "Sabio, sereno e intuitivo. Piensas antes de actuar y rara vez fallas.", "처음": "Inicio", "촛불처럼 은은하게 곁을 밝히는 사람이에요. 세심하고 배려가 깊어 마음을 잘 읽어요. 속으로 삭이기보다 마음을 표현할수록 빛이 커져요.": "Como una vela, iluminas suavemente a quien te rodea. Atento y cariñoso, lees bien los corazones. Expresa lo que sientes y tu luz crecerá.", "충동구매와 보증은 피하세요. 지키는 게 버는 거예요.": "Evita compras impulsivas y ser avalista. Ahorrar es ganar.", "충분한 잠, 물 자주 마시기": "dormir bien y beber agua", "크게 요란하진 않아도 차곡차곡 쌓이는 해예요. 저축, 공부, 건강 관리처럼 꾸준히 하는 일이 연말에 든든한 결과로 돌아와요. 욕심내지 않는 것이 가장 큰 복이에요.": "Sin brillo, pero un año de acumular con constancia. Ahorro, estudio y salud dan fruto a fin de año. No ser codicioso es tu mayor suerte.", "큰 강을 건너는 해": "El año de cruzar el gran río", "큰 나무처럼 곧고 반듯한 성품이에요. 한번 정한 목표는 끝까지 밀고 나가고, 남을 이끄는 힘이 있어요. 가끔은 굽힐 줄 아는 유연함이 더해지면 더 크게 자라요.": "Recto como un árbol alto. Con una meta, llegas hasta el final y guías a otros. Un poco de flexibilidad te hará crecer más.", "큰 바다처럼 생각이 깊고 포용력이 커요. 지혜롭고 상황을 넓게 봐요. 생각이 너무 많아질 땐 몸을 움직여 머리를 비워 보세요.": "Profundo y acogedor como el océano. Sabio, ves el conjunto. Si piensas demasiado, mueve el cuerpo para despejar la mente.", "큰 변화 없이 평온한 달이에요. 하던 일을 꾸준히 이어 가세요.": "Un mes tranquilo sin grandes cambios. Sigue con lo tuyo.", "큰 산처럼 듬직하고 믿음직해요. 쉽게 흔들리지 않아 사람들이 기대요. 변화 앞에서 너무 오래 머뭇거리지만 않으면 돼요.": "Firme y fiable como una montaña, los demás se apoyan en ti. Solo no dudes demasiado ante el cambio.", "큰돈보다 작은 돈이 꾸준히 들어와요.": "Llegan sumas pequeñas y constantes más que grandes.", "타고난 성품": "Tu naturaleza", "태양처럼 밝고 따뜻해요. 솔직하고 열정이 넘쳐 주변을 환하게 만들어요. 감정이 금세 타오르니 결정을 내리기 전 한 번 식혀 보세요.": "Luminoso y cálido como el sol. Sincero y apasionado, iluminas tu entorno. Las emociones se encienden rápido: enfríate antes de decidir.", "태어난 시": "Hora de nacimiento", "태어난 시 모름": "Hora desconocida", "토끼": "Conejo", "토정비결": "Tojeong Bigyeol", "토정비결 · 사주팔자 · 오늘의 운세": "Tojeong Bigyeol · Cuatro Pilares · Horóscopo", "토정비결·사주·운세는 전통 계산법을 바탕으로 한 재미와 참고용이에요.": "Tojeong Bigyeol, Cuatro Pilares y horóscopos son por diversión, basados en métodos tradicionales.", "투자보다 저축이 이로운 해예요.": "Este año ahorrar es mejor que invertir.", "파이오니어": "Pioneer", "평온하게 흘러가는 날이에요. 꾸준히 할 일을 해 나가세요.": "Un día tranquilo. Sigue con tus tareas sin prisa.", "프리미엄": "Premium", "프리미엄에서 몸 분석, 맞춤 음식, 운동 따라하기, 영양 가이드를 모두 쓸 수 있어요. 한 번 열면 계속 쓸 수 있어요.": "Premium desbloquea Chequeo corporal, Comida para mí, Ejercicios guiados y la Guía de nutrición. Se desbloquea una vez, para siempre.", "하는 일마다 손발이 맞는 달이에요. 미뤄 둔 일을 처리하기 좋아요.": "Todo encaja este mes. Ideal para lo pendiente.", "하던 일을 깊게 파고들면 길이 보여요.": "Profundiza en lo que haces y aparecerá el camino.", "하반기로 갈수록 운이 올라가요. 늦게 피는 꽃이 더 오래 가듯, 연말에 웃게 돼요.": "La suerte sube hacia la segunda mitad. Como la flor tardía que dura más, sonreirás a fin de año.", "하반기엔 정리와 마무리에 힘쓰면 좋아요. 새 일보다 하던 일을 끝내는 게 이득이에요.": "En la segunda mitad, céntrate en terminar. Acabar lo empezado vale más que empezar algo nuevo.", "한 단계 올라서는 도약의 해예요. 중요한 결정을 내려야 할 순간이 오는데, 충분히 준비했다면 과감하게 건너도 좋아요. 건넌 뒤엔 넓은 들판이 기다려요.": "Un año de subir de nivel. Llegará una decisión clave: si te has preparado, cruza con valentía. Al otro lado te espera un campo abierto.", "한 해 내내 고르게 흘러가요. 큰 굴곡 없이 꾸준함이 결실을 맺어요.": "Todo el año fluye parejo. Sin grandes altibajos, la constancia da fruto.", "한 해 총운": "Resumen del año", "햇볕 쬐기, 즐거운 모임": "sol y reuniones alegres", "호랑이": "Tigre", "혼자보다 함께할 때 성과가 커요.": "Juntos logras más que solo.", "환절기": "el cambio de estación", "활발하고 자유로워 어디로든 달려가요. 솔직하고 사람을 좋아해요.": "Vivo y libre, vas a todas partes. Sincero y sociable.", "흰색": "Blanco", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠 보세요.": "Tus emociones están claras hoy. Comparte esa energía con los demás.", "시주": "Hora", "좋은 달": "Meses buenos", "조심할 달": "Meses de cuidado", "올해의 행운": "Suerte del año", "달을 누르면 그 달의 운세를 볼 수 있어요.": "Toca un mes para ver su lectura.", "← 올해 운세": "← Año", "{0}월 운세": "Mes {0}", "좋은 흐름": "Buena racha", "무난한 흐름": "Tranquilo", "조심할 흐름": "Cuidado", "이달에 눈여겨볼 분야": "Foco del mes", "이달의 행운의 날: 음력 {0}일": "Día de suerte: día lunar {0}", "이전 달": "Anterior", "다음 달": "Siguiente", "좋음": "Bien", "보통": "Normal", "조심": "Cuidado", "음악 켬": "Música on", "음악 끔": "Música off", "올해는 '시작'이 열쇠예요. 완벽하게 준비될 때를 기다리기보다 작게 시작해서 고쳐 나가는 쪽이 운을 부르는 해예요. 새로 배우는 것과 새로 만나는 사람에게 마음을 열어 두세요.": "Este año la clave es 'empezar'. En vez de esperar a estar perfectamente preparado, empezar en pequeño e ir ajustando atrae la suerte. Abre tu corazón a nuevos aprendizajes y personas.", "올해는 '유연함'이 열쇠예요. 계획대로 되지 않는 일이 생겨도 다른 길을 찾으면 오히려 더 좋은 결과로 이어져요. 서두르고 싶은 마음이 들 때마다 한 번 쉬어 가는 여유를 가지세요.": "Este año la clave es la 'flexibilidad'. Aunque algo no salga según lo planeado, buscar otro camino lleva a mejores resultados. Cuando sientas prisa, date un respiro.", "올해는 '드러냄'이 열쇠예요. 그동안 쌓아 둔 실력과 생각을 보여 줄 기회가 찾아와요. 주목받는 만큼 겸손함을 잃지 않으면 좋은 평판이 오래 가요.": "Este año la clave es 'mostrarte'. Llegará la ocasión de enseñar lo que has construido. Si mantienes la humildad mientras crece la atención, tu buena fama durará.", "올해는 '변화'가 열쇠예요. 익숙한 자리를 떠나는 일이 생겨도 두려워하지 마세요. 바뀐 환경에서 새로운 인연과 기회가 기다리고 있어요. 큰 결정은 하나씩 차례대로 하세요.": "Este año la clave es el 'cambio'. No temas dejar lo conocido. En el nuevo entorno te esperan nuevas personas y oportunidades. Toma las grandes decisiones de una en una.", "올해는 '꾸준함'이 열쇠예요. 눈에 띄는 변화보다 매일 반복하는 작은 습관이 큰 차이를 만들어요. 돈도 건강도 차곡차곡 모으는 만큼 연말에 든든해져요.": "Este año la clave es la 'constancia'. Los pequeños hábitos diarios marcan más diferencia que los grandes cambios. Cuanto más ahorres, en dinero y salud, más tranquilo estarás a fin de año.", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "Este año la clave es 'soltar'. Cuanto más dejes atrás viejas cargas y rencores, más ligero estarás. Lo bueno llenará el espacio que liberes.", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "Este año la clave son las 'personas'. Juntos todo sale mejor que solo. Expresa primero tu gratitud y esos lazos volverán como grandes bendiciones.", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "Este año la clave es el 'valor'. Es momento de dar el paso hacia el reto que llevas tiempo aplazando. Si te has preparado, confía y avanza. Al otro lado encontrarás a alguien que ha crecido: tú.", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "En {0} sigue la buena energía. Buen momento para hacer los planes pendientes.", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "En {0} todo fluye con calma, sin grandes altibajos. Sigue con lo tuyo.", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "En {0} conviene tener algo de cuidado. Sin prisas, cuida la salud y los gastos.", "올해의 큰 흐름": "La gran corriente del año", "올해의 조언": "Consejo del año", "상반기": "Primera mitad", "하반기": "Segunda mitad", "계절별 흐름": "Estación por estación", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "Este mes la energía sube en general. Si estabas preparando algo, sácalo ahora. Una pequeña decisión puede dar un resultado mayor del esperado.", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "La ayuda y el apoyo llegan de forma natural. Comparte en vez de cargar con todo y la alegría se duplica. Cuanto más agradezcas, más firme será tu suerte.", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "Tus planes cogen velocidad. Pero cuanto mejor vaya, más importa lo básico. Cumple promesas y plazos y la buena racha seguirá el mes próximo.", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "Se abre una puerta a nuevas oportunidades. Escucha también propuestas que normalmente dejarías pasar. La curiosidad, no la duda, trae la suerte del mes.", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "Un mes tranquilo sin grandes sucesos. Justo ahora, mantener tu ritmo diario es el mejor cuidado. Comer y dormir bien ya acumula fuerza para el mes siguiente.", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "Lo bueno y lo decepcionante se mezclan a partes iguales. No te inclines demasiado a un lado; con equilibrio pasará sin problemas. Felicítate por los pequeños logros.", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "Buen mes para afianzar en silencio. Más que cambios visibles, conviene ordenar y estudiar lo pendiente. Lo que siembres ahora brotará la próxima estación.", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "Con un flujo sereno, es buen mes para darle espacio al corazón. Pasa tiempo con los tuyos o da un paseo. Una mente relajada sabe ver la próxima oportunidad.", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "Con un poco de prisa las cosas se cruzan. Aplaza uno o dos días las decisiones importantes. Ir despacio es en realidad lo más rápido.", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "Cuerpo y mente se cansan fácilmente. Reduce los compromisos exigentes y descansa lo suficiente. Si tú estás bien, los demás también.", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "Cuida cada palabra y cada moneda y el mes pasará tranquilo. Cuando suban las emociones, respira antes de responder. Gasta solo en lo necesario.", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "Los pequeños errores son fáciles este mes: sé minucioso. Revisa documentos y citas, y prioriza la seguridad al moverte. Cuanto más cuidado, más ligero el mes siguiente.", "이달의 운세": "Este mes", "분야별 흐름": "Por área", "이달의 한마디": "Palabras del mes", "이달의 행운": "Suerte del mes", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "Tu fecha de nacimiento y tu foto se guardan en tu cuenta Pi, así que siguen ahí aunque cierres la app.", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "Tu fecha de nacimiento solo se guarda en tu cuenta Pi. Las lecturas son por diversión; la salud no sustituye al médico.", "궁합": "Compatibilidad", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "Mira cuánto encajan las energías de dos personas", "상대방 정보": "Sus datos", "상대 이름 (선택)": "Su nombre (opcional)", "궁합 보기": "Ver compatibilidad", "다른 사람과 보기": "Probar con otra persona", "띠 궁합": "Signos", "성향 궁합": "Carácter", "오행 궁합": "Cinco Elementos", "두 사람에게 주는 조언": "Consejo para los dos", "두 띠는 서로 힘을 북돋아 주는 삼합 관계예요. 함께 있으면 일이 술술 풀리고 마음이 잘 통해요.": "Vuestros signos forman una 'triple armonía' que os impulsa. Juntos todo fluye y os entendéis bien.", "두 띠는 서로 끌어당기는 육합 관계예요. 처음 만나도 편안하고, 오래 함께할수록 정이 깊어져요.": "Vuestros signos forman una 'armonía de seis' que os atrae. Cómodos desde el principio, el vínculo crece con el tiempo.", "두 띠는 서로 마주 보는 충 관계예 culos te traen buenas oportunidades.", "일찍부터 자기 길이 분명한 편이에요. 한 분야를 꾸준히 밀고 나가면 인정받고 자리를 잡는 손금이에요.": "Tienes claro tu camino desde pronto. Si perseveras en un campo, lograrás reconocimiento y estabilidad.", "늦게 피는 꽃처럼 중년 이후에 운이 크게 열리는 흐름이에요. 지금 쌓는 경험이 나중에 큰 힘이 돼요.": "Como una flor tardía, tu suerte se abre a partir de la madurez. La experiencia de hoy será una gran fuerza.", "정해진 틀보다 스스로 길을 만드는 자유로운 타입이에요. 여러 경험을 해 볼수록 나에게 맞는 일을 찾게 돼요.": "Eres un espíritu libre que crea su propio camino. Cuanto más pruebas, antes encuentras lo tuyo.", "손금 전체에 힘이 고르게 실려 있어요. 지금 하는 일을 꾸준히 밀고 나가면 좋은 결과가 따라와요.": "La fuerza se reparte por igual en tu mano. Sigue adelante y llegarán buenos resultados.", "강한 선과 부드러운 선이 섞여 균형이 좋은 손이에요. 장점은 살리고 약한 부분은 생활 습관으로 채워 보세요.": "Líneas fuertes y suaves forman una mano equilibrada. Aprovecha tus fortalezas y refuerza lo débil con hábitos.", "손금은 살면서 조금씩 바뀌어요. 지금의 흐름은 변화와 가능성이 크다는 뜻이니, 새로운 도전을 두려워하지 마세요.": "Las líneas cambian poco a poco con la vida. Ahora indican cambio y potencial: no temas nuevos retos.", "왼손": "izquierda", "오른손": "derecha", "{0} 손바닥을 손 모양 안에 맞춰 주세요": "Coloca tu palma {0} dentro de la silueta", "전통적으로 남자는 왼손, 여자는 오른손을 봐요": "Tradicionalmente, hombres la izquierda y mujeres la derecha", "카메라를 켤 수 없어요. 아래 버튼으로 사진을 찍어 주세요.": "No se puede abrir la cámara. Usa el botón de abajo.", "찍기": "Capturar", "{0}으로 보기": "Usar mano {0}", "손바닥 윤곽을 맞추는 중…": "Alineando el contorno…", "생명선 찾는 중…": "Buscando línea de la vida…", "두뇌선 찾는 중…": "Buscando línea de la cabeza…", "감정선 찾는 중…": "Buscando línea del corazón…", "운명선 찾는 중…": "Buscando línea del destino…", "스캔 완료!": "¡Escaneo completo!", "사진 속 점선 위치의 내 손금과 가장 비슷한 모양을 골라 주세요": "Compara cada línea punteada con tu palma y elige la forma más parecida", "손금 풀이 보기": "Ver mi lectura", "나의 손금 풀이": "Mi lectura de manos", "한마디": "En una frase", "손금 풀이는 전통 해석을 바탕으로 한 재미와 참고용이에요. 사진은 휴대폰 안에서만 쓰이고 서버에 저장되지 않아요.": "La lectura se basa en la interpretación tradicional, como entretenimiento. Tu foto se queda en tu móvil y no se guarda en el servidor.", "다시 찍기": "Volver a tomar", "아직 고르지 않은 손금이 있어요: {0}": "Aún falta elegir: {0}", "스캔 결과로 손금 모양을 자동으로 골랐어요. 내 손과 다르면 아래에서 바꿀 수 있어요": "Elegimos tus líneas según el escaneo. Si algo no coincide, cámbialo abajo.", "보고 싶은 손금을 눌러 보세요": "Toca una línea para verla", "총평": "Valoración general", "닮은 손금 유형": "Tu tipo de mano", "한눈에 보기": "De un vistazo", "건강·체력운: 타고난 체력이 좋아 바쁜 시기에도 쉽게 지치지 않아요. 다만 몸을 믿고 무리하는 습관이 생기기 쉬우니, 한 달에 한 번은 푹 쉬는 날을 정해 두세요. 걷기나 등산처럼 오래 꾸준히 하는 운동이 이 손금과 가장 잘 맞아요.": "Salud y vitalidad: tienes resistencia natural y no te cansas fácilmente ni en épocas de mucho trabajo. Pero confiar demasiado en tu cuerpo puede llevarte a excederte: reserva un día de descanso total al mes. Caminar o hacer senderismo de forma constante es lo que mejor te va.", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Salud y vitalidad: si gastas tu energía de golpe se agota pronto, así que te conviene un ritmo de pausas cortas y frecuentes. Comida caliente y sueño regular son tu mejor medicina. Anota tus días buenos y malos y pronto verás tu propia forma de cuidarte.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Salud y vitalidad: cuando cambia tu entorno, tu cuerpo también pasa por una adaptación. En una mudanza o un trabajo nuevo, cuida especialmente el sueño y las comidas las primeras semanas. Al superarlo, se asientan hábitos más sanos que antes.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Trabajo y estudios: dividir metas en partes pequeñas y tacharlas te funciona. Ganas confianza en áreas precisas como planificación, gestión, contabilidad o TI, y tus responsabilidades crecen con el tiempo. No esperes a estar perfecto: empieza cuando estés al 70 %.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Trabajo y estudios: tu verdadero talento brilla creando cosas nuevas más que en tareas con respuesta fija. Anotar las ideas en cuanto surgen será un gran tesoro. Organizar plazos puede costarte, así que formar equipo con alguien meticuloso mejora mucho los resultados.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Trabajo y estudios: decides rápido y ejecutas bien, así que brillas donde la velocidad importa: trabajo de campo, ventas, emprendimiento. Te va mejor concentrarte en tramos cortos y ver resultados que aferrarte a algo mucho tiempo. Antes de grandes decisiones, consúltalo con la almohada y cometerás muchos menos errores.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Amor y relaciones: en el amor das sin medida, y tu pareja se siente muy segura. Amigos de toda la vida y familia son grandes pilares para ti. Puedes sentirte dolido si no recibes lo mismo, así que practica expresar lo que deseas.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Amor y relaciones: no te abres con facilidad, pero cuando confías eres leal hasta el final. Demuestras amor con atención constante y sincera más que con gestos llamativos. Si te expresas un poco más, tu pareja sentirá tu cariño con mucha más fuerza.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Amor y relaciones: tu encanto atrae a la gente, tienes muchos vínculos y te vuelves el centro de las reuniones. Aprender a reconocer quién está de verdad de tu lado hará tus relaciones mucho más sólidas. Las buenas oportunidades llegan con nuevos encuentros: mantén el corazón abierto.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Dinero y carrera: profundizas en un campo, así que tus ingresos crecen de forma estable con la experiencia. Te van bien los métodos en los que el tiempo juega a tu favor, como el ahorro constante o la inversión a largo plazo. Guarda títulos o logros que prueben tu experiencia y las oportunidades llegarán antes.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Dinero y carrera: tu suerte económica crece con los años, así que la clave es no apresurarte. La experiencia y los contactos que has reunido volverán como grandes frutos, e incluso podrías triunfar en algo que empezaste tarde. Por ahora, céntrate en tapar fugas de dinero más que en ganar mucho.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Dinero y carrera: tu suerte económica despierta cuando ganas según tu capacidad y no con un sueldo fijo. Crear varias fuentes de ingreso —trabajos extra, freelance, un pequeño negocio— te va muy bien. Como los ingresos pueden variar, guarda sí o sí varios meses de gastos como fondo de emergencia.", "👑 리더형 손금": "👑 Mano de líder", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Desde antiguo se dice que una mano con líneas de la vida y del destino claras pertenece a fundadores y líderes de grandes organizaciones. Con resistencia y empuje, tienes la fuerza para llevar tus metas hasta el final. La gente confía en tu criterio de forma natural, así que no evites los puestos de responsabilidad. En lugar de cargar con todo, delega en gente de confianza y tu suerte crecerá aún más.", "🎨 예술가형 손금": "🎨 Mano de artista", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Tradicionalmente se dice que una mano cuya línea de la cabeza se curva suavemente hacia abajo es común en artistas, escritores y diseñadores. Tienes gran sensibilidad para captar y expresar lo que otros no ven. Cuando te sumerges en lo que amas pierdes la noción del tiempo, y esa entrega es tu tesoro. Cuando lleguen olas de emoción, vuélcalas en la escritura o el dibujo y saldrán buenas obras.", "🌳 대기만성형 손금": "🌳 Mano de éxito tardío", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "La mano cuya línea del destino empieza a mitad de la palma se llama de éxito tardío: florece tarde pero triunfa en grande. Todos los tropiezos de juventud se vuelven abono para el futuro. Mantener tu propio ritmo importa más que compararte con otros. A partir de la madurez se ve un flujo de riqueza estable y respeto.", "🧭 개척자형 손금": "🧭 Mano de pionero", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Una mano con líneas que se bifurcan o se extienden libremente pertenece al pionero, que abre caminos nuevos en vez de seguir los marcados. Eres de los que aprovechan oportunidades en medio del cambio: nuevos trabajos, mudanzas, retos. Buscar solo estabilidad te agobia, así que sigue probando cosas nuevas, aunque sean pequeñas. Cuando tus muchas experiencias se unan, lograrás algo extraordinario.", "♟️ 전략가형 손금": "♟️ Mano de estratega", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Una mano con la línea de la cabeza recta pertenece al estratega o consejero, preciso en cálculo y juicio. Ves el panorama completo y anticipas riesgos, lo que te hace imprescindible en cualquier organización. Muestras tu verdadero valor moviendo los hilos desde atrás más que al frente. De vez en cuando, deja los cálculos y confía en tu intuición: puede llegar una suerte inesperada.", "⚖️ 균형형 손금": "⚖️ Mano equilibrada", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Una mano que no se inclina hacia ninguna línea en particular es del tipo equilibrado, capaz en muchos campos. Sabes cuidar por igual de las personas, el trabajo y la salud, y te adaptas bien a cualquier entorno. Elige una etapa para concentrarte en una sola cosa y reunir fuerzas: tus talentos ocultos brillarán. Cuanta más constancia acumules, más crecerán juntas la confianza de los demás y tu suerte.", "생활패턴 수정": "Editar hábitos", "생활패턴을 저장했어요": "Tus hábitos se han guardado", "나의 하루 생활패턴": "Mi rutina diaria", "나의 손금": "Mi mano", "{0} 손바닥을 화면 가득 쫙 펴서 찍어 주세요": "Abre bien tu palma {0} hasta llenar la pantalla y toma la foto", "광고 보고 +{0} 토큰": "Ver anuncio +{0} tokens", "오늘 {0}/{1}회": "hoy {0}/{1}", "광고 준비 중이에요": "Los anuncios llegan pronto", "오늘 광고 보상을 다 받았어요": "Ya recibiste todas las recompensas de hoy", "광고를 불러오지 못했어요. 잠시 후 다시 해 주세요.": "No se pudo cargar el anuncio. Inténtalo en un momento.", "광고 시청 확인이 안 됐어요": "No se pudo confirmar el anuncio", "토큰 순위": "Ranking de tokens", "나의 순위": "Mi puesto", "{0}위": "#{0}", "아직 순위가 없어요": "Aún no hay ranking", "매달 토큰을 많이 모은 분께 건강용품을 드릴 예정이에요. Pi 정책에 따라 바뀌거나 빠질 수 있어요.": "Cada mes planeamos regalar artículos de salud a quienes más tokens tengan. Puede cambiar o eliminarse según las políticas de Pi.", "항목당 0.1π 또는 100토큰": "0,1π o 100 tokens cada uno", "100 토큰으로 열기": "Desbloquear con 100 tokens", "토큰 순위 보기": "Ver ranking de tokens", "광고를 끝까지 봐야 토큰을 받아요": "Mira el anuncio hasta el final para recibir tokens"}, "pt": {"생년월일": "Data de nascimento", "성별": "Gênero", "여성": "Mulhe : "No {0} tudo flui calmo, sem grandes altos e baixos. Siga em frente.", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "No {0} é preciso um pouco de cuidado. Sem pressa, cuide da saúde e dos gastos.", "올해의 큰 흐름": "A grande corrente do ano", "올해의 조언": "Conselho do ano", "상반기": "Primeiro semestre", "하반기": "Segundo semestre", "계절별 흐름": "Estação por estação", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "Este mês a energia sobe no geral. Se você vinha preparando algo, mostre agora. Uma pequena decisão pode render mais do que imagina.", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "Ajuda e apoio chegam naturalmente. Compartilhe em vez de carregar tudo sozinho e a alegria dobra. Quanto mais gratidão, mais firme a sorte.", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "Seus planos ganham velocidade. Mas quanto melhor vai, mais o básico importa. Cumpra promessas e prazos e a boa fase segue no próximo mês.", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "Abre-se uma porta para novas oportunidades. Ouça até convites que você normalmente ignoraria. A curiosidade, não a hesitação, traz a sorte do mês.", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "Um mês tranquilo, sem grandes acontecimentos. É hora de manter o ritmo do dia a dia. Comer e dormir bem já junta força para o próximo mês.", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "Coisas boas e frustrantes se misturam por igual. Não penda demais para um lado; com equilíbrio, passa tranquilo. Elogie suas pequenas conquistas.", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "Bom mês para firmar a base em silêncio. Mais que mudanças visíveis, combina com organizar e estudar o que ficou para trás. O que plantar agora brota na próxima estação.", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "Com o fluxo calmo, dê espaço ao coração. Passe tempo com quem ama ou faça uma caminhada leve. Uma mente tranquila enxerga a próxima chance.", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "Um pouco de pressa e as coisas se desencontram. Adie decisões importantes por um ou dois dias. Ir devagar é, na verdade, o caminho mais rápido.", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "Corpo e mente cansam fácil. Diminua compromissos pesados e descanse de verdade. Quando você está bem, quem está perto também fica.", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "Cuidado com cada palavra e cada centavo e o mês passa tranquilo. Quando a emoção subir, respire antes de responder. Gaste só no necessário.", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "Pequenos erros acontecem fácil este mês: seja minucioso. Confira documentos e compromissos e priorize a segurança ao se deslocar. Quanto mais cuidado, mais leve o próximo mês.", "이달의 운세": "Este mês", "분야별 흐름": "Por área", "이달의 한마디": "Palavras do mês", "이달의 행운": "Sorte do mês", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "Sua data de nascimento e foto ficam salvas na sua conta Pi, mesmo depois de fechar o app.", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "Sua data de nascimento fica salva só na sua conta Pi. As leituras são por diversão; a saúde não substitui o médico.", "궁합": "Compatibilidade", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "Veja o quanto as energias de duas pessoas combinam", "상대방 정보": "Dados da pessoa", "상대 이름 (선택)": "Nome (opcional)", "궁합 보기": "Ver compatibilidade", "다른 사람과 보기": "Testar com outra pessoa", "띠 궁합": "Signos", "성향 궁합": "Personalidade", "오행 궁합": "Cinco Elementos", "두 사람에게 주는 조언": "Conselho para vocês", "두 띠는 서로 힘을 북돋아 주는 삼합 관계예요. 함께 있으면 일이 "감정을 차분하게 다스리는 사람이에요. 겉으로는 담담해 보여도 믿을 수 있는 사람에게는 깊은 마음을 보여 줘요.": "Você lida com as emoções com calma. Parece sereno, mas mostra sentimentos profundos a quem confia.", "마음이 넓고 여러 사람과 잘 어울려요. 다양한 인연 속에서 좋은 기회를 만나는 손금이에요.": "Você é aberto e se dá bem com muita gente. Suas muitas conexões trazem boas oportunidades.", "일찍부터 자기 길이 분명한 편이에요. 한 분야를 꾸준히 밀고 나가면 인정받고 자리를 잡는 손금이에요.": "Você conhece seu caminho desde cedo. Persistindo numa área, conquista reconhecimento e posição.", "늦게 피는 꽃처럼 중년 이후에 운이 크게 열리는 흐름이에요. 지금 쌓는 경험이 나중에 큰 힘이 돼요.": "Como flor tardia, sua sorte se abre a partir da meia-idade. A experiência de agora será uma grande força.", "정해진 틀보다 스스로 길을 만드는 자유로운 타입이에요. 여러 경험을 해 볼수록 나에게 맞는 일을 찾게 돼요.": "Você é um espírito livre que faz o próprio caminho. Quanto mais experimenta, mais acha o que combina.", "손금 전체에 힘이 고르게 실려 있어요. 지금 하는 일을 꾸준히 밀고 나가면 좋은 결과가 따라와요.": "A força se distribui por igual na sua mão. Siga firme e bons resultados virão.", "강한 선과 부드러운 선이 섞여 균형이 좋은 손이에요. 장점은 살리고 약한 부분은 생활 습관으로 채워 보세요.": "Linhas fortes e suaves formam uma mão equilibrada. Use seus pontos fortes e reforce os fracos com hábitos.", "손금은 살면서 조금씩 바뀌어요. 지금의 흐름은 변화와 가능성이 크다는 뜻이니, 새로운 도전을 두려워하지 마세요.": "As linhas mudam aos poucos com a vida. Agora indicam mudança e potencial: não tema novos desafios.", "왼손": "esquerda", "오른손": "direita", "{0} 손바닥을 손 모양 안에 맞춰 주세요": "Encaixe sua palma {0} no contorno da mão", "전통적으로 남자는 왼손, 여자는 오른손을 봐요": "Tradicionalmente, homens a esquerda e mulheres a direita", "카메라를 켤 수 없어요. 아래 버튼으로 사진을 찍어 주세요.": "Não foi possível abrir a câmera. Use o botão abaixo.", "찍기": "Capturar", "{0}으로 보기": "Usar mão {0}", "손바닥 윤곽을 맞추는 중…": "Alinhando o contorno…", "생명선 찾는 중…": "Procurando linha da vida…", "두뇌선 찾는 중…": "Procurando linha da cabeça…", "감정선 찾는 중…": "Procurando linha do coração…", "운명선 찾는 중…": "Procurando linha do destino…", "스캔 완료!": "Escaneamento concluído!", "사진 속 점선 위치의 내 손금과 가장 비슷한 모양을 골라 주세요": "Compare cada linha pontilhada com sua palma e escolha a forma mais parecida", "손금 풀이 보기": "Ver minha leitura", "나의 손금 풀이": "Minha leitura de mãos", "한마디": "Em uma frase", "손금 풀이는 전통 해석을 바탕으로 한 재미와 참고용이에요. 사진은 휴대폰 안에서만 쓰이고 서버에 저장되지 않아요.": "A leitura se baseia na interpretação tradicional, para diversão. Sua foto fica no celular e não é salva no servidor.", "다시 찍기": "Tirar de novo", "아직 고르지 않은 손금이 있어요: {0}": "Ainda falta escolher: {0}", "스캔 결과로 손금 모양을 자동으로 골랐어요. 내 손과 다르면 아래에서 바꿀 수 있어요": "Escolhemos suas linhas pelo escaneamento. Se algo for diferente, altere abaixo.", "보고 싶은 손금을 눌러 보세요": "Toque numa linha para ver", "총평": "Avaliação geral", "닮은 손금 유형": "Seu tipo de mão", "한눈에 보기": "Num relance", "건강·체력운: 타고난 체력이 좋아 바쁜 시기에도 쉽게 지치지 않아요. 다만 몸을 믿고 무리하는 습관이 생기기 쉬우니, 한 달에 한 번은 푹 쉬는 날을 정해 두세요. 걷기나 등산처럼 오래 꾸준히 하는 운동이 이 손금과 가장 잘 맞아요.": "Saúde e vitalidade: você tem resistência natural e não se cansa fácil, mesmo em fases corridas. Mas confiar demais no corpo pode levar a exageros: reserve um dia inteiro de descanso por mês. Caminhadas e trilhas constantes combinam muito com esta mão.", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Saúde e vitalidade: se gasta toda a energia de uma vez, ela acaba rápido; um ritmo de pausas curtas e frequentes é essencial. Comida quente e sono regular são seu melhor remédio. Anote seus dias bons e ruins e logo descobrirá seu jeito de se cuidar.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Saúde e vitalidade: quando o ambiente muda, o corpo também passa por adaptação. Em mudanças de casa ou de emprego, cuide bem do sono e das refeições nas primeiras semanas. Superada essa fase, hábitos mais saudáveis se firmam.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Trabalho e estudos: dividir metas em partes e riscá-las uma a uma combina com você. Ganha confiança em áreas precisas como planejamento, gestão, contabilidade ou TI, e suas responsabilidades crescem. Não espere a perfeição: comece quando estiver 70% pronto.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Trabalho e estudos: seu verdadeiro talento aparece ao criar coisas novas, mais do que em tarefas com resposta pronta. Anotar ideias na hora vira um grande patrimônio. Prazos podem ser um ponto fraco; formar dupla com alguém detalhista melhora muito os resultados.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Trabalho e estudos: você decide rápido e executa bem, brilhando onde a velocidade conta: campo, vendas, empreendedorismo. Foco em ciclos curtos com resultados rápidos combina mais do que insistir muito tempo numa coisa. Antes de grandes decisões, durma sobre o assunto e os erros cairão bastante.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Amor e relações: no amor você se doa por inteiro, e o parceiro se sente muito seguro. Amigos antigos e família são grandes pilares na sua vida. Pode se magoar quando não recebe o mesmo, então pratique colocar seus desejos em palavras.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Amor e relações: você não se abre fácil, mas quando confia é leal até o fim. Mostra amor com atenção constante e sincera, mais do que com gestos chamativos. Expressando-se um pouco mais, o parceiro sente seu carinho muito mais forte.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Amor e relações: seu charme atrai pessoas, você tem muitos laços e vira o centro das reuniões. Aprender a reconhecer quem está de fato ao seu lado fortalece muito as relações. Boas chances chegam por novos encontros, mantenha o coração aberto.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Dinheiro e carreira: você se aprofunda numa área, então a renda cresce de forma estável com a experiência. Métodos em que o tempo joga a seu favor, como poupança constante ou investimento de longo prazo, combinam com você. Guarde certificados e registros da sua especialidade e as chances virão mais cedo.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Dinheiro e carreira: sua sorte financeira cresce com o tempo, então não ter pressa é a chave. A experiência e a rede que construiu voltarão como grandes frutos, e você pode até ter muito sucesso em algo começado tarde. Por ora, foque em estancar vazamentos de dinheiro em vez de ganhar muito.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Dinheiro e carreira: sua sorte financeira desperta quando você ganha conforme sua capacidade, não com salário fixo. Criar várias fontes de renda — bicos, freelance, um pequeno negócio — combina com você. Como a renda pode oscilar, guarde sem falta alguns meses de despesas como reserva de emergência.", "👑 리더형 손금": "👑 Mão de líder", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Desde sempre se diz que uma mão com linhas da vida e do destino nítidas pertence a fundadores e líderes de grandes organizações. Com resistência e garra, você tem força para levar metas até o fim. As pessoas confiam naturalmente no seu julgamento, então não fuja de cargos de responsabilidade. Em vez de carregar tudo sozinho, divida o trabalho com quem confia e sua sorte crescerá ainda mais.", "🎨 예술가형 손금": "🎨 Mão de artista", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Tradicionalmente, diz-se que a mão cuja linha da cabeça curva suavemente para baixo é comum em artistas, escritores e designers. Você tem sensibilidade para sentir e expressar o que outros não veem. Quando mergulha no que ama perde a noção do tempo, e essa entrega é seu tesouro. Quando vierem ondas de emoção, transforme-as em texto ou desenho e boas obras podem nascer.", "🌳 대기만성형 손금": "🌳 Mão de sucesso tardio", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "A mão cuja linha do destino começa no meio da palma é chamada de sucesso tardio: floresce tarde, mas vence em grande. Todas as tentativas e erros da juventude viram adubo para depois. Manter seu ritmo importa mais do que comparar velocidade com os outros. A partir da meia-idade aparecem riqueza estável e respeito.", "🧭 개척자형 손금": "🧭 Mão de pioneiro", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Uma mão com linhas que se ramificam ou se espalham livremente pertence ao pioneiro, que abre caminhos novos em vez de seguir os traçados. Você aproveita oportunidades em meio à mudança: novo emprego, mudança de casa, desafios. Buscar só estabilidade sufoca você; continue tentando coisas novas, mesmo pequenas. Quando suas muitas experiências se juntarem, virá uma conquista marcante.", "♟️ 전략가형 손금": "♟️ Mão de estrategista", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Uma mão com a linha da cabeça reta pertence ao estrategista ou conselheiro, preciso em cálculo e julgamento. Você enxerga o quadro geral e antecipa riscos, sendo indispensável em qualquer organização. Mostra seu verdadeiro valor armando o jogo nos bastidores, mais do que na linha de frente. De vez em quando, deixe os cálculos de lado e confie na intuição: uma sorte inesperada pode chegar.", "⚖️ 균형형 손금": "⚖️ Mão equilibrada", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Uma mão que não pende para nenhuma linha específica é do tipo equilibrado, capaz em várias áreas. Você sabe cuidar igualmente de pessoas, trabalho e saúde, e se adapta bem a qualquer ambiente. Escolha uma fase para focar em uma coisa só e reunir forças: talentos escondidos vão aparecer. Quanto mais constância, mais crescem juntos a confiança dos outros e sua sorte.", "생활패턴 수정": "Editar hábitos", "생활패턴을 저장했어요": "Seus hábitos foram salvos", "나의 하루 생활패턴": "Minha rotina diária", "나의 손금": "Minha mão", "{0} 손바닥을 화면 가득 쫙 펴서 찍어 주세요": "Abra bem a palma {0} preenchendo a tela e tire a foto", "광고 보고 +{0} 토큰": "Ver anúncio +{0} tokens", "오늘 {0}/{1}회": "hoje {0}/{1}", "광고 준비 중이에요": "Anúncios em breve", "오늘 광고 보상을 다 받았어요": "Você já recebeu todas as recompensas de hoje", "광고를 불러오지 못했어요. 잠시 후 다시 해 주세요.": "Não foi possível carregar o anúncio. Tente em instantes.", "광고 시청 확인이 안 됐어요": "Não foi possível confirmar o anúncio", "토큰 순위": "Ranking de tokens", "나의 순위": "Minha posição", "{0}위": "#{0}", "아직 순위가 없어요": "Ainda sem ranking", "매달 토큰을 많이 모은 분께 건강용품을 드릴 예정이에요. Pi 정책에 따라 바뀌거나 빠질 수 있어요.": "Todo mês planejamos dar itens de saúde a quem tiver mais tokens. Pode mudar ou ser removido conforme as políticas da Pi.", "항목당 0.1π 또는 100토큰": "0,1π ou 100 tokens cada", "100 토큰으로 열기": "Desbloquear com 100 tokens", "토큰 순위 보기": "Ver ranking de tokens", "광고를 끝까지 봐야 토큰을 받아요": "Assista ao anúncio até o fim para ganhar tokens"}, "it": {"생년월일": "Data di nascita", "성별": "Genere", "여성 에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Salute e vitalità: se spendi tutta l'energia in una volta finisce presto, quindi conta un ritmo di pause brevi e frequenti. Cibo caldo e sonno regolare sono la tua medicina migliore. Annota i giorni buoni e quelli no e scoprirai presto il tuo metodo.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Salute e vitalità: quando cambia l'ambiente, anche il corpo attraversa un adattamento. In un trasloco o un nuovo lavoro, cura soprattutto sonno e pasti nelle prime settimane. Superata la fase, si radicano abitudini più sane di prima.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Lavoro e studio: dividere gli obiettivi in piccoli passi e spuntarli ti riesce bene. Ti guadagni fiducia in campi precisi come pianificazione, gestione, contabilità o IT, e le responsabilità crescono. Non aspettare la perfezione: parti quando sei pronto al 70%.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Lavoro e studio: il tuo vero talento emerge creando cose nuove più che in compiti con risposte fisse. Annotare subito le idee diventerà un grande patrimonio. La gestione dei tempi può essere un punto debole: in coppia con qualcuno preciso i risultati migliorano molto.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Lavoro e studio: decidi in fretta ed esegui bene, quindi brilli dove conta la velocità: lavoro sul campo, vendite, start-up. Ti si addicono brevi sprint di concentrazione con risultati rapidi. Prima delle grandi decisioni dormici su una notte e gli errori caleranno molto.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Amore e relazioni: in amore dai senza riserve e il partner si sente profondamente al sicuro. Amici di lunga data e famiglia sono grandi pilastri. Puoi restare ferito se non ricevi altrettanto: esercitati a esprimere i tuoi desideri.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Amore e relazioni: non ti apri facilmente, ma quando ti fidi resti leale fino alla fine. Mostri amore con attenzioni costanti e sincere più che con gesti eclatanti. Esprimerti un po' di più farà sentire il tuo amore molto più forte.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Amore e relazioni: il tuo fascino attira, hai molti legami e diventi spontaneamente il centro dei gruppi. Imparare a riconoscere chi è davvero dalla tua parte renderà i rapporti molto più solidi. Le occasioni arrivano dai nuovi incontri: resta aperto.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Denaro e carriera: scavi a fondo in un campo, quindi il reddito cresce stabilmente con l'esperienza. Ti si addicono metodi in cui il tempo lavora per te, come risparmio costante e investimenti a lungo termine. Conserva certificati e risultati che provino la tua competenza: le occasioni arriveranno prima.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Denaro e carriera: la fortuna economica cresce col tempo, quindi la chiave è non avere fretta. Esperienza e contatti accumulati torneranno come grandi frutti, e potresti avere successo anche in qualcosa iniziato tardi. Per ora concentrati a fermare le spese inutili più che a guadagnare tanto.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Denaro e carriera: la fortuna economica si accende quando guadagni in base alle tue capacità e non con uno stipendio fisso. Creare più fonti di reddito — lavori extra, freelance, piccola impresa — ti si addice. Il reddito può oscillare: metti assolutamente da parte qualche mese di spese come fondo d'emergenza.", "👑 리더형 손금": "👑 Mano da leader", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Da sempre si dice che una mano con linee della vita e del destino nette appartenga a fondatori e leader di grandi organizzazioni. Con resistenza e slancio hai la forza di portare gli obiettivi fino in fondo. Le persone si fidano spontaneamente del tuo giudizio: non evitare ruoli di responsabilità. Invece di portare tutto da solo, delega a persone fidate e la tua fortuna crescerà ancora.", "🎨 예술가형 손금": "🎨 Mano d'artista", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Tradizionalmente si dice che una mano con la linea della testa che curva dolcemente verso il basso sia comune tra artisti, scrittori e designer. Hai una grande sensibilità nel cogliere ed esprimere ciò che altri non vedono. Quando ti immergi in ciò che ami perdi la cognizione del tempo, e quell'immersione è il tuo tesoro. Quando arrivano ondate di emozioni, trasformale in scrittura o disegno: ne nasceranno belle opere.", "🌳 대기만성형 손금": "🌳 Mano del successo tardivo", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "La mano con la linea del destino che parte a metà palmo è detta del successo tardivo: fiorisce tardi ma ha grande successo. Tutti i tentativi ed errori della giovinezza diventano concime per il futuro. Mantenere il tuo ritmo conta più che confrontarti con gli altri. Dalla mezza età in poi si vede un flusso di ricchezza stabile e rispetto.", "🧭 개척자형 손금": "🧭 Mano da pioniere", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Una mano con linee ramificate o libere appartiene al pioniere, che apre nuove strade invece di seguire quelle tracciate. Sei di quelli che colgono le occasioni nel cambiamento: nuovi lavori, traslochi, sfide. Inseguire solo la stabilità ti soffoca, quindi continua a provare cose nuove, anche piccole. Quando le tue esperienze convergeranno, otterrai qualcosa di straordinario.", "♟️ 전략가형 손금": "♟️ Mano da stratega", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Una mano con la linea della testa dritta appartiene allo stratega o consigliere, preciso nei calcoli e nel giudizio. Vedi il quadro generale e anticipi i rischi, il che ti rende indispensabile ovunque. Mostri il tuo vero valore tessendo le trame dietro le quinte più che in prima fila. Ogni tanto metti da parte i calcoli e fidati dell'intuito: può arrivare una fortuna inattesa.", "⚖️ 균형형 손금": "⚖️ Mano equilibrata", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Una mano che non pende verso nessuna linea è del tipo equilibrato, capace in molti campi. Sai prenderti cura allo stesso modo di persone, lavoro e salute, e ti adatti bene ovunque. Scegli un periodo per concentrarti su una sola cosa e raccogliere le forze: i talenti nascosti emergeranno. Più cresce la tua costanza, più crescono insieme fiducia altrui e fortuna.", "생활패턴 수정": "Modifica abitudini", "생활패턴을 저장했어요": "Abitudini salvate", "나의 하루 생활패턴": "La mia routine quotidiana", "나의 손금": "La mia man ya adalah 'ketekunan'. Kebiasaan kecil sehari-hari membuat perbedaan lebih besar daripada perubahan heboh. Uang dan kesehatan yang ditabung sedikit-sedikit membuat akhir tahun tenang.", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "Tahun ini kuncinya adalah 'melepaskan'. Makin banyak beban lama dan ganjalan hati yang dilepas, makin ringan tubuh dan pikiran. Hal baik akan mengisi ruang kosong itu.", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "Tahun ini kuncinya adalah 'orang'. Bersama orang sekitar semuanya lebih lancar daripada berjuang sendiri. Ungkapkan terima kasih lebih dulu, ikatan itu kembali jadi berkah besar.", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "Tahun ini kuncinya adalah 'keberanian'. Saatnya melangkah ke tantangan yang lama kamu tunda. Jika sudah siap, percayalah dan maju. Setelahnya kamu akan bertemu dirimu yang lebih dewasa.", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "Di musim {0}, energi baik terus berlanjut. Waktu yang baik menjalankan rencana tertunda.", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "Di musim {0}, semua mengalir tenang tanpa naik-turun besar. Lanjutkan yang sedang dikerjakan.", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "Di musim {0}, ada sedikit yang perlu diwaspadai. Jangan terburu-buru, jaga kesehatan dan pengeluaran.", "올해의 큰 흐름": "Arus besar tahun ini", "올해의 조언": "Nasihat tahun ini", "상반기": "Paruh pertama", "하반기": "Paruh kedua", "계절별 흐름": "Per musim", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "Bulan ini energi secara umum naik. Jika kamu sedang menyiapkan sesuatu, keluarkan sekarang. Satu keputusan kecil bisa berbuah lebih besar dari dugaan.", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "Bantuan dan dukungan berdatangan dengan sendirinya. Berbagi daripada menanggung sendiri membuat kebahagiaan berlipat. Makin sering berterima kasih, makin kokoh keberuntungan.", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "Rencanamu melaju cepat. Tapi makin lancar, makin penting menjaga dasar. Tepati janji dan tenggat, aliran baik berlanjut ke bulan depan.", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "Pintu peluang baru terbuka. Dengarkan juga tawaran yang biasanya kamu lewatkan. Rasa ingin tahu, bukan keraguan, mendatangkan keberuntungan.", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "Bulan tenang tanpa kejadian besar. Saat seperti ini, menjaga ritme harian adalah perawatan terbaik. Makan dan tidur yang baik sudah menabung tenaga untuk bulan depan.", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "Hal baik dan mengecewakan bercampur rata. Jangan terlalu condong ke satu sisi; dengan seimbang semuanya lewat dengan aman. Pujilah pencapaian kecilmu.", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "Bulan yang baik untuk diam-diam memperkuat dasar. Lebih cocok merapikan dan belajar hal yang tertunda daripada perubahan besar. Benih yang ditanam sekarang tumbuh musim depan.", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "Alirannya datar, beri ruang untuk hatimu. Habiskan waktu dengan orang terdekat atau jalan santai. Hati yang tenang membantumu melihat peluang berikutnya.", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "Sedikit terburu-buru, urusan mudah meleset. Tunda keputusan penting sehari-dua untuk menata pikiran. Pelan-pelan justru jalan tercepat.", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "Tubuh dan pikiran mudah lelah. Kurangi janji yang berat dan pastikan cukup istirahat. Kalau kamu nyaman, orang sekitar juga nyaman.", "말 한마디, 돈 한 푼을 조
