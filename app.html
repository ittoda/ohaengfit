이 이 손금과 가장 잘 맞아요.": "Kesehatan & stamina: Staminamu bawaan kuat, jarang lelah meski sibuk. Tapi mudah memaksakan diri karena merasa kuat, jadi sisihkan satu hari istirahat penuh setiap bulan. Olahraga panjang dan rutin seperti jalan kaki atau mendaki paling cocok.", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Kesehatan & stamina: Energimu cepat habis bila dipakai sekaligus, jadi ritme istirahat singkat tapi sering itu penting. Makanan hangat dan tidur teratur adalah obat terbaikmu. Catat hari bugar dan lelahmu, cara merawat diri yang cocok akan segera terlihat.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Kesehatan & stamina: Saat lingkungan berubah, tubuhmu juga butuh masa adaptasi. Ketika pindah rumah atau kerja baru, jaga tidur dan makan terutama di minggu-minggu awal. Setelah terlewati, kebiasaan yang lebih sehat akan terbentuk.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Kerja & belajar: Memecah target jadi bagian kecil lalu mencentangnya cocok untukmu. Kamu dipercaya di bidang yang butuh ketelitian seperti perencanaan, manajemen, akuntansi, atau IT, dan tanggung jawabmu terus membesar. Jangan tunggu sempurna, mulailah saat siap 70%.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Kerja & belajar: Bakat sejatimu muncul saat menciptakan hal baru, bukan pekerjaan dengan jawaban pasti. Kebiasaan mencatat ide saat itu juga menjadi aset besar. Mengatur jadwal mungkin kelemahanmu, berpasangan dengan rekan yang teliti membuat hasil jauh lebih baik.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Kerja & belajar: Kamu cepat memutuskan dan sigap bertindak, jadi bersinar di pekerjaan yang butuh kecepatan seperti lapangan, penjualan, atau usaha rintisan. Fokus singkat lalu melihat hasil lebih cocok daripada lama berkutat pada satu hal. Sebelum keputusan besar, tidurkan semalam dulu, kesalahan akan jauh berkurang.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Cinta & relasi: Saat mencintai kamu memberi tanpa hitung-hitungan, pasangan merasa sangat aman. Sahabat lama dan keluarga menjadi penopang besar hidupmu. Kamu bisa kecewa bila balasannya tak sebanding, jadi latih mengungkapkan keinginanmu.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Cinta & relasi: Kamu tak mudah membuka hati, tapi sekali percaya setia sampai akhir. Kamu menunjukkan cinta lewat perhatian tulus yang konsisten, bukan kejutan mewah. Sesekali ungkapkan sedikit lebih banyak, pasangan akan merasakannya jauh lebih kuat.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Cinta & relasi: Pesonamu menarik orang, relasimu banyak, dan kamu sering jadi pusat perkumpulan. Melatih mata untuk mengenali siapa yang benar-benar di pihakmu membuat hubunganmu jauh lebih kokoh. Peluang baik datang dari pertemuan baru, tetaplah terbuka.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Rezeki & karier: Kamu tekun mendalami satu bidang, jadi penghasilan naik stabil seiring karier. Cara yang membuat waktu berpihak padamu, seperti menabung rutin atau investasi jangka panjang, sangat cocok. Simpan sertifikat atau catatan prestasi yang membuktikan keahlianmu agar peluang datang lebih cepat.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Rezeki & karier: Rezekimu makin besar seiring waktu, jadi kuncinya jangan terburu-buru. Pengalaman dan relasi yang dikumpulkan akan kembali sebagai hasil besar, bahkan bisa sukses besar di hal yang dimulai belakangan. Sekarang, fokuslah menutup kebocoran uang daripada mengejar penghasilan besar.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Rezeki & karier: Rezekimu hidup saat penghasilan sesuai kemampuan, bukan gaji tetap. Membangun beberapa sumber penghasilan seperti kerja sampingan, freelance, atau usaha kecil sangat cocok. Penghasilan bisa naik-turun, jadi pastikan menyisihkan biaya hidup beberapa bulan sebagai dana darurat.", "👑 리더형 손금": "👑 Tipe pemimpin", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Sejak dulu, tangan dengan garis hidup dan garis nasib yang jelas dikatakan banyak dimiliki pendiri usaha dan pemimpin organisasi besar. Didukung stamina dan dorongan kuat, kamu mampu menuntaskan target hingga akhir. Orang-orang alami memercayai penilaianmu, jadi jangan hindari posisi bertanggung jawab. Daripada memikul semuanya sendiri, bagi tugas kepada orang terpercaya agar keberuntunganmu makin besar.", "🎨 예술가형 손금": "🎨 Tipe seniman", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Secara tradisi, tangan dengan garis kepala melengkung lembut ke bawah banyak dimiliki seniman, penulis, dan desainer. Kamu peka merasakan dan mengekspresikan hal yang tak terlihat orang lain. Saat tenggelam dalam hal yang disukai kamu lupa waktu, dan fokus itu adalah hartamu. Saat gelombang emosi datang, tuangkan ke tulisan atau gambar, karya bagus bisa lahir.", "🌳 대기만성형 손금": "🌳 Tipe sukses belakangan", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "Tangan dengan garis nasib yang dimulai di tengah telapak disebut tipe sukses belakangan: mekar terlambat tapi berhasil besar. Semua coba-coba di masa muda menjadi pupuk untuk masa depan. Menjaga ritme sendiri lebih penting daripada membandingkan kecepatan dengan orang lain. Setelah paruh baya tampak aliran rezeki yang stabil dan rasa hormat.", "🧭 개척자형 손금": "🧭 Tipe perintis", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Tangan dengan garis bercabang atau menyebar bebas adalah tipe perintis yang membuka jalan baru, bukan mengikuti jalur yang ada. Kamu justru meraih peluang di tengah perubahan seperti ganti kerja, pindah rumah, atau tantangan. Hanya mengejar rasa aman bisa membuatmu sesak, jadi teruslah mencoba hal baru walau kecil. Saat berbagai pengalaman menyatu, hasil luar biasa akan lahir.", "♟️ 전략가형 손금": "♟️ Tipe ahli strategi", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Tangan dengan garis kepala lurus adalah tipe ahli strategi atau penasihat yang tepat dalam perhitungan dan penilaian. Kamu melihat gambaran besar dan membaca risiko lebih dulu, sehingga dibutuhkan di organisasi mana pun. Nilai sejatimu muncul saat menyusun strategi di balik layar, bukan tampil di depan. Sesekali lepaskan hitung-hitungan dan percayai intuisi, keberuntungan tak terduga bisa datang.", "⚖️ 균형형 손금": "⚖️ Tipe seimbang", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Tangan yang tidak condong ke satu garis adalah tipe seimbang yang cakap di banyak bidang. Kamu pandai memp hazırken başla.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "İş ve eğitim: Asıl yeteneğin, cevabı belli işlerden çok yeni şeyler yaratırken ortaya çıkar. Fikirleri anında not etmek büyük bir hazine olur. Zaman yönetimi zayıf yanın olabilir; titiz bir partnerle çalışmak sonuçları çok iyileştirir.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "İş ve eğitim: Hızlı karar verip iyi uygularsın; saha, satış, girişim gibi hızın önemli olduğu işlerde parlarsın. Bir şeye uzun süre takılmaktansa kısa odaklanıp sonuç görmek sana uyar. Büyük kararlardan önce bir gece uyuyup yeniden bakarsan hataların ciddi azalır.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Aşk ve ilişkiler: Severken cömertçe verirsin, partnerin derin bir güven hisseder. Eski dostlar ve aile hayatının büyük dayanaklarıdır. Verdiğinin karşılığını alamayınca kırılabilirsin; isteklerini dile getirmeyi dene.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Aşk ve ilişkiler: Kolay açılmazsın ama bir kez güvenince sonuna kadar sadık kalırsın. Sevgini gösterişli jestlerden çok istikrarlı, içten ilgiyle gösterirsin. Biraz daha ifade edersen partnerin sevgini çok daha güçlü hisseder.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Aşk ve ilişkiler: Çekiciliğin insanları toplar, çok bağlantın olur ve doğal olarak ortamın merkezi olursun. Gerçekten yanında olanları ayırt etmeyi öğrenmek ilişkilerini çok güçlendirir. Güzel fırsatlar yeni tanışmalardan gelir, kalbini açık tut.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Para ve kariyer: Tek bir alanda derinleşip başarı elde edersin; kariyerin geliştikçe gelirin istikrarlı artar. Düzenli birikim ya da uzun vadeli yatırım gibi zamanın lehine işlediği yöntemler sana uyar. Uzmanlığını kanıtlayan belge ve kayıtları sakla, fırsatlar daha erken gelir.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Para ve kariyer: Servet şansın ileriki yıllarda büyür; acele etmemek anahtar. Biriktirdiğin deneyim ve çevre büyük ürünler olarak döner, geç başladığın bir işte bile büyük başarı gelebilir. Şimdilik çok kazanmaktan çok para sızıntılarını durdurmaya odaklan.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Para ve kariyer: Sabit maaştan çok yeteneğin kadar kazandığın düzende servet şansın canlanır. Yan iş, serbest çalışma, küçük girişim gibi birden fazla gelir kaynağı sana uyar. Gelirin dalgalanabilir; birkaç aylık yaşam masrafını mutlaka acil fon olarak ayır.", "👑 리더형 손금": "👑 Lider tipi el", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Eskiden beri hayat ve kader çizgisi belirgin elin büyük kuruluşları yöneten girişimci ve liderlerde sık görüldüğü söylenir. Dayanıklılık ve azmin sayesinde hedefini sonuna kadar götürürsün. İnsanlar kararlarına doğal olarak güvenip seni izler; sorumluluk gerektiren yerlerden kaçma. Her şeyi tek başına taşımak yerine güvendiğin kişilerle paylaş, şansın daha da büyür.", "🎨 예술가형 손금": "🎨 Sanatçı tipi el", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Geleneğe göre akıl çizgisi aşağı doğru yumuşakça kıvrılan el sanatçı, yazar ve tasarımcılarda sık görülür. Başkalarının görmediğini hissedip ifade etme yeteneğin güçlü. Sevdiğin işe dalınca zamanı unutursun; o dalış senin hazinen. Duygu dalgaları gelince onları yazıya ya da çizime dök, güzel eserler doğabilir.", "🌳 대기만성형 손금": "🌳 Geç parlayan el", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "Kader çizgisi avucun ortasından başlayan ele geç açan ama büyük başaran tip denir. Gençlikteki tüm deneme yanılmalar sonrası için gübre olur. Başkalarıyla hız yarışından çok kendi temposunu korumak önemli. Orta yaştan sonra istikrarlı servet ve saygı birlikte gelir.", "🧭 개척자형 손금": "🧭 Öncü tipi el", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Çizgileri çatallanan ya da serbestçe uzanan el, hazır yolları izlemek yerine yeni yollar açan öncü tiptir. İş değişikliği, taşınma, meydan okuma gibi değişimlerin ortasında fırsat yakalarsın. Sadece güvenliği kovalamak seni bunaltabilir; küçük de olsa yeni denemeler yap. Deneyimlerin bir araya geldiği an olağanüstü bir başarı doğar.", "♟️ 전략가형 손금": "♟️ Stratejist tipi el", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Akıl çizgisi düz uzanan el, hesap ve kararları isabetli stratejist ya da danışman tipidir. Büyük resmi görür, riskleri önceden okursun; her kurumda vazgeçilmez olursun. Önde durmaktan çok arka planda oyunu kurarken gerçek değerini gösterirsin. Ara sıra hesabı bırakıp sezgine güven, beklenmedik şans gelebilir.", "⚖️ 균형형 손금": "⚖️ Dengeli tip el", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Hiçbir çizgiye ağırlık vermeyen el, pek çok alanda başarılı dengeli tiptir . Стань сегодня для кого-то тенью.", "작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.": "Маленькая искра согревает целую комнату. Твоя улыбка сегодня — эта искра.", "타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.": "Свет — это не только то, что пылает. Мягко освещать тех, кто рядом, — тоже сила.", "마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.": "Если сердце остыло, сделай глубокий вдох. Искра всё ещё там.", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "Один громкий смех сегодня меняет температуру всего дня.", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "Земля молча держит всё. Просто пережить сегодня — уже большое дело.", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "Тропа, протоптанная медленно, ведёт дальше всех. Сегодня хватит одного шага.", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "Сытная еда задаёт центр дня. Хорошо накорми себя сегодня.", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "У кого глубокие корни, тот улыбается даже на ветру. Доверяй своим корням.", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "Металл крепнет, пройдя через огонь. Нынешние трудности шлифуют тебя.", "맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.": "Звон чистого колокола разносится далеко. Твоё слово сегодня дойдёт так же.", "깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.": "Глубоко вдохни и расправь плечи. Когда открывается грудь, открывается и сердце.", "정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.": "Порядок на столе и в голове похожи. Освободи сегодня одну вещь — станет легче.", "물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.": "Вода обходит преграды и отдыхает, когда застаивается. Отдых — тоже часть течения.", "깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.": "Глубокая вода течёт бесшумно. День тихой работы тоже прекрасен.", "오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.": "Сегодня не спеши, просто теки. В конце концов море принимает всю воду.", "따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.": "Стакан тёплой воды смягчает сердце. Остановись на минуту и позаботься о себе.", "오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.": "Эмоциональный ритм сегодня низкий. Будь к себе чуть добрее.", "오늘은 차분하게 균형을 지키기 좋 을 내리기 전 한 번 식혀 보세요.": "Яркий и тёплый, как солнце. Честный и страстный, освещаешь всё вокруг. Эмоции вспыхивают быстро — остынь, прежде чем решать.", "태어난 시": "Время рождения", "태어난 시 모름": "Время неизвестно", "토끼": "Кролик", "토정비결": "Тходжон Пигёль", "토정비결 · 사주팔자 · 오늘의 운세": "Тходжон Пигёль · Четыре столпа · Гороскоп", "토정비결·사주·운세는 전통 계산법을 바탕으로 한 재미와 참고용이에요.": "Тходжон Пигёль, Четыре столпа и гороскопы — для развлечения, на основе традиционных методов.", "투자보다 저축이 이로운 해예요.": "В этом году копить лучше, чем инвестировать.", "파이오니어": "Pioneer", "평온하게 흘러가는 날이에요. 꾸준히 할 일을 해 나가세요.": "Спокойный день. Делай свои дела размеренно.", "프리미엄": "Премиум", "프리미엄에서 몸 분석, 맞춤 음식, 운동 따라하기, 영양 가이드를 모두 쓸 수 있어요. 한 번 열면 계속 쓸 수 있어요.": "Премиум открывает Проверку тела, Еду для меня, Упражнения за мной и Гид по питанию. Открываешь один раз — навсегда.", "하는 일마다 손발이 맞는 달이에요. 미뤄 둔 일을 처리하기 좋아요.": "В этом месяце всё складывается. Отлично для отложенных дел.", "하던 일을 깊게 파고들면 길이 보여요.": "Углубись в то, чем занимаешься, — и путь откроется.", "하반기로 갈수록 운이 올라가요. 늦게 피는 꽃이 더 오래 가듯, 연말에 웃게 돼요.": "Удача растёт ко второй половине года. Как поздний цветок держится дольше, к концу года ты будешь улыбаться.", "하반기엔 정리와 마무리에 힘쓰면 좋아요. 새 일보다 하던 일을 끝내는 게 이득이에요.": "Во второй половине сосредоточься на завершении. Закончить начатое выгоднее, чем начинать новое.", "한 단계 올라서는 도약의 해예요. 중요한 결정을 내려야 할 순간이 오는데, 충분히 준비했다면 과감하게 건너도 좋아요. 건넌 뒤엔 넓은 들판이 기다려요.": "Год рывка на новый уровень. Придёт важное решение — если готов, переходи смело. На том берегу ждёт широкое поле.", "한 해 내내 고르게 흘러가요. 큰 굴곡 없이 꾸준함이 결실을 맺어요.": "Весь год течёт ровно. Без больших взлётов и падений постоянство приносит плоды.", "한 해 총운": "Обзор года", "햇볕 쬐기, 즐거운 모임": "солнце и весёлые встречи", "호랑이": "Тигр", "혼자보다 함께할 때 성과가 커요.": "Вместе добьёшься большего, чем один.", "환절기": "смена сезонов", "활발하고 자유로워 어디로든 달려가요. 솔직하고 사람을 좋아해요.": "Живой и свободный, мчишься куда угодно. Честный и общительный.", "흰색": "Белый", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠 보세요.": "Сегодня эмоции ясные. Поделись этой энергией с окружающими.", "시주": "Час", "좋은 달": "Хорошие месяцы", "조심할 달": "Месяцы осторожности", "올해의 행운": "Удача года", "달을 누르면 그 달의 운세를 볼 수 있어요.": "Нажми на месяц, чтобы увидеть прогноз.", "← 올해 운세": "← Год", "{0}월 운세": "Месяц {0}", "좋은 흐름": "Хороший поток", "무난한 흐름": "Ровно", "조심할 흐름": "Осторожно", "이달에 눈여겨볼 분야": "Фокус месяца", "이달의 행운의 날: 음력 {0}일": "Счастливый день: лунный {0}-й день", "이전 달": "Предыдущий", "다음 달": "Следующий", "좋음": "Хорошо", "보통": "Нормально", "조심": "Осторожно", "음악 켬": "Музыка вкл.", "음악 끔": "Музыка выкл.", "올해는 '시작'이 열쇠예요. 완벽하게 준비될 때를 기다리기보다 작게 시작해서 고쳐 나가는 쪽이 운을 부르는 해예요. 새로 배우는 것과 새로 만나는 사람에게 마음을 열어 두세요.": "В этом году ключ — «начать». Вместо того чтобы ждать идеальной готовности, начни с малого и поправляй по ходу — так приходит удача. Открой сердце новому и новым людям.", "올해는 '유연함'이 열쇠예요. 계획대로 되지 않는 일이 생겨도 다른 길을 찾으면 오히려 더 좋은 결과로 이어져요. 서두르고 싶은 마음이 들 때마다 한 번 쉬어 가는 여유를 가지세요.": "В этом году ключ — «гибкость». Даже если что-то идёт не по плану, другой путь приведёт к лучшему результату. Когда торопишься, дай себе паузу.", "올해는 '드러냄'이 열쇠예요. 그동안 쌓아 둔 실력과 생각을 보여 줄 기회가 찾아와요. 주목받는 만큼 겸손함을 잃지 않으면 좋은 평판이 오래 가요.": "В этом году ключ — «проявить себя». Появится шанс показать накопленные умения и идеи. Сохраняй скромность при растущем внимании — и добрая слава будет долгой.", "올해는 '변화'가 열쇠예요. 익숙한 자리를 떠나는 일이 생겨도 두려워하지 마세요. 바뀐 환경에서 새로운 인연과 기회가 기다리고 있어요. 큰 결정은 하나씩 차례대로 하세요.": "В этом году ключ — «перемены». Не бойся покидать привычное. В новой обстановке ждут новые связи и возможности. Большие решения принимай по одному.", "올해는 '꾸준함'이 열쇠예요. 눈에 띄는 변화보다 매일 반복하는 작은 습관이 큰 차이를 만들어요. 돈도 건강도 차곡차곡 모으는 만큼 연말에 든든해져요.": "В этом году ключ — «постоянство». Маленькие ежедневные привычки значат больше ярких перемен. Чем больше копишь — денег и здоровья, — тем спокойнее к концу года.", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "В этом году ключ — «отпустить». Чем больше старого груза и обид ты сложишь, тем легче телу и душе. Освободившееся место заполнит хорошее.", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "В этом году ключ — «люди». Вместе всё получается лучше, чем в одиночку. Первым вырази благодарность — и эти связи вернутся большим благом.", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "В этом году ключ — «смелость». Пора шагнуть к вызову, который долго откладывал. Если готов — доверься и иди вперёд. По ту сторону встретишь повзрослевшего себя.", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "{0}: хорошая энергия продолжается. Время воплощать отложенные планы.", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "{0}: всё течёт спокойно, без больших взлётов и падений. Продолжай своё.", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "{0}: стоит быть осторожнее. Не спеши, береги здоровье и следи за расходами.", "올해의 큰 흐름": "Большое течение года", "올해의 조언": "Совет на год", "상반기": "Первая половина", "하반기": "Вторая половина", "계절별 흐름": "По сезонам", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "В этом месяце энергия в целом растёт. Если ты что-то готовил — доставай сейчас. Маленькое решение может дать больший результат, чем кажется.", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "Помощь и поддержка приходят сами. Делись, а не неси всё в одиночку — и радость удвоится. Чем больше благодарности, тем крепче удача.", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "Задуманное набирает скорость. Но чем лучше идёт, тем важнее основы. Держи слово и сроки — и хороший поток продолжится в следующем месяце.", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "Открывается дверь к новым возможностям. Прислушайся даже к предложениям, мимо которых обычно проходишь. Удачу приносит любопытство, а не колебания.", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "Тихий месяц без больших событий. Именно сейчас лучший уход — сохранять привычный ритм. Хорошо есть и спать — уже копить силы на следующий месяц.", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "Хорошее и огорчающее смешиваются поровну. Не уходи в крайности — с балансом месяц пройдёт гладко. Хвали себя за маленькие победы.", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "Хороший месяц, чтобы тихо укрепить основу. Лучше разобрать отложенное и поучиться, чем затевать перемены. Посеянное сейчас взойдёт в следующем сезоне.", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "Поток ровный — дай сердцу простор. Побудь с близкими или прогуляйся налегке. Спокойный ум замечает следующий шанс.", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "Чуть поспешишь — и дела расходятся. Отложи важные решения на день-два. Медленно — на самом деле быстрее всего.", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "Тело и душа быстро устают. Сократи тяжёлые планы и обязательно отдыхай. Когда спокойно тебе, спокойно и окружающим.", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "Следи за каждым словом и каждой копейкой — и месяц пройдёт спокойно. Когда эмоции растут, сделай вдох перед ответом. Трать только на нужное.", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "Мелкие ошибки случаются легко — будь внимателен. Перепроверяй документы и встречи, в пути думай о безопасности. Чем осторожнее, тем легче следующий месяц.", "이달의 운세": "Этот месяц", "분야별 흐름": "По сферам", "이달의 한마디": "Слово месяца", "이달의 행운": "Удача месяца", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "Дата рождения и фото сохраняются в твоём аккаунте Pi и остаются даже после закрытия п еру. Сделайте фото кнопкой ниже.", "찍기": "Снять", "{0}으로 보기": "Смотреть по {0} руке", "손바닥 윤곽을 맞추는 중…": "Выравниваем контур ладони…", "생명선 찾는 중…": "Ищем линию жизни…", "두뇌선 찾는 중…": "Ищем линию ума…", "감정선 찾는 중…": "Ищем линию сердца…", "운명선 찾는 중…": "Ищем линию судьбы…", "스캔 완료!": "Сканирование завершено!", "사진 속 점선 위치의 내 손금과 가장 비슷한 모양을 골라 주세요": "Сравните пунктир с ладонью и выберите самый похожий вариант", "손금 풀이 보기": "Смотреть толкование", "나의 손금 풀이": "Моё толкование ладони", "한마디": "Коротко", "손금 풀이는 전통 해석을 바탕으로 한 재미와 참고용이에요. 사진은 휴대폰 안에서만 쓰이고 서버에 저장되지 않아요.": "Толкование основано на традиции и носит развлекательный характер. Фото остаётся в телефоне и не сохраняется на сервере.", "다시 찍기": "Переснять", "아직 고르지 않은 손금이 있어요: {0}": "Ещё не выбрана линия: {0}", "스캔 결과로 손금 모양을 자동으로 골랐어요. 내 손과 다르면 아래에서 바꿀 수 있어요": "Мы подобрали линии по результатам сканирования. Если что-то не так, измените ниже.", "보고 싶은 손금을 눌러 보세요": "Нажмите на линию", "총평": "Общий итог", "닮은 손금 유형": "Ваш тип ладони", "한눈에 보기": "Кратко", "건강·체력운: 타고난 체력이 좋아 바쁜 시기에도 쉽게 지치지 않아요. 다만 몸을 믿고 무리하는 습관이 생기기 쉬우니, 한 달에 한 번은 푹 쉬는 날을 정해 두세요. 걷기나 등산처럼 오래 꾸준히 하는 운동이 이 손금과 가장 잘 맞아요.": "Здоровье и силы: у вас природная выносливость, вы мало устаёте даже в загруженные периоды. Но, полагаясь на силы, легко перестараться — выделяйте один полноценный день отдыха в месяц. Лучше всего подходят долгие равномерные нагрузки: прогулки, походы.", "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Здоровье и силы: если тратить энергию разом, она быстро кончается, поэтому важен ритм коротких частых передышек. Тёплая еда и регулярный сон — ваше лучшее лекарство. Записывайте удачные и тяжёлые дни — и быстро найдёте свой способ заботы о себе.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Здоровье и силы: при смене обстановки организму тоже нужна адаптация. При переезде или новой работе первые недели особенно следите за сном и питанием. Пройдя этот этап, вы закрепите более здоровые привычки, чем прежде.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Работа и учёба: вам подходит дробить цели на мелкие шаги и вычёркивать их. Вы заслуживаете доверие в точных сферах — планировании, управлении, бухгалтерии, IT, и ваши задачи со временем растут. Не ждите идеальной готовности — начинайте на 70%.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Работа и учёба: ваш настоящий талант раскрывается в создании нового, а не в задачах с готовым ответом. Привычка сразу записывать идеи станет большим капиталом. Планирование может хромать — в паре с аккуратным коллегой результаты будут гораздо лучше.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Работа и учёба: вы быстро решаете и хорошо действуете, поэтому сильны там, где важна скорость: в полевой работе, продажах, стартапах. Короткие рывки с быстрым результатом подходят больше, чем долгая возня с одним делом. Перед важными решениями «переспите» с ними — ошибок станет гораздо меньше.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Любовь и отношения: в любви вы отдаёте щедро, и партнёр чувствует глубокую надёжность. Старые друзья и семья — большая опора в жизни. Вас может ранить, если получаете меньше, чем отдаёте, — учитесь проговаривать свои ожидания.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Любовь и отношения: вы не сразу открываетесь, но, доверившись, верны до конца. Любовь выражаете постоянным искренним вниманием, а не яркими жестами. Чуть больше слов — и партнёр почувствует ваши чувства гораздо сильнее.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Любовь и отношения: ваше обаяние притягивает людей, у вас много связей, и вы естественно в центре компании. Научившись распознавать тех, кто по-настоящему на вашей стороне, вы сделаете отношения гораздо крепче. Хорошие шансы приходят с новыми знакомствами — будьте открыты.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Деньги и карьера: вы углубляетесь в одно дело, поэтому доход стабильно растёт вместе с опытом. Вам подходят способы, где время работает на вас: регулярные накопления, долгосрочные вложения. Сохраняйте сертификаты и достижения, подтверждающие экспертизу, — возможности придут быстрее.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Деньги и карьера: денежная удача растёт со временем, поэтому главное — не спешить. Накопленный опыт и связи вернутся большими плодами, и даже дело, начатое поздно, может принести крупный успех. Сейчас лучше сосредоточиться на том, чтобы закрыть утечки денег, а не на больших заработках.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Деньги и карьера: денежная удача оживает, когда вы зарабатываете по способностям, а не на фиксированной зарплате. Вам подходят несколько источников дохода: подработка, фриланс, небольшой бизнес. Доход может скакать, поэтому обязательно отложите на несколько месяцев жизни про запас.", "👑 리더형 손금": "👑 Ладонь лидера", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Издавна говорят, что рука с чёткими линиями жизни и судьбы бывает у основателей бизнеса и лидеров крупных организаций. Выносливость и напор позволяют вам доводить цели до конца. Люди естественно доверяют вашим решениям — не избегайте ответственных постов. Не тащите всё в одиночку: делитесь задачами с надёжными людьми, и удача станет ещё больше.", "🎨 예술가형 손금": "🎨 Ладонь художника", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "По традиции считают, что рука с мягко изогнутой вниз линией ума часто встречается у художников, писателей и дизайнеров. Вы умеете чувствовать и выражать то, что другие не замечают. Увлёкшись любимым делом, вы забываете о времени — и эта увлечённость ваше богатство. Когда накатывают эмоции, выплёскивайте их в текст или рисунок — может родиться отличная работа.", "🌳 대기만성형 손금": "🌳 Ладонь позднего успеха", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "Рука, где линия судьбы начинается с середины ладони, называется типом позднего успеха: расцветает поздно, но добивается многого. Все пробы и ошибки молодости становятся почвой для будущего. Важнее держать свой темп, чем сравнивать скорость с другими. После середины жизни видны стабильный достаток и уважение.", "🧭 개척자형 손금": "🧭 Ладонь первопроходца", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Рука с ветвящимися или свободно идущими линиями — тип первопроходца, который прокладывает новые пути, а не идёт проторёнными. Вы ловите шансы именно в переменах: смена работы, переезд, вызов. Погоня только за стабильностью может вас душить — пробуйте новое, пусть понемногу. Когда весь опыт сложится воедино, вы добьётесь выдающегося результата.", "♟️ 전략가형 손금": "♟️ Ладонь стратега", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Рука с прямой линией ума — тип стратега или советника, точного в расчётах и суждениях. Вы видите общую картину и заранее читаете риски, поэтому незаменимы в любой организации. Настоящую ценность вы проявляете, выстраивая игру за кулисами, а не на передовой. Иногда откладывайте расчёты и доверяйте интуиции — может прийти неожиданная удача.", "⚖️ 균형형 손금": "⚖️ Гармоничная ладонь", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Рука без перекоса в какую-то одну линию — гармоничный тип, успешный во многих сферах. Вы умеете одновременно заботиться о людях, работе и здоровье и хорошо адаптируетесь где угодно. Выберите период, чтобы сосредоточиться на одном деле, — и скрытые таланты ярко проявятся. Чем больше постоянства, тем сильнее вместе растут доверие окружающих и удача.", "생활패턴 수정": "Изменить привычки", "생활패턴을 저장했어요": "Привычки сохранены", "나의 하루 생활패턴": "Мой распорядок дня", "나의 손금": "Моя ладонь", "{0} 손바닥을 화면 가득 쫙 펴서 찍어 주세요": "Раскройте ладонь {0} руки на весь экран и сделайте фото", "광고 보고 +{0} 토큰": "Смотреть рекламу +{0} токенов", "오늘 {0}/{1}회": "сегодня {0}/{1}", "광고 준비 중이에요": "Реклама скоро появится", "오늘 광고 보상을 다 받았어요": "Все награды за рекламу на сегодня получены", "광고를 불러오지 못했어요. 잠시 후 다시 해 주세요.": "Не удалось загрузить рекламу. Попробуйте позже.", "광고 시청 확인이 안 됐어요": "Просмотр не подтверждён", "토큰 순위": "Рейтинг токенов", "나의 순위": "Моё место", "{0}위": "№{0}", "아직 순위가 없어요": "Рейтинга пока нет", "매달 토큰을 많이 모은 분께 건강용품을 드릴 예정이에요. Pi 정책에 따라 바뀌거나 빠질 수 있어요.": "Каждый месяц планируем дарить лидерам по токенам товары для здоровья. Может измениться или отмениться по правилам Pi.", "항목당 0.1π 또는 100토큰": "0,1π или 100 токенов за раздел", "100 토큰으로 열기": "Открыть за 100 токенов", "토큰 순위 보기": "Посмотреть рейтинг", "광고를 끝까지 봐야 토큰을 받아요": "Досмотрите рекламу до конца, чтобы получить токены"}, "el": {"생년월일": "Ημερομηνία γέννησης", "성별": "Φύλο", "여성": "Γυναίκα", "남성": "Άνδρας", "모름": "Δεν ξέρω", "목": "Ξύλο", "화": "Φωτιά", "토": "Γη", "금": "Μέταλλο", "수": "Νερό", "목(木)": "Ξύλο(木)", "화(火)": "Φωτιά(火)", "토(土)": "Γη(土)", "금(金)": "Μέταλλο(金)", "수(水)": "Νερό(水)", "나무는 하루아침에 자라지 않아도 매일 해를 향해 갑니다. 오늘도 그 방향이면 충분해요.": "Ένα δέντρο δεν μεγαλώνει σε μια νύχτα, αλλά κάθε μέρα στρέφεται στον ήλιο. Αρκεί σήμερα να κοιτάς προς τα εκεί.", "오늘 내디딘 한 걸음이 내일의 새싹이 돼요. 서두르지 않아도 괜찮아요.": "Το βήμα που έκανες σήμερα γίνεται το αυριανό βλαστάρι. Δεν χρειάζεται βιασύνη.", "굽은 가지도 결국 빛을 찾아 자랍니다. 지금 모습 그대로 괜찮아요.": "Ακόμη και ένα στραβό κλαδί τελικά μεγαλώνει προς το φως. Είσαι καλά όπως είσαι.", "숲은 서로의 그늘을 나눠 크는 법이에요. 오늘 누군가에게 그늘이 되어주세요.": "Ένα δάσος μεγαλώνει μοιράζοντας τη σκιά του. Γίνε σήμερα σκιά για κάποιον.", "작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.": "Μια μικρή σπίθα ζεσταίνει ολόκληρο δωμάτιο. Το σημερινό σου χαμόγελο είναι αυτή η σπίθα.", "타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.": "Φως δεν είναι μόνο ό,τι φλέγεται. Το να φωτίζεις απαλά όσους είναι δίπλα σου είναι κι αυτό δύναμη.", "마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.": "Αν η καρδιά σου κρύωσε, πάρε μια βαθιά ανάσα. Η σπίθα είναι ακόμη εκεί.", "오늘 한 번 크게 웃으면 하루의 온도가 달라져요.": "Ένα δυνατό γέλιο σήμερα αλλάζει τη θερμοκρασία όλης της μέρας.", "땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.": "Η γη σηκώνει σιωπηλά τα πάντα. Το να αντέξεις σήμερα είναι ήδη μεγάλο πράγμα.", "천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.": "Το μονοπάτι που πατήθηκε αργά πάει πιο μακριά. Σήμερα αρκεί ένα βήμα.", "든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.": "Ένα χορταστικό γεύμα ισορροπεί τη μέρα σου. Τάισε καλά τον εαυτό σου σήμερα.", "뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.": "Όποιος έχει βαθιές ρίζες χαμογελά ακόμη και στον αέρα. Εμπιστέψου τις ρίζες σου.", "쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.": "Το μέταλλο σκληραίνει περνώντας από τη φωτιά. Η τωρινή δυσκολία σε σμιλεύει.", "맑은 종소리는 멀리 퍼져요. 오늘 건네는  κάνουν μεγαλύτερη διαφορά από τις εντυπωσιακές αλλαγές. Όσο αποταμιεύεις, χρήματα και υγεία, τόσο πιο ήσυχος θα είσαι στο τέλος.", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "Φέτος το κλειδί είναι το «άφημα». Όσο αφήνεις παλιά βάρη και πικρίες, τόσο ελαφραίνουν σώμα και μυαλό. Καλά πράγματα θα γεμίσουν τον χώρο που αδειάζεις.", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "Φέτος το κλειδί είναι οι «άνθρωποι». Μαζί τα πράγματα πάνε καλύτερα απ' ό,τι μόνος. Έκφρασε πρώτος την ευγνωμοσύνη σου και οι δεσμοί θα επιστρέψουν ως μεγάλη ευλογία.", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "Φέτος το κλειδί είναι το «θάρρος». Ήρθε η ώρα για το βήμα προς την πρόκληση που ανέβαλλες. Αν είσαι έτοιμος, εμπιστέψου και προχώρα. Απέναντι θα συναντήσεις έναν πιο ώριμο εαυτό.", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "Το {0} η καλή ενέργεια συνεχίζεται. Καλή στιγμή για τα σχέδια που ανέβαλλες.", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "Το {0} όλα κυλούν ήρεμα χωρίς μεγάλα σκαμπανεβάσματα. Συνέχισε.", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "Το {0} χρειάζεται λίγη προσοχή. Μη βιάζεσαι, πρόσεχε υγεία και έξοδα.", "올해의 큰 흐름": "Η μεγάλη ροή της χρονιάς", "올해의 조언": "Συμβουλή της χρονιάς", "상반기": "Πρώτο εξάμηνο", "하반기": "Δεύτερο εξάμηνο", "계절별 흐름": "Εποχή με εποχή", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "Αυτόν τον μήνα η ενέργεια ανεβαίνει συνολικά. Αν ετοίμαζες κάτι, βγάλ' το τώρα. Μια μικρή απόφαση μπορεί να φέρει μεγαλύτερο αποτέλεσμα απ' ό,τι περιμένεις.", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "Βοήθεια και στήριξη μαζεύονται φυσικά. Μοιράσου αντί να τα κουβαλάς μόνος και η χαρά διπλασιάζεται. Όσο δείχνεις ευγνωμοσύνη, τόσο σταθεροποιείται η τύχη.", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": " "건강·체력운: 에너지를 한 번에 몰아 쓰면 금방 바닥나는 타입이라, 짧게 자주 쉬는 리듬이 중요해요. 따뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "Υγεία και αντοχή: Αν ξοδεύεις την ενέργεια μονομιάς, τελειώνει γρήγορα· χρειάζεσαι ρυθμό με σύντομα, συχνά διαλείμματα. Ζεστό φαγητό και τακτικός ύπνος είναι το καλύτερο φάρμακο. Κατέγραψε καλές και κακές μέρες και θα βρεις γρήγορα τη δική σου φροντίδα.", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "Υγεία και αντοχή: Όταν αλλάζει το περιβάλλον, και το σώμα περνά περίοδο προσαρμογής. Σε μετακόμιση ή νέα δουλειά, πρόσεξε ιδιαίτερα ύπνο και φαγητό τις πρώτες εβδομάδες. Μετά, ριζώνουν πιο υγιεινές συνήθειες από πριν.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "Δουλειά και μάθηση: Σου ταιριάζει να σπας τους στόχους σε μικρά κομμάτια και να τα ολοκληρώνεις ένα ένα. Κερδίζεις εμπιστοσύνη σε τομείς ακρίβειας όπως σχεδιασμός, διοίκηση, λογιστική ή IT, και οι ευθύνες σου μεγαλώνουν. Μην περιμένεις την τελειότητα· ξεκίνα στο 70%.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "Δουλειά και μάθηση: Το πραγματικό σου ταλέντο φαίνεται στη δημιουργία νέων πραγμάτων, όχι σε έτοιμες απαντήσεις. Το να σημειώνεις αμέσως τις ιδέες γίνεται μεγάλο κεφάλαιο. Ο προγραμματισμός ίσως είναι αδυναμία· με έναν σχολαστικό συνεργάτη τα αποτελέσματα βελτιώνονται πολύ.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "Δουλειά και μάθηση: Αποφασίζεις γρήγορα και εκτελείς καλά, γι' αυτό λάμπεις όπου μετράει η ταχύτητα: πεδίο, πωλήσεις, νεοφυείς επιχειρήσεις. Σου ταιριάζουν σύντομα ξεσπάσματα συγκέντρωσης με γρήγορα αποτελέσματα. Πριν από μεγάλες αποφάσεις κοιμήσου ένα βράδυ και τα λάθη θα μειωθούν πολύ.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "Αγάπη και σχέσεις: Στην αγάπη δίνεις απλόχερα και ο άλλος νιώθει βαθιά ασφάλεια. Παλιοί φίλοι και οικογένεια είναι μεγάλα στηρίγματα. Μπορεί να πληγωθείς όταν δεν παίρνεις όσα δίνεις· εξασκήσου να λες τι επιθυμείς.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "Αγάπη και σχέσεις: Δεν ανοίγεσαι εύκολα, αλλά όταν εμπιστευτείς μένεις πιστός ως το τέλος. Δείχνεις αγάπη με σταθερή, ειλικρινή φροντίδα αντί για εντυπωσιακές κινήσεις. Αν εκφράζεσαι λίγο περισσότερο, ο άλλος θα νιώσει πολύ πιο έντονα την αγάπη σου.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "Αγάπη και σχέσεις: Η γοητεία σου τραβά κόσμο, έχεις πολλές γνωριμίες και γίνεσαι φυσικά το κέντρο της παρέας. Αν μάθεις να ξεχωρίζεις ποιοι είναι πραγματικά στο πλευρό σου, οι σχέσεις σου θα γίνουν πιο δυνατές. Οι ευκαιρίες έρχονται από νέες γνωριμίες· μείνε ανοιχτός.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "Χρήμα και καριέρα: Εμβαθύνεις σε έναν τομέα, έτσι το εισόδημα αυξάνεται σταθερά με την εμπειρία. Σου ταιριάζουν μέθοδοι όπου ο χρόνος δουλεύει για σένα, όπως τακτική αποταμίευση ή μακροπρόθεσμη επένδυση. Κράτα πιστοποιήσεις και αποδείξεις της εξειδίκευσής σου και οι ευκαιρίες θα έρθουν νωρίτερα.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "Χρήμα και καριέρα: Η οικονομική σου τύχη μεγαλώνει με τα χρόνια, οπότε το κλειδί είναι να μη βιάζεσαι. Εμπειρία και γνωριμίες θα επιστρέψουν ως μεγάλη σοδειά, και μπορεί να πετύχεις πολύ ακόμη και σε κάτι που ξεκίνησες αργά. Τώρα εστίασε στο να κλείσεις τις διαρροές χρημάτων, όχι στα μεγάλα κέρδη.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "Χρήμα και καριέρα: Η οικονομική σου τύχη ζωντανεύει όταν κερδίζεις ανάλογα με τις ικανότητές σου, όχι με σταθερό μισθό. Σου ταιριάζουν πολλές πηγές εισοδήματος: δεύτερη δουλειά, freelance, μικρή επιχείρηση. Το εισόδημα μπορεί να διακυμαίνεται, οπότε φύλαξε οπωσδήποτε έξοδα μερικών μηνών για έκτακτη ανάγκη.", "👑 리더형 손금": "👑 Παλάμη ηγέτη", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "Από παλιά λέγεται ότι το χέρι με καθαρές γραμμές ζωής και μοίρας ανήκει σε ιδρυτές και ηγέτες μεγάλων οργανισμών. Με αντοχή και ορμή έχεις τη δύναμη να φτάνεις τους στόχους ως το τέλος. Οι άνθρωποι εμπιστεύονται φυσικά την κρίση σου· μην αποφεύγεις θέσεις ευθύνης. Αντί να τα σηκώνεις όλα μόνος, μοίρασε δουλειά σε ανθρώπους εμπιστοσύνης και η τύχη σου θα μεγαλώσει.", "🎨 예술가형 손금": "🎨 Παλάμη καλλιτέχνη", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "Παραδοσιακά λέγεται ότι η παλάμη με γραμμή νου που καμπυλώνει απαλά προς τα κάτω είναι συχνή σε καλλιτέχνες, συγγραφείς και σχεδιαστές. Έχεις ευαισθησία να νιώθεις και να εκφράζεις ό,τι άλλοι δεν βλέπουν. Όταν βυθίζεσαι σε κάτι που αγαπάς ξεχνάς τον χρόνο, κι αυτή η αφοσίωση είναι ο θησαυρός σου. Όταν έρχονται κύματα συναισθημάτων, κάνε τα γραφή ή ζωγραφιά και μπορεί να γεννηθεί κάτι όμορφο.", "🌳 대기만성형 손금": "🌳 Παλάμη όψιμης επιτυχίας", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "Η παλάμη με γραμμή μοίρας που ξεκινά από τη μέση λέγεται τύπος όψιμης επιτυχίας: ανθίζει αργά αλλά πετυχαίνει πολύ. Όλες οι δοκιμές και τα λάθη της νιότης γίνονται λίπασμα για αργότερα. Πιο σημαντικό είναι να κρατάς τον δικό σου ρυθμό παρά να συγκρίνεσαι. Από τη μέση ηλικία φαίνονται σταθερός πλούτος και σεβασμός.", "🧭 개척자형 손금": "🧭 Παλάμη πρωτοπόρου", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "Παλάμη με γραμμές που διχάζονται ή απλώνονται ελεύθερα ανήκει στον πρωτοπόρο, που ανοίγει νέους δρόμους αντί να ακολουθεί τους γνωστούς. Αρπάζεις ευκαιρίες μέσα στην αλλαγή: νέα δουλειά, μετακόμιση, προκλήσεις. Αν κυνηγάς μόνο τη σταθερότητα, ασφυκτιάς· συνέχισε να δοκιμάζεις νέα πράγματα, έστω μικρά. Τη στιγμή που οι εμπειρίες σου θα ενωθούν, θα πετύχεις κάτι ξεχωριστό.", "♟️ 전략가형 손금": "♟️ Παλάμη στρατηγού", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "Παλάμη με ευθεία γραμμή νου ανήκει στον στρατηγό ή σύμβουλο, ακριβή σε υπολογισμό και κρίση. Βλέπεις τη μεγάλη εικόνα και διαβάζεις τους κινδύνους νωρίς, γι' αυτό είσαι απαραίτητος παντού. Δείχνεις την αξία σου στήνοντας το παιχνίδι από πίσω, όχι στην πρώτη γραμμή. Πότε πότε άφησε τους υπολογισμούς κι εμπιστέψου το ένστικτο· μπορεί να έρθει απρόσμενη τύχη.", "⚖️ 균형형 손금": "⚖️ Ισορροπημένη παλάμη", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "Παλάμη που δεν γέρνει προς καμία γραμμή ανήκει στον ισορροπημένο τύπο, ικανό σε πολλούς τομείς. Φροντίζεις εξίσου ανθρώπους, δουλειά και υγεία και προσαρμόζεσαι παντού. Διάλεξε μια περίοδο για να εστιάσεις σε ένα πράγμα και θα φανούν κρυμμένα ταλέντα. Όσο χτίζεται η σταθερότητά σου, μεγαλώνουν μαζί η εμπιστοσύνη των άλλων και η τύχη σου.", "생활패턴 수정": "Επεξεργασία συνηθειών", "생활패턴을 저장했어요": "Οι συνήθειές σου αποθηκεύτηκαν", "나의 하루 생활패턴": "Η καθημερινή μου ρουτίνα", "나의 손금": "Η παλάμη μο 심내지 않는 것이 가장 큰 복이에요.": "चमक-दमक नहीं, पर धीरे-धीरे जोड़ने का साल। बचत, पढ़ाई और सेहत साल के अंत में फल देंगे। लालच न करना सबसे बड़ा आशीर्वाद है।", "큰 강을 건너는 해": "महान नदी पार करने का वर्ष", "큰 나무처럼 곧고 반듯한 성품이에요. 한번 정한 목표는 끝까지 밀고 나가고, 남을 이끄는 힘이 있어요. 가끔은 굽힐 줄 아는 유연함이 더해지면 더 크게 자라요.": "ऊँचे पेड़ जैसे सीधे। लक्ष्य तय करके अंत तक जाते हैं और दूसरों को राह दिखाते हैं। थोड़ा लचीलापन आपको और ऊँचा करेगा।", "큰 바다처럼 생각이 깊고 포용력이 커요. 지혜롭고 상황을 넓게 봐요. 생각이 너무 많아질 땐 몸을 움직여 머리를 비워 보세요.": "सागर जैसे गहरे और अपनाने वाले। बुद्धिमान, बड़ी तस्वीर देखते हैं। ज़्यादा सोचें तो शरीर चलाकर मन खाली करें।", "큰 변화 없이 평온한 달이에요. 하던 일을 꾸준히 이어 가세요.": "बिना बड़े बदलाव का शांत महीना। जो कर रहे हैं, करते रहें।", "큰 산처럼 듬직하고 믿음직해요. 쉽게 흔들리지 않아 사람들이 기대요. 변화 앞에서 너무 오래 머뭇거리지만 않으면 돼요.": "बड़े पहाड़ जैसे मज़बूत और भरोसेमंद, लोग आप पर टिकते हैं। बस बदलाव के सामने ज़्यादा देर न हिचकें।", "큰돈보다 작은 돈이 꾸준히 들어와요.": "बड़ी रक़म से ज़्यादा छोटी रक़म लगातार आएगी।", "타고난 성품": "आपका स्वभाव", "태양처럼 밝고 따뜻해요. 솔직하고 열정이 넘쳐 주변을 환하게 만들어요. 감정이 금세 타오르니 결정을 내리기 전 한 번 식혀 보세요.": "सूरज जैसे उजले और गर्म। सच्चे और जोशीले, आसपास रोशन करते हैं। भावनाएँ जल्दी भड़कती हैं—फ़ैसले से पहले शांत हो जाएँ।", "태어난 시": "जन्म समय", "태어난 시 모름": "जन्म समय अज्ञात", "토끼": "ख़रगोश", "토정비결": "तोजोंग बिग्योल", "토정비결 · 사주팔자 · 오늘의 운세": "तोजोंग बिग्योल · चार स्तंभ · आज का भविष्यफल", "토정비결·사주·운세는 전통 계산법을 바탕으로 한 재미와 참고용이에요.": "तोजोंग बिग्योल, चार स्तंभ और भविष्यफल पारंपरिक विधियों पर आधारित मनोरंजन हैं।", "투자보다 저축이 이로운 해예요.": "इस साल निवेश से बेहतर बचत है।", "파이오니어": "Pioneer", "평온하게 흘러가는 날이에요. 꾸준히 할 일을 해 나가세요.": "शांत बहता दिन। अपने काम लगातार करते रहें।", "프리미엄": "प्रीमियम", "프리미엄에서 몸 분석, 맞춤 음식, 운동 따라하기, 영양 가이드를 모두 쓸 수 있어요. 한 번 열면 계속 쓸 수 있어요.": "प्रीमियम से शरीर जाँच, मेरे लिए भोजन, साथ-साथ व्यायाम और पोषण गाइड खुलते हैं। एक बार खोलें, हमेशा इस्तेमाल करें।", "하는 일마다 손발이 맞는 달이에요. 미뤄 둔 일을 처리하기 좋아요.": "इस महीने सब कुछ ठीक बैठता है। टले कामों के लिए बढ़िया।", "하던 일을 깊게 파고들면 길이 보여요.": "जो कर रहे हैं उसमें गहराई से उतरें, राह दिखेगी।", "하반기로 갈수록 운이 올라가요. 늦게 피는 꽃이 더 오래 가듯, 연말에 웃게 돼요.": "दूसरी छमाही की ओर भाग्य बढ़ेगा। देर से खिला फूल ज़्यादा टिकता है, साल के अंत में आप मुस्कुराएँगे।", "하반기엔 정리와 마무리에 힘쓰면 좋아요. 새 일보다 하던 일을 끝내는 게 이득이에요.": "दूसरी छमाही में काम पूरा करने पर ध्यान दें। नया शुरू करने से बेहतर है शुरू किया ख़त्म करना।", "한 단계 올라서는 도약의 해예요. 중요한 결정을 내려야 할 순간이 오는데, 충분히 준비했다면 과감하게 건너도 좋아요. 건넌 뒤엔 넓은 들판이 기다려요.": "एक स्तर ऊपर छलांग का साल। अहम फ़ैसला आएगा—तैयार हैं तो हिम्मत से पार करें। उस पार खुला मैदान इंतज़ार कर रहा है।", "한 해 내내 고르게 흘러가요. 큰 굴곡 없이 꾸준함이 결실을 맺어요.": "पूरा साल बराबर बहता है। बड़े उतार-चढ़ाव के बिना निरंतरता फल देती है।", "한 해 총운": "साल का सार", "햇볕 쬐기, 즐거운 모임": "धूप और ख़ुशनुमा मुलाक़ातें", "호랑이": "बाघ", "혼자보다 함께할 때 성과가 커요.": "साथ मिलकर अकेले से ज़्यादा पाते हैं।", "환절기": "मौसम बदलना", "활발하고 자유로워 어디로든 달려가요. 솔직하고 사람을 좋아해요.": "जोशीले और आज़ाद, कहीं भी दौड़ पड़ते हैं। सच्चे और मिलनसार।", "흰색": "सफ़ेद", "오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠 보세요.": "आज आपकी भावनाएँ साफ़ हैं। यह ऊर्जा आसपास के लोगों से बाँटें।", "시주": "समय", "좋은 달": "अच्छे महीने", "조심할 달": "सावधानी के महीने", "올해의 행운": "इस साल का भाग्य", "달을 누르면 그 달의 운세를 볼 수 있어요.": "महीने पर टैप करें, उसका भविष्यफल देखें।", "← 올해 운세": "← साल", "{0}월 운세": "माह {0}", "좋은 흐름": "अच्छा प्रवाह", "무난한 흐름": "सामान्य", "조심할 흐름": "सावधान", "이달에 눈여겨볼 분야": "इस महीने का ध्यान", "이달의 행운의 날: 음력 {0}일": "शुभ दिन: चंद्र तिथि {0}", "이전 달": "पिछला", "다음 달": "अगला", "좋음": "अच्छा", "보통": "ठीक", "조심": "सावधान", "음악 켬": "संगीत चालू", "음악 끔": "संगीत बंद", "올해는 '시작'이 열쇠예요. 완벽하게 준비될 때를 기다리기보다 작게 시작해서 고쳐 나가는 쪽이 운을 부르는 해예요. 새로 배우는 것과 새로 만나는 사람에게 마음을 열어 두세요.": "इस साल कुंजी है 'शुरुआत'। पूरी तैयारी का इंतज़ार करने के बजाय छोटे से शुरू करके सुधारते चलना भाग्य बुलाता है। नई सीख और नए लोगों के लिए दिल खुला रखें।", "올해는 '유연함'이 열쇠예요. 계획대로 되지 않는 일이 생겨도 다른 길을 찾으면 오히려 더 좋은 결과로 이어져요. 서두르고 싶은 마음이 들 때마다 한 번 쉬어 가는 여유를 가지세요.": "इस साल कुंजी है 'लचीलापन'। योजना के मुताबिक़ न हो तो भी दूसरा रास्ता बेहतर नतीजे देता है। जब जल्दी लगे, थोड़ा रुकने की गुंजाइश रखें।", "올해는 '드러냄'이 열쇠예요. 그동안 쌓아 둔 실력과 생각을 보여 줄 기회가 찾아와요. 주목받는 만큼 겸손함을 잃지 않으면 좋은 평판이 오래 가요.": "इस साल कुंजी है 'ख़ुद को सामने लाना'। अपनी जमा की हुई काबिलियत और विचार दिखाने का मौक़ा आएगा। ध्यान बढ़ने पर विनम्र रहें तो अच्छा नाम लंबा चलेगा।", "올해는 '변화'가 열쇠예요. 익숙한 자리를 떠나는 일이 생겨도 두려워하지 마세요. 바뀐 환경에서 새로운 인연과 기회가 기다리고 있어요. 큰 결정은 하나씩 차례대로 하세요.": "इस साल कुंजी है 'बदलाव'। जानी-पहचानी जगह छोड़ने से न डरें। नए माहौल में नए रिश्ते और मौक़े इंतज़ार कर रहे हैं। बड़े फ़ैसले एक-एक करके लें।", "올해는 '꾸준함'이 열쇠예요. 눈에 띄는 변화보다 매일 반복하는 작은 습관이 큰 차이를 만들어요. 돈도 건강도 차곡차곡 모으는 만큼 연말에 든든해져요.": "इस साल कुंजी है 'निरंतरता'। रोज़ की छोटी आदतें दिखावटी बदलावों से ज़्यादा फ़र्क़ लाती हैं। पैसा और सेहत जितना जोड़ेंगे, साल के अंत में उतना सुकून होगा।", "올해는 '정리'가 열쇠예요. 묵은 짐과 마음속 응어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "इस साल कुंजी है 'छोड़ना'। पुराने बोझ और मन की गाँठें जितनी उतारेंगे, तन-मन उतना हल्का होगा। खाली जगह में अच्छी चीज़ें आएँगी।", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "इस साल कुंजी हैं 'लोग'। अकेले जूझने से ज़्यादा साथ मिलकर काम बनते हैं। जिनके आभारी हैं उनसे पहले कहें, वह रिश्ता बड़ा आशीर्वाद बनकर लौटेगा।", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "इस साल कुंजी है 'हिम्मत'। जिस चुनौती को लंबे समय से टाल रहे थे, उसकी ओर कदम बढ़ाने का समय है। तैयारी पूरी है तो भरोसा रखकर आगे बढ़ें। पार करके आप एक बढ़े हुए ख़ुद से मिलेंगे।", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "{0} में अच्छी ऊर्जा बनी रहती है। टली हुई योजनाएँ पूरी करने का अच्छा समय।", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "{0} में बिना बड़े उतार-चढ़ाव के शांति से समय बहता है। जो कर रहे हैं करते रहें।", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "{0} में थोड़ी सावधानी चाहिए। जल्दी न करें, सेहत और ख़र्च का ध्यान रखें।", "올해의 큰 흐름": "साल का बड़ा प्रवाह", "올해의 조언": "साल की सलाह", "상반기": "पहली छमाही", "하반기": "दूसरी छमाही", "계절별 흐름": "मौसम दर मौसम", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "इस महीने कुल मिलाकर ऊर्जा ऊपर जा रही है। अगर कुछ तैयार कर रहे थे, तो अभी सामने लाएँ। एक छोटा फ़ैसला उम्मीद से बड़ा नतीजा दे सकता है।", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "मदद और हौसला अपने आप जुटता है। अकेले ढोने के बजाय बाँटें तो ख़ुशी दोगुनी होगी। जितना आभार जताएँगे, भाग्य उतना मज़बूत होगा।", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "ठाने हुए काम रफ़्तार पकड़ते हैं। पर जितना अच्छा चले, बुनियादी बातें उतनी ज़रूरी। वादे और समय-सीमा निभाएँ तो अच्छा दौर अगले महीने तक चलेगा।", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "नए मौक़ों का दरवाज़ा खुलता है। आम तौर पर टाल देने वाले प्रस्तावों को भी सुनें। हिचक नहीं, जिज्ञासा इस महीने का भाग्य लाएगी।", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "बिना बड़ी घटनाओं के शांत महीना। ऐसे में रोज़ की लय बनाए रखना सबसे अच्छी देखभाल है। अच्छा खाना-सोना ही अगले महीने की ताक़त जोड़ता है।", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "अच्छी और खटकने वाली बातें बराबर मिलेंगी। किसी एक तरफ़ ज़्यादा न झुकें; संतुलन से महीना आराम से गुज़रेगा। छोटी उपलब्धियों पर ख़ुद को शाबाशी दें।", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "चुपचाप नींव मज़बूत करने का अच्छा महीना। बड़े बदलाव से ज़्यादा टली हुई सफ़ाई और पढ़ाई के लिए उपयुक्त। अभी बोए बीज अगले मौसम में अंकुरित होंगे।", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "बहाव शांत है, तो मन को थोड़ी जगह दें। अपनों के साथ समय बिताएँ या हल्की सैर करें। शांत मन अगला मौक़ा पहचान लेता है।", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "थोड़ी जल्दबाज़ी से काम उलझ सकते हैं। अहम फ़ैसले एक-दो दिन टालकर सोचें। धीरे चलना ही असल में सबसे तेज़ रास्ता है।", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "तन-मन जल्दी थक सकते हैं। भारी कार्यक्रम घटाएँ और पूरा आराम ज़रूर करें। आप सहज होंगे तो आसपास भी सहज होगा।", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "हर शब्द और हर पैसे का ध्यान रखें तो महीना आराम से गुज़रेगा। भावनाएँ उठें तो जवाब से पहले साँस लें। ख़र्च सिर्फ़ ज़रूरी जगह करें।", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "छोटी ग़लतियाँ आसानी से होती हैं, इसलिए बारीकी रखें। काग़ज़ और वादे दोबारा जाँचें, आते-जाते सुरक्षा पहले। जितनी सावधानी, अगला महीना उतना हल्का।", "이달의 운세": "इस महीने का भविष्यफल", "분야별 흐름": "क्षेत्र अनुसार प्रवाह", "이달의 한마디": "इस महीने की बात", "이달의 행운": "इस महीने का भाग्य", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "आपकी जन्म तिथि और फ़ोटो आपके Pi खाते में सहेजी जाती है, ऐप बंद करने पर भी बनी रहती है।", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "आपकी जन्म तिथि सिर्फ़ आपके Pi खाते में सहेजी जाती है। भविष्यफल मनोरंजन के लिए है; स्वास्थ्य जानकारी डॉक्टर की जगह नहीं।", "궁합": "मेल-मिलाप", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "देखें दो लोगों की ऊर्जा कितनी मेल खाती है", "상대방 정보": "सामने वाले की जानकारी", "상대 이름 (선택)": "नाम (वैकल्पिक)", "궁합 보기": "मेल देखें", "다른 사람과 보기": "किसी और से देखें", "띠 궁합": "राशि मेल", "성향 궁합": "स्वभाव मेल", "오행 궁합": "पाँच तत्व मेल", "두 사람에게 주는 조언": "आप दोनों के लिए सलाह", "두 띠는 서로 힘을 북돋아 주는 삼합 관계예요. 함께 있으면 일이 술술 풀리고 마음이 잘 통해요.": "आपकी राशियाँ एक-दूसरे को आगे बढ़ाने वाला 'त्रि-मेल' बनाती हैं। साथ रहने पर काम आसानी से बनते हैं और मन मिलता है।", "두 띠는 서로 끌어당기는 육합 관계예요. 처음 만나도 편안하고, 오래 함께할수록 정이 깊어져요.": "आपकी राशियाँ एक-दूसरे को खींचने वाला 'षट्-मेल' बनाती हैं। पहली मुलाक़ात से सहज, समय के साथ लगाव गहरा।", "두 띠는 서로 마주 보는 충 관계예요. 성향이 달라 부딪힐 때도 있지만, 서로를 인정하면 오히려 좋은 자극이 돼요.": "आपकी राशियाँ आमने-सामने हैं। स्वभाव अलग होने से टकराव हो सकता है, पर स्वीकारने से अच्छी प्रेरणा बनती है।", "같은 띠라 생각과 리듬이 비슷해요. 말하지 않아도 통하는 부분이 많아 편안한 사이예요.": "एक ही राशि, इसलिए सोच और लय मिलती है। बहुत कुछ बिना कहे समझ आता है।", "두 띠는 크게 부딪히지도 끌리지도 않는 무난한 관계예요. 함께 보내는 시간만큼 신뢰가 쌓여요.": "आपकी राशियाँ न टकरा 뜻한 음식과 규칙적인 잠이 가장 좋은 보약이에요. 컨디션이 좋은 날과 나쁜 날을 기록해 보면 나만의 관리법이 금방 보여요.": "स्वास्थ्य और ऊर्जा: ऊर्जा एक साथ खर्च करने पर जल्दी खत्म हो जाती है, इसलिए छोटे-छोटे बार-बार आराम ज़रूरी है। गर्म भोजन और नियमित नींद आपकी सबसे अच्छी दवा है। अच्छे और खराब दिनों को लिखें, जल्द ही अपनी देखभाल का तरीका मिल जाएगा।", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "स्वास्थ्य और ऊर्जा: माहौल बदलने पर शरीर भी ढलने का समय लेता है। घर या नौकरी बदलने जैसे बड़े बदलाव में शुरुआती हफ्तों में नींद और खाने का खास ध्यान रखें। यह दौर पार होते ही पहले से बेहतर आदतें बन जाती हैं।", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "काम और पढ़ाई: लक्ष्यों को छोटे हिस्सों में बाँटकर एक-एक पूरा करना आपको सूट करता है। योजना, प्रबंधन, अकाउंटिंग या IT जैसे सटीक क्षेत्रों में भरोसा जीतते हैं और ज़िम्मेदारियाँ बढ़ती जाती हैं। पूरी तैयारी के इंतज़ार में मौका न गँवाएँ, 70% तैयार हों तो शुरू करें।", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "काम और पढ़ाई: तय उत्तर वाले कामों से ज़्यादा, कुछ नया रचने में आपकी असली प्रतिभा दिखती है। विचार आते ही लिख लेने की आदत बड़ी पूँजी बनेगी। समय-प्रबंधन कमज़ोर हो सकता है, इसलिए किसी बारीकी से काम करने वाले साथी के साथ जोड़ी बनाएँ।", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "काम और पढ़ाई: आप जल्दी फ़ैसला लेते और अच्छी तरह अमल करते हैं, इसलिए फ़ील्ड, सेल्स या स्टार्टअप जैसे तेज़ी वाले कामों में चमकते हैं। एक चीज़ को लंबा पकड़ने के बजाय कम समय में ध्यान देकर नतीजा देखना आपको सूट करता है। बड़े फ़ैसलों से पहले एक रात सोचकर देखें, गलतियाँ बहुत घटेंगी।", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "प्रेम और रिश्ते: प्यार में आप खुले दिल से देते हैं, इसलिए साथी गहरी सुरक्षा महसूस करता है। पुराने दोस्त और परिवार जीवन के बड़े सहारे हैं। जितना देते हैं उतना न मिले तो दुख हो सकता है, इसलिए अपनी इच्छाएँ शब्दों में कहने का अभ्यास करें।", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "प्रेम और रिश्ते: आप जल्दी दिल नहीं खोलते, पर एक बार भरोसा करें तो अंत तक निभाते हैं। दिखावटी तोहफ़ों से ज़्यादा लगातार सच्चे ध्यान से प्यार जताते हैं। थोड़ा और ज़ाहिर करें तो साथी आपका प्यार कहीं ज़्यादा महसूस करेगा।", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "प्रेम और रिश्ते: आपका आकर्षण लोगों को खींचता है, जान-पहचान बहुत है और महफ़िल में आप स्वाभाविक केंद्र बन जाते हैं। सच्चे साथियों को पहचानने की नज़र विकसित करें तो रिश्ते और मज़बूत होंगे। नई मुलाक़ातों से अच्छे अवसर आते हैं, दिल खुला रखें।", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "धन और करियर: आप एक क्षेत्र में गहराई से काम कर सफलता पाते हैं, इसलिए अनुभव के साथ आय स्थिर रूप से बढ़ती है। नियमित बचत या दीर्घकालिक निवेश जैसे तरीके, जहाँ समय आपके पक्ष में हो, सबसे अच्छे हैं। अपनी विशेषज्ञता साबित करने वाले प्रमाणपत्र या रिकॉर्ड रखें, मौके जल्दी आएँगे।", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "धन और करियर: आपका धन-भाग्य समय के साथ बढ़ता है, इसलिए जल्दबाज़ी न करना ही कुंजी है। जुटाया अनुभव और संपर्क बड़ा फल बनकर लौटते हैं, देर से शुरू किए काम में भी बड़ी सफलता मिल सकती है। अभी ज़्यादा कमाने से ज़्यादा फ़िज़ूलखर्ची रोकने पर ध्यान दें।", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "धन और करियर: तय वेतन से ज़्यादा, क्षमता के हिसाब से कमाने वाले ढाँचे में आपका धन-भाग्य जागता है। साइड जॉब, फ़्रीलांस या छोटा व्यवसाय जैसे कई आय स्रोत आपको सूट करते हैं। आय ऊपर-नीचे हो सकती है, इसलिए कुछ महीनों का ख़र्च आपातकालीन फ़ंड में ज़रूर रखें।", "👑 리더형 손금": "👑 नेता-प्रकार हस्तरेखा", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "कहा जाता है कि स्पष्ट जीवन और भाग्य रेखा वाला हाथ बड़े संगठनों को चलाने वाले उद्यमियों और नेताओं में ज़्यादा मिलता है। सहनशक्ति और जोश के बल पर आप लक्ष्य को अंत तक पहुँचाते हैं। लोग स्वाभाविक रूप से आपके फ़ैसलों पर भरोसा करते हैं, इसलिए ज़िम्मेदारी वाले पदों से न बचें। सब कुछ अकेले उठाने के बजाय भरोसेमंद लोगों में काम बाँटें, भाग्य और बढ़ेगा।", "🎨 예술가형 손금": "🎨 कलाकार-प्रकार हस्तरेखा", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "परंपरा कहती है कि नीचे की ओर कोमलता से मुड़ी मस्तिष्क रेखा कलाकारों, लेखकों और डिज़ाइनरों में ज़्यादा मिलती है। दूसरों से छूट जाने वाली चीज़ें महसूस करने और व्यक्त करने की आपमें ख़ास समझ है। पसंदीदा काम में डूबकर आप समय भूल जाते हैं, और यही तल्लीनता आपकी पूँजी है। भावनाओं की लहर आए तो उसे लेखन या चित्र में उतारें, अच्छी रचना बन सकती है।", "🌳 대기만성형 손금": "🌳 देर से चमकने वाली हस्तरेखा", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "हथेली के बीच से शुरू होने वाली भाग्य रेखा वाले हाथ को देर से खिलकर बड़ी सफलता पाने वाला प्रकार कहते हैं। जवानी की सारी कोशिशें और गलतियाँ आगे की नींव बनती हैं। दूसरों से रफ़्तार की तुलना करने से ज़्यादा अपनी गति बनाए रखना ज़रूरी है। मध्य आयु के बाद स्थिर धन और सम्मान दोनों मिलते दिखते हैं।", "🧭 개척자형 손금": "🧭 अग्रणी-प्रकार हस्तरेखा", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "शाखाओं में बँटी या खुलकर फैली रेखाओं वाला हाथ उस अग्रणी क 어리를 하나씩 내려놓을수록 몸과 마음이 가벼워져요. 비워 낸 자리에 좋은 일이 들어올 거예요.": "ปีนี้กุญแจคือ 'การปล่อยวาง' ยิ่งวางภาระเก่าและความขุ่นข้องใจ กายใจยิ่งเบา พื้นที่ว่างจะมีสิ่งดีเข้ามา", "올해는 '사람'이 열쇠예요. 혼자 애쓰기보다 주변과 함께할 때 일이 더 잘 풀려요. 고마운 사람에게 먼저 마음을 표현하면 그 인연이 큰 복으로 돌아와요.": "ปีนี้กุญแจคือ 'ผู้คน' ทำร่วมกับคนรอบข้างดีกว่าสู้คนเดียว แสดงความขอบคุณก่อน แล้วความสัมพันธ์นั้นจะกลับมาเป็นโชคใหญ่", "올해는 '용기'가 열쇠예요. 오래 망설였던 도전에 한 걸음 내디딜 때예요. 충분히 준비했다면 결과를 믿고 나아가세요. 넘어서고 나면 한 단계 자란 나를 만나게 돼요.": "ปีนี้กุญแจคือ 'ความกล้า' ถึงเวลาก้าวสู่ความท้าทายที่ลังเลมานาน ถ้าเตรียมพร้อมแล้วก็เชื่อมั่นและก้าวไป เมื่อข้ามไปได้ คุณจะได้พบตัวเองที่เติบโตขึ้น", "{0}에는 좋은 기운이 이어져요. 미뤄 둔 계획을 실행하기 좋은 때예요.": "ช่วง{0} พลังดีต่อเนื่อง เหมาะลงมือทำแผนที่ค้างไว้", "{0}에는 큰 굴곡 없이 차분하게 흘러가요. 하던 일을 꾸준히 이어 가세요.": "ช่วง{0} ราบเรียบไม่ขึ้นลงมาก ทำสิ่งที่ทำต่อไป", "{0}에는 조금 조심할 일이 있어요. 서두르지 말고 건강과 지출을 챙기세요.": "ช่วง{0} มีเรื่องต้องระวังเล็กน้อย อย่ารีบ ดูแลสุขภาพและการใช้จ่าย", "올해의 큰 흐름": "กระแสใหญ่ของปี", "올해의 조언": "คำแนะนำประจำปี", "상반기": "ครึ่งปีแรก", "하반기": "ครึ่งปีหลัง", "계절별 흐름": "ตามฤดูกาล", "이번 달은 전체적으로 기운이 위로 올라가는 시기예요. 그동안 준비해 온 일이 있다면 이달에 꺼내 보세요. 작은 결정 하나가 생각보다 큰 결과로 이어질 수 있어요.": "เดือนนี้พลังโดยรวมกำลังขึ้น ถ้ามีเรื่องที่เตรียมไว้ ลองหยิบออกมาเดือนนี้ การตัดสินใจเล็ก ๆ อาจให้ผลใหญ่กว่าที่คิด", "주변의 도움과 응원이 자연스럽게 모이는 달이에요. 혼자 끌어안기보다 함께 나누면 기쁨이 두 배가 돼요. 감사한 마음을 표현할수록 운이 더 단단해져요.": "ความช่วยเหลือและกำลังใจมารวมกันเอง แบ่งปันแทนการแบกคนเดียว ความสุขจะเพิ่มเป็นสองเท่า ยิ่งแสดงความขอบคุณ โชคยิ่งมั่นคง", "마음먹은 일에 속도가 붙는 달이에요. 다만 잘 풀릴수록 기본을 지키는 게 중요해요. 약속과 마감만 잘 챙기면 좋은 흐름이 다음 달까지 이어져요.": "สิ่งที่ตั้งใจไว้จะเดินหน้าเร็วขึ้น แต่ยิ่งราบรื่นยิ่งต้องรักษาพื้นฐาน รักษาสัญญาและกำหนดส่ง กระแสดีจะต่อไปถึงเดือนหน้า", "새로운 기회의 문이 열리는 달이에요. 평소라면 지나쳤을 제안이나 만남에도 한 번 귀를 기울여 보세요. 망설임보다 호기심이 이달의 행운을 불러와요.": "ประตูสู่โอกาสใหม่เปิดออก ลองฟังข้อเสนอหรือการพบปะที่ปกติจะมองข้าม ความอยากรู้ ไม่ใช่ความลังเล จะนำโชคมา", "큰 사건 없이 잔잔하게 흘러가는 달이에요. 이런 때일수록 일상의 리듬을 지키는 것이 가장 좋은 관리예요. 잘 먹고 잘 자는 것만으로도 다음 달을 위한 힘이 쌓여요.": "เดือนเงียบสงบไม่มีเรื่องใหญ่ ยิ่งช่วงนี้ยิ่งควรรักษาจังหวะชีวิตประจำวัน แค่กินดีนอนดีก็สะสมแรงสำหรับเดือนหน้า", "좋은 일과 아쉬운 일이 고르게 섞이는 달이에요. 한쪽에 너무 마음을 두지 말고 균형을 잡으면 무난하게 지나가요. 작은 성취를 스스로 칭찬해 주세요.": "เรื่องดีและเรื่องน่าเสียดายปนกันพอ ๆ กัน อย่าเอนไปทางใดมากเกิน รักษาสมดุลแล้วจะผ่านไปได้ดี ชมตัวเองกับความสำเร็จเล็ก ๆ", "조용히 다지기 좋은 달이에요. 눈에 띄는 변화보다 미뤄 둔 정리나 공부를 하기에 알맞아요. 지금 심어 둔 씨앗이 다음 계절에 싹을 틔워요.": "เดือนดีที่จะค่อย ๆ วางรากฐานเงียบ ๆ เหมาะกับการจัดระเบียบและเรียนรู้สิ่งที่ค้างไว้มากกว่าการเปลี่ยนแปลงใหญ่ เมล็ดที่หว่านตอนนี้จะงอกฤดูหน้า", "흐름이 평탄한 만큼 마음의 여유를 갖기 좋은 달이에요. 가까운 사람과 시간을 보내거나 가벼운 산책으로 몸을 풀어 보세요. 편안한 마음이 다음 기회를 알아보게 해 줘요.": "กระแสเรียบ จึงเหมาะให้ใจได้พัก ใช้เวลากับคนใกล้ชิดหรือเดินเล่นเบา ๆ ใจที่สบายจะมองเห็นโอกาสถัดไป", "조금 서두르면 일이 엇갈리기 쉬운 달이에요. 중요한 결정은 하루 이틀 미뤄 생각을 정리한 뒤 내리세요. 천천히 가는 것이 오히려 가장 빠른 길이에요.": "รีบนิดเดียวเรื่องก็คลาดกันง่าย เลื่อนการตัดสินใจสำคัญไปสักวันสองวัน การไปช้า ๆ กลับเป็นทางที่เร็วที่สุด", "몸과 마음이 쉽게 지칠 수 있는 달이에요. 무리한 약속은 줄이고 충분히 쉬는 시간을 꼭 챙기세요. 내가 편안해야 주변도 편안해져요.": "กายใจเหนื่อยง่าย ลดนัดที่หนักเกินไปและพักให้พอ เมื่อเราสบาย คนรอบข้างก็สบาย", "말 한마디, 돈 한 푼을 조심하면 무난하게 넘어가는 달이에요. 감정이 올라올 때는 바로 대답하기보다 한 번 숨을 고르세요. 지출은 꼭 필요한 곳에만 쓰세요.": "ระวังทุกคำพูดและทุกบาทแล้วเดือนนี้จะผ่านไปด้วยดี เมื่ออารมณ์ขึ้น หายใจก่อนตอบ ใช้จ่ายเฉพาะที่จำเป็น", "작은 실수가 생기기 쉬운 달이라 꼼꼼함이 필요해요. 서류나 약속은 한 번 더 확인하고, 이동할 때는 안전을 먼저 챙기세요. 조심한 만큼 다음 달이 가벼워져요.": "ผิดพลาดเล็ก ๆ ได้ง่าย ต้องละเอียด ตรวจเอกสารและนัดหมายอีกรอบ เดินทางให้นึกถึงความปลอดภัยก่อน ยิ่งระวัง เดือนหน้ายิ่งเบา", "이달의 운세": "ดวงเดือนนี้", "분야별 흐름": "ตามด้าน", "이달의 한마디": "คำแนะนำเดือนนี้", "이달의 행운": "โชคประจำเดือน", "생년월일과 사진은 내 Pi 계정에 저장돼서 앱을 닫아도 그대로 남아요.": "วันเกิดและรูปถูกบันทึกในบัญชี Pi ของคุณ ปิดแอปก็ยังอยู่", "생년월일은 내 Pi 계정에만 저장돼요. 운세는 재미와 참고용이고, 건강 정보는 의료 상담을 대신하지 않아요.": "วันเกิดเก็บไว้ในบัญชี Pi ของคุณเท่านั้น ดวงเพื่อความบันเทิง ข้อมูลสุขภาพไม่แทนแพทย์", "궁합": "ดวงสมพงศ์", "두 사람의 기운이 얼마나 잘 어울리는지 봐요": "ดูว่าพลังของสองคนเข้ากันแค่ไหน", "상대방 정보": "ข้อมูลอีกฝ่าย", "상대 이름 (선택)": "ชื่อ (ไม่บังคับ)", "궁합 보기": "ดูดวงสมพงศ์", "다른 사람과 보기": "ลองกับ 을 기록해 보면 나만의 관리법이 금방 보여요.": "สุขภาพและพลังกาย: ถ้าใช้พลังหมดในครั้งเดียวจะหมดเร็ว จังหวะพักสั้น ๆ บ่อย ๆ จึงสำคัญ อาหารอุ่น ๆ และการนอนเป็นเวลาคือยาบำรุงที่ดีที่สุด ลองจดวันที่สบายและไม่สบาย แล้วจะเห็นวิธีดูแลตัวเองเร็วขึ้น", "건강·체력운: 환경이 바뀔 때 몸도 함께 적응기를 거치는 손금이에요. 이사나 새 일처럼 큰 변화가 있을 땐 첫 몇 주 동안 잠과 식사를 특히 챙기세요. 변화를 잘 넘기고 나면 오히려 전보다 건강한 생활 습관이 자리 잡아요.": "สุขภาพและพลังกาย: เมื่อสภาพแวดล้อมเปลี่ยน ร่างกายก็ต้องปรับตัวด้วย ช่วงย้ายบ้านหรือเริ่มงานใหม่ ควรใส่ใจการนอนและอาหารเป็นพิเศษในช่วงสัปดาห์แรก ๆ ผ่านไปได้แล้วนิสัยสุขภาพจะดีกว่าเดิม", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "การงานและการเรียน: เหมาะกับการแบ่งเป้าหมายเป็นชิ้นเล็กแล้วทำให้เสร็จทีละอย่าง ได้รับความไว้วางใจในงานที่ต้องแม่นยำ เช่น วางแผน บริหาร บัญชี ไอที และงานที่รับผิดชอบจะใหญ่ขึ้นเรื่อย ๆ อย่ารอให้พร้อมสมบูรณ์จนพลาดโอกาส พร้อม 70% ก็เริ่มได้", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "การงานและการเรียน: ฝีมือจริงจะออกมาในงานสร้างสรรค์สิ่งใหม่มากกว่างานที่มีคำตอบตายตัว การจดไอเดียทันทีที่คิดได้จะเป็นทรัพย์สินสำคัญ การจัดตารางอาจเป็นจุดอ่อน จับคู่กับเพื่อนร่วมงานที่ละเอียดจะได้ผลดีขึ้นมาก", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "การงานและการเรียน: ตัดสินใจเร็วและลงมือเก่ง จึงโดดเด่นในงานที่ต้องการความเร็ว เช่น งานภาคสนาม งานขาย หรือสตาร์ทอัพ เหมาะกับการโฟกัสสั้น ๆ แล้วเห็นผลมากกว่ายึดติดเรื่องเดียวนาน ๆ ก่อนตัดสินใจเรื่องใหญ่ ลองนอนคิดสักคืน ความผิดพลาดจะลดลงมาก", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "ความรักและความสัมพันธ์: เวลารักจะให้อย่างเต็มที่ คนรักจึงรู้สึกมั่นคงมาก เพื่อนเก่าและครอบครัวเป็นเสาหลักของชีวิต แต่ถ้าได้รับกลับไม่เท่าที่ให้อาจน้อยใจ ลองฝึกบอกความต้องการออกมาเป็นคำพูด", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "ความรักและความสัมพันธ์: ไม่เปิดใจง่าย แต่เมื่อไว้ใจแล้วจะซื่อสัตย์จนถึงที่สุด แสดงความรักด้วยความใส่ใจจริงใจอย่างสม่ำเสมอมากกว่าเซอร์ไพรส์หรูหรา ถ้าแสดงออกเพิ่มอีกนิด คนรักจะรู้สึกถึงใจคุณได้ชัดขึ้นมาก", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "ความรักและความสัมพันธ์: มีเสน่ห์ดึงดูดคน มีสายสัมพันธ์มาก และมักเป็นศูนย์กลางของวงสังสรรค์ ฝึกมองให้ออกว่าใครอยู่ข้างเราจริง ความสัมพันธ์จะมั่นคงขึ้นมาก โอกาสดีมาจากการพบเจอคนใหม่ จงเปิดใจไว้", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "การเงินและอาชีพ: เป็นคนเจาะลึกสายเดียวจนสำเร็จ ยิ่งประสบการณ์มาก รายได้ยิ่งเพิ่มอย่างมั่นคง วิธีที่เวลาเป็นฝ่ายเรา เช่น ออมสม่ำเสมอหรือลงทุนระยะยาว เหมาะมาก เก็บใบรับรองหรือผลงานที่พิสูจน์ความเชี่ยวชาญไว้ โอกาสจะมาเร็วขึ้น", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "การเงินและอาชีพ: ดวงการเงินยิ่งนานยิ่งดี หัวใจคืออย่ารีบร้อน ประสบการณ์และคอนเนกชันที่สะสมไว้จะกลับมาเป็นผลตอบแทนใหญ่ แม้งานที่เริ่มช้าก็อาจประสบความสำเร็จมาก ตอนนี้เน้นอุดรูรั่วของเงินมากกว่าหาเงินก้อนใหญ่", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "การเงินและอาชีพ: ดวงการเงินจะเด่นเมื่อหาเงินตามความสามารถมากกว่าเงินเดือนประจำ การสร้างรายได้หลายทาง เช่น งานเสริม ฟรีแลนซ์ ธุรกิจเล็ก ๆ เหมาะมาก รายได้อาจไม่แน่นอน จึงควรเก็บค่าใช้จ่ายหลายเดือนไว้เป็นเงินฉุกเฉิน", "👑 리더형 손금": "👑 ลายมือแบบผู้นำ", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "มือที่มีเส้นชีวิตและเส้นวาสนาชัดเจนทั้งคู่ มีความเชื่อแต่โบราณว่าพบมากในนักธุรกิจและผู้นำองค์กรใหญ่ ด้วยพลังกายและแรงขับเคลื่อน คุณมีพลังผลักดันเป้าหมายจนสำเร็จ ผู้คนเชื่อใจและทำตามการตัดสินใจของคุณโดยธรรมชาติ อย่าหลีกเลี่ยงตำแหน่งที่ต้องรับผิดชอบ แทนที่จะแบกทุกอย่างคนเดียว ลองแบ่งงานให้คนที่ไว้ใจ ดวงจะยิ่งดีขึ้น", "🎨 예술가형 손금": "🎨 ลายมือแบบศิลปิน", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "มือที่เส้นสมองโค้งลงอย่างนุ่มนวล ตามความเชื่อดั้งเดิมพบมากในศิลปิน นักเขียน และนักออกแบบ คุณมีสัมผัสพิเศษในการรับรู้และถ่ายทอดสิ่งที่คนอื่นมองไม่เห็น เมื่อจมดิ่งกับสิ่งที่รักจะลืมเวลา และความทุ่มเทนั้นคือทรัพย์สมบัติของคุณ เมื่ออารมณ์ถาโถม ลองระบายเป็นงานเขียนหรือภาพวาด อาจได้ผลงานดี ๆ", "🌳 대기만성형 손금": "🌳 ลายมือแบบสำเร็จช้าแต่ยิ่งใหญ่", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "มือที่เส้นวาสนาเริ่มจากกลางฝ่ามือ เรียกว่าแบบสำเร็จช้าแต่ยิ่งใหญ่ การลองผิดลองถูกตอนหนุ่มสาวจะเป็นปุ๋ยให้อนาคต การรักษาจังหวะของตัวเองสำคัญกว่าการเทียบความเร็วกับคนอื่น หลังวัยกลางคนจะเห็นทั้งการเงินมั่นคงและความนับถือ", "🧭 개척자형 손금": "🧭 ลายมือแบบผู้บุกเบิก", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "มือที่เส้นแตกแขนงหรือทอดยาวอิสระ คือแบบผู้บุกเบิกที่เปิดเส้นทางใหม่มากกว่าเดินตามทางเดิม คุณมักคว้าโอกาสท่ามกลางการเปลี่ยนแปลง เช่น เปลี่ยนงาน ย้ายบ้าน หรือความท้าทาย ถ้าไล่ตามแต่ความมั่นคงอาจรู้สึกอึดอัด ลองทำสิ่งใหม่สม่ำเสมอแม้เล็กน้อย เมื่อประสบการณ์ทั้งหมดรวมเป็นหนึ่ง จะเกิดผลงานโดดเด่น", "♟️ 전략가형 손금": "♟️ ลายมือแบบนักวางแผน", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "มือที่เส้นสมองตรงยาวคือแบบนักวางแผนหรือที่ปรึกษา คำนวณและตัดสินใจแม่นยำ มองภาพรวมและอ่านความเสี่ยงล่วงหน้าได้ จึงเป็นคนที่องค์กรไหนก็ขาดไม่ไ  حين تتغير بيئتك يمر جسدك أيضًا بفترة تكيّف. عند الانتقال أو بدء عمل جديد اعتنِ بالنوم والطعام خاصة في الأسابيع الأولى. بعد تجاوزها تترسخ عادات أصح من قبل.", "일·공부운: 목표를 잘게 쪼개 하나씩 지워 가는 방식이 잘 맞아요. 기획·관리·회계·IT처럼 정확함이 필요한 분야에서 신뢰를 얻고, 시간이 갈수록 맡는 일의 크기가 커져요. 완벽하게 준비될 때까지 기다리다 기회를 놓치지 않도록, 70% 준비되면 시작해 보세요.": "العمل والدراسة: يناسبك تقسيم الأهداف إلى أجزاء صغيرة وإنجازها واحدًا تلو الآخر. تكسب الثقة في المجالات الدقيقة كالتخطيط والإدارة والمحاسبة وتقنية المعلومات، وتكبر مسؤولياتك مع الوقت. لا تنتظر الكمال فتضيع الفرص، ابدأ حين تكون جاهزًا بنسبة 70%.", "일·공부운: 정답이 정해진 일보다 새로운 것을 만들어 내는 일에서 진짜 실력이 나와요. 아이디어가 떠오를 때 바로 메모하는 습관이 큰 자산이 돼요. 일정 관리는 약할 수 있으니 꼼꼼한 동료와 짝을 이루면 결과가 훨씬 좋아져요.": "العمل والدراسة: تظهر موهبتك الحقيقية في ابتكار الجديد أكثر من المهام ذات الإجابات الجاهزة. عادة تدوين الأفكار فور ورودها ستصبح ثروة كبيرة. قد تكون إدارة المواعيد نقطة ضعف، فالعمل مع شريك دقيق يحسّن النتائج كثيرًا.", "일·공부운: 결정이 빠르고 실행력이 좋아 현장·영업·창업처럼 속도가 중요한 일에서 빛나요. 한 가지를 오래 붙잡기보다 짧게 집중하고 결과를 보는 방식이 잘 맞아요. 중요한 결정 앞에서는 하룻밤 자고 다시 보는 습관을 들이면 실수가 크게 줄어요.": "العمل والدراسة: تتخذ القرار بسرعة وتنفّذ جيدًا، فتتألق حيث تهم السرعة: العمل الميداني والمبيعات والشركات الناشئة. يناسبك التركيز لفترات قصيرة ورؤية النتائج بدل التمسك بأمر واحد طويلًا. قبل القرارات الكبيرة نم عليها ليلة وستقل أخطاؤك كثيرًا.", "사랑·인간관계운: 사랑할 때 아낌없이 주는 타입이라 상대가 깊은 안정감을 느껴요. 오래 만난 친구와 가족이 인생의 큰 버팀목이 되는 손금이에요. 내 마음만큼 돌려받지 못할 때 서운함이 커질 수 있으니, 바라는 것을 말로 표현하는 연습을 해 보세요.": "الحب والعلاقات: تعطي بسخاء في الحب فيشعر شريكك بأمان عميق. الأصدقاء القدامى والعائلة دعائم كبرى في حياتك. قد تتألم حين لا تنال بقدر ما تعطي، فتدرّب على التعبير عن رغباتك بالكلام.", "사랑·인간관계운: 쉽게 마음을 열지 않지만 한번 믿으면 끝까지 지키는 의리파예요. 화려한 이벤트보다 꾸준하고 진심 어린 관심으로 사랑을 표현해요. 가끔 표현을 조금만 더 해 주면 상대가 내 마음을 훨씬 크게 느껴요.": "الحب والعلاقات: لا تفتح قلبك بسهولة، لكن حين تثق تبقى وفيًا حتى النهاية. تعبّر عن الحب باهتمام صادق ومستمر أكثر من المفاجآت البراقة. إن عبّرت أكثر قليلًا سيشعر شريكك بحبك بقوة أكبر بكثير.", "사랑·인간관계운: 사람을 끄는 매력이 있어 인연이 많고, 모임에서 자연스럽게 중심이 돼요. 여러 인연 가운데 진짜 내 편을 알아보는 눈을 키우면 관계가 훨씬 단단해져요. 새로운 만남에서 좋은 기회가 오니 열린 마음을 유지하세요.": "الحب والعلاقات: جاذبيتك تجذب الناس، فلديك علاقات كثيرة وتصبح محور التجمعات تلقائيًا. تعلّم تمييز من هم في صفك حقًا يجعل علاقاتك أمتن بكثير. الفرص الجيدة تأتي من لقاءات جديدة، فأبقِ قلبك منفتحًا.", "재물·직업운: 한 우물을 깊게 파서 성과를 내는 타입이라 경력이 쌓일수록 수입도 안정적으로 늘어요. 꾸준한 저축이나 장기 투자처럼 시간이 내 편이 되는 방식이 잘 맞아요. 전문성을 보여 줄 자격이나 기록을 남겨 두면 기회가 더 빨리 와요.": "المال والمهنة: تتعمق في مجال واحد حتى تنجح، فيزداد دخلك باستقرار مع تراكم الخبرة. تناسبك الأساليب التي يكون فيها الوقت في صفك كالادخار المنتظم والاستثمار طويل الأمد. احتفظ بالشهادات والإنجازات التي تثبت خبرتك فتأتي الفرص أسرع.", "재물·직업운: 재물운이 뒤로 갈수록 커지는 흐름이라 서두르지 않는 게 핵심이에요. 그동안 쌓은 경험과 인맥이 큰 결실로 돌아오고, 늦게 시작한 일에서 크게 성공하기도 해요. 지금은 크게 벌기보다 새는 돈을 막는 데 집중하면 좋아요.": "المال والمهنة: حظك المالي يكبر مع مرور الوقت، فالمفتاح ألا تستعجل. الخبرة والعلاقات التي بنيتها ستعود ثمارًا كبيرة، وقد تنجح نجاحًا كبيرًا حتى فيما بدأته متأخرًا. الآن ركّز على سدّ تسربات المال بدل السعي لكسب كبير.", "재물·직업운: 정해진 월급보다 내 능력만큼 버는 구조에서 재물운이 살아나요. 부업·프리랜서·작은 창업처럼 여러 갈래로 수입을 만드는 방식이 잘 맞아요. 수입이 들쭉날쭉할 수 있으니 생활비 몇 달 치는 꼭 비상금으로 모아 두세요.": "المال والمهنة: ينتعش حظك المالي حين تكسب بقدر مهارتك لا براتب ثابت. يناسبك بناء عدة مصادر دخل كالعمل الجانبي والعمل الحر والمشاريع الصغيرة. قد يتقلب الدخل، فادّخر حتمًا نفقات عدة أشهر كصندوق طوارئ.", "👑 리더형 손금": "👑 كفّ القائد", "생명선과 운명선이 모두 또렷한 손은 예부터 큰 조직을 이끄는 사업가와 지도자에게 많다고 전해져요. 체력과 추진력이 받쳐 주니 한번 정한 목표를 끝까지 밀고 나가는 힘이 있어요. 사람들이 자연스럽게 당신의 판단을 믿고 따르니, 책임 있는 자리를 피하지 마세요. 다만 혼자 다 짊어지기보다 믿을 만한 사람에게 일을 나누면 운이 더 커져요.": "يُقال منذ القدم إن اليد ذات خطي الحياة والقدر الواضحين تكثر لدى مؤسسي الأعمال وقادة المؤسسات الكبرى. بقوة التحمل والاندفاع تملك القدرة على إيصال أهدافك حتى النهاية. يثق الناس بحكمك ويتبعونه تلقائيًا، فلا تتهرب من مواقع المسؤولية. وبدل أن تحمل كل شيء وحدك، وزّع المهام على من تثق بهم فيزداد حظك.", "🎨 예술가형 손금": "🎨 كفّ الفنان", "두뇌선이 아래로 부드럽게 휘는 손은 전통적으로 예술가·작가·디자이너에게 많다고 해요. 남들이 보지 못하는 것을 느끼고 표현하는 감각이 뛰어나요. 좋아하는 일에 빠지면 시간 가는 줄 모르는데, 그 몰입이 곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요.": "تقليديًا يُقال إن اليد التي ينحني فيها خط العقل بلطف إلى الأسفل شائعة بين الفنانين والكتّاب والمصممين. لديك حسّ قوي لالتقاط ما لا يراه الآخرون والتعبير عنه. حين تنغمس فيما تحب تنسى الوقت، وهذا الانغماس هو كنزك. وعندما تجتاحك المشاعر، صبّها في الكتابة أو الرسم فقد يولد منها عمل جميل.", "🌳 대기만성형 손금": "🌳 كفّ النجاح المتأخر", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요.": "اليد التي يبدأ فيها خط القدر من منتصف الكف تُسمّى نوع النجاح المتأخر: تزهر متأخرة لكنها تنجح نجاحًا كبيرًا. كل تجارب الشباب وأخطائه تصبح سمادًا للمستقبل. الحفاظ على إيقاعك أهم من مقارنة سرعتك بالآخرين. بعد منتصف العمر يظهر تدفق من الثروة المستقرة والاحترام.", "🧭 개척자형 손금": "🧭 كفّ الرائد", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요.": "اليد ذات الخطوط المتفرعة أو الممتدة بحرية تعود للرائد الذي يشق طرقًا جديدة بدل سلوك الطرق المعتادة. أنت ممن يقتنصون الفرص وسط التغيير: عمل جديد، انتقال، تحدٍّ. السعي وراء الاستقرار وحده قد يخنقك، فواصل تجربة أشياء جديدة ولو صغيرة. حين تجتمع تجاربك الكثيرة ستحقق إنجازًا لافتًا.", "♟️ 전략가형 손금": "♟️ كفّ الاستراتيجي", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요.": "اليد ذات خط العقل المستقيم تعود للاستراتيجي أو المستشار الدقيق في الحساب والحكم. ترى الصورة الكبيرة وتقرأ المخاطر مسبقًا، فتصبح لا غنى عنك في أي مؤسسة. تُظهر قيمتك الحقيقية حين تدير اللعبة من الخلف لا حين تتصدر. أحيانًا ضع الحسابات جانبًا وثق بحدسك، فقد يأتيك حظ غير متوقع.", "⚖️ 균형형 손금": "⚖️ الكفّ المتوازنة", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요.": "اليد التي لا تميل إلى خط بعينه تعود للنوع المتوازن الناجح في مجالات كثيرة. تعرف كيف تعتني بالناس والعمل والصحة معًا، فتتكيف جيدًا مع أي بيئة. اختر فترة تركز فيها على أمر واحد وتجمع قواك فتسطع مواهبك الخفية. وكلما تراكمت مثابرتك نمت ثقة الآخرين وحظك معًا.", "생활패턴 수정": "تعديل العادات", "생활패턴을 저장했어요": "تم حفظ عاداتك اليومية", "나의 하루 생활패턴": "روتيني اليومي", "나의 손금": "خطوط كفّي", "{0} 손바닥을 화면 가득 쫙 펴서 찍어 주세요": "افرد راحة يدك {0} لتملأ الشاشة والتقط صورة", "광고 보고 +{0} 토큰": "شاهد إعلانًا +{0} رمز", "오늘 {0}/{1}회": "اليوم {0}/{1}", "광고 준비 중이에요": "الإعلانات قريبًا", "오늘 광고 보상을 다 받았어요": "حصلت على كل مكافآت الإعلانات اليوم", "광고를 불러오지 못했어요. 잠시 후 다시 해 주세요.": "تعذّر تحميل الإعلان. حاول بعد قليل.", "광고 시청 확인이 안 됐어요": "تعذّر تأكيد مشاهدة الإعلان", "토큰 순위": "ترتيب الرموز", "나의 순위": "ترتيبي", "{0}위": "#{0}", "아직 순위가 없어요": "لا يوجد ترتيب بعد", "매달 토큰을 많이 모은 분께 건강용품을 드릴 예정이에요. Pi 정책에 따라 바뀌거나 빠질 수 있어요.": "نخطط كل شهر لإهداء منتجات صحية لأصحاب أكثر الرموز. قد يتغير ذلك أو يُلغى وفق سياسات Pi.", "항목당 0.1π 또는 100토큰": "0.1π أو 100 رمزًا لكل قسم", "100 토큰으로 열기": "افتح مقابل 100 رمزًا", "토큰 순위 보기": "عرض ترتيب الرموز", "광고를 끝까지 봐야 토큰을 받아요": "شاهد الإعلان حتى النهاية لتحصل على الرموز"}};

function lunMonth(y,m,lp){var Y=lunYear(y);if(!Y)return null;var o=0,nm=null;for(var k=0;k<Y.ms.length;k++){var M=Y.ms[k];if(M.m==m){if(!!M.lp==!!lp)return{s:Y.s+o,n:M.n};if(!M.lp)nm={s:Y.s+o,n:M.n}}o+=M.n}return nm}
function lun2sol(y,m,d,lp){var M=lunMonth(y,m,lp);if(!M)return null;return ymd(M.s+Math.min(d,M.n)-1)}
function dayIdx(t){return((t+2440637)%60+60)%60}

/* ===== 사주 (절기는 날짜로 단순화) ===== */
function jdn(y,m,d){var a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;return d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045}
function pil(y,m,d,h,nt){
var TD=[[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7],[1,6]];
var yy=y;if(m<2||(m==2&&d<4))yy=y-1;
var ys=((yy-4)%10+10)%10,yb=((yy-4)%12+12)%12;
var mi=0;for(var i=0;i<12;i++){var t=TD[i];var dt=(m>t[0]||(m==t[0]&&d>=t[1]));
 if(t[0]==1){if(m==1&&d>=6)mi=11;else if(m==1)mi=10}else if(dt)mi=i}
if(m==12&&d>=7)mi=10;if(m==1&&d<6)mi=10;if(m==1&&d>=6)mi=11;
var ms=(((ys%5)*2+2+mi)%10),mb=(mi+2)%12;
var di=(jdn(y,m,d)+49)%60,ds=di%10,db=di%12;
var P=[[ys,yb],[ms,mb],[ds,db]];
if(!nt){var hi=Math.floor(((h+1)%24)/2);P.push([((ds%5)*2+hi)%10,hi])}
return {P:P,ds:ds}}

function calcOf(ME){if(!ME)return null;var sol,lun;
  if(ME.cal=='l'){sol=lun2sol(ME.y,ME.m,ME.d,ME.lp);lun={y:ME.y,m:ME.m,d:ME.d,lp:!!ME.lp}}else{sol=[ME.y,ME.m,ME.d];lun=sol2lun(ME.y,ME.m,ME.d)}
  if(!sol||!lun)return null;
  var nt=ME.si<0,h=nt?12:(ME.si*2)%24,S=pil(sol[0],sol[1],sol[2],h,nt),cnt=[0,0,0,0,0];
  S.P.forEach(function(p){cnt[SE[p[0]]]++;cnt[BE[p[1]]]++});
  var strong=cnt.indexOf(Math.max.apply(null,cnt)),weak=cnt.indexOf(Math.min.apply(null,cnt));
  var ani=((lun.y-4)%12+12)%12;
  return{sol:sol,lun:lun,P:S.P,ds:S.ds,cnt:cnt,strong:strong,weak:weak,me:SE[S.ds],ani:ani}}

곧 당신의 재산이에요. 감정의 파도가 올 땐 글이나 그림으로 풀어내면 오히려 좋은 작품이 나와요."], ["🌳 대기만성형 손금", "운명선이 손바닥 중간에서 시작하는 손은 늦게 피어 크게 성공하는 대기만성형이라고 불러요. 젊을 때의 시행착오가 모두 나중을 위한 밑거름이 되는 손금이에요. 남과 속도를 비교하기보다 내 페이스를 지키는 것이 가장 중요해요. 중년 이후에는 안정된 재물과 존경을 함께 얻는 흐름이 보여요."], ["🧭 개척자형 손금", "선이 갈라지거나 자유롭게 뻗은 손은 정해진 길보다 새 길을 여는 개척자형이에요. 이직·이사·도전 같은 변화 속에서 오히려 기회를 잡는 타입이에요. 안정만 좇으면 답답함을 느끼기 쉬우니, 작게라도 새로운 시도를 꾸준히 해 보세요. 여러 경험이 하나로 모이는 순간 남다른 큰 성과가 나와요."], ["♟️ 전략가형 손금", "두뇌선이 곧게 뻗은 손은 계산과 판단이 정확한 전략가·참모형이에요. 큰 그림을 그리고 위험을 미리 읽어 내는 능력이 있어 어느 조직에서나 꼭 필요한 사람이 돼요. 앞에 나서기보다 뒤에서 판을 짜는 역할에서 진가를 발휘해요. 가끔은 계산을 내려놓고 직감을 믿어 보면 뜻밖의 행운이 찾아와요."], ["⚖️ 균형형 손금", "어느 한 선에 치우치지 않은 손은 여러 분야를 고루 해내는 균형형이에요. 사람·일·건강을 두루 챙기는 감각이 있어 어떤 환경에서도 잘 적응해요. 한 가지에 집중할 시기를 정해 힘을 모으면 숨은 재능이 크게 드러나요. 꾸준함이 쌓일수록 주변의 신뢰와 운이 함께 커지는 손금이에요."]];
