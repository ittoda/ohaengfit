<style>
:root{--bg:#f4f0fb;--card:#fff;--tx:#2a2238;--sub:#6f6485;--ln:#e2d9f3;--ac:#6d4bb8;--ac2:#a98bf0;--gold:#c99a2e;
--e0:#4f9a6b;--e1:#d9603a;--e2:#c9a23a;--e3:#8a94a0;--e4:#3a78b5}
@media (prefers-color-scheme:dark){:root{--bg:#16121f;--card:#211b30;--tx:#efe9fb;--sub:#a89cc4;--ln:#3a2f55;--ac:#b79cf0;--ac2:#7d5fd0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
.w{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.sub{color:var(--sub);font-size:13px}
.note{color:var(--sub);font-size:12px;line-height:1.5;margin-top:10px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;margin-top:14px}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .back{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font-size:14px}
.top b{font-size:18px}
/* 프로필 */
.prof{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0}
.ava{width:76px;height:76px;flex:none;border-radius:50%;background:#fff3;border:3px solid #fff;display:grid;place-items:center;font-size:38px;overflow:hidden;position:relative}
.ava img{width:100%;height:100%;object-fit:cover}
.cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ac);font-size:14px;display:grid;place-items:center;box-shadow:0 1px 4px #0003}
.avaw{position:relative;flex:none;border:0;background:none;padding:0}
.prof .nm{font-size:20px;font-weight:800;line-height:1.2}
.prof .info{font-size:13px;opacity:.92;margin-top:4px;line-height:1.45}
.prof .edit{margin-top:8px;background:#fff2;border:1px solid #fff8;color:#fff;border-radius:999px;padding:4px 12px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:#fff3;border:1px solid #fff6}
/* 메뉴 */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mi{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px 12px;text-align:left;color:var(--tx);min-height:118px;display:flex;flex-direction:column;gap:4px}
.mi .ic{font-size:30px;line-height:1}
.mi b{font-size:16px;margin-top:6px}
.mi small{color:var(--sub);font-size:12px;line-height:1.35}
.sect{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 8px}
.sect b{font-size:15px}
.prem{border:1.5px solid var(--gold);background:linear-gradient(180deg,#fff8e6,var(--card) 60%)}
@media (prefers-color-scheme:dark){.prem{background:linear-gradient(180deg,#3a2f17,var(--card) 60%)}}
.pi{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--tx)}
.pi:first-of-type{border-top:0}
.pi .ic{font-size:26px;width:36px;text-align:center}
.pi div{flex:1}.pi small{display:block;color:var(--sub);font-size:12px}
.lock{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap}
/* 폼 */
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
select,input{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.r3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:15px}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx);margin-top:8px}.chk input{width:auto}
/* 결과 공통 */
.hero{text-align:center;padding:20px 16px}
.hero .gw{font-size:13px;color:var(--sub)}
.hero .tt{font-size:22px;font-weight:800;margin:6px 0 2px;word-break:keep-all}
.hero .sc{font-size:46px;font-weight:800;color:var(--ac);line-height:1.1}
.hero .sc small{font-size:18px;color:var(--sub)}
.p{font-size:15px;line-height:1.75;margin:8px 0;word-break:keep-all}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}.row>span:first-child{width:86px;flex:none}.row>span:last-child{width:30px;text-align:right;font-weight:700}
.bar{flex:1;height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.mon{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;align-items:start}
.mon .m{font-weight:800;text-align:center;border-radius:10px;padding:4px 0;font-size:13px}
.mon .m.g{background:#e3f3e8;color:#2f7a4b}.mon .m.n{background:var(--bg);color:var(--sub)}.mon .m.b{background:#fbe8e1;color:#b4532f}
@media (prefers-color-scheme:dark){.mon .m.g{background:#1f3a29;color:#8fd6a6}.mon .m.b{background:#3d2219;color:#f0a084}}
.mon p{margin:0 0 8px;font-size:14px;line-height:1.55;word-break:keep-all}
.pil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pil .hd{font-size:12px;color:var(--sub)}
.gz{border-radius:12px;padding:8px 2px;color:#fff;line-height:1.15}
.gz b{font-size:26px;display:block;font-family:"Noto Serif KR","Apple SD Gothic Neo",serif}
.gz small{font-size:12px;opacity:.95}
.gz.e0{background:var(--e0)}.gz.e1{background:var(--e1)}.gz.e2{background:var(--e2)}.gz.e3{background:var(--e3)}.gz.e4{background:var(--e4)}
.gz.na{background:var(--ln);color:var(--sub)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:8px}
.kv div{background:var(--bg);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--sub)}.kv b{display:block;font-size:15px;color:var(--tx)}
.q{font-size:17px;line-height:1.8;text-align:center;padding:10px 4px;word-break:keep-all}
.song{padding:10px 0;border-top:1px solid var(--ln)}.song:first-of-type{border-top:0}
.song a{display:inline-block;margin-top:4px;padding:5px 12px;border-radius:8px;border:1px solid var(--ln);color:var(--tx);text-decoration:none;font-size:13px}
.ytab{display:flex;gap:6px;margin-bottom:10px}.ytab button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}.ytab button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.intro{min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:380px;margin:0 auto}
.intro .logo{width:168px;height:168px;filter:drop-shadow(0 12px 28px #5a3aa855);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.intro h1{font-size:44px;margin:26px 0 0;letter-spacing:.04em;line-height:1.1}
.intro .en{font-size:15px;font-weight:700;letter-spacing:.32em;color:var(--sub);margin-top:6px}
.intro .tag{color:var(--sub);font-size:14px;margin:18px 0 0}
.intro .bot{width:100%;margin-top:30px}
.pibtn{background:linear-gradient(135deg,#8a63d2,#5a3aa8);font-size:18px;padding:16px;box-shadow:0 8px 20px #5a3aa840}
.foot{display:flex;justify-content:center;gap:8px;margin-top:18px;font-size:13px;color:var(--sub)}.foot a{color:var(--sub)}.ver{font-size:12px;color:var(--sub);opacity:.8;margin-top:6px}
.link{background:none;border:0;color:var(--sub);font-size:14px;margin-top:12px;text-decoration:underline;padding:8px}
.lang{width:auto;padding:5px 8px;font-size:13px;border-radius:999px;background:var(--card)}
.ltop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
.hbar{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 8px}
.snd{background:var(--card);border:1px solid var(--ln);color:var(--tx);border-radius:999px;padding:4px 12px;font-size:13px}
</style>
</head>

 것도 힘이에요.":"燃え盛るものだけが光ではありません。ほのかに隣を照らすのも力です。","마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.":"心が冷めたなら、深く息を一つ吸いましょう。火種はまだそこにあります。","오늘 한 번 크게 웃으면 하루의 온도가 달라져요.":"今日一度大きく笑えば、一日の温度が変わります。","땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.":"大地は黙ってすべてを支えてくれます。今日を耐えただけでも十分大きなことです。","천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.":"ゆっくり踏み固めた道がいちばん遠くまで行けます。今日も一歩で十分です。","든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.":"しっかりした一食が一日の軸になります。今日は自分をよく食べさせてあげましょう。","뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.":"根の深い人は風が吹いても笑っています。自分の根を信じましょう。","쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.":"鉄は火をくぐってこそ強くなります。今の困難があなたを磨いています。","맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.":"澄んだ鐘の音は遠くまで響きます。今日かける一言も、そのように届くでしょう。","깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.":"深く息を吸って肩を開きましょう。胸が開けば心もついて開きます。","정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.":"整った机と心は似ています。今日ひとつだけ手放せば軽くなります。","물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.":"水はふさがれれば回り道をし、たまれば休みます。休むことも流れの一部です。","깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.":"深い水は音もなく流れます。静かにやり遂げる一日も素敵です。","오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.":"今日は急がず流れましょう。海は結局すべての水を受け止めてくれます。","따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.":"温かい水一杯が心をほぐします。ちょっと立ち止まって自分をいたわりましょう。","오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.":"今日は感情のリズムが低い日です。自分に少しだけ優しくしてあげましょう。","오늘은 차분하게 균형을 지키기 좋은 날이에요.":"今日は落ち着いてバランスを保つのによい日です。","목형 (성장·추진형)":"木タイプ(成長・推進型)","새로운 계획과 배움 이야기를 즐기고 시원시원하게 말하는 사람":"新しい計画や学びの話が好きで、さっぱり話す人","“요즘 새로 시작한 게 있어요?”처럼 근황과 계획을 물어보세요":"「最近、新しく始めたことはありますか?」のように近況や計画を聞いてみましょう","초록":"グリーン","화형 (열정·밝은 에너지형)":"火タイプ(情熱・明るいエネルギー型)","표정이 밝고 말이 빠르며 웃음이 많은 사람":"表情が明るく、話が早く、よく笑う人","“오늘 기분 좋아 보여요!”처럼 먼저 웃으며 인사해 보세요":"「今日は機嫌がよさそうですね!」のように、先に笑顔で挨拶してみましょう","빨강":"レッド","토형 (믿음직·안정형)":"土タイプ(頼もしい・安定型)","차분하고 말수는 적지만 약속을 잘 지키는 사람":"落ち着いていて口数は少ないけれど、約束をきちんと守る人","고민을 솔직하게 털어놓고 조언을 구해 보세요":"悩みを正直に打ち明けて、アドバイスをもらってみましょう","노랑·베이지":"イエロー・ベージュ","금형 (원칙·정리형)":"金タイプ(原則・整理型)","말이 간결하고 단정하며 시간 약속에 철저한 사람":"話が簡潔で端正、時間の約束に厳しい人","핵심부터 짧게 말하고 일정과 결정을 함께 정리해 보세요":"要点から短く話して、予定と決定を一緒に整理してみましょう","흰색·은색":"ホワイト・シルバー","수형 (지혜·유연형)":"水タイプ(知恵・柔軟型)","경청을 잘하고 생각이 깊으며 분위기를 부드럽게 만드는 사람":"聞き上手で思慮深く、場をやわらげてくれる人 기회가 있어요.":"目上の人の目に留まるチャンスがあります。","윤{0}월 {1}일":"閏{0}月{1}日","윤달이에요":"閏月です","음력":"旧暦","음력 날짜를 확인해 주세요.":"旧暦の日付を確認してください。","의리 있고 정직해요. 한번 맺은 인연을 소중히 지켜요.":"義理堅く正直。結んだ縁を大切に守ります。","이사·이직·새로운 만남처럼 자리가 바뀌는 기운이 강한 해예요. 변화가 두렵게 느껴져도 대부분 좋은 쪽으로 이어져요. 다만 한꺼번에 여러 가지를 바꾸지는 마세요.":"引っ越し・転職・新しい出会いなど、居場所が変わる気が強い年。変化が怖くても多くは良い方向へ。ただ一度に多くを変えないで。","이슬과 시냇물처럼 맑고 섬세해요. 직감이 좋고 공감 능력이 뛰어나요. 마음이 쉽게 흔들릴 땐 믿을 만한 사람과 이야기를 나눠 보세요.":"露や小川のように澄んで繊細。直感が鋭く共感力に優れます。心が揺れたら信頼できる人と話して。","이용약관":"利用規約","일·학업":"仕事・学業","일간":"日干","일주":"日柱","작은 서운함은 그때그때 풀어 두세요.":"小さなわだかまりはその都度解消して。","작은 약속을 잘 지키면 다음 달에 복으로 돌아와요.":"小さな約束を守れば翌月に福として返ってきます。","작은 재물이 들어오는 달이에요. 들어온 만큼 조금은 모아 두세요.":"小さな財が入る月。入った分の一部は貯めて。","잘 다듬어진 보석처럼 깔끔하고 감각이 뛰어나요. 완성도를 중요하게 여기고 아름다운 것을 알아봐요. 완벽하지 않아도 괜찮다고 스스로에게 말해 주세요.":"磨かれた宝石のように洗練され、センス抜群。完成度を重んじ、美しいものを見抜きます。完璧でなくていいと自分に言ってあげて。","잘 맞는 사람":"相性の良い人","잠을 잘 자는 것이 올해 최고의 관리예요.":"よく眠ることが今年最高のケア。","재치 있고 눈치가 빨라 어디서든 살아남는 힘이 있어요. 알뜰하고 기회를 잘 잡아요.":"機転が利き勘が鋭く、どこでも生き抜く力があります。倹約家でチャンスをつかむのが上手。","저장하고 시작하기":"保存して始める","정리 정돈, 깊은 호흡":"整理整頓、深呼吸","정리 정돈을 하면 운이 트이는 달이에요.":"整理整頓すると運が開ける月。","조용히 실력을 다지기 좋은 달이에요. 서두를 필요 없어요.":"静かに実力を磨くのに良い月。急ぐ必要はありません。","좋은 방향":"良い方角","좋은 소개가 들어오는 해예요.":"良い紹介が舞い込む年。","쥐":"子（鼠）","지난해의 고민과 얽힌 일이 하나씩 풀려 가는 해예요. 상반기에 정리를 잘 해 두면 하반기엔 마음이 한결 가벼워져요. 미뤄 둔 연락이나 정리를 먼저 해 보세요.":"昨年の悩みやもつれが一つずつほどける年。上半期に整理しておけば下半期は心が軽く。後回しにした連絡や整理から。","지혜롭고 차분하며 직감이 뛰어나요. 깊이 생각한 뒤 움직여 실수가 적어요.":"賢く落ち着いていて直感に優れます。深く考えてから動くので失敗が少ない。","처음":"ホーム","촛불처럼 은은하게 곁을 밝히는 사람이에요. 세심하고 배려가 깊어 마음을 잘 읽어요. 속으로 삭이기보다 마음을 표현할수록 빛이 커져요.":"ろうそくのようにそっと周りを照らす人。細やかで思いやり深く、心を読むのが上手。胸にしまうより表現するほど光が増します。","충동구매와 보증은 피하세요. 지키는 게 버는 거예요.":"衝動買いと保証人は避けて。守ることが稼ぐこと。","충분한 잠, 물 자주 마시기":"十分な睡眠、こまめな水分補給","크게 요란하진 않아도 차곡차곡 쌓이는 해예요. 저축, 공부, 건강 관리처럼 꾸준히 하는 일이 연말에 든든한 결과로 돌아와요. 욕심내지 않는 것이 가장 큰 복이에요.":"派手ではなくても着実に積み上がる年。貯蓄・勉強・健康管理など続けることが年末に実ります。欲張らないことが一番の福。","큰 강을 건너는 해":"大河を渡る年","큰 나무처럼 곧고 반듯한 성품이에요. 한번 정한 목표는 끝까지 밀고 나가고, 남을 이끄는 힘이 있어요. 가끔은 굽힐 줄 아는 유연함이 더해지면 더 크게 자라요.":"大木のようにまっすぐな性格。決めた目標はやり抜き、人を導く力があります。時にしなやかさを加えればもっと大きく育ちます。","큰 바다처럼 생각이 cơ hội được cấp trên chú ý.","윤{0}월 {1}일":"{1}/{0} nhuận","윤달이에요":"Là tháng nhuận","음력":"Âm lịch","음력 날짜를 확인해 주세요.":"Vui lòng kiểm tra ngày âm lịch.","의리 있고 정직해요. 한번 맺은 인연을 소중히 지켜요.":"Trọng nghĩa, thật thà. Trân trọng mối quan hệ đã có.","이사·이직·새로운 만남처럼 자리가 바뀌는 기운이 강한 해예요. 변화가 두렵게 느껴져도 대부분 좋은 쪽으로 이어져요. 다만 한꺼번에 여러 가지를 바꾸지는 마세요.":"Năm nhiều đổi thay—chuyển nhà, đổi việc, gặp người mới. Thay đổi đáng sợ nhưng phần lớn dẫn đến điều tốt. Chỉ đừng đổi quá nhiều cùng lúc.","이슬과 시냇물처럼 맑고 섬세해요. 직감이 좋고 공감 능력이 뛰어나요. 마음이 쉽게 흔들릴 땐 믿을 만한 사람과 이야기를 나눠 보세요.":"Trong trẻo, tinh tế như sương và suối. Trực giác tốt, giàu đồng cảm. Khi dao động, hãy tâm sự với người tin cậy.","이용약관":"Điều khoản","일·학업":"Công việc & học tập","일간":"Can ngày","일주":"Ngày","작은 서운함은 그때그때 풀어 두세요.":"Chuyện buồn nhỏ nên giải tỏa ngay.","작은 약속을 잘 지키면 다음 달에 복으로 돌아와요.":"Giữ lời hứa nhỏ, tháng sau sẽ thành phúc.","작은 재물이 들어오는 달이에요. 들어온 만큼 조금은 모아 두세요.":"Có chút tiền vào. Hãy để dành một ít.","잘 다듬어진 보석처럼 깔끔하고 감각이 뛰어나요. 완성도를 중요하게 여기고 아름다운 것을 알아봐요. 완벽하지 않아도 괜찮다고 스스로에게 말해 주세요.":"Gọn gàng như viên ngọc đã mài, rất có gu. Coi trọng sự hoàn thiện. Hãy tự nhủ không hoàn hảo cũng được.","잘 맞는 사람":"Người hợp với bạn","잠을 잘 자는 것이 올해 최고의 관리예요.":"Ngủ ngon là cách chăm sóc tốt nhất năm nay.","재치 있고 눈치가 빨라 어디서든 살아남는 힘이 있어요. 알뜰하고 기회를 잘 잡아요.":"Lanh trí, nhạy bén, sống tốt ở mọi nơi. Tiết kiệm, giỏi nắm cơ hội.","저장하고 시작하기":"Lưu và bắt đầu","정리 정돈, 깊은 호흡":"dọn dẹp, hít thở sâu","정리 정돈을 하면 운이 트이는 달이에요.":"Dọn dẹp sẽ mở vận.","조용히 실력을 다지기 좋은 달이에요. 서두를 필요 없어요.":"Tháng tốt để lặng lẽ trau dồi. Không cần vội.","좋은 방향":"Hướng tốt","좋은 소개가 들어오는 해예요.":"Sẽ có người giới thiệu tốt.","쥐":"Tý (Chuột)","지난해의 고민과 얽힌 일이 하나씩 풀려 가는 해예요. 상반기에 정리를 잘 해 두면 하반기엔 마음이 한결 가벼워져요. 미뤄 둔 연락이나 정리를 먼저 해 보세요.":"Lo âu, vướng mắc năm ngoái lần lượt được gỡ. Nửa đầu dọn dẹp tốt thì nửa sau nhẹ lòng. Bắt đầu từ việc liên lạc, dọn dẹp còn dang dở.","지혜롭고 차분하며 직감이 뛰어나요. 깊이 생각한 뒤 움직여 실수가 적어요.":"Thông minh, điềm tĩnh, trực giác tốt. Nghĩ kỹ rồi làm nên ít sai.","처음":"Trang đầu","촛불처럼 은은하게 곁을 밝히는 사람이에요. 세심하고 배려가 깊어 마음을 잘 읽어요. 속으로 삭이기보다 마음을 표현할수록 빛이 커져요.":"Như ngọn nến lặng lẽ soi sáng xung quanh. Tinh tế, chu đáo, hiểu lòng người. Bày tỏ cảm xúc sẽ khiến bạn tỏa sáng hơn.","충동구매와 보증은 피하세요. 지키는 게 버는 거예요.":"Tránh mua sắm bốc đồng và bảo lãnh. Giữ được là kiếm được.","충분한 잠, 물 자주 마시기":"ngủ đủ, uống nhiều nước","크게 요란하진 않아도 차곡차곡 쌓이는 해예요. 저축, 공부, 건강 관리처럼 꾸준히 하는 일이 연말에 든든한 결과로 돌아와요. 욕심내지 않는 것이 가장 큰 복이에요.":"Không ồn ào nhưng tích lũy từng chút. Tiết kiệm, học tập, giữ sức khỏe sẽ cho kết quả vững vào cuối năm. Không tham là phúc lớn nhất.","큰 강을 건너는 해":"Năm vượt sông lớn","큰 나무처럼 곧고 반듯한 성품이에요. 한번 정한 목표는 끝까지 밀고 나가고, 남을 이끄는 힘이 있어요. 가끔은 굽힐 줄 아는 유연함이 더해지면 더 크게 자라요.":"Ngay thẳng như cây lớn. Đã đặt mục tiêu là theo đến cùng, có khả năng dẫn dắt. Thêm chút mềm dẻo sẽ lớn mạnh hơn.","큰 바다처럼 생각이 깊고 포용력이 커요. 지혜롭고 상황을 넓게 봐요. 생각이 너무 많아질 땐 몸을 움직여 머리를 비워 보세요.":"Sâu sắc, bao dung như biển cả. Khôn ngoan, nhìn xa. Khi nghĩ quá nhiều, hãy vận động cho đầu óc thông thoáng.","큰 변화 없이 평온한 달이에요. 하던 일을 꾸준히 이어 가세요.":"Tháng bình yên, không biến động lớn. Cứ đều đặn việc đang làm.","큰 산처럼 듬직하고 믿음직해요. 쉽게 흔들리지 않아 사람들이 기대요. 변화 앞에서 너무 오래 머뭇거리지만 않으면 돼요.":"Vững chãi, đáng tin như núi lớn. Không dễ lung lay nên mọi người dựa vào. Chỉ đừng chần chừ quá lâu trước thay đổi.","큰돈보다 작은 돈이 꾸준히 들어와요.":"Tiền nhỏ vào đều hơn tiền lớn.","타고난 성품":"Tính cách bẩm sinh","태양처럼 밝고 따뜻해요. 솔직하고 열정이 넘쳐 주변을 환하게 만들어요. 감정이 금세 타오르니 결정을 내리기 전 한 번 식혀 보세요.":"Rực rỡ, ấm áp như mặt trời. Thẳng thắn, nhiệt huyết, làm sáng xung quanh. Cảm xúc dễ bùng, hãy bình tĩnh trước khi quyết.","태어난 시":"Giờ sinh","태어난 시 모름":"Không rõ giờ sinh","토끼":"Mão (Mèo)","토정비결":"Thổ Đình Bí Quyết","토정비결 · 사주팔자 · 오늘의 운세":"Thổ Đình · Tứ trụ · Vận hôm nay","토정비결·사주·운세는 전통 계산법을 바탕으로 한 재미와 참고용이에요.":"Thổ Đình, Tứ trụ và vận hạn dựa trên cách tính truyền thống, chỉ để giải trí, tham khảo.","투자보다 저축이 이로운 해예요.":"Năm này tiết kiệm có lợi hơn đầu tư.","파이오니어":"Pioneer","평온하게 흘러가는 날이에요. 꾸준히 할 일을 해 나가세요.":"Một ngày bình yên. Cứ đều đặn làm việc của mình.","프리미엄":"Cao cấp","프리미엄에서 몸 분석, 맞춤 음식, 운동 따라하기, 영양 가이드를 모두 쓸 수 있어요. 한 번 열면 계속 쓸 수 있어요.":"Gói cao cấp mở Phân tích cơ thể, Món ăn, Bài tập và Dinh dưỡng. Mở một lần, dùng mãi.","하는 일마다 손발이 맞는 달이에요. 미뤄 둔 일을 처리하기 좋아요.":"Việc gì cũng ăn ý. Tốt để giải quyết việc tồn đọng.","하던 일을 깊게 파고들면 길이 보여요.":"Đào sâu việc đang làm, con đường sẽ hiện ra.","하반기로 갈수록 운이 올라가요. 늦게 피는 꽃이 더 오래 가듯, 연말에 웃게 돼요.":"Vận lên dần về nửa cuối năm. Hoa nở muộn bền lâu, cuối năm bạn sẽ cười.","하반기엔 정리와 마무리에 힘쓰면 좋아요. 새 일보다 하던 일을 끝내는 게 이득이에요.":"Nửa cuối năm hãy tập trung hoàn tất. Làm xong việc cũ lợi hơn bắt đầu việc mới.","한 단계 올라서는 도약의 해예요. 중요한 결정을 내려야 할 순간이 오는데, 충분히 준비했다면 과감하게 건너도 좋아요. 건넌 뒤엔 넓은 들판이 기다려요.":"Năm bứt phá lên một bậc. Sẽ có quyết định quan trọng—đã chuẩn bị kỹ thì cứ mạnh dạn vượt qua. Bên kia là cánh đồng rộng.","한 해 내내 고르게 흘러가요. 큰 굴곡 없이 꾸준함이 결실을 맺어요.":"Cả năm đều đặn, không thăng trầm lớn, sự bền bỉ sẽ đơm hoa.","한 해 총운":"Tổng vận cả năm","햇볕 쬐기, 즐거운 모임":"tắm nắng, gặp gỡ vui vẻ","호랑이":"Dần (Hổ)","혼자보다 함께할 때 성과가 커요.":"Cùng nhau sẽ đạt nhiều hơn một mình.","환절기":"giao mùa","활발하고 자유로워 어디로든 달려가요. 솔직하고 사람을 좋아해요.":"Năng động, tự do, đi khắp nơi. Thẳng thắn, quý người.","흰색":"Trắng","오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠 보세요.":"Hôm nay cảm xúc trong trẻo. Hãy lan tỏa năng lượng ấy."},"fr":{"생년월일":"Date de naissance","성별":"Sexe","여성":"Femme","남성":"Homme","모름":"Inconnu","목":"Bois","화":"Feu","토":"Terre","금":"Métal","수":"Eau","목(木)":"Bois(木)","화(火)":"Feu(火)","토(土)":"Terre(土)","금(金)":"Métal(金)","수(水)":"Eau(水)","나무는 하루아침에 자라지 않아도 매일 해를 향해 갑니다. 오늘도 그 방향이면 충분해요.":"Un arbre ne pousse pas en une nuit, pourtant il se tourne chaque jour vers le soleil. Vous tourner de ce côté aujourd'hui suffit.","오늘 내디딘 한 걸음이 내일의 새싹이 돼요. 서두르지 않아도 괜찮아요.":"Le pas fait aujourd'hui devient la pousse de demain. Inutile de vous presser.","굽은 가지도 결국 빛을 찾아 자랍니다. 지금 모습 그대로 괜찮아요.":"Même une branche tordue finit par pousser vers la lumière. Vous êtes bien tel que vous êtes.","숲은 서로의 그늘을 나눠 크는 법이에요. 오늘 누군가에게 그늘이 되어주세요.":"Une forêt grandit en partageant son ombre. Soyez l'ombre de quelqu'un aujourd'hui.","작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.":"Une petite étincelle réchauffe toute une pièce. Votre sourire d'aujourd'hui est cette étincelle.","타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.":"Ce n'est pas seulement ce qui flambe qui éclaire. Éclairer doucement ceux qui vous entourent est aussi une force.","마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.":"Si votre cœur s'est refroidi, respirez profondément une fois. L'étincelle est toujours là.","오늘 한 번 크게 웃으면 하루의 온도가 달라져요.":"Un grand éclat de rire aujourd'hui change la température de toute votre journée.","땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.":"La terre soutient tout en silence. Avoir tenu bon aujourd'hui est déjà beaucoup.","천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.":"Un chemin tassé lentement va le plus loin. Un pas aujourd'hui suffit.","든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.":"Un bon repas ancre votre journée. Nourrissez-vous bien aujourd'hui.","뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.":"Quelqu'un de profondément enraciné sourit même quand le vent souffle. Faites confiance à vos racines.","쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.":"Le métal ne devient fort qu'en passant par le feu. Votre épreuve actuelle vous affine.","맑은 종소리는 멀리 퍼져요. 오늘 건네는 말 한마디가 그렇게 닿을 거예요.":"Le son d'une cloche claire porte loin. Un mot offert aujourd'hui atteindra les gens de la même façon.","깊게 숨 쉬고 어깨를 펴요. 가슴이 열리면 마음도 따라 열려요.":"Respirez profondément et ouvrez les épaules. Quand la poitrine s'ouvre, le cœur suit.","정리된 책상과 마음은 닮았어요. 오늘 하나만 비우면 가벼워져요.":"Un bureau rangé et un esprit rangé se ressemblent. Rangez une seule chose aujourd'hui et vous vous sentirez plus léger.","물은 막히면 돌아가고, 고이면 쉬어가요. 쉼도 흐름의 일부예요.":"L'eau contourne l'obstacle et se repose quand elle s'accumule. Le repos fait aussi partie du courant.","깊은 물은 소리 없이 흘러요. 조용히 해내는 하루도 멋져요.":"L'eau profonde coule sans bruit. Une journée à avancer tranquillement est belle aussi.","오늘은 서두르지 말고 흐르세요. 바다는 결국 모든 물을 받아주어요.":"Ne vous pressez pas aujourd'hui, laissez-vous couler. Au bout du compte, la mer accueille toutes les eaux.","따뜻한 물 한 잔이 마음을 풀어줘요. 잠깐 멈추고 나를 돌봐요.":"Une tasse d'eau chaude détend le cœur. Faites une pause et prenez soin de vous.","오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.":"Votre rythme émotionnel est bas aujourd'hui. Soyez un peu plus doux avec vous-même.","오늘은 차분하게 균형을 지키기 좋은 날이에요.":"Un bon jour pour rester calme et garder votre équilibre.","목형 (성장·추진형)":"Type Bois (croissance · élan)","새로운 계획과 배움 이야기를 즐기고 시원시원하게 말하는 사람":"Quelqu'un qui aime parler de nouveaux projets et d'apprentissage, et qui s'exprime ouvertement","“요즘 새로 시작한 게 있어요?”처럼 근황과 계획을 물어보세요":"Demandez-lui des nouvelles et ses projets, par exemple « Avez-vous commencé quelque chose de nouveau récemment ? »","초록":"Vert","화형 (열정·밝은 에너지형)":"Type Feu (passion · énergie lumineuse)","표정이 밝고 말이 빠르며 웃음이 많은 사람":"Quelqu'un au visage lumineux, qui parle vite et rit beaucoup","“오늘 기분 좋아 보여요!”처럼 먼저 웃으며 인사해 보세요":"Saluez-le d'abord avec un sourire, par exemple « Vous avez l'air heureux aujourd'hui ! »","빨강":"Rouge","토형 (믿음직·안정형)":"Type Terre (fiable · stable)","차분하고 말수는 적지만 약속을 잘 지키는 사람":"Calme et discret, mais quelqu'un qui tient ses promesses","고민을 솔직하게 털어놓고 조언을 구해 보세요":"Confiez-lui franchement vos soucis et demandez son avis","노랑·베이지":"Jaune · beige","금형 (원칙·정리형)":"Type Métal (principes · organisation)","말이 간결하고 단정하며 시간 약속에 철저한 사람":"Concis et soigné dans ses propos, strict sur les horaires","핵심부터 짧게 말하고 일정과 결정을 함께 정리해 보세요":"Commencez par l'essentiel, restez bref, et fixez ensemble les horaires et les décisions","흰색·은색":"Blanc · argent","수형 (지혜·유연형)":"Type Eau (sage · souple)","경청을 잘하고 생각이 깊으며 분위기를 부드럽게 만드는 사람":"Un bon auditeur qui réfléchit en profondeur et adoucit l'ambiance","따뜻한 차 한 잔 하며 천천히 이야기를 나눠 보세요":"Partagez une conversation tranquille autour d'une tasse de thé chaud","검정·남색":"Noir · bleu marine","행운의 색":"Couleur porte-bonheur","닫기":"Fermer","부족한 기운이 채워지는 날이에요. 중요한 일을 시작하기 좋아요.":"Un jour où l'énergie qui vous manque e able.","흰색":"Blanc","오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠 보세요.":"Vos émotions sont claires aujourd'hui. Partagez cette énergie."},"de":{"생년월일":"Geburtsdatum","성별":"Geschlecht","여성":"Weiblich","남성":"Männlich","모름":"Unbekannt","목":"Holz","화":"Feuer","토":"Erde","금":"Metall","수":"Wasser","목(木)":"Holz(木)","화(火)":"Feuer(火)","토(土)":"Erde(土)","금(金)":"Metall(金)","수(水)":"Wasser(水)","나무는 하루아침에 자라지 않아도 매일 해를 향해 갑니다. 오늘도 그 방향이면 충분해요.":"Ein Baum wächst nicht über Nacht, wendet sich aber jeden Tag der Sonne zu. Sich heute wieder dorthin zu wenden, genügt.","오늘 내디딘 한 걸음이 내일의 새싹이 돼요. 서두르지 않아도 괜찮아요.":"Der Schritt von heute wird zum Spross von morgen. Sie müssen sich nicht beeilen.","굽은 가지도 결국 빛을 찾아 자랍니다. 지금 모습 그대로 괜찮아요.":"Auch ein krummer Ast wächst am Ende zum Licht. Sie sind gut, so wie Sie sind.","숲은 서로의 그늘을 나눠 크는 법이에요. 오늘 누군가에게 그늘이 되어주세요.":"Ein Wald wächst, indem er seinen Schatten teilt. Seien Sie heute jemandes Schatten.","작은 불씨 하나가 방 전체를 데워요. 오늘 당신의 웃음이 그 불씨예요.":"Ein kleiner Funke wärmt einen ganzen Raum. Ihr Lächeln heute ist dieser Funke.","타오르는 것만이 빛은 아니에요. 은은하게 곁을 밝히는 것도 힘이에요.":"Nicht nur, was lodert, leuchtet. Auch die Menschen neben sich sanft zu erhellen ist Stärke.","마음이 식었다면 숨을 한 번 깊게 쉬어요. 불씨는 아직 거기 있어요.":"Wenn Ihr Herz erkaltet ist, atmen Sie einmal tief durch. Der Funke ist noch da.","오늘 한 번 크게 웃으면 하루의 온도가 달라져요.":"Ein herzhaftes Lachen heute verändert die Temperatur Ihres ganzen Tages.","땅은 말없이 모든 것을 받쳐줘요. 오늘 버틴 것만으로도 충분히 큰일이에요.":"Die Erde trägt still alles. Heute durchgehalten zu haben ist schon viel.","천천히 다져진 길이 가장 멀리 가요. 오늘도 한 걸음이면 돼요.":"Ein langsam festgetretener Weg führt am weitesten. Ein Schritt heute genügt.","든든한 한 끼가 하루의 중심을 잡아줘요. 오늘은 나를 잘 먹여주세요.":"Eine kräftige Mahlzeit erdet Ihren Tag. Versorgen Sie sich heute gut.","뿌리 깊은 사람은 바람이 불어도 웃어요. 당신의 뿌리를 믿어요.":"Wer tief verwurzelt ist, lächelt auch im Wind. Vertrauen Sie Ihren Wurzeln.","쇠는 불을 지나야 단단해져요. 지금의 어려움이 당신을 다듬고 있어요.":"Metall wird erst stark, wenn es durchs Feuer geht. Ihre jetzige Mühe läutert Sie.","맑은 종소 var LY=LUN.split(',').map(function(x,i){var p=x.split(':'),ms=[],s=p[1];for(var k=0,m=0;k<s.length;k++){var lp=false;if(s[k]=='+'){lp=true;k++}else m++;ms.push({m:m,lp:lp,n:s[k]=='L'?30:29})}return{y:1921+i,s:parseInt(p[0],36),ms:ms}});
function sol2lun(y,m,d){var t=dn(y,m,d),Y=null;for(var i=0;i<LY.length;i++){if(LY[i].s<=t)Y=LY[i];else break}if(!Y)return null;var o=t-Y.s;for(var k=0;k<Y.ms.length;k++){var M=Y.ms[k];if(o<M.n)return{y:Y.y,m:M.m,d:o+1,lp:M.lp};o-=M.n}return null}
function lunYear(y){return LY[y-1921]||null}
function lunMonth(y,m,lp){var Y=lunYear(y);if(!Y)return null;var o=0,nm=null;for(var k=0;k<Y.ms.length;k++){var M=Y.ms[k];if(M.m==m){if(!!M.lp==!!lp)return{s:Y.s+o,n:M.n};if(!M.lp)nm={s:Y.s+o,n:M.n}}o+=M.n}return nm}
function lun2sol(y,m,d,lp){var M=lunMonth(y,m,lp);if(!M)return null;return ymd(M.s+Math.min(d,M.n)-1)}
function dayIdx(t){return((t+2440637)%60+60)%60}

/* ===== 사주 (절기는 날짜로 단순화) ===== */
function jdn(y,m,d){var a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;return d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045}
function pil(y,m,d,h,nt){
var TD=[[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7],[1,6]];
var yy=y;if(m<2||(m==2&&d<4))yy=y-1;
var ys=((yy-4)%10+10)%10,yb=((yy-4)%12+12)%12;
var mi=0;for(var i=0;i<12;i++){var t=TD[i];var dt=(m>t[0]||(m==t[0]&&d>=t[1]));
 if(t[0]==1){if(m==1&&d>=6)mi=11;else if(m==1)mi=10}else if(dt)mi=i}
if(m==12&&d>=7)mi=10;if(m==1&&d<6)mi=10;if(m==1&&d>=6)mi=11;
var ms=(((ys%5)*2+2+mi)%10),mb=(mi+2)%12;
var di=(jdn(y,m,d)+49)%60,ds=di%10,db=di%12;
var P=[[ys,yb],[ms,mb],[ds,db]];
if(!nt){var hi=Math.floor(((h+1)%24)/2);P.push([((ds%5)*2+hi)%10,hi])}
return {P:P,ds:ds}}

  if(!sol||!lun)return null;
  var nt=ME.si<0,h=nt?12:(ME.si*2)%24,S=pil(sol[0],sol[1],sol[2],h,nt),cnt=[0,0,0,0,0];
  S.P.forEach(function(p){cnt[SE[p[0]]]++;cnt[BE[p[1]]]++});
  var strong=cnt.indexOf(Math.max.apply(null,cnt)),weak=cnt.indexOf(Math.min.apply(null,cnt));
  var ani=((lun.y-4)%12+12)%12;
  return{sol:sol,lun:lun,P:S.P,ds:S.ds,cnt:cnt,strong:strong,weak:weak,me:SE[S.ds],ani:ani}}

var ANX=["재치 있고 눈치가 빨라 어디서든 살아남는 힘이 있어요. 알뜰하고 기회를 잘 잡아요.","성실하고 참을성이 강해 한번 맡은 일은 끝까지 해내요. 느려 보여도 가장 멀리 가요.","용감하고 당당해 앞장서는 걸 좋아해요. 정의감이 강하고 마음이 따뜻해요.","온화하고 다정해 사람들이 편안해해요. 감각이 섬세하고 평화를 사랑해요.","꿈이 크고 자신감이 넘쳐요. 타고난 운이 좋아 큰일을 이루는 힘이 있어요.","지혜롭고 차분하며 직감이 뛰어나요. 깊이 생각한 뒤 움직여 실수가 적어요.","활발하고 자유로워 어디로든 달려가요. 솔직하고 사람을 좋아해요.","순하고 예술적인 감각이 있어요. 남을 잘 배려하고 평화로운 관계를 만들어요.","영리하고 재주가 많아 무엇이든 빨리 배워요. 유머 감각으로 분위기를 띄워요.","부지런하고 꼼꼼해요. 계획을 잘 세우고 자기 관리가 뛰어나요.","의리 있고 정직해요. 한번 맺은 인연을 소중히 지켜요.","너그럽고 복이 많아요. 마음씨가 넉넉해 주변에 사람이 끊이지 않아요."];


/* ===== 오늘의 운세 ===== */
function todayView(){var td=today(),T=dn(td[0],td[1],td[2]),di=dayIdx(T),te=SE[di%10],w=C.weak,s=C.strong,base,tx;
  if(te==w){base=88;tx='부족한 기운이 채워지는 날이에요. 중요한 일을 시작하기 좋아요.'}else if((te+1)%5==w){base=84;tx='귀인의 도움을 받기 쉬운 날이에요. 먼저 손을 내밀어 보세요.'}else if((te+2)%5==w){base=62;tx='마음이 예민해지기 쉬운 날이에요. 결정은 서두르지 말고 한 박자 쉬세요.'}else if(te==s){base=68;tx='기운이 넘치는 날이에요. 과하지 않게 속도를 조절하세요.'}else{base=76;tx='평온하게 흘러가는 날이에요. 꾸준히 할 일을 해 나가세요.'}
  var F=['재물','일·학업','관계','건강'],V=F.map(function(f,i){return Math.max(40,Math.min(98,base+(hsh(T,i,C.ds)%21)-10))}),tot=Math.round(V.reduce(function(a,b){return a+b},0)/4);
  var db=di%12,rel=(db-C.ani+12)%12,AL=rel==0?'나의 띠 날이라 자신감이 올라가요.':rel==4||rel==8?'띠와 날이 잘 어울려 일이 순조로워요.':rel==6?'띠와 날이 부딪혀요. 말을 아끼면 무난해요.':'무난하게 흘러가는 띠의 날이에요.';
  var b=BOOST[w],h=hdr(t('오늘의 운세'));
  h+='<div class="c hero"><div class="gw">'+D3(td[0],td[1],td[2])+' · '+t('{0}일',GZ(di%10,di%12))+'</div><div class="sc">'+tot+'<small> / 100</small></div><p class="p" style="text-align:center">'+t(tx)+'</p></div>';
  h+='<div class="c"><h2>'+t('분야별')+'</h2>'+F.map(function(f,i){return '<div class="row"><span>'+t(f)+'</span><div class="bar"><i style="width:'+V[i]+'%"></i></div><span>'+V[i]+'</span></div>'}).join('')+'</div>';
  h+='<div class="c"><h2>'+ANE[C.ani]+' '+t('{0}띠 오늘',t(ANI[C.ani]))+'</h2><p class="p">'+t(AL)+'</p><div class="kv"><div>'+t('행운의 색')+'<b>'+t(b[0])+'</b></div><div>'+t('행운의 숫자')+'<b>'+((td[2]*3+C.ds)%9+1)+'</b></div><div>'+t('좋은 방향')+'<b>'+t(b[1])+'</b></div></div></div>';
  h+='<p class="note">'+t('오늘의 일진과 내 사주의 오행을 견주어 본 재미·참고용 운세예요.')+'</p>';
  return h}

/* ===== 오늘의 노래와 글귀 ===== */
var SGN=0;
function zdOf(m,d){var r=ZD[0];for(var i=0;i<12;i++){var z=ZD[i];if(m*100+d>=z[3]*100+z[4])r=z}return r}

function songView(){var td=today(),bd=C.sol,dt=dn(td[0],td[1],td[2])-dn(bd[0],bd[1],bd[2]),x=Math.round(Math.sin(2*Math.PI*dt/28)*100),w=C.weak,s=C.strong;
  var z=zdOf(bd[1],bd[2]),zel={"♈":0,"♌":0,"♐":0,"♉":1,"♍":1,"♑":1,"♊":2,"♎":2,"♒":2,"♋":3,"♏":3,"♓":3}[z[1]],tg=x>30?'u':x<-30?'h':'c',ML={u:'기분이 올라가는 곡',c:'차분하게 마음을 가라앉히는 곡',h:'위로와 힘이 되는 곡'};
  var sc=SGP.map(function(g,i){var v=0,why=[];if(g[2]==tg){v+=3;why.push(t('오늘 기분에 어울려요'))}if(g[3].indexOf(w)>=0){v+=2;why.push(t('부족한 {0} 기운을 채워 줘요',ELT(w)))}if(g[3].indexOf(s)>=0)v+=.6;if(g[4]==zel){v+=2;why.push(t('{0} 감성',t(z[0])))}
    return{g:g,v:v+(hsh(i,td.join(),SGN)%100)/100*3.2,why:why}}).sort(function(a,b){return b.v-a.v});
  var pk=[],cnt={u:0,c:0,h:0};sc.forEach(function(o){if(pk.length<5&&cnt[o.g[2]]<3){pk.push(o);cnt[o.g[2]]++}});
  var ln=x<-30?'오늘은 감정 리듬이 낮은 날이에요. 스스로에게 조금 더 다정해지세요.':x>30?'오늘은 감정이 맑은 날이에요. 그 에너지를 주변에 나눠 보세요.':'오늘은 차분하게 균형을 지키기 좋은 날이에요.';
  var h=hdr(t('오늘의 노래와 글귀'));
  h+='<div class="c"><h2>'+t('오늘의 글귀')+'</h2><div class="q">“'+t(QP[w][(td[2]+SGN)%4])+'”</div><p class="sub" style="text-align:center">'+t(ln)+'</p></div>';
  h+='<div class="c"><h2>'+t('오늘 나에게 맞는 노래 5곡')+'</h2><p class="sub">'+t('감정 리듬 {0}점',x)+' · '+z[1]+' '+t(z[0])+' · '+t('부족한 {0} 기운',ELT(w))+'</p>';
  pk.forEach(function(o,i){var q=encodeURIComponent(o.g[0]+' '+o.g[1]);h+='<div class="song"><b>'+(i+1)+'. '+esc(o.g[0])+'</b> <span class="sub">· '+esc(t(o.g[1]))+'</span><div class="sub">'+t(ML[o.g[2]])+(o.why.length?' · '+o.why.slice(0,2).join(' · '):'')+'</div><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener">▶ '+t('들어보기')+'</a></div>'});
  h+='<button class="btn ghost" onclick="SGN++;render()">🎵 '+t('다른 곡 · 다른 글귀')+'</button></div>';
  return h}

render();

</script>
