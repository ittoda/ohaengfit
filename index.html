<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오행핏 · Wellbeing Life</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>html,body{margin:0;height:100%;background:#f4f0fb}iframe{border:0;width:100%;height:100vh;height:100dvh;display:block}</style>
</head>
<body>
<iframe src="app.html" title="Ohaeng Fit"></iframe>
<script>
window.PI_SESSION=null;
var PI_READY=(async function(){try{if(window.Pi)await Pi.init({version:"2.0"})}catch(e){}})();
// 첫 화면의 "Pi로 로그인" 버튼을 누르면 로그인해요
window.piLogin=async function(){
  if(window.PI_SESSION)return window.PI_SESSION;
  try{
    await PI_READY;if(!window.Pi)return null;
    var a=await Pi.authenticate(["username"],function(){});
    if(!a||!a.accessToken)return null;
    var un=a.user&&a.user.username,uid=a.user&&a.user.uid;
    try{var r=await fetch("/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:a.accessToken})});if(r.ok){var d=await r.json();if(d&&d.ok){un=d.username;uid=d.uid}}}catch(e){}
    window.PI_SESSION={token:a.accessToken,uid:uid,username:un};
    return window.PI_SESSION;
  }catch(e){return null}
};
</script>
</body>
</html>
